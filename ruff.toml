# =============================================================================
# ruff configuration — the lint gate's rule set is a DECISION, not a default.
#
# Why this file exists
# --------------------
# `validate-code.yml` ran an unpinned `pip install ruff` against a repo with no
# ruff config, so the gate's rule set was whatever the newest release happened to
# default to. Ruff widened that default between 0.15.x and 0.16.x: the same
# unchanged Python went from green on 2026-08-06 to 177 errors on 2026-08-07,
# and stayed red on every push for a week. Nobody had touched a line of code.
#
# A gate whose rules change underneath you cannot be kept green, and a
# permanently-red check is a check nobody reads. Two things fix that:
#   1. the CI job pins an exact ruff version (.github/workflows/validate-code.yml)
#   2. this file states the rule set explicitly, so a ruff upgrade can only
#      change the gate when someone edits one of those two files on purpose.
#
# Upgrading ruff: bump the pin, run `ruff check scripts`, and land any new
# findings (or an explicit ignore with a stated reason) in the SAME commit.
# =============================================================================

target-version = "py312"
line-length = 120

[lint]
# Explicit selection. Ruff's defaults are deliberately NOT relied on.
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes
    "I",       # import sorting
    "UP",      # pyupgrade — keep syntax current with target-version
    "B",       # flake8-bugbear
    "C4",      # comprehensions
    "SIM",     # simplify
    "PIE",     # misc lints
    "PERF",    # performance anti-patterns
    "FLY",     # static join -> f-string
    "DTZ",     # naive datetime
    "EXE",     # shebang vs executable bit

    # The four below are selected INDIVIDUALLY, not as whole families. Their
    # families (BLE / S / PLW) carry many rules that are pure noise in ops
    # scripts — S310 urlopen, S108 /tmp inside a pod, PLW0603 module-level state
    # in a single-file wizard. Pulling a family in and then ignoring nine of its
    # members would bury the four that actually matter here.
    #
    # These four are the exact shape of this platform's signature failure mode:
    # "a control that could not work, reporting success" — a swallowed
    # exception, a subprocess whose exit code was never read, a fallback that
    # turned a hard error into a quiet no-op. They stay on repo-wide.
    "BLE001",  # blind `except Exception`
    "S110",    # try/except/pass
    "S112",    # try/except/continue
    "PLW1510", # subprocess.run without an explicit check=
]

ignore = [
    "E501",    # length is enforced by `line-length`; a second rule just duplicates it
    "RUF005",  # list concatenation over unpacking — style only, no defect risk
]
