# Site link: hypatia (Hetzner dedicated, Falkenstein) -> Homelab production VLAN
#
# Declares a layer-2 extension of an on-prem VLAN to a remote Proxmox node over
# an existing WireGuard tunnel, so guests on the remote node can hold addresses
# in the on-prem subnet and join clusters that assume same-subnet adjacency
# (Talos control planes, MetalLB L2, Cilium).
#
# Consumed by scripts/site-link.sh. The same fields are what a console-driven
# "add remote site" flow needs to collect; nothing here is specific to hypatia
# beyond the values.

name: hypatia

# Node that already terminates the WireGuard tunnel and holds the VLAN.
hub:
  host: 10.1.0.3
  node: proxmox
  tunnel_ip: 10.1.9.1
  # VLAN-aware bridge carrying the VLAN to extend.
  bridge: vmbr0

# Remote node receiving the extended VLAN.
edge:
  host: 162.55.99.90
  node: hypatia
  tunnel_ip: 10.1.9.2
  # Bridge created on the edge node. Guests attach here untagged and land
  # directly in the hub VLAN's subnet.
  bridge: vmbr3

l2:
  # VLAN ID on the hub bridge to extend.
  vlan: 3
  # VXLAN VNI. Kept equal to the VLAN ID for legibility; only needs to be
  # unique per site link on a shared tunnel.
  vni: 3
  dstport: 4789

mtu:
  # WireGuard interface MTU on both ends.
  tunnel: 1420
  # tunnel - 50 bytes of VXLAN encapsulation. Guests on the edge bridge MUST
  # be configured with this MTU; otherwise large packets are silently dropped
  # while pings still succeed.
  overlay: 1370
  # EVERY cluster node must use the overlay MTU on its cluster interface, not
  # only the ones behind the site link. Learned the hard way on 2026-08-14:
  # Longhorn's instance-manager pods run with hostNetwork, so they inherit the
  # HOST MTU. The home nodes sat at 1500 and happily sent 1500-byte frames down
  # a 1370-byte path, which silently destroyed replication — volumes faulted
  # cluster-wide with "failed to handle data server EOF" while every ping and
  # every small API call kept working, so nothing looked wrong.
  #
  # Cilium's MTU setting does NOT fix this: Cilium governs the pod network,
  # while Longhorn's data path is host network and ignores it entirely.
  #
  # Set on each node via machine config:
  #   machine.network.interfaces[].mtu: 1370
  cluster_mtu: 1370

# Operational constraints that follow from the link being a WAN path.
# These are advisory metadata for the console/operator, not applied by the script.
constraints:
  # Round-trip latency observed hub <-> edge.
  rtt_ms: 16
  # MetalLB runs in L2 mode; a speaker on the edge node can win an ARP election
  # and pull VIP traffic across the WAN. Exclude the edge node from the speaker set.
  metallb_speaker: exclude
  # Longhorn will schedule replicas here unless told otherwise.
  longhorn_scheduling: disable
