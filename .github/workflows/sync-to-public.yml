name: sync-to-public

# Publishes a SANITIZED subset of this PRIVATE source repo to the PUBLIC template
# repo (IaC + config/param never leave private). See scripts/sync-to-public.sh.
#
# Setup (one-time):
#   1. Create a PUBLIC template repo (e.g. <owner>/InfraWeaver-IAC).
#   2. Add an SSH deploy key (read-write) on ONLY that public repo and store its
#      private half as the secret PUBLIC_REPO_DEPLOY_KEY.
#   3. Set the `vars.PUBLIC_REPO` variable to "owner/public-repo".
# Until both are set, the job no-ops (it only runs when PUBLIC_REPO is defined),
# so adding this workflow changes nothing on its own.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sync-to-public
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Guard: only run once the public target is configured.
    if: ${{ vars.PUBLIC_REPO != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize deny-list for the content scan
        # params/.public-deny is gitignored (it holds the private identifiers),
        # so it is absent from the CI checkout. Without it the fail-closed
        # content deny-scan in sync-to-public.sh silently no-ops. Restore it
        # from the PUBLIC_DENY_LIST secret and fail hard if it is not configured.
        env:
          PUBLIC_DENY_LIST: ${{ secrets.PUBLIC_DENY_LIST }}
        run: |
          if [ -z "$PUBLIC_DENY_LIST" ]; then
            echo "::error::PUBLIC_DENY_LIST secret is not set — refusing to sync without an active content deny-scan." >&2
            exit 1
          fi
          mkdir -p params
          printf '%s\n' "$PUBLIC_DENY_LIST" > params/.public-deny
      - name: Materialize genericize-map for the export transform
        # params/.public-genericize is gitignored (it pairs real identifiers with
        # their public placeholders), so it is absent from the CI checkout. Without
        # it sync-to-public.sh skips the genericize transform and the fail-closed
        # deny-scan then aborts on the real values that base manifests still carry.
        # Restore it from the PUBLIC_GENERICIZE_MAP secret and fail hard if unset.
        env:
          PUBLIC_GENERICIZE_MAP: ${{ secrets.PUBLIC_GENERICIZE_MAP }}
        run: |
          if [ -z "$PUBLIC_GENERICIZE_MAP" ]; then
            echo "::error::PUBLIC_GENERICIZE_MAP secret is not set — refusing to sync without the export genericize transform." >&2
            exit 1
          fi
          mkdir -p params
          printf '%s\n' "$PUBLIC_GENERICIZE_MAP" > params/.public-genericize
      - name: Configure write-scoped deploy key (SSH)
        # Push with an SSH deploy key bound to ONLY the public repo (read-write),
        # instead of a broad account token. Fail hard if the key is missing.
        env:
          DEPLOY_KEY: ${{ secrets.PUBLIC_REPO_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::PUBLIC_REPO_DEPLOY_KEY secret is not set — cannot push to the public repo." >&2
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/public_repo_deploy
          chmod 600 ~/.ssh/public_repo_deploy
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
      - name: Sync sanitized tree to public repo
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/public_repo_deploy -o IdentitiesOnly=yes
          PUBLIC_REPO_URL: git@github.com:${{ vars.PUBLIC_REPO }}.git
        run: bash scripts/sync-to-public.sh
