name: validate-iac

# Server-side GitOps gate: every change to manifests is validated on PR before
# it can reach main (which ArgoCD syncs to the cluster). This is the "how large
# orgs do it" control — branch protection should require this check to pass, so
# the client-side pre-push hook becomes a fast local pre-check, not the gate.
on:
  pull_request:
    paths:
      - "kubernetes/**"
      - "scripts/validate-iac.sh"
      - "scripts/validate-netpol-ports.sh"
      - ".github/workflows/validate-iac.yml"
  push:
    branches: [main]
    paths:
      - "kubernetes/**"

permissions:
  contents: read

jobs:
  validate:
    name: validate-iac   # status-check context name (required by branch protection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl (provides kustomize v5)
        uses: azure/setup-kubectl@v4

      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kc.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kc.tar.gz -C /usr/local/bin kubeconform

      # promtool gates the alerting rules (validate-iac.sh step 5/5). Pinned
      # rather than :latest so a Prometheus release cannot turn CI red on a day
      # nothing in this repo changed.
      - name: Install promtool
        env:
          PROM_VERSION: '3.13.2'
        run: |
          curl -fsSL -o /tmp/prom.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          tar -xzf /tmp/prom.tar.gz -C /usr/local/bin \
            --strip-components=1 "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          promtool --version

      # Moved AHEAD of validate-iac.sh: its secret-leak, cron-secret and
      # alerting-rule gates all parse manifests with PyYAML. They were relying on
      # the runner image happening to ship it, and would have degraded the moment
      # it did not.
      - name: Install PyYAML (manifest-parsing gates)
        run: python3 -m pip install --quiet pyyaml

      - name: Validate IaC (render + schema + secret-leak + cron-secret + alert-rule gates)
        run: bash scripts/validate-iac.sh

      - name: Validate NetworkPolicy ports (pod-port vs Service-port gate)
        run: bash scripts/validate-netpol-ports.sh

      - name: Validate ESO references
        run: bash scripts/validate-eso-refs.sh || true   # informational until hardened
