name: validate-iac

# Server-side GitOps gate: every change to manifests is validated on PR before
# it can reach main (which ArgoCD syncs to the cluster). This is the "how large
# orgs do it" control — branch protection should require this check to pass, so
# the client-side pre-push hook becomes a fast local pre-check, not the gate.
on:
  pull_request:
    paths:
      - "kubernetes/**"
      - "scripts/validate-iac.sh"
      - "scripts/validate-netpol-ports.sh"
      - "scripts/validate-gitops-coverage.py"
      - "scripts/validate-scheduling.py"
      - "scripts/fleet-topology.yaml"
      - "scripts/validate-openbao-policy-drift.sh"
      - "scripts/deploy/bootstrap-openbao.sh"
      # Gate 7's input. A PR that edits the snapshot, or edits any script whose
      # basename could collide with InfraWeaver-platform's tree, must re-run the
      # duplicate-script gate.
      - "scripts/platform-scripts.inventory"
      - "scripts/**"
      - ".github/workflows/validate-iac.yml"
  push:
    branches: [main]
    paths:
      - "kubernetes/**"

permissions:
  contents: read

jobs:
  validate:
    name: validate-iac   # status-check context name (required by branch protection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl (provides kustomize v5)
        uses: azure/setup-kubectl@v4

      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kc.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kc.tar.gz -C /usr/local/bin kubeconform

      # promtool gates the alerting rules (validate-iac.sh step 5/5). Pinned
      # rather than :latest so a Prometheus release cannot turn CI red on a day
      # nothing in this repo changed.
      - name: Install promtool
        env:
          PROM_VERSION: '3.13.2'
        run: |
          curl -fsSL -o /tmp/prom.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          tar -xzf /tmp/prom.tar.gz -C /usr/local/bin \
            --strip-components=1 "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          promtool --version

      # Moved AHEAD of validate-iac.sh: its secret-leak, cron-secret and
      # alerting-rule gates all parse manifests with PyYAML. They were relying on
      # the runner image happening to ship it, and would have degraded the moment
      # it did not.
      - name: Install PyYAML (manifest-parsing gates)
        run: python3 -m pip install --quiet pyyaml

      # Gates 1/2/5 need kubeconform and promtool, installed above. Since
      # 2026-08-19 a MISSING tool is no longer a silent skip: validate-iac.sh
      # ends INCOMPLETE with exit 1 rather than printing PASSED, so a broken
      # install step above can no longer let this job go green on a partial run.
      # Never set IAC_ALLOW_SKIPPED_GATES here.
      - name: Validate IaC (render + schema + secret-leak + cron-secret + alert-rule + duplicate-script gates)
        run: bash scripts/validate-iac.sh

      - name: Validate NetworkPolicy ports (pod-port vs Service-port gate)
        run: bash scripts/validate-netpol-ports.sh

      # Static half of the OpenBao policy drift check. CI has no route to the
      # cluster, so it cannot diff live — but it CAN guarantee the heredocs stay
      # parseable and well-formed, which is what keeps the live check (run with
      # --live from an operator host / cron) from silently comparing nothing.
      - name: Validate OpenBao policy definitions (static drift gate)
        run: bash scripts/validate-openbao-policy-drift.sh

      # The "committed but never deployed" gate. This platform's signature
      # failure is a directory of valid manifests that NO Application renders:
      # it passes kubeconform, it passes review, `git log` says it shipped, and
      # the cluster has never seen it. core/rbac sat inert while the
      # cluster-admin binding it replaces stayed live; core/etcd-maintenance sat
      # inert for eight days; minio-velero ran with no owner underneath Velero's
      # only BackupStorageLocation. Nothing checked, so nothing was found.
      - name: Validate GitOps coverage (every manifest directory has an Application)
        run: python3 scripts/validate-gitops-coverage.py

      # Scheduling rules must still bind to a node/zone that exists. Deleting
      # talos-prod-cp2 on 2026-08-15 turned three rules into no-ops without an
      # error anywhere, and authentik's Traefik p95 went 0.270 s -> 3.765 s with
      # no change to any file. Also rejects zone rules written as preferences —
      # a WAN boundary is not a hint. Policy: docs/SCHEDULING-ZONES.md
      - name: Validate scheduling rules (stale node/zone references, soft zone rules)
        run: python3 scripts/validate-scheduling.py

      - name: Validate ESO references
        run: bash scripts/validate-eso-refs.sh || true   # informational until hardened
