---
# ArgoCD Application: cluster network policies (airgap baseline + allowlists).
# Syncs ONLY kubernetes/core/network-policies/manifests/ — the live posture.
# pending/ and _TEMPLATE.yaml are intentionally outside this path so they are not
# auto-applied.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core-network-policies
  namespace: argocd
spec:
  project: default-restricted
  source:
    repoURL: ${DEPLOY_REPO_URL}
    targetRevision: main
    path: kubernetes/core/network-policies/manifests
    # repoURL carries a ${} token, so render through the envsubst CMP like the
    # other core *-manifests apps.
    plugin:
      name: envsubst-v1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ServerSideApply=true
