---
# Standalone ArgoCD Application for Authentik supporting manifests
# Deploys: ExternalSecret for secrets + Authentik blueprint ConfigMaps
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps-authentik-manifests
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: ${DEPLOY_REPO_URL}
    targetRevision: main
    path: kubernetes/platform/authentik/manifests
    directory:
      # Required for manifests/blueprints/ (WP11, GAP-C5) to be seen at all.
      # A plain directory source is non-recursive by default, so without this
      # the blueprint ConfigMaps in that subdirectory would never be created —
      # they would look like config-as-code and do nothing. ArgoCD reads only
      # *.yaml / *.yml / *.json, which is what keeps the *.yaml.DEFERRED
      # enforcement blueprints out of the cluster.
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      name: authentik-secrets
      jsonPointers:
        - /status
