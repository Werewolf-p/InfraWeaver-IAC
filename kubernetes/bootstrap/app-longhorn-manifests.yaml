---
# Standalone ArgoCD Application for Longhorn extra StorageClass manifests.
# The Longhorn Helm chart (core-longhorn) manages the "longhorn" StorageClass.
# This Application deploys supplementary manifests (e.g. longhorn-retain StorageClass).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core-longhorn-manifests
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: ${DEPLOY_REPO_URL}
    targetRevision: main
    path: kubernetes/core/longhorn/manifests
    plugin:
      name: envsubst-v1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  # This directory now also carries a Kyverno ClusterPolicy
  # (longhorn-manager-resources.yaml), and Kyverno DEFAULTS fields onto its own
  # policy objects after admission — so the live object never matches git and
  # this Application sat permanently OutOfSync (measured 2026-08-07).
  #
  # Copied verbatim from the core-kyverno-policies Application, which has
  # carried exactly this for every other ClusterPolicy in the repo. Kept here
  # rather than moving the policy file into core/kyverno/manifests, because the
  # move would prune and recreate the ClusterPolicy, and during that window a
  # new longhorn-manager pod would be admitted WITHOUT the memory mutation —
  # which is the whole reason the policy exists.
  ignoreDifferences:
    - group: kyverno.io
      kind: ClusterPolicy
      jqPathExpressions:
        - .status
        - .spec.admission
        - .spec.rules[].skipBackgroundRequests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
