---
# appset-core.yaml — Mandatory ApplicationSet for kubernetes/core/ tier.
# This file is regenerated by scripts/sync-groups.sh — do not edit manually
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-core
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - git:
        repoURL: ${DEPLOY_REPO_URL}
        revision: HEAD
        files:
          - path: "kubernetes/core/*/application.yaml"
  template:
    metadata:
      name: '{{ index (splitList "/" .path.path) 1 }}-{{ index (splitList "/" .path.path) 2 }}'
      namespace: argocd
    spec:
      project: platform
      sources:
        - repoURL: ${DEPLOY_REPO_URL}
          targetRevision: HEAD
          ref: values
        - repoURL: "{{ .repoURL }}"
          targetRevision: "{{ .targetRevision }}"
          chart: "{{ .chart }}"
          helm:
            releaseName: "{{ .releaseName }}"
            valueFiles:
              - "$values/{{ .path.path }}/values.yaml"
            parameters:
              - name: replicaCount
                value: '{{ if .replicas }}{{ .replicas }}{{ else }}1{{ end }}'
              - name: global.domain
                value: '{{ if eq .path.path "kubernetes/core/argocd" }}argocd.int.${BASE_DOMAIN}{{ end }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - '{{ if eq (default "true" .serverSideApply) "false" }}ServerSideApply=false{{ else }}ServerSideApply=true{{ end }}'
          - RespectIgnoreDifferences=true
      ignoreDifferences:
        # ── kyverno 1.18 policy CRDs: apiserver-defaulted conversion ──────────
        # These 11 CRDs arrived with the 3.2.8 -> 3.8.2 upgrade. The chart does
        # not set `spec.conversion`, so the apiserver defaults it to
        # `{strategy: None}` and ArgoCD reports every one of them OutOfSync
        # forever while the sync itself reports Succeeded.
        #
        # ⚠️ Scoped BY NAME on purpose. This ApplicationSet templates every
        # core-* Application, including core-longhorn, whose CRDs legitimately
        # declare `conversion.strategy: Webhook`. A blanket
        # `kind: CustomResourceDefinition` ignore would hide a real change to
        # that wiring -- and a stale longhorn conversion webhook pointing at a
        # Service with zero endpoints is a bug that was cleaned up on the same
        # day this was written.
        - kind: CustomResourceDefinition
          name: deletingpolicies.policies.kyverno.io
          jsonPointers:
            - /spec/conversion
        - kind: CustomResourceDefinition
          name: generatingpolicies.policies.kyverno.io
          jsonPointers:
            - /spec/conversion
        - kind: CustomResourceDefinition
          name: imagevalidatingpolicies.policies.kyverno.io
          jsonPointers:
            - /spec/conversion
        - kind: CustomResourceDefinition
          name: mutatingpolicies.policies.kyverno.io
          jsonPointers:
            - /spec/conversion
        - kind: CustomResourceDefinition
          name: namespaceddeletingpolicies.policies.kyverno.io
          jsonPointers:
            - /spec/conversion
        - kind: CustomResourceDefinition
          name: namespacedgeneratingpolicies.policies.kyverno.io
          jsonPointers:
            - /spec/conversion
        - kind: CustomResourceDefinition
          name: namespacedimagevalidatingpolicies.policies.kyverno.io
          jsonPointers:
            - /spec/conversion
        - kind: CustomResourceDefinition
          name: namespacedmutatingpolicies.policies.kyverno.io
          jsonPointers:
            - /spec/conversion
        - kind: CustomResourceDefinition
          name: namespacedvalidatingpolicies.policies.kyverno.io
          jsonPointers:
            - /spec/conversion
        - kind: CustomResourceDefinition
          name: policyexceptions.policies.kyverno.io
          jsonPointers:
            - /spec/conversion
        - kind: CustomResourceDefinition
          name: validatingpolicies.policies.kyverno.io
          jsonPointers:
            - /spec/conversion
        - kind: Secret
          jqPathExpressions:
            - '.data["admin-password"]'
            - '.data["admin-user"]'
        - group: external-secrets.io
          kind: ExternalSecret
          jsonPointers:
            - /status
            - /metadata/finalizers
          jqPathExpressions:
            - '.spec.data[].remoteRef.conversionStrategy'
            - '.spec.data[].remoteRef.decodingStrategy'
            - '.spec.data[].remoteRef.metadataPolicy'
        - group: apps
          kind: StatefulSet
          jsonPointers:
            - /spec/persistentVolumeClaimRetentionPolicy
          managedFieldsManagers:
            - kube-controller-manager
        - kind: Secret
          name: cilium-ca
          namespace: kube-system
          jsonPointers:
            - /data
        - kind: Secret
          name: hubble-server-certs
          namespace: kube-system
          jsonPointers:
            - /data
        - kind: Secret
          name: hubble-relay-client-certs
          namespace: kube-system
          jsonPointers:
            - /data
        - group: monitoring.coreos.com
          kind: ServiceMonitor
          name: hubble
          namespace: kube-system
          jsonPointers:
            - /spec/endpoints
