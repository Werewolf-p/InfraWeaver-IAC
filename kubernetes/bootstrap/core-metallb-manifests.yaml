---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core-metallb-manifests
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ${DEPLOY_REPO_URL}
    targetRevision: main
    path: kubernetes/core/metallb/manifests
    # Render through the envsubst CMP so ${PLACEHOLDER} config tokens
    # (e.g. ${METALLB_TRAEFIK_VIP}, ${METALLB_COREDNS_VIP}) resolve at sync time.
    plugin:
      name: envsubst-v1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
