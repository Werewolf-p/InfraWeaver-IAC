---
# Standalone ArgoCD Application for Kyverno ClusterPolicies.
# ClusterPolicies are cluster-scoped so they deploy to the kyverno namespace
# but apply cluster-wide (filtered to apps-* and catalog-* namespaces).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core-kyverno-policies
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: ${DEPLOY_REPO_URL}
    targetRevision: main
    path: kubernetes/core/kyverno/manifests
    plugin:
      name: envsubst-v1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  # NEVER add a jqPathExpression that reaches INSIDE .spec.rules here.
  #
  # `ClusterPolicy.spec.rules` is an ATOMIC list — the CRD schema declares only
  # description/items/type, no `x-kubernetes-list-type` — so it cannot be edited
  # field-by-field. Under `RespectIgnoreDifferences=true` + `ServerSideApply=true`
  # an ignore path inside that list makes ArgoCD normalise the WHOLE list out of
  # the desired object and send the live rules back instead. The sync then reports
  # `serverside-applied` and Succeeded, the object does not move, and the app sits
  # OutOfSync forever. `argocd app diff` and selfHeal are both blind to it: they
  # run the same normalisation that built the bad payload.
  #
  # It cost two incidents. 2026-08-07: a second rule on mutate-default-sa-automount
  # never landed. 2026-08-12/13: the opt-out namespaceSelector on the five
  # `=()`-anchored Enforce policies never landed, leaving wordpress, game-hub and
  # game-servers — the namespaces running third-party code — outside every
  # admission rule while the app claimed a successful sync.
  #
  # Scalar ignores are fine and stay. `skipBackgroundRequests` is now pinned
  # explicitly on every rule in git instead (see the preceding commit), so it needs
  # no ignore at all. See docs/gitops-operating-model.md §7.1.
  ignoreDifferences:
    - group: kyverno.io
      kind: ClusterPolicy
      jqPathExpressions:
        - '.status'
        - '.spec.admission'
        # Added 2026-08-16 with the kyverno 3.2.8 -> 3.8.2 (v1.12.6 -> v1.18.2)
        # upgrade. 1.18 defaults `spec.emitWarning: false` on every ClusterPolicy,
        # which our manifests predate, so all 21 policies reported OutOfSync
        # immediately after a sync that had itself Succeeded. Same shape and same
        # remedy as `.spec.admission` above.
        #
        # A top-level SCALAR, which is the safe kind per the note above — it does
        # not reach inside the atomic `.spec.rules` list.
        - '.spec.emitWarning'
