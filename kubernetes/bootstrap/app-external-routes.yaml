---
# ArgoCD Application — deploys all external-routes manifests
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-routes
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: ${DEPLOY_REPO_URL}
    targetRevision: main
    path: kubernetes/platform/external-routes/manifests
    # Render through the envsubst CMP so ${PLACEHOLDER} config tokens
    # (e.g. ${ADMIN_EMAIL}, ${BASE_DOMAIN}) resolve at sync time.
    plugin:
      name: envsubst-v1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
