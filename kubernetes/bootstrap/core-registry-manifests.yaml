---
# ArgoCD Application for the self-hosted Zot OCI registry (kubernetes/core/registry).
# The registry is the "image gallery" for the feedback pipeline: preview images
# (one per approved change) and the released console image are pushed here by the
# in-cluster BuildKit, removing GitHub Actions / ghcr rate limits.
#
# Secret material is provided out-of-band (NOT in git): the `zot-htpasswd` Secret
# (registry ns) and `registry-pull-secret` (consumer namespaces). See
# kubernetes/core/registry/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core-registry-manifests
  namespace: argocd
  labels:
    infraweaver.io/type: core
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: ${DEPLOY_REPO_URL}
    targetRevision: main
    path: kubernetes/core/registry
  destination:
    server: https://kubernetes.default.svc
    namespace: registry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
