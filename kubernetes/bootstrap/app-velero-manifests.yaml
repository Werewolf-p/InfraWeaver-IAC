---
# Standalone ArgoCD Application for Velero's supplementary manifests.
# The Velero Helm chart itself (platform-velero) is generated by the
# core-platform ApplicationSet from kubernetes/platform/velero/application.yaml.
# This Application deploys only what the chart cannot: the ExternalSecret that
# materialises Velero's MinIO credentials out of OpenBao.
#
# NO `plugin: { name: envsubst-v1.0 }` HERE, DELIBERATELY.
# Nothing under kubernetes/platform/velero/manifests/ contains a ${PLACEHOLDER},
# so the CMP would add a rendering hop for no benefit. If a future manifest in
# that directory needs ${BASE_DOMAIN} (e.g. an IngressRoute), the plugin block
# MUST be added at the same time — the CMP is opt-in per Application, not
# per-path, and an unsubstituted placeholder ships verbatim.
#
# sync-wave 1: the ExternalSecret must exist before the Velero Deployment tries
# to mount the Secret it produces. Velero tolerates the gap (it restarts until
# /credentials/cloud appears) but this removes the avoidable CrashLoop.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-velero-manifests
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: velero
    infraweaver.io/type: platform
spec:
  project: platform
  source:
    repoURL: ${DEPLOY_REPO_URL}
    targetRevision: main
    path: kubernetes/platform/velero/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      # The `velero` Namespace already exists and its PSA labels are owned by
      # core-psa-manifests (kubernetes/core/psa/namespace-labels.yaml is the
      # single source of truth for PSA). CreateNamespace is kept for a
      # from-scratch rebuild; this Application ships no Namespace object, so it
      # cannot fight core-psa-manifests for ownership of the labels.
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # ESO defaults these remoteRef strategy fields server-side after admission,
    # so the live object never matches git without this. Same block every other
    # ExternalSecret-carrying Application in this repo uses.
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /status
        - /metadata/finalizers
      jqPathExpressions:
        - '.spec.data[].remoteRef.conversionStrategy'
        - '.spec.data[].remoteRef.decodingStrategy'
        - '.spec.data[].remoteRef.metadataPolicy'
