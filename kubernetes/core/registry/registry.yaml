---
# Zot OCI registry — the self-hosted "image gallery" for the feedback pipeline.
# Preview images (one per approved change) and the released console image are
# pushed here by the in-cluster BuildKit, removing GitHub Actions / ghcr rate
# limits. The host carries NO Authentik forward-auth (docker/buildkit/containerd
# clients cannot complete SSO) — Zot's own htpasswd is the access gate.
#
# Secret material is provided out-of-band (NOT in git): the `zot-htpasswd`
# Secret (registry ns). See kubernetes/core/registry/README.md.
#
# Namespace `registry` PSA labels are set centrally in
# kubernetes/core/psa/namespace-labels.yaml (do not add a Namespace here).
apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-config
  namespace: registry
  labels:
    app.kubernetes.io/name: zot
    infraweaver.io/component: registry
data:
  config.json: |
    {
      "distSpecVersion": "1.1.0",
      "storage": { "rootDirectory": "/var/lib/registry", "dedupe": false, "gc": true, "gcDelay": "1h", "gcInterval": "24h" },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "auth": { "htpasswd": { "path": "/secret/htpasswd" } }
      },
      "log": { "level": "info" },
      "extensions": {
        "search": { "enable": false },
        "ui": { "enable": false }
      }
    }
# ── Why search/ui are DISABLED (changed 2026-08-12) ──────────────────────────
# Zot's `ui` extension is a browsable web console and `search` is the GraphQL
# API behind it. Between them they enumerate the complete image inventory —
# every repository name, every tag, every CVE report — to anything that gets
# past the single shared htpasswd credential. That inventory is a map of the
# platform's internals and of which images are behind on patches, which is
# reconnaissance handed over for free, and `ui` cannot run without `search`.
#
# Nothing in the platform needs them: BuildKit pushes and containerd pulls speak
# the OCI distribution API on /v2/, which is unaffected. This costs a
# human-facing convenience and removes an information-disclosure surface from a
# host whose only authentication is one password shared by every client.
#
# Re-enabling is a one-line change if the browser UI is wanted — it is a more
# defensible one now that the route is gated by `lan-only` (see the IngressRoute
# at the bottom of this file), because the UI is then LAN-reachable rather than
# internet-reachable.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zot-data
  namespace: registry
  labels:
    app.kubernetes.io/name: zot
    infraweaver.io/component: registry
spec:
  accessModes: ["ReadWriteOnce"]
  # Node-local storage. Longhorn's network-replicated RWO volume churns
  # (attach/detach FailedMount) under a registry's large sequential blob writes,
  # replacing the Zot pod mid-push (500/504). local-path is far more robust here;
  # registry images are rebuildable so single-node durability is acceptable.
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zot
  namespace: registry
  labels:
    app.kubernetes.io/name: zot
    infraweaver.io/component: registry
spec:
  replicas: 1
  strategy:
    type: Recreate          # single RWO volume — never run two pods at once
  selector:
    matchLabels:
      app.kubernetes.io/name: zot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zot
        infraweaver.io/component: registry
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zot
          image: ghcr.io/project-zot/zot-linux-amd64:v2.1.2
          imagePullPolicy: IfNotPresent
          args: ["serve", "/etc/zot/config.json"]
          ports:
            - name: http
              containerPort: 5000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Pushing the large console image (many node_modules layers) with
          # dedupe/GC enabled needs headroom; 512Mi OOMs → Traefik 503 on push.
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "2", memory: 2Gi }
          # /v2/ returns 401 under htpasswd auth (correct), and embedding creds in
          # an HTTP probe would leak them to git — so check the listening socket.
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { name: config, mountPath: /etc/zot }
            - { name: htpasswd, mountPath: /secret, readOnly: true }
            - { name: data, mountPath: /var/lib/registry }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: zot-config }
        - name: htpasswd
          secret: { secretName: zot-htpasswd }
        - name: data
          persistentVolumeClaim: { claimName: zot-data }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
  labels:
    app.kubernetes.io/name: zot
    infraweaver.io/component: registry
spec:
  selector:
    app.kubernetes.io/name: zot
  ports:
    - name: http
      port: 5000
      targetPort: http
---
# Browser/API route: registry.int.${BASE_DOMAIN} → Zot. Lives in the traefik ns
# (cross-namespace service ref is allowed: traefik runs with allowCrossNamespace=true).
#
# ── WHY THIS ROUTE NOW CARRIES lan-only (added 2026-08-12) ───────────────────
# It could not use forward-auth — docker/buildkit/containerd cannot complete an
# SSO redirect — and that fact was allowed to stand in for a decision. The
# result: registry.int is a publicly RESOLVABLE hostname (the cloudflare-proxied
# annotation below is deliberately "false", so the A record points straight at
# the origin), with no edge authentication and no rate limit, in front of the
# registry that serves this platform's own production images.
#
# The consequence is not information disclosure, it is code execution. Zot's
# only gate was one shared htpasswd credential exposed to the entire internet
# for unlimited guessing; a single successful PUSH over an existing tag means
# the next pull of that tag runs attacker-chosen code as infraweaver-api. The
# blast radius is the platform, not the registry.
#
# `lan-only` is the control the platform already had and had never wired up —
# 01-middlewares.yaml defines it and its own comment names "Docker registry
# pulls" as the intended consumer. It is FIRST in the chain on purpose: deny
# non-LAN sources before spending any other middleware on the request.
#
# rate-limit-public (not -public-cf) is the correct variant precisely BECAUSE
# cloudflare-proxied is false: with no proxy in front, Traefik sees the real
# client IP directly, so the limiter buckets per real client. Read the header of
# core/traefik/manifests/middleware-rate-limit.yaml before changing either.
#
# cloudflare-proxied STAYS "false" — see the annotation's own note; proxying
# mangles OCI chunked blob uploads. lan-only is what compensates for that, and
# the two must be changed together or not at all.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: registry-int
  namespace: traefik
  annotations:
    external-dns.alpha.kubernetes.io/managed: "true"
    # DNS-only (NOT Cloudflare-proxied): the OCI registry push protocol
    # (chunked blob uploads, OCI manifest media types) is mangled by the
    # Cloudflare proxy — pushes fail with 415 / connection-reset. Going direct to
    # Traefik (valid wildcard TLS) makes push+pull reliable.
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
  labels:
    infraweaver.io/access-tier: internal
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`registry.int.${BASE_DOMAIN}`)
      kind: Rule
      middlewares:
        # Order matters: reject non-LAN sources before anything else runs.
        - name: lan-only
          namespace: traefik
        - name: rate-limit-public
          namespace: traefik
        - name: secure-headers
          namespace: traefik
      services:
        - name: registry
          namespace: registry
          port: 5000
  tls:
    secretName: platform-int-wildcard-tls
