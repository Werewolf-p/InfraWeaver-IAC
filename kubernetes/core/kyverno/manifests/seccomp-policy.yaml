---
# Kyverno ClusterPolicy: require seccomp profile on catalog/apps pods
#
# Mode: Audit — logs violations but does NOT block deployments.
# Rationale: seccomp RuntimeDefault blocks ~44% of Linux kernel syscalls used
# in container escape CVEs (e.g. CVE-2022-0492, CVE-2023-0386). This is listed
# in Kubernetes Pod Security Standards (Restricted) and NSA/CISA K8s Hardening Guide.
#
# RuntimeDefault uses the container runtime's built-in seccomp filter.
# Localhost is also allowed for custom profiles.
# Applies to: catalog/* and apps/* namespaces (not infrastructure).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-seccomp-profile
  annotations:
    policies.kyverno.io/title: Require Seccomp Profile
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Pods should set securityContext.seccompProfile.type to RuntimeDefault or Localhost.
      RuntimeDefault enables the container runtime's default seccomp filter, blocking
      ~44% of kernel syscalls and reducing the attack surface for container escapes.
      This is an Audit policy — violations are logged but not blocked.
spec:
  validationFailureAction: Enforce
  admission: true
  background: true
  rules:
    - name: check-seccomp-profile
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchLabels:
                  infraweaver.io/type: catalog-app
      exclude:
        any:
          # Namespaces whose pods legitimately run privileged, host-networked or
          # hostPath-mounted. Kept even though the match above is narrow, because
          # kyverno/values.yaml's `config.excludeNamespacesFromAdmission` and
          # `features.webhooks.namespaceSelector` are BOTH INERT — the live
          # ConfigMap carries only the chart defaults (kyverno, kube-system,
          # kube-public, kube-node-lease). Verify, do not trust the values file:
          #     kubectl get cm kyverno -n kyverno -o jsonpath='{.data}'
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - longhorn-system
                - metallb-system
                - local-path-storage
                - monitoring
                - build
                - falco
                - velero
      validate:
        # Pinned, not ignored: kyverno 1.18 defaults this onto every validate
        # rule, and it lives INSIDE the atomic .spec.rules list where an
        # ignoreDifferences entry is forbidden here. Same treatment as
        # skipBackgroundRequests. true is the 1.18 default and matches what
        # is live; tightening it is a deliberate change, not a default.
        allowExistingViolations: true
        message: >-
          Pod "{{ request.object.metadata.name }}" should set
          spec.securityContext.seccompProfile.type to RuntimeDefault or Localhost.
          This limits kernel syscall exposure and reduces container escape risk.
        pattern:
          spec:
            securityContext:
              seccompProfile:
                type: "RuntimeDefault | Localhost"
---
# Kyverno ClusterPolicy: require seccomp profile — WIDE SCOPE, AUDIT ONLY
#
# The opt-out half of the ratchet described in the SCOPE MODEL header of
# cluster-policies.yaml. seccomp RuntimeDefault is the single highest-value
# control for the namespaces this newly reaches: `wordpress` executes
# third-party plugin code, `game-hub`/`game-servers` execute third-party mods,
# and `plex`/`jellyfin` parse attacker-supplied container formats — the exact
# shape of the container-escape CVEs (CVE-2022-0492, CVE-2023-0386) whose
# syscalls RuntimeDefault blocks. None of them had ANY seccomp rule before.
#
# It ships Audit, not Enforce, on measured grounds: 36 workload files under
# kubernetes/catalog/ declare no seccompProfile at all, so Enforce here would
# refuse admission to all of them at their next restart — a node drain would
# take out the catalog. Fix the workloads, confirm the report is clean, THEN
# widen the Enforce policy above and delete this one. Never run both at Enforce.
#     kubectl get clusterpolicyreport -o wide | grep require-seccomp-profile-wide
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-seccomp-profile-wide
  annotations:
    policies.kyverno.io/title: Require Seccomp Profile (wide scope, audit)
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Audit-only companion to require-seccomp-profile covering every namespace
      that is not core/platform infrastructure. Measures the remediation backlog
      before the Enforce policy is widened.
spec:
  validationFailureAction: Audit
  admission: true
  background: true
  rules:
    - name: check-seccomp-profile-wide
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchExpressions:
                  - key: infraweaver.io/type
                    operator: NotIn
                    values: [core, platform, platform-app, system]
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - cilium-secrets
                - longhorn-system
                - metallb-system
                - local-path-storage
                - monitoring
                - build
                - falco
                - velero
                - argocd
                - traefik
                - dns-system
                # Already covered at Enforce by the narrow policy above; listing
                # them here keeps exactly one report per pod.
                - gatus
                - infraweaver-console
                - stirling-pdf
                - registry
      validate:
        # Pinned, not ignored: kyverno 1.18 defaults this onto every validate
        # rule, and it lives INSIDE the atomic .spec.rules list where an
        # ignoreDifferences entry is forbidden here. Same treatment as
        # skipBackgroundRequests. true is the 1.18 default and matches what
        # is live; tightening it is a deliberate change, not a default.
        allowExistingViolations: true
        message: >-
          Pod "{{ request.object.metadata.name }}" should set
          spec.securityContext.seccompProfile.type to RuntimeDefault or Localhost.
          This limits kernel syscall exposure and reduces container escape risk.
        pattern:
          spec:
            securityContext:
              seccompProfile:
                type: "RuntimeDefault | Localhost"
---
# Kyverno ClusterPolicy: warn when pods automount ServiceAccount tokens unnecessarily
#
# Mode: Audit — logs violations but does NOT block deployments.
# Rationale: automountServiceAccountToken: true (the default) injects a K8s API
# credential into every pod. Workloads that don't call the K8s API expose this
# credential unnecessarily — if the container is compromised, the token can be
# used for lateral movement (privilege escalation via RBAC).
# NSA/CISA K8s Hardening Guide §4.2: "Disable auto-mounting of service account tokens".
#
# Applies to: catalog/* and apps/* namespaces.
# Note: Infrastructure pods (argocd, cert-manager, etc.) legitimately need SA tokens.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: warn-automount-service-account-token
  annotations:
    policies.kyverno.io/title: Warn Automount ServiceAccount Token
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: low
    policies.kyverno.io/description: >-
      Pods that don't call the Kubernetes API should set
      automountServiceAccountToken: false to prevent unnecessary credential exposure.
      If a container is compromised and has a mounted SA token, attackers can use it
      for lateral movement via RBAC. This is an Audit policy — violations are logged
      but not blocked (some apps legitimately need SA tokens).
spec:
  validationFailureAction: Audit
  admission: true
  background: true
  rules:
    - name: check-automount-serviceaccount-token
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchLabels:
                  infraweaver.io/type: catalog-app
      validate:
        # Pinned, not ignored: kyverno 1.18 defaults this onto every validate
        # rule, and it lives INSIDE the atomic .spec.rules list where an
        # ignoreDifferences entry is forbidden here. Same treatment as
        # skipBackgroundRequests. true is the 1.18 default and matches what
        # is live; tightening it is a deliberate change, not a default.
        allowExistingViolations: true
        message: >-
          Pod "{{ request.object.metadata.name }}" has automountServiceAccountToken enabled (default).
          If this pod does not call the Kubernetes API, set automountServiceAccountToken: false
          in the pod spec (or on the ServiceAccount) to reduce credential exposure.
        pattern:
          spec:
            automountServiceAccountToken: "false"
