---
# Kyverno ClusterPolicy — Block :latest image tags
# Source: ArgoCD best practices (immutable manifests) + OWASP K8s security
# Mode: Enforce — blocks admission of pods with :latest tags
# Scope: catalog and apps namespaces only (core platform excluded — uses pinned tags)
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      The ':latest' tag is mutable and can lead to unexpected changes.
      Require all container images in catalog/apps namespaces to use
      a specific version tag.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaceSelector:
                matchExpressions:
                  - key: infraweaver.io/type
                    operator: In
                    values:
                      - catalog-app
      exclude:
        any:
          # Namespaces whose pods legitimately run privileged, host-networked or
          # hostPath-mounted. Kept even though the match above is narrow, because
          # kyverno/values.yaml's `config.excludeNamespacesFromAdmission` and
          # `features.webhooks.namespaceSelector` are BOTH INERT — the live
          # ConfigMap carries only the chart defaults. Verify, do not trust it:
          #     kubectl get cm kyverno -n kyverno -o jsonpath='{.data}'
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - longhorn-system
                - metallb-system
                - local-path-storage
                - monitoring
                - build
                - falco
                - velero
      validate:
        message: "Image tag ':latest' is not allowed. Pin to a specific version (e.g. 'myapp:1.2.3')."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
---
# Kyverno ClusterPolicy — Block :latest image tags, WIDE SCOPE, AUDIT ONLY
#
# The opt-out half of the ratchet described in the SCOPE MODEL header of
# cluster-policies.yaml. What this newly reaches is the point: a mutable tag in
# `wordpress`, `game-hub` or an on-demand catalog namespace means the image that
# runs after the next pod restart is not the image anyone reviewed — and for a
# registry we push to ourselves, a tag overwrite is code execution on the next
# reschedule with no git commit to point at.
#
# It ships Audit, not Enforce, on measured grounds: four catalog apps pin
# `:latest` today (homer, it-tools, cyberchef, gotify). Enforce would refuse
# admission to all four at their next restart. Pin them, confirm the report is
# clean, then widen the Enforce policy above and delete this one.
#
# KNOWN GAP, NOT FIXED HERE: the pattern `!*:latest` is a literal string match,
# so an image with NO tag at all — `mace/qbittorrent`, `lscr.io/linuxserver/plex`
# — passes even though the runtime resolves it to :latest. Catching that needs a
# separate rule matching `image: "!*:*"`, which would also have to allow digest
# pins; it is deliberately left out of this change rather than half-done.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag-wide
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag (wide scope, audit)
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Audit-only companion to disallow-latest-tag covering every namespace that
      is not core/platform infrastructure. Measures the remediation backlog
      before the Enforce policy is widened.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-image-tag-wide
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaceSelector:
                matchExpressions:
                  - key: infraweaver.io/type
                    operator: NotIn
                    values: [core, platform, platform-app, system]
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - cilium-secrets
                - longhorn-system
                - metallb-system
                - local-path-storage
                - monitoring
                - build
                - falco
                - velero
                - argocd
                - traefik
                - dns-system
                # Already covered at Enforce by the narrow policy above; listing
                # them here keeps exactly one report per pod.
                - gatus
                - infraweaver-console
                - stirling-pdf
                - registry
      validate:
        message: "Image tag ':latest' is not allowed. Pin to a specific version (e.g. 'myapp:1.2.3')."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
