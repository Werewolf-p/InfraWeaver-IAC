---
# =============================================================================
# Resource governance ClusterPolicies.
# =============================================================================
# WHAT THESE ADD OVER THE LIMITRANGES:
# The LimitRanges in kubernetes/core/limitranges/ are apiserver-native and
# cannot fail open, but they only exist in namespaces someone remembered to
# enumerate. These policies are the cluster-wide net, and rule 1 below closes
# the loop permanently: any namespace created from now on gets a baseline
# LimitRange automatically, with no human step.
#
# WHY THE EXISTING POLICIES DID NOT PREVENT THIS — both were measured inert:
#
#   require-resource-limits (cluster-policies.yaml)
#     - validationFailureAction: Audit  -> never blocked anything
#     - namespaceSelector infraweaver.io/type=catalog-app -> matches exactly
#       TWO namespaces cluster-wide: gatus and infraweaver-console
#     - it only asserts that limits EXIST. A 1Gi request against a 12Gi limit
#       satisfies it perfectly, so it could never have caught buildkitd.
#
#   set-default-memory-limits (default-memory-limits-policy.yaml)
#     - match is namespaceSelector app.kubernetes.io/part-of in [infraweaver],
#       which matches exactly ONE namespace: game-hub
#     - exclude explicitly lists game-hub
#     - match ∩ ¬exclude = EMPTY SET. The policy has matched zero namespaces
#       since it was written. It is inert, not merely weak.
#
# ROLLOUT POSTURE: every validate rule here ships as Audit deliberately.
# Kyverno JMESPath expressions cannot be dry-run from a GitOps checkout, so
# these must be observed in policy reports before being flipped to Enforce.
# In Audit mode a malformed expression logs a policy error and ADMITS the pod;
# it cannot cause an outage. Flip to Enforce only after confirming:
#     kubectl get clusterpolicyreport -o wide
#     kubectl get clusterpolicy <name> -o jsonpath='{.status}'
# returns Ready with no unexpected failures.
#
# OPEN FINDING, 2026-08-07 — require-memory-request-and-limit (bottom of this
# file) fails on TWO openbao subjects, and the fix is split across two events:
#   StatefulSet/openbao  -> FIXED IN GIT. kubernetes/core/openbao/values.yaml had
#     `resources` and `priorityClassName` at the TOP level, where the chart never
#     read them; they now sit under `server.*` plus new resources on the
#     autounseal sidecar. The StatefulSet has `updateStrategy: OnDelete`, so this
#     commit changes the template and recreates NO pod — the StatefulSet finding
#     clears at the next Kyverno background scan with nothing restarted.
#   Pod/openbao-0        -> STAYS OPEN until openbao-0 is deliberately recreated.
#     That is HUMAN-GATED and scheduled separately: OpenBao comes back SEALED
#     every restart, is reopened only by the autounseal sidecar's 30s loop, and
#     the `OpenBaoSealed` alert cannot fire (docs/OPENBAO-OPERATIONS.md §0.1), so
#     ~3-5 minutes of sealed OpenBao pass unmonitored. Never delete this pod to
#     tidy a policy report. Procedure: docs/OPENBAO-OPERATIONS.md §1.
# =============================================================================

# -----------------------------------------------------------------------------
# RULE 1 — the self-applying part. This is what makes it "never again".
#
# A namespace created tomorrow by the console, by a catalog install, or by hand
# has no LimitRange and therefore no floor: its pods can be BestEffort and its
# limits unbounded. That is exactly how the cluster drifted. This generates a
# baseline LimitRange into every new namespace automatically.
#
# `synchronize: true` means the generated object is also repaired if someone
# deletes or edits it — the "dynamically fixed" property, not a one-off.
#
# The values are IDENTICAL to baseline-namespaces.yaml on purpose. Namespaces
# already covered explicitly there are excluded below so there is exactly one
# LimitRange per namespace and no ambiguity about which defaults apply.
#
# NOTE: this rule needs the background controller to be allowed to write
# LimitRanges — the aggregated ClusterRole at the bottom of this file grants
# it. Without that RBAC the rule fails silently, so verify after sync with:
#     kubectl get limitrange -A | grep auto-baseline
# -----------------------------------------------------------------------------
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-baseline-limitrange
  annotations:
    policies.kyverno.io/title: Auto-provision Baseline LimitRange
    policies.kyverno.io/category: Resource Management
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Every namespace gets a LimitRange supplying a default CPU and memory
      request, so no workload can ever be admitted as BestEffort simply
      because nobody remembered to write a LimitRange for its namespace.
      Self-healing via synchronize.
spec:
  admission: true
  background: true
  rules:
    - name: add-baseline-limitrange
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Namespace
      exclude:
        any:
          # Talos-managed static pods and the CNI. A LimitRange here is not
          # worth the risk of ever interfering with control-plane admission.
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
          # Storage data plane — carries its own LimitRange already at
          # kubernetes/core/longhorn/manifests/instance-manager-limits.yaml
          - resources:
              namespaces:
                - longhorn-system
          # Governed explicitly in kubernetes/core/limitranges/. Excluded so
          # each namespace has exactly one LimitRange and one set of defaults.
          - resources:
              namespaces:
                - argocd
                - authentik
                - build
                - cert-manager
                - dns-system
                - external-dns
                - external-secrets
                - game-hub
                - gatus
                - infraweaver-console
                - infraweaver-system
                - jellyfin
                - local-path-storage
                - metallb-system
                - monitoring
                - n8n-prod
                - nextcloud
                - openbao
                - private-test
                - registry
                - traefik
                - velero
                - wordpress
      generate:
        apiVersion: v1
        kind: LimitRange
        name: auto-baseline-requests
        namespace: "{{ request.object.metadata.name }}"
        synchronize: true
        data:
          metadata:
            labels:
              infraweaver.io/governance: auto-baseline
          spec:
            limits:
              - type: Container
                defaultRequest:
                  cpu: 10m
                  memory: 32Mi
---
# -----------------------------------------------------------------------------
# RULE 1b — the same trick, applied to the thing that had a much bigger hole.
#
# THE GAP THIS CLOSES: 31 namespaces with running workloads had NO
# NetworkPolicy and NO CiliumNetworkPolicy of any kind, which under Cilium means
# default-ALLOW in both directions. Among them:
#
#   vaultwarden   a password vault, reachable from every pod on the cluster
#   velero        holds the MinIO credentials and every cluster backup
#   qbittorrent   fetches attacker-controlled content by design
#   jackett       same, and talks to whatever indexer it is pointed at
#
# kubernetes/core/network-policies/manifests/airgap-baseline.yaml opens with
# "one block per application namespace" and covers eleven. It was accurate the
# day it was written. Every namespace created since — every on-demand catalog
# install — arrived with nothing, because the block is hand-written and nobody
# is on the hook to write one. Exactly the failure mode RULE 1 above fixed for
# LimitRanges, in a place where the consequence is lateral movement rather than
# a noisy neighbour.
#
# So: same mechanism, same `synchronize: true` self-healing. The generated
# policy is a byte-for-byte copy of the shape that is already live and
# Hubble-verified in airgap-baseline.yaml — intra-namespace, cluster DNS,
# Traefik ingress, monitoring scrape, nothing else — with ONE deliberate
# subtraction: no `toEntities: [kube-apiserver]`. A freshly installed catalog
# app has no business talking to the API server, and handing it that path by
# default is how a stolen token stops being harmless. Namespaces that genuinely
# need it get an explicit CNP, the way argocd/authentik/kyverno already do in
# network-policies/manifests/apiserver-egress.yaml.
#
# `fromEndpoints: [{}]` / `toEndpoints: [{}]` in a NAMESPACED CiliumNetworkPolicy
# means "any endpoint in this policy's own namespace" — the same idiom
# apiserver-egress.yaml uses for the argocd->redis allow. It avoids templating
# the namespace name into the selector.
#
# ⚠️ EXPECTED AND INTENDED CONSEQUENCE, READ BEFORE SYNCING: every namespace not
# excluded below LOSES OUTBOUND INTERNET on first sync. That is the control
# working. Holes go in network-policies/manifests/allowlists.yaml as toFQDNs
# entries, scoped per app, NOT by widening this template.
#
# THE BLAST RADIUS ABOVE WAS WRITTEN FROM A NAMESPACE LIST THAT IS NOT THIS
# CLUSTER'S — measured 2026-08-13, `kubectl get ns` returns 37 namespaces and
# the exclude list below now covers 36 of them. The in-scope set is exactly:
#     apps-grafana   (holds no pods; standalone grafana is application.yaml
#                     .disabled and no grafana pod runs anywhere on the cluster)
# and that is the whole of it. vaultwarden, qbittorrent, jackett, sonarr,
# radarr, lidarr and prowlarr DO NOT EXIST as namespaces here, so none of the
# "31 namespaces" above, and none of the *arr-stack breakage predicted in the
# original text, is reachable from this repo's state. Jellyfin metadata and the
# Nextcloud app store were never at risk either: both namespaces already run an
# egress baseline that permits world:443, and both are now excluded below for
# the ingress reason documented there. Do not re-derive scope from this header
# — re-measure. The gap this rule really closes today is future namespaces.
#
# WHERE THE ORIGINAL LIST CAME FROM, because the mistake is worth naming: those
# names are kubernetes/catalog/ entries, not namespaces. vaultwarden,
# qbittorrent, jackett, sonarr, radarr, lidarr and prowlarr are all INSTALLABLE
# on demand and none is installed. So the predicted breakage is real but in the
# FUTURE TENSE — it lands the day someone installs one, because the namespace is
# created then and this rule fires on that admission.
#
# NO HOLE IS PRE-GRANTED FOR ANY OF THEM, deliberately:
#   qbittorrent / jackett  are the workloads this lockdown exists for. They
#     fetch attacker-controlled content, and default-deny is the correct and
#     intended posture. Do not widen them to make a download work.
#   sonarr / radarr / lidarr / prowlarr  need whatever indexers and metadata
#     providers THAT operator configures at runtime. The hostnames are user
#     data, not a property of this repo, so there is no honest toFQDNs list to
#     write in advance — writing a guessed one, or reaching for
#     `toEntities: [world]` to avoid guessing, would hand the *arr stack the
#     exact broad egress this rule was built to remove.
# The correct move on first install is to read the real destinations out of
# Hubble (`hubble observe --namespace <ns> --verdict DROPPED`) and add a scoped
# toFQDNs block to allowlists.yaml from measured hostnames.
#
# VERIFY AFTER SYNC — a generate rule that lacks RBAC fails SILENTLY, which is
# the one failure mode that would leave all 31 namespaces exposed while the
# policy reads as healthy in git:
#     kubectl get cnp -A | grep auto-default-deny
#     kubectl get clusterpolicy generate-default-deny-cnp -o jsonpath='{.status}'
# The ClusterRole granting ciliumnetworkpolicies to the background controller is
# at the bottom of this file, next to the LimitRange one.
#
# CHANGING THE EXCLUDE LIST BELOW REQUIRES DELETING THIS POLICY FIRST.
# Kyverno's own admission webhook rejects EVERY update that touches a generate
# rule's immutable fields — `exclude` is one of them:
#     admission webhook "validate-policy.kyverno.svc" denied the request:
#     change of immutable fields for a generate rule is disallowed
# Renaming the RULE does not help (measured with --dry-run=server: denied
# identically), and neither does Replace=true, because `kubectl replace` is still
# an update. Only delete-then-create is accepted.
#
# WHAT THAT COSTS IF NOBODY NOTICES, measured on 2026-08-13. Adding the
# jellyfin/nextcloud exclusion left `core-kyverno-policies` permanently
# OutOfSync: ArgoCD retried 5 times, gave up, and — because a child in a failed
# sync operation drags its parent down — reported the `bootstrap` app-of-apps as
# Degraded with no message and no unhealthy resource under it. Two apps looked
# broken, the cause was in neither's resource list, and real drift in this app
# would have been invisible behind the permanent OutOfSync.
#
# THE PROCEDURE:
#     kubectl get clusterpolicy generate-default-deny-cnp -o yaml > /tmp/cp.bak
#     kubectl get cnp -A -l infraweaver.io/governance=auto-default-deny   # note them
#     kubectl delete clusterpolicy generate-default-deny-cnp
#     # ArgoCD does NOT recreate it on its own once the operation has failed its
#     # retry limit — selfHeal will not re-enter a failed sync. Trigger one:
#     kubectl patch app core-kyverno-policies -n argocd --type merge \
#       -p '{"operation":{"initiatedBy":{"username":"<you>"},"sync":{"revision":"HEAD"}}}'
# Deleting the policy does NOT cascade to the CiliumNetworkPolicies it already
# generated (verified: apps-grafana/auto-default-deny survived untouched), so the
# window is limited to namespaces created during it. If one is lost anyway, a
# no-op label change on its namespace re-triggers the rule — this matches
# Namespace admission, not a background scan, so nothing backfills on its own.
# -----------------------------------------------------------------------------
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-default-deny-cnp
  annotations:
    policies.kyverno.io/title: Auto-provision Default-Deny CiliumNetworkPolicy
    policies.kyverno.io/category: Network Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Every namespace gets a default-deny CiliumNetworkPolicy allowing only
      intra-namespace traffic, cluster DNS, Traefik ingress and monitoring
      scrape, so no namespace can ever be created into a default-allow posture
      simply because nobody remembered to hand-write an airgap block for it.
      Self-healing via synchronize.
spec:
  admission: true
  background: true
  rules:
    - name: add-default-deny-cnp
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Namespace
      exclude:
        any:
          # ── Would break the cluster, not harden it ──────────────────────────
          # Talos static pods, the CNI itself, the storage data plane, and the
          # LoadBalancer speakers all predate or bypass pod networking.
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - cilium-secrets
                - longhorn-system
                - metallb-system
                - local-path-storage
                - kyverno
          # ── Legitimately need far more than this template allows ────────────
          # traefik must reach a backend in EVERY namespace; monitoring must
          # scrape every namespace; gatus probes every service; velero must
          # reach MinIO plus every PVC data path. Default-denying any of these
          # takes out ingress, observability, health and backups respectively.
          - resources:
              namespaces:
                - traefik
                - monitoring
                - gatus
                - velero
          # ── Already carry a hand-written, Hubble-verified airgap block ──────
          # kubernetes/core/network-policies/manifests/{airgap-baseline,
          # infra-airgap,wordpress-lockdown}.yaml. Excluded so each namespace has
          # exactly one default-deny policy and one place to change it.
          - resources:
              namespaces:
                - build
                - dns-system
                - game-hub
                - game-servers
                - infraweaver
                - infraweaver-system
                - n8n-prod
                - private-test
                - registry
                - tradesphere
                - wordpress
          # ── Already EGRESS-airgapped, and must stay ingress default-ALLOW ───
          # These two also carry a hand-written baseline, but it lives in
          # allowlists.yaml rather than airgap-baseline.yaml, which is why they
          # were missed above. Both are ALREADY egress default-deny today —
          # jellyfin-egress and nextcloud-egress each select their pods for
          # egress — so this template adds NO egress protection here. What it
          # would add is `ingress:`, and both policies omit ingress ON PURPOSE:
          # a namespace with no ingress rule is ingress default-ALLOW, and the
          # comments on both blocks call that out as the design, not an
          # oversight. Selecting these pods for ingress breaks, specifically:
          #   jellyfin  native/TV clients — NodePort 8920 and LAN discovery
          #             7359/1900 UDP arrive from world/host, which the
          #             template's traefik+monitoring ingress does not cover.
          #   jellyfin  console RBAC account provisioning (console→8096) and
          #             the nextcloud media-notify sidecar's library refresh
          #             (nextcloud→8096). Both have an EGRESS hole in
          #             allowlists.yaml and no ingress hole, because none was
          #             ever needed — the hole comments say so explicitly.
          #   nextcloud user offboard's OCS delete (console→80), same shape.
          # Excluding is narrower than re-granting all of that: reproducing the
          # DLNA path alone would mean `fromEntities: [world, host]` on four
          # ports, which is wider than simply not enforcing ingress. If these
          # ever should go ingress default-deny, that is a deliberate change
          # with Hubble evidence for the DLNA clients — not a side effect of a
          # template. See the postgresql-nextcloud egress block added to
          # allowlists.yaml, which closes the one real gap this exclusion left.
          - resources:
              namespaces:
                - jellyfin
                - nextcloud
          # ── Already run default-deny + an explicit apiserver egress CNP ─────
          # network-policies/manifests/apiserver-egress.yaml. These are
          # controllers and operators; the template below would cut them off
          # from the API server and stop reconciliation cluster-wide.
          - resources:
              namespaces:
                - argocd
                - authentik
                - cert-manager
                - external-dns
                - external-secrets
                - falco
                - infraweaver-console
                - openbao
          # ── Structural namespaces that hold no pods ─────────────────────────
          - resources:
              namespaces:
                - default
                - bootstrap
                - crds
      generate:
        apiVersion: cilium.io/v2
        kind: CiliumNetworkPolicy
        name: auto-default-deny
        namespace: "{{ request.object.metadata.name }}"
        synchronize: true
        data:
          metadata:
            labels:
              app.kubernetes.io/managed-by: gitops
              infraweaver.io/posture: airgapped
              infraweaver.io/governance: auto-default-deny
          spec:
            endpointSelector: {}
            ingress:
              # Same namespace.
              - fromEndpoints: [{}]
              - fromEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": traefik}}]
              - fromEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": monitoring}}]
            egress:
              - toEndpoints: [{}]
              - toEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": kube-system, "k8s-app": kube-dns}}]
                toPorts:
                  - ports:
                      - {port: "53", protocol: UDP}
                      - {port: "53", protocol: TCP}
                    rules:
                      dns: [{matchPattern: "*"}]
---
# -----------------------------------------------------------------------------
# RULE 2 — bound the memory burst ratio cluster-wide.
#
# This is the direct structural answer to "limits at 494% of allocatable".
# A memory limit far above its request is a promise the node cannot keep:
# the scheduler packs the node using REQUESTS, but the kernel OOM killer
# enforces LIMITS. Measured worst offenders before this change:
#     20.0x  kube-system/csi-smb-controller   20Mi  -> 400Mi
#     16.0x  jellyfin/jellyfin               256Mi  -> 4096Mi
#     12.0x  build/buildkitd                1024Mi  -> 12288Mi
#
# 8x is chosen because it admits every workload on the cluster today except
# the three above, of which buildkitd is fixed in this same change and the
# other two are namespace-scoped exceptions with a wider LimitRange ratio.
#
# CPU is deliberately NOT ratio-capped. CPU is compressible: a CPU limit
# throttles the owning container and protects nothing. Requests are what
# reserve CPU, and those are covered by the alerts in
# kubernetes/monitoring/alerts/resource-allocation.yaml.
# -----------------------------------------------------------------------------
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: limit-memory-burst-ratio
  annotations:
    policies.kyverno.io/title: Bound Memory Limit-to-Request Ratio
    policies.kyverno.io/category: Resource Management
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      A container's memory limit may not exceed 8x its memory request.
      Memory is incompressible, so a limit far above the request is
      unschedulable capacity the node cannot actually honour.
spec:
  # AUDIT FIRST. See rollout posture in the header before changing to Enforce.
  validationFailureAction: Audit
  admission: true
  background: true
  rules:
    - name: memory-limit-request-ratio
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                # Talos / CNI / storage — not ours to reshape, and csi-smb
                # ships a 20x ratio from upstream.
                - kube-system
                - kube-public
                - kube-node-lease
                - longhorn-system
                - kyverno
                # Namespace-scoped wider ratios are declared in
                # kubernetes/core/limitranges/governed-namespaces.yaml,
                # which is apiserver-native and authoritative for these.
                - jellyfin
                - registry
                - infraweaver-console
      validate:
        message: >-
          Memory limit must not exceed 8x the memory request. Memory is
          incompressible: the scheduler packs nodes by request but the kernel
          OOM killer enforces the limit, so a wide ratio is capacity the node
          cannot honour. Either raise the request or lower the limit.
        foreach:
          - list: "request.object.spec.containers[?resources.limits.memory != null && resources.requests.memory != null]"
            deny:
              conditions:
                all:
                  - key: "{{ divide('{{ element.resources.limits.memory }}', '{{ element.resources.requests.memory }}') }}"
                    operator: GreaterThan
                    value: 8
---
# -----------------------------------------------------------------------------
# RULE 3 — require a memory request and a memory limit.
#
# Replaces the intent of require-resource-limits, which covered only two
# namespaces and asked for a CPU limit. This asks for what actually protects
# a node:
#   memory request  -> makes the pod visible to the scheduler and lifts it out
#                      of BestEffort so it is not first to be OOM-killed
#   memory limit    -> caps blast radius
#   cpu request     -> the scheduler's only real CPU reservation
# A CPU LIMIT IS DELIBERATELY NOT REQUIRED. Requiring one would force CFS
# throttling onto the 14 wordpress pods that legitimately burst today.
# -----------------------------------------------------------------------------
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-memory-request-and-limit
  annotations:
    policies.kyverno.io/title: Require Memory Request and Limit
    policies.kyverno.io/category: Resource Management
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Every container must declare a CPU request, a memory request and a
      memory limit. CPU limits are intentionally not required.
spec:
  validationFailureAction: Audit
  admission: true
  background: true
  rules:
    - name: check-memory-request-and-limit
      # Background scanning off for this rule: it would report against every
      # pre-existing pod on every scan, and the LimitRange defaults only take
      # effect on next rollout, so the reports would be noise for weeks.
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - longhorn-system
                - kyverno
                - metallb-system
                - monitoring
      validate:
        message: >-
          Containers must declare resources.requests.cpu,
          resources.requests.memory and resources.limits.memory.
          A container with no request is scheduled as if it were free and is
          the first thing killed when a node runs short.
        pattern:
          spec:
            containers:
              - name: "*"
                resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"
---
# -----------------------------------------------------------------------------
# RBAC for RULE 1.
#
# Kyverno's background controller can only generate resource kinds it has been
# granted. LimitRange is not in its default permission set, so without this the
# generate rule above fails silently.
#
# AGGREGATION SELECTS ON THE THREE app.kubernetes.io LABELS BELOW — measured
# live 2026-08-07, do not copy this from documentation:
#   kubectl get clusterrole kyverno:background-controller -o jsonpath='{.aggregationRule}'
#   -> matchLabels: app.kubernetes.io/component=background-controller,
#                   app.kubernetes.io/instance=kyverno,
#                   app.kubernetes.io/part-of=kyverno
#
# `rbac.kyverno.io/aggregate-to-background-controller: "true"` does NOT match
# that selector. Until 2026-08-07 this role carried ONLY that label and was
# therefore INERT — measured:
#   kubectl get clusterrole -l app.kubernetes.io/component=background-controller\
# ,app.kubernetes.io/instance=kyverno,app.kubernetes.io/part-of=kyverno -o name
#   -> :core and :serviceaccounts only; :limitranges ABSENT.
# Nobody noticed because the chart's own :core role already aggregates
# limitranges create/update/patch/delete, which is everything the generate rule
# needed — so the grant read present in git, was absent live, and worked anyway.
#
# PROOF THAT THIS FIX TOOK EFFECT (the get/list/watch below are NOT supplied by
# :core — its limitranges rule is create/update/patch/delete only, measured
# 2026-08-07 — so their appearance in the aggregate proves THIS role fed it):
#   kubectl get clusterrole kyverno:background-controller -o json \
#     | jq '[.rules[] | select((.resources // []) | index("limitranges"))]'
# The `rbac.kyverno.io/...` label is retained: harmless, and it is the label
# Kyverno's own docs use, so removing it would invite someone to "restore" it.
# -----------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:background-controller:limitranges
  labels:
    app.kubernetes.io/component: background-controller
    app.kubernetes.io/instance: kyverno
    app.kubernetes.io/part-of: kyverno
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: [""]
    resources:
      - limitranges
    verbs:
      - create
      - update
      - patch
      - delete
      - get
      - list
      - watch
---
# -----------------------------------------------------------------------------
# RBAC for RULE 1b.
#
# CiliumNetworkPolicy is a CRD, so it is nowhere in Kyverno's default permission
# set — unlike LimitRange, there is no chart-provided `:core` role quietly
# covering for a missing grant here. Without this ClusterRole the generate rule
# fails SILENTLY and all 31 unprotected namespaces stay default-allow while the
# policy reads as healthy in git. That is the worst possible failure shape for a
# security control, so it gets its own role rather than an appended verb.
#
# AGGREGATION SELECTS ON THE THREE app.kubernetes.io LABELS BELOW — measured
# live 2026-08-07, do not copy this from documentation:
#   kubectl get clusterrole kyverno:background-controller -o jsonpath='{.aggregationRule}'
#   -> matchLabels: app.kubernetes.io/component=background-controller,
#                   app.kubernetes.io/instance=kyverno,
#                   app.kubernetes.io/part-of=kyverno
# `rbac.kyverno.io/aggregate-to-background-controller: "true"` does NOT match
# that selector and on its own is inert — that mistake is documented in full
# above the LimitRange role. It is kept only because it is the label Kyverno's
# own docs use, so removing it would invite someone to "restore" it.
#
# PROOF THAT THIS TOOK EFFECT:
#   kubectl get clusterrole kyverno:background-controller -o json \
#     | jq '[.rules[] | select((.apiGroups // []) | index("cilium.io"))]'
# -----------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:background-controller:ciliumnetworkpolicies
  labels:
    app.kubernetes.io/component: background-controller
    app.kubernetes.io/instance: kyverno
    app.kubernetes.io/part-of: kyverno
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: ["cilium.io"]
    resources:
      - ciliumnetworkpolicies
    verbs:
      - create
      - update
      - patch
      - delete
      - get
      - list
      - watch
