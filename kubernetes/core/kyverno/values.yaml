# Kyverno — Kubernetes-native policy engine
# Deployed in audit mode. Policies enforce in apps/ and catalog/ namespaces.
# Single-node-friendly: all controllers set to 1 replica.

# ── Keep the controllers out of zone `hypatia` ───────────────────────────────
# Was "avoid CP2 (chronically OOM-killing)" as a preference naming
# talos-prod-cp2. That node no longer exists, so the rule had become a no-op --
# and on 2026-08-16 the ADMISSION controller was found running on cp4, the
# Hetzner box ~15 ms across the stretched VLAN (cp1<->cp3 is 0.19-0.63 ms).
#
# ⚠️ That is not an ordinary workload placement. The admission webhook is in the
# synchronous path of every CREATE/UPDATE of pods, deployments, jobs, namespaces,
# externalsecrets and ciliumnetworkpolicies cluster-wide, so a controller on the
# far side of the link adds that round trip to every matching API write -- which
# the console pays repeatedly on every page that touches the cluster.
#
# REQUIRED, not preferred: a preference is what silently failed here. cp1 and
# cp3 both remain eligible, so no availability is given up.
admissionController:
  replicas: 1
  # ⚠️ KEY PATH: the kyverno chart reads `<controller>.nodeAffinity`, NOT
  # `<controller>.affinity.nodeAffinity`. This was nested one level too deep
  # from the day it was written, so Helm silently discarded it and the rule
  # never existed -- verified 2026-08-16: the live admission-controller
  # Deployment carried only the chart's default podAntiAffinity. That is how
  # the controller ended up on cp4. A values key that does nothing looks
  # exactly like a values key that works.
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: topology.kubernetes.io/zone
          operator: NotIn
          values: [hypatia]
  serviceMonitor:
    enabled: false  # enable once Prometheus is confirmed running
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

backgroundController:
  replicas: 1
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: topology.kubernetes.io/zone
          operator: NotIn
          values: [hypatia]
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

cleanupController:
  replicas: 1
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: topology.kubernetes.io/zone
          operator: NotIn
          values: [hypatia]
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  cleanupJobsImage:
    registry: docker.io
    repository: alpine/k8s
    tag: "1.35.4"

reportsController:
  replicas: 1
  # Increase API rate limits to prevent leader-election lease timeouts during
  # post-crash reconciliation bursts (269+ restarts observed in 3 days).
  clientRateLimitQPS: 30
  clientRateLimitBurst: 60
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: topology.kubernetes.io/zone
          operator: NotIn
          values: [hypatia]
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# ── Namespace exclusions ──────────────────────────────────────────────────────
# System and platform namespaces are excluded from policy enforcement.
# These have legitimate reasons to run privileged/root workloads.
config:
  excludeNamespacesFromAdmission:
    - kube-system
    - kube-public
    - kube-node-lease
    - kyverno
    - argocd
    - authentik
    - openbao
    - longhorn-system
    - external-secrets
    - cert-manager
    - metallb-system
    - monitoring
    - ingress-nginx
    - traefik
    - external-dns
    - dns-system
    - local-path-storage
    - bootstrap
    - wiki
    - registry
    - velero
    - infraweaver-console
    - apps-grafana
    - apps-homepage
    - apps-gatus
    - apps-stirling-pdf
    - apps-immich

# ── Webhook interception — namespace-level bypass ─────────────────────────────
# These namespaces bypass the Kyverno webhook entirely (no policy call made).
# Critical: prevents Kyverno downtime from blocking Longhorn, Authentik, etc.
# Without this, failurePolicy=Fail on webhook causes ALL system pods to crash
# whenever Kyverno is restarting (e.g. during node OOM cascade recovery).
features:
  forceFailurePolicyIgnore:
    # All Kyverno webhooks use Ignore instead of Fail.
    # Prevents: Kyverno down → Longhorn manager crash → CSI deregistration → cascade.
    enabled: true
  webhooks:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - kyverno
            - argocd
            - authentik
            - openbao
            - longhorn-system
            - external-secrets
            - cert-manager
            - metallb-system
            - monitoring
            - traefik
            - dns-system
            - local-path-storage
            - bootstrap
            - wiki
            - registry
            - velero
            - infraweaver-console

# ── Webhook cleanup ───────────────────────────────────────────────────────────
webhooksCleanupEnabled: true

# ── kubectl image for all cleanup/webhook jobs ───────────────────────────────
# NOW ACTUALLY registry.k8s.io — this comment previously claimed the switch had
# been made while every block below still said `docker.io/bitnami/kubectl:latest`.
#
# Two problems with the old value, fixed together on 2026-08-07:
#
#  1. `:latest` is a floating tag on jobs that run `kubectl delete` against
#     cluster-scoped report resources. Whatever Bitnami last pushed became the
#     binary doing the deleting, unreviewed.
#  2. It is unpinnable. `docker.io/bitnami/kubectl` no longer publishes version
#     tags at all — Bitnami moved versioned images to `bitnamilegacy/kubectl`,
#     which is frozen at 1.33.4 (2025-08). Verified against the Docker Hub tag
#     API: the only non-digest tag left on bitnami/kubectl is `latest`. So there
#     was no in-place pin available; the registry had to change.
#
# registry.k8s.io/kubectl was tried next and BROKE EVERY CLEANUP JOB. It is a
# DISTROLESS image with no shell, and the chart hardcodes the entrypoint:
#
#   templates/cleanup/*.yaml  ->  command: [/bin/bash, -c, ...]
#
# That is not overridable from values — five cleanup templates plus three
# pre-delete/post-upgrade hooks all spell `/bin/bash` literally. Measured
# 2026-08-07, once the change actually reached the cluster:
#
#   Error: failed to create containerd task: ... unable to start container
#   process: exec: "/bin/bash": stat /bin/bash: no such file or directory
#
# All four report-cleanup CronJobs failed on every 10-minute run. The image swap
# had been committed and reviewed, but nothing had exercised it — the CronJobs
# only re-render when the release syncs, so the breakage surfaced hours later at
# an unrelated sync, looking like it came from that sync. Verify an image can
# RUN the command the chart hands it, not merely that the tag exists.
#
# docker.io/alpine/k8s bundles kubectl AND bash and publishes real version tags.
# 1.35.4 matches this cluster's server version exactly — note there is no `v`
# prefix, unlike registry.k8s.io. Verified in-cluster before committing, under
# the same hardening these jobs run with (runAsNonRoot, all capabilities
# dropped, RuntimeDefault seccomp):
#
#   bash=OK
#   Client Version: v1.35.4
#
# The `:latest` problem that motivated leaving bitnami stays solved: this is a
# pinned, versioned tag.
#
# Bump in step with the cluster's Kubernetes version — kubectl supports +/-1
# minor, so drifting more than one release behind will eventually break these
# jobs. When you bump it, confirm the new tag still ships bash.
webhooksCleanup:
  image:
    registry: docker.io
    repository: alpine/k8s
    tag: "1.35.4"

policyReportsCleanup:
  enabled: false  # Post-upgrade migration hook — not needed for fresh installs
  image:
    registry: docker.io
    repository: alpine/k8s
    tag: "1.35.4"

cleanupJobs:
  admissionReports:
    image:
      registry: docker.io
      repository: alpine/k8s
      tag: "1.35.4"
    # alpine/k8s has USER root, like registry.k8s.io/kubectl and unlike the
    # bitnami image the chart defaults to (which baked in USER 1001). The
    # chart's securityContext sets
    # runAsNonRoot: true with no runAsUser, so kubelet refused every cleanup pod
    # with "container has runAsNonRoot and image will run as root" (measured
    # 2026-08-07, CreateContainerConfigError x22). Pin the UID explicitly and
    # restate the chart's own hardening, because setting this key REPLACES it.
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
  clusterAdmissionReports:
    image:
      registry: docker.io
      repository: alpine/k8s
      tag: "1.35.4"
    # alpine/k8s has USER root, like registry.k8s.io/kubectl and unlike the
    # bitnami image the chart defaults to (which baked in USER 1001). The
    # chart's securityContext sets
    # runAsNonRoot: true with no runAsUser, so kubelet refused every cleanup pod
    # with "container has runAsNonRoot and image will run as root" (measured
    # 2026-08-07, CreateContainerConfigError x22). Pin the UID explicitly and
    # restate the chart's own hardening, because setting this key REPLACES it.
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
  ephemeralReports:
    image:
      registry: docker.io
      repository: alpine/k8s
      tag: "1.35.4"
    # alpine/k8s has USER root, like registry.k8s.io/kubectl and unlike the
    # bitnami image the chart defaults to (which baked in USER 1001). The
    # chart's securityContext sets
    # runAsNonRoot: true with no runAsUser, so kubelet refused every cleanup pod
    # with "container has runAsNonRoot and image will run as root" (measured
    # 2026-08-07, CreateContainerConfigError x22). Pin the UID explicitly and
    # restate the chart's own hardening, because setting this key REPLACES it.
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
  clusterEphemeralReports:
    image:
      registry: docker.io
      repository: alpine/k8s
      tag: "1.35.4"
    # alpine/k8s has USER root, like registry.k8s.io/kubectl and unlike the
    # bitnami image the chart defaults to (which baked in USER 1001). The
    # chart's securityContext sets
    # runAsNonRoot: true with no runAsUser, so kubelet refused every cleanup pod
    # with "container has runAsNonRoot and image will run as root" (measured
    # 2026-08-07, CreateContainerConfigError x22). Pin the UID explicitly and
