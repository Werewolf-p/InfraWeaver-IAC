# Kyverno — Kubernetes-native policy engine
# Deployed in audit mode. Policies enforce in apps/ and catalog/ namespaces.
# Single-node-friendly: all controllers set to 1 replica.

# ── Avoid CP2 (was chronically OOM-killing) ──────────────────────────────────
# All Kyverno controllers prefer CP1/CP3 to prevent co-location with CP2 crashes.
admissionController:
  replicas: 1
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
          - key: kubernetes.io/hostname
            operator: NotIn
            values: [talos-prod-cp2]
  serviceMonitor:
    enabled: false  # enable once Prometheus is confirmed running
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

backgroundController:
  replicas: 1
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
          - key: kubernetes.io/hostname
            operator: NotIn
            values: [talos-prod-cp2]
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

cleanupController:
  replicas: 1
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
          - key: kubernetes.io/hostname
            operator: NotIn
            values: [talos-prod-cp2]
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  cleanupJobsImage:
    registry: registry.k8s.io
    repository: kubectl
    tag: "v1.35.4"

reportsController:
  replicas: 1
  # Increase API rate limits to prevent leader-election lease timeouts during
  # post-crash reconciliation bursts (269+ restarts observed in 3 days).
  clientRateLimitQPS: 30
  clientRateLimitBurst: 60
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
          - key: kubernetes.io/hostname
            operator: NotIn
            values: [talos-prod-cp2]
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# ── Namespace exclusions ──────────────────────────────────────────────────────
# System and platform namespaces are excluded from policy enforcement.
# These have legitimate reasons to run privileged/root workloads.
config:
  excludeNamespacesFromAdmission:
    - kube-system
    - kube-public
    - kube-node-lease
    - kyverno
    - argocd
    - authentik
    - openbao
    - longhorn-system
    - external-secrets
    - cert-manager
    - metallb-system
    - monitoring
    - ingress-nginx
    - traefik
    - external-dns
    - dns-system
    - local-path-storage
    - bootstrap
    - wiki
    - registry
    - velero
    - infraweaver-console
    - apps-grafana
    - apps-homepage
    - apps-gatus
    - apps-stirling-pdf
    - apps-immich

# ── Webhook interception — namespace-level bypass ─────────────────────────────
# These namespaces bypass the Kyverno webhook entirely (no policy call made).
# Critical: prevents Kyverno downtime from blocking Longhorn, Authentik, etc.
# Without this, failurePolicy=Fail on webhook causes ALL system pods to crash
# whenever Kyverno is restarting (e.g. during node OOM cascade recovery).
features:
  forceFailurePolicyIgnore:
    # All Kyverno webhooks use Ignore instead of Fail.
    # Prevents: Kyverno down → Longhorn manager crash → CSI deregistration → cascade.
    enabled: true
  webhooks:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - kyverno
            - argocd
            - authentik
            - openbao
            - longhorn-system
            - external-secrets
            - cert-manager
            - metallb-system
            - monitoring
            - traefik
            - dns-system
            - local-path-storage
            - bootstrap
            - wiki
            - registry
            - velero
            - infraweaver-console

# ── Webhook cleanup ───────────────────────────────────────────────────────────
webhooksCleanupEnabled: true

# ── kubectl image for all cleanup/webhook jobs ───────────────────────────────
# NOW ACTUALLY registry.k8s.io — this comment previously claimed the switch had
# been made while every block below still said `docker.io/bitnami/kubectl:latest`.
#
# Two problems with the old value, fixed together on 2026-08-07:
#
#  1. `:latest` is a floating tag on jobs that run `kubectl delete` against
#     cluster-scoped report resources. Whatever Bitnami last pushed became the
#     binary doing the deleting, unreviewed.
#  2. It is unpinnable. `docker.io/bitnami/kubectl` no longer publishes version
#     tags at all — Bitnami moved versioned images to `bitnamilegacy/kubectl`,
#     which is frozen at 1.33.4 (2025-08). Verified against the Docker Hub tag
#     API: the only non-digest tag left on bitnami/kubectl is `latest`. So there
#     was no in-place pin available; the registry had to change.
#
# registry.k8s.io/kubectl is the upstream Kubernetes-published image and carries
# real version tags. v1.35.4 matches this cluster's server version exactly and
# was verified to exist before committing
# (digest sha256:e8bc9c71a813d90d5f7689fa57516b2aacd7a02bb9d70d3ab6664ed6d202fc10).
#
# Bump this in step with the cluster's Kubernetes version — kubectl supports
# +/-1 minor, so drifting more than one release behind will eventually break
# these jobs.
webhooksCleanup:
  image:
    registry: registry.k8s.io
    repository: kubectl
    tag: "v1.35.4"

policyReportsCleanup:
  enabled: false  # Post-upgrade migration hook — not needed for fresh installs
  image:
    registry: registry.k8s.io
    repository: kubectl
    tag: "v1.35.4"

cleanupJobs:
  admissionReports:
    image:
      registry: registry.k8s.io
      repository: kubectl
      tag: "v1.35.4"
  clusterAdmissionReports:
    image:
      registry: registry.k8s.io
      repository: kubectl
      tag: "v1.35.4"
  ephemeralReports:
    image:
      registry: registry.k8s.io
      repository: kubectl
      tag: "v1.35.4"
  clusterEphemeralReports:
    image:
      registry: registry.k8s.io
      repository: kubectl
      tag: "v1.35.4"
  updateRequests:
    image:
      registry: registry.k8s.io
      repository: kubectl
      tag: "v1.35.4"
