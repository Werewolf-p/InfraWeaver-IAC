---
# In-cluster BuildKit. The dispatch service (on the runner, ${NODE_SUBNET_CIDR}) runs
# `buildctl` against this daemon to build the console image and push it to the
# Zot registry — no GitHub Actions minutes, no ghcr pull limits.
#
# Runs ROOTFUL + privileged: the Talos nodes have user namespaces disabled
# (max_user_namespaces=0), which rootless BuildKit requires, so rootless fails
# with "no space left on device" on the userns clone. The `build` namespace is
# PSA `privileged` (set centrally in kubernetes/core/psa/namespace-labels.yaml)
# and Kyverno's privileged policy is Audit-mode, so this is admitted.
#
# Exposed via NodePort 31234 so the runner can reach it. Plain TCP on the
# internal network; mTLS is a future hardening step.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
  namespace: build
  labels:
    app.kubernetes.io/name: buildkitd
    infraweaver.io/component: buildkit
spec:
  replicas: 1
  # The running pod template is already conformant (1Gi request / 3Gi limit, a
  # 3x ratio — see the resources block below). The ONLY thing still failing
  # limit-memory-burst-ratio for this workload is a dead ReplicaSet from
  # 2026-06-13 that is scaled to 0 and still carries the old 1Gi/12Gi (12x)
  # template. It is retained purely as rollout history and nothing will ever
  # schedule from it again.
  #
  # revisionHistoryLimit is not part of the pod template, so changing it creates
  # no new revision and does NOT restart buildkitd. It simply lets the deployment
  # controller garbage-collect that stale ReplicaSet. 0 rather than 1 because 1
  # would retain precisely the offending ReplicaSet; buildkitd is a stateless
  # build daemon on an emptyDir, and rollback is `git revert` on this file.
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: buildkitd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildkitd
        infraweaver.io/component: buildkit
    spec:
      # Push to the registry via Traefik's INTERNAL MetalLB IP (${METALLB_TRAEFIK_VIP}),
      # not the public IP. Reaching the cluster's own public IP from a pod
      # hairpins and resets OCI blob uploads (415 / connection-reset); going
      # straight to the internal LB avoids that while Traefik still serves the
      # valid *.int wildcard cert (matched by SNI = registry.int.${BASE_DOMAIN}).
      hostAliases:
        - ip: "${METALLB_TRAEFIK_VIP}"
          hostnames:
            - registry.int.${BASE_DOMAIN}
      # Never co-schedule the heavy 12Gi build on the same node as the Zot
      # registry — the memory contention makes Zot 500/503 on large pushes.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              namespaces: ["registry"]
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: zot
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.16.0
          imagePullPolicy: IfNotPresent
          args:
            - --addr
            - unix:///run/buildkit/buildkitd.sock
            - --addr
            - tcp://0.0.0.0:1234
            # Allow RUN steps to opt out of BuildKit's seccomp sandbox. Node/V8
            # segfaults (exit 139) under the default seccomp profile on the Talos
            # kernel; builds pass `--allow security.insecure` + run with
            # `security.insecure` to execute RUN unsandboxed.
            - --allow-insecure-entitlement
            - security.insecure
          securityContext:
            privileged: true
          ports:
            - name: grpc
              containerPort: 1234
          readinessProbe:
            exec:
              command: ["buildctl", "debug", "workers"]
            initialDelaySeconds: 5
            periodSeconds: 30
          livenessProbe:
            exec:
              command: ["buildctl", "debug", "workers"]
            initialDelaySeconds: 10
            periodSeconds: 60
          # Next.js 16 production builds are memory-hungry; the webpack build
          # worker SIGSEGVs (OOM) under a 6Gi cap. cp1/cp2 have ~18Gi.
          resources:
            # Memory limit lowered 12Gi -> 3Gi (2026-08-02, resource governance).
            #
            # Measured: this pod requests 1Gi and uses 6Mi at idle, against a
            # 12Gi limit — a 12x burst ratio and the single largest block of
            # uncovered OOM exposure on the cluster. A 12Gi limit is also
            # larger than the ENTIRE allocatable memory of talos-prod-cp3
            # (6.4Gi), so it could never have been honoured on that node.
            #
            # Memory limits are what the kernel OOM killer enforces, so
            # over-committing them is not free the way CPU limits are:
            # talos-prod-cp1 carried 49452Mi of memory limits against 23.4Gi
            # of physical RAM, and this pod alone was 12Gi of that.
            #
            # 3Gi keeps a real 3x burst headroom over the 1Gi request for
            # actual image builds while capping the blast radius. If a genuine
            # build is ever OOMKilled at 3Gi, raise BOTH this and the
            # build-quota limits.memory in
            # kubernetes/core/limitranges/governed-namespaces.yaml, and keep
            # the limit:request ratio at or below the 4x cap declared there.
            requests: { cpu: 250m, memory: 1Gi }
            limits: { cpu: "4", memory: 3Gi }
          volumeMounts:
            - name: buildkitd
              mountPath: /var/lib/buildkit
      volumes:
        - name: buildkitd
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: buildkitd
  namespace: build
  labels:
    app.kubernetes.io/name: buildkitd
    infraweaver.io/component: buildkit
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: buildkitd
  ports:
    - name: grpc
      port: 1234
      targetPort: grpc
      nodePort: 31234
