# THE VOID — default-deny airgap baseline, one block per application namespace.
# Each makes the namespace deny-all except: intra-namespace, cluster DNS, the
# Kubernetes API, Traefik ingress, and monitoring scrape. Outbound internet is
# blocked; specific holes live in allowlists.yaml.
#
# Mirrors what is LIVE on the cluster. To airgap a new namespace, copy a block
# (or ../_TEMPLATE.yaml) and change the two namespace references.
# anchors keep this DRY and readable.
---
# Reusable rule sets (YAML anchors) — defined once, referenced per namespace below.
# (Comment-only; the blocks below are fully expanded so each is independently auditable.)

# ─────────────────────────────── tradesphere ───────────────────────────────
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: airgap-baseline, namespace: tradesphere, labels: {app.kubernetes.io/managed-by: gitops, infraweaver.io/posture: airgapped}}
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": tradesphere}}]
    - fromEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": traefik}}]
    - fromEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": monitoring}}]
  egress:
    - toEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": tradesphere}}]
    - toEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": kube-system, "k8s-app": kube-dns}}]
      toPorts: [{ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}], rules: {dns: [{matchPattern: "*"}]}}]
    - toEntities: [kube-apiserver]
---
