# THE VOID — default-deny airgap baseline, one block per application namespace.
# Each makes the namespace deny-all except: intra-namespace, cluster DNS, the
# Kubernetes API, Traefik ingress, and monitoring scrape. Outbound internet is
# blocked; specific holes live in allowlists.yaml.
#
# Mirrors what is LIVE on the cluster. To airgap a new namespace, copy a block
# (or ../_TEMPLATE.yaml) and change the two namespace references.
# anchors keep this DRY and readable.
#
# ⚠️ THIS FILE IS NO LONGER THE ONLY WAY A NAMESPACE GETS AIRGAPPED, and relying
# on it as such is what caused the gap it now shares with a policy. "One block
# per application namespace" was true the day it was written and then quietly
# stopped being true: hand-writing a block is a step nobody is on the hook for,
# so a namespace created by an on-demand catalog install arrives with no policy
# at all and is therefore default-ALLOW in both directions.
#
# The "31 namespaces, vaultwarden and qbittorrent among them" this paragraph
# used to claim is NOT this cluster — measured 2026-08-13, `kubectl get ns`
# returns 37 namespaces and none of them is vaultwarden, qbittorrent, jackett
# or any *arr app. The real unpolicied set today is one empty namespace
# (apps-grafana). Re-measure before citing a number here.
#
# `generate-default-deny-cnp` in kubernetes/core/kyverno/manifests/
# resource-governance-policies.yaml now emits this exact shape into every
# namespace automatically, with synchronize: true. The blocks below stay because
# each one is independently auditable and several differ from the template; a
# namespace that appears here MUST also appear in that policy's exclude list, or
# it ends up with two default-deny policies and two places to change it.
#
# ⚠️ THAT RULE APPLIES TO allowlists.yaml TOO, and that is exactly how jellyfin
# and nextcloud were missed: their baselines (jellyfin-egress, nextcloud-egress)
# live there, not here, so neither appeared in the exclude list. Both are now
# excluded. When you add a namespace baseline to EITHER file, add the exclude.
---
# Reusable rule sets (YAML anchors) — defined once, referenced per namespace below.
# (Comment-only; the blocks below are fully expanded so each is independently auditable.)

# ─────────────────────────────── tradesphere ───────────────────────────────
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: airgap-baseline, namespace: tradesphere, labels: {app.kubernetes.io/managed-by: gitops, infraweaver.io/posture: airgapped}}
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": tradesphere}}]
    - fromEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": traefik}}]
    - fromEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": monitoring}}]
  egress:
    - toEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": tradesphere}}]
    - toEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": kube-system, "k8s-app": kube-dns}}]
      toPorts: [{ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}], rules: {dns: [{matchPattern: "*"}]}}]
    - toEntities: [kube-apiserver]
---
