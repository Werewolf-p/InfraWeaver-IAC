# WordPress OIDC backchannel (token/userinfo/jwks) → Authentik.
#
# The public auth.example.com path NAT-hairpins through Cloudflare (pod cannot reach
# the homelab's own public IP) and the Traefik path is unreachable pod-internally, so the
# server-side OIDC calls go WP pod → authentik-server ClusterIP :443 (→9443 https) DIRECTLY.
# A hostAlias on each WordPress pod maps auth.example.com → the authentik ClusterIP so the
# Host header + TLS (and thus the https://auth.example.com issuer) stay correct; the plugin
# runs with no_sslverify=1 because authentik serves its self-signed internal cert there.
# Verified 2026-06-29 on testsite1: jwks 200, token endpoint reachable 0.08s (primary_ip =
# authentik ClusterIP), issuer https://auth.example.com/.../ . Front-channel (browser
# authorize/end-session) is unaffected — the hostAlias only changes the pod's own resolution.
#
# Both sides are required (zero-trust): WP egress allow + Authentik ingress allow.
---
# Additive backchannel allow: WordPress sites need server-side (token/userinfo/jwks)
# egress to Authentik. The public auth.example.com path NAT-hairpins through
# Cloudflare and fails; the Traefik path is unreachable pod-internally. So the OIDC
# backchannel goes WP pod -> authentik-server ClusterIP :443 (->9443 https) directly,
# with a hostAlias mapping auth.example.com -> the authentik ClusterIP so Host + TLS
# (and thus the https://auth.example.com issuer) stay correct.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: wordpress-oidc-backchannel
  namespace: wordpress
  labels: {app.kubernetes.io/managed-by: gitops, infraweaver.io/posture: airgapped}
spec:
  endpointSelector: {matchLabels: {"infraweaver.io/component": wordpress}}
  egress:
    - toEndpoints:
        - {matchLabels: {"k8s:io.kubernetes.pod.namespace": authentik, "app.kubernetes.io/name": authentik}}
      toPorts: [{ports: [{port: "9443", protocol: TCP}, {port: "9000", protocol: TCP}]}]
---
# Allow the WordPress OIDC backchannel (token/userinfo/jwks) to reach authentik-server.
# Pairs with wordpress/wordpress-oidc-backchannel. authentik runs default-deny-ingress;
# this is an additive allow scoped to the wordpress namespace on the https app port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-wordpress-oidc-ingress
  namespace: authentik
  labels: {app.kubernetes.io/managed-by: gitops, infraweaver.io/purpose: wordpress-oidc-backchannel}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: authentik}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: wordpress}}
      ports:
        - {port: 9443, protocol: TCP}
        - {port: 9000, protocol: TCP}
