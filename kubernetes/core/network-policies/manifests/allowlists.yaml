# THE HOLES — every exception to the airgap, one block per reason, with WHY.
# If a flow isn't allowed here (or by a namespace's own policies elsewhere), it's
# denied. This file is the single audit surface for "what is allowed out/across".
# Mirrors what is LIVE. The console "allow next time" feature appends here.
---
# WHY: the console's API drives ArgoCD (GitOps view, app sync) → it must reach argocd.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-console-to-argocd, namespace: infraweaver-console, labels: {app.kubernetes.io/managed-by: gitops}}
spec:
  endpointSelector: {}
  egress:
    - toEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": argocd}}]
---
# WHY: the matching ingress side — argocd-server must accept calls from the console.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-ingress-from-console, namespace: argocd, labels: {app.kubernetes.io/managed-by: gitops}}
spec:
  endpointSelector: {matchLabels: {"app.kubernetes.io/name": argocd-server}}
  ingress:
    - fromEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": infraweaver-console}}]
---
# WHY: the WordPress Manager addon reads/writes secrets in OpenBao (KV) when
# provisioning sites — OPENBAO_ADDR=openbao.openbao.svc:8200. The console's
# allow-console-to-argocd policy (endpointSelector {}) puts all console pods into
# egress-enforcement, and no hole permitted openbao, so create-site hung on a
# vault connection timeout. Egress side: console → openbao:8200.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-console-to-openbao, namespace: infraweaver-console, labels: {app.kubernetes.io/managed-by: gitops}}
spec:
  endpointSelector: {}
  egress:
    - toEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": openbao}}]
      toPorts: [{ports: [{port: "8200", protocol: TCP}]}]
---
# WHY: the matching ingress side — openbao must accept the console's KV calls.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-ingress-from-console, namespace: openbao, labels: {app.kubernetes.io/managed-by: gitops}}
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": infraweaver-console}}]
      toPorts: [{ports: [{port: "8200", protocol: TCP}]}]
---
# WHY: cert-manager needs the K8s API, ACME/CA endpoints (world), and DNS-01 providers
# to issue/renew certificates. Scoped to entities, not blanket allow.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-egress-ops, namespace: cert-manager, labels: {app.kubernetes.io/managed-by: gitops}}
spec:
  endpointSelector: {}
  egress:
    - toEntities: [kube-apiserver, world, cluster]
    - toEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": kube-system, "k8s-app": kube-dns}}]
      toPorts: [{ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}]}]
---
# WHY: external-dns needs the K8s API and the DNS provider API (world) to manage records.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-egress-ops, namespace: external-dns, labels: {app.kubernetes.io/managed-by: gitops}}
spec:
  endpointSelector: {}
  egress:
    - toEntities: [kube-apiserver, world, cluster]
    - toEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": kube-system, "k8s-app": kube-dns}}]
      toPorts: [{ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}]}]
---
# WHY: tradesphere's one real external dependency — the Binance market/trade API.
# FQDN-scoped (not blanket world): only *.binance.com:443 is reachable.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-egress-binance, namespace: tradesphere, labels: {app.kubernetes.io/managed-by: gitops}}
spec:
  endpointSelector: {}
  egress:
    - toFQDNs: [{matchPattern: "*.binance.com"}, {matchName: "api.binance.com"}, {matchName: "fapi.binance.com"}]
      toPorts: [{ports: [{port: "443", protocol: TCP}]}]
---
# WHY: the infraweaver-node agent (infraweaver-system) reports to / is driven by the
# console API (infraweaver-console, port 3001). Egress side. Observed dropped after the
# airgap migration — legitimate platform control-plane flow.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-node-to-api, namespace: infraweaver-system, labels: {app.kubernetes.io/managed-by: gitops}}
spec:
  endpointSelector: {matchLabels: {app: infraweaver-node}}
  egress:
    - toEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": infraweaver-console, app: infraweaver-api}}]
      toPorts: [{ports: [{port: "3001", protocol: TCP}]}]
---
# WHY: the matching ingress side — infraweaver-api must accept calls from the node agent.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-ingress-from-node, namespace: infraweaver-console, labels: {app.kubernetes.io/managed-by: gitops}}
spec:
  endpointSelector: {matchLabels: {app: infraweaver-api}}
  ingress:
    - fromEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": infraweaver-system, app: infraweaver-node}}]
      toPorts: [{ports: [{port: "3001", protocol: TCP}]}]
---
# WHY: game-server pods run Pelican/parkervcp install scripts that download game
# artifacts from the public internet on first boot (e.g. SpongeVanilla, TShock,
# SteamCMD, GitHub release assets). The airgap baseline blocks all outbound, which
# leaves the install init container hanging on curl forever. Download hosts vary
# per egg, so this opens world:443/80 — but SCOPED to actual game-server pods only
# (label infraweaver.io/game=true), not the whole namespace. DNS is already opened
# by the airgap baseline; restated here so this hole is self-contained for audit.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-game-downloads, namespace: game-hub, labels: {app.kubernetes.io/managed-by: gitops}}
spec:
  endpointSelector: {matchLabels: {"infraweaver.io/game": "true"}}
  egress:
    - toEntities: [world]
      toPorts: [{ports: [{port: "443", protocol: TCP}, {port: "80", protocol: TCP}]}]
    - toEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": kube-system, "k8s-app": kube-dns}}]
      toPorts: [{ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}], rules: {dns: [{matchPattern: "*"}]}}]
---
# WHY: players connect to game servers from outside the cluster via a NodePort on a
# node (typically the router forwards the public game port → the node's NodePort).
# Cilium sees that DNAT'd traffic with host / remote-node / world identity — none of
# which the airgap baseline's ingress allows (it only permits game-hub, traefik, and
# monitoring endpoints) — so every player packet was dropped and servers reported
# "Port Closed". This opens ingress to actual game pods only (label
# infraweaver.io/game=true) from the entities a NodePort path can present. Not
# port-scoped on purpose: each egg exposes only its own game port(s), nothing else
# listens on these pods, and ports vary per game (25565, 2456-2458, 27015, …) so a
# per-egg port list would be brittle. This is the ingress twin of allow-game-downloads.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-game-ingress, namespace: game-hub, labels: {app.kubernetes.io/managed-by: gitops}}
spec:
  endpointSelector: {matchLabels: {"infraweaver.io/game": "true"}}
  ingress:
    - fromEntities: [world, cluster, host, remote-node, health]
---
# WHY: the console delivers game-server commands via Tier-1 native RCON, which
# connects DIRECTLY to a game pod's RCON port (podIP:25575) — not through the K8s
# API like exec/logs. The console's airgap egress baseline blocks cross-namespace
# traffic, so RCON timed out and commands silently fell back to the (unreachable)
# PTY-stdin path. Open console -> game-hub egress. Ingress side is already covered
# by game-hub/allow-game-ingress (cluster entity). Scoped to the game-hub namespace.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-console-to-gamehub-rcon, namespace: infraweaver-console, labels: {app.kubernetes.io/managed-by: gitops}}
spec:
  endpointSelector: {}
  egress:
    - toEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": game-hub}}]
---
# WHY: Jellyfin's OIDC covers only its web UI, so native/TV clients sign in against a
# LOCAL Jellyfin account. The console therefore provisions those accounts over
# Jellyfin's admin API (jellyfin.jellyfin.svc:8096) whenever an RBAC grant at
# `/jellyfin` changes — see lib/jellyfin/access.ts. The console's airgap egress
# baseline blocks cross-namespace traffic, so without this the reconcile fails with
# "Jellyfin is unreachable" and a granted user never gets an account.
#
# Egress only. Jellyfin's namespace runs an EGRESS-ONLY baseline
# (jellyfin-egress, below) — it never selects endpoints for ingress, so ingress
# stays default-allow and Traefik + every NodePort/DLNA media client keep working.
# This console→jellyfin egress hole is still required for the admin-API reconcile.
#
# Port is the POD port (8096), not a Service port — Cilium egress policy is evaluated
# after service translation.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-console-to-jellyfin, namespace: infraweaver-console, labels: {app.kubernetes.io/managed-by: gitops}}
spec:
  endpointSelector: {}
  egress:
    - toEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": jellyfin}}]
      toPorts: [{ports: [{port: "8096", protocol: TCP}]}]
---
# WHY: user offboard deletes the departing user's Nextcloud account over the OCS
# Provisioning API (nextcloud.nextcloud.svc:80) — see lib/nextcloud/deprovision.ts.
# The console's airgap egress baseline blocks cross-namespace traffic, so without this
# the Nextcloud offboard step fails "Nextcloud is unreachable" (access is still revoked
# by the Authentik disable + group-strip, but the residual user row would linger).
#
# Egress only, mirroring allow-console-to-jellyfin: nextcloud's namespace has an
# egress-only CiliumNetworkPolicy, so its ingress stays default-allow and this hole
# is sufficient. Port is the POD port (80), evaluated after service translation.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-console-to-nextcloud, namespace: infraweaver-console, labels: {app.kubernetes.io/managed-by: gitops}}
spec:
  endpointSelector: {}
  egress:
    - toEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": nextcloud}}]
      toPorts: [{ports: [{port: "80", protocol: TCP}]}]
---
# WHY: Jellyfin was the last user namespace with NO network policy at all, so a
# compromised media server could freely reach every other namespace (openbao,
# argocd, app databases). This is an EGRESS-ONLY baseline: it selects all jellyfin
# pods for egress but never for ingress, so ingress stays default-allow — Traefik,
# NodePort clients (8096/8920) and LAN discovery (7359/1900 UDP) are untouched, per
# the deliberate "no ingress policy on jellyfin" design noted above.
#
# Egress is now default-deny except the media server's real dependencies:
#   - intra-namespace (the library-bootstrap CronJob curls jellyfin:8096)
#   - cluster DNS
#   - authentik (the SSO/OIDC plugin's server-side token exchange, 80/443)
#   - the internet on 80/443 (TMDB metadata + artwork, plugin repo, updates)
# NAS media is a node-level CSI mount, not pod egress, so it is unaffected.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: jellyfin-egress, namespace: jellyfin, labels: {app.kubernetes.io/managed-by: gitops, infraweaver.io/posture: egress-airgapped}}
spec:
  endpointSelector: {}
  egress:
    - toEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": jellyfin}}]
    - toEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": kube-system, "k8s-app": kube-dns}}]
      toPorts: [{ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}], rules: {dns: [{matchPattern: "*"}]}}]
    - toEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": authentik}}]
      toPorts: [{ports: [{port: "80", protocol: TCP}, {port: "443", protocol: TCP}]}]
    - toEntities: [world]
      toPorts: [{ports: [{port: "80", protocol: TCP}, {port: "443", protocol: TCP}]}]
---
# WHY: the console's /api/health and /health page fetch endpoint statuses from
# Gatus (http://gatus.gatus.svc:8080 — see src/lib/gatus.ts). The console's
# airgap egress baseline (allow-console-to-argocd, endpointSelector {}) puts all
# console pods into egress-enforcement, so without this hole the fetch times out
# and health reports "degraded". Egress side: console → gatus:8080. Port is the
# POD port (8080), evaluated after service translation.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-console-to-gatus, namespace: infraweaver-console, labels: {app.kubernetes.io/managed-by: gitops}}
spec:
  endpointSelector: {}
  egress:
    - toEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": gatus}}]
      toPorts: [{ports: [{port: "8080", protocol: TCP}]}]
---
# WHY: the matching ingress side — gatus must accept the console's status fetch.
# gatus ships a k8s NetworkPolicy (allow-gatus-ingress) that admits only traefik
# and monitoring; Cilium unions that with CNPs, so this adds console without
# editing gatus's generated manifest (regenerated by scripts/generate-gatus-config.py).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-ingress-from-console, namespace: gatus, labels: {app.kubernetes.io/managed-by: gitops}}
spec:
  endpointSelector: {matchLabels: {"app.kubernetes.io/name": gatus}}
  ingress:
    - fromEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": infraweaver-console}}]
      toPorts: [{ports: [{port: "8080", protocol: TCP}]}]
---
# WHY: Gatus health-probes each core/platform service directly in-cluster so its
# checks bypass Traefik + Authentik forward-auth (the public *.int hosts 302 to
# login / time out from inside the cluster and never return 200). Its checks were
# repointed to in-cluster health URLs in scripts/generate-gatus-config.py, but the
# target namespaces run default-deny-ingress, so every probe was dropped and the
# console /health page stayed degraded. These are the matching ingress holes —
# one per probed target, Cilium unions them with each namespace's k8s NetworkPolicy.
# Gatus itself has no egress policy (egress stays default-allow), so only the
# ingress side is needed. Ports are POD ports, evaluated after service translation.
# Registry is intentionally absent: its namespace has NO ingress policy at all
# (default-allow), so adding one would flip it to deny-all-except-gatus.
#
# argocd-server /healthz (runs --insecure → plain HTTP on 8080).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-ingress-from-gatus, namespace: argocd, labels: {app.kubernetes.io/managed-by: gitops}}
spec:
  endpointSelector: {matchLabels: {"app.kubernetes.io/name": argocd-server}}
  ingress:
    - fromEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": gatus}}]
      toPorts: [{ports: [{port: "8080", protocol: TCP}]}]
---
# openbao /v1/sys/health (svc port 8200 is plain HTTP).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-ingress-from-gatus, namespace: openbao, labels: {app.kubernetes.io/managed-by: gitops}}
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": gatus}}]
      toPorts: [{ports: [{port: "8200", protocol: TCP}]}]
---
# openbao /v1/sys/metrics — the OTHER half of making OpenBaoSealed able to fire.
#
# openbao is on the exclude list of the generate-default-deny-cnp Kyverno policy,
# so it gets no auto-generated block and its ingress is exactly what is written
# here: console and gatus, and nothing else. A CiliumNetworkPolicy selecting an
# endpoint makes that endpoint default-deny for everything it does not name, so
# adding the ServiceMonitor without this line produces a target that is scraped,
# times out, and reports OpenBao as down — the same "looks like coverage, is not"
# failure the ServiceMonitor exists to end.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-monitoring-scrape, namespace: openbao, labels: {app.kubernetes.io/managed-by: gitops}}
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": monitoring}}]
      toPorts: [{ports: [{port: "8200", protocol: TCP}]}]
---
# Prometheus /-/healthy (pod port 9090).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-gatus-to-prometheus, namespace: monitoring, labels: {app.kubernetes.io/managed-by: gitops}}
spec:
  endpointSelector: {matchLabels: {"app.kubernetes.io/name": prometheus}}
  ingress:
    - fromEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": gatus}}]
      toPorts: [{ports: [{port: "9090", protocol: TCP}]}]
---
# Loki /ready (pod port 3100).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-gatus-to-loki, namespace: monitoring, labels: {app.kubernetes.io/managed-by: gitops}}
spec:
  endpointSelector: {matchLabels: {"app": loki}}
  ingress:
    - fromEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": gatus}}]
      toPorts: [{ports: [{port: "3100", protocol: TCP}]}]
---
# InfraWeaver Console /api/ping (unauthenticated route, pod port 3000).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-ingress-from-gatus, namespace: infraweaver-console, labels: {app.kubernetes.io/managed-by: gitops}}
spec:
  endpointSelector: {matchLabels: {"app": infraweaver-console}}
  ingress:
    - fromEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": gatus}}]
      toPorts: [{ports: [{port: "3000", protocol: TCP}]}]
---
# WHY: the console's monitoring "Logs" tab queries Loki for historical/aggregated
# logs (loki.monitoring.svc:3100 — see src/lib/loki.ts + /api/logs/search). The
# console's own egress netpol already opens monitoring:9090 for Prometheus but NOT
# 3100, and console pods are egress-enforced, so the Loki fetch would be dropped.
# Egress side: console -> loki:3100. Pod port, evaluated after service translation.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-console-to-loki, namespace: infraweaver-console, labels: {app.kubernetes.io/managed-by: gitops}}
spec:
  endpointSelector: {}
  egress:
    - toEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": monitoring, "app": loki}}]
      toPorts: [{ports: [{port: "3100", protocol: TCP}]}]
---
# WHY: the matching ingress side — Loki must accept the console's log-search calls.
# monitoring runs default-deny-ingress; Cilium unions this with that k8s policy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-console-to-loki, namespace: monitoring, labels: {app.kubernetes.io/managed-by: gitops}}
spec:
  endpointSelector: {matchLabels: {"app": loki}}
  ingress:
    - fromEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": infraweaver-console}}]
      toPorts: [{ports: [{port: "3100", protocol: TCP}]}]
---
# WHY: this one is a DENY, not a hole — it closes the single real gap left by
# excluding nextcloud from generate-default-deny-cnp (kubernetes/core/kyverno/
# manifests/resource-governance-policies.yaml).
#
# nextcloud-egress above selects `app.kubernetes.io/name: nextcloud`, which is
# the app pod ONLY. Measured 2026-08-13: the namespace also runs
# postgresql-nextcloud (label `app: postgresql-nextcloud`, postgres:15-alpine,
# single container, no sidecar), and NOTHING selected it for egress — so the
# database has been egress default-ALLOW since the namespace was created. The
# Kyverno template would have covered it incidentally; the exclusion means we
# cover it deliberately instead, which is the narrower fix anyway because it
# leaves the app pod's carefully-scoped rules untouched.
#
# EGRESS ONLY, and that is load-bearing: nextcloud→postgres:5432 is INGRESS to
# this pod and is unaffected by an egress rule, so the app keeps its database.
# Postgres itself dials nothing outbound — no replica, no backup sidecar, no
# archive_command — so intra-namespace plus cluster DNS is its whole real need.
# Deliberately no `toEntities: [world]`: a database that can reach the internet
# is an exfiltration path, and this one has never used it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: nextcloud-postgres-egress, namespace: nextcloud, labels: {app.kubernetes.io/managed-by: gitops, infraweaver.io/posture: egress-airgapped}}
spec:
  endpointSelector: {matchLabels: {"app": postgresql-nextcloud}}
  egress:
    - toEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": nextcloud}}]
    - toEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": kube-system, "k8s-app": kube-dns}}]
      toPorts: [{ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}], rules: {dns: [{matchPattern: "*"}]}}]
---
# WHY: the elevated in-cluster shell (infraweaver-agent/agent-admin) must be able
# to build and push the console image, so the operator VM can be retired. That is
# a buildctl CLIENT talking to the existing buildkitd on 1234 — no Docker daemon
# in the shell and no privileged pod anywhere new.
#
# WHAT `airgap-baseline` IN `build` ACTUALLY PROTECTS, and why this does not undo it:
#
#   buildkitd runs ROOTFUL + `privileged: true` with `--allow-insecure-entitlement
#   security.insecure`, listening on 1234 with NO authentication of any kind. Anyone
#   who can open that socket can run arbitrary unsandboxed containers as root on a
#   control-plane node. The ingress half of airgap-baseline is therefore the ONLY
#   authentication in front of that daemon: build ⇄ build, plus traefik (ingress)
#   and monitoring (scrape). The egress half is the second line — it means a build
#   that does get in still cannot reach the internet or any other namespace.
#
#   This rule adds ONE named client to the ingress side: not "the agent namespace",
#   not "any pod", but the pod labelled agent-admin in infraweaver-agent, on 1234
#   only, and it is scoped to the buildkitd endpoint rather than the namespace. It
#   grants agent-admin nothing it does not already hold: that ServiceAccount can
#   already create Pods in any namespace, which is already root on a node for anyone
#   who wants it. The gate in front of agent-admin (Authentik admins-only, see
#   kubernetes/platform/agent/terminal-admin.yaml) is the real control, and it is
#   unchanged. The read-only sibling `agent-session` is deliberately NOT named here.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-agent-admin-to-buildkitd, namespace: build, labels: {app.kubernetes.io/managed-by: gitops}}
spec:
  endpointSelector: {matchLabels: {"app.kubernetes.io/name": buildkitd}}
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": infraweaver-agent
            "app.kubernetes.io/name": agent-admin
      toPorts: [{ports: [{port: "1234", protocol: TCP}]}]
---
# WHY: the matching egress side — a build daemon that cannot reach a registry can
# neither resolve a `FROM` nor push a result, so with airgap-baseline alone
# buildkitd is a daemon that can only ever fail. Measured 2026-08-15 from inside
# the pod, BEFORE this rule: 10.0.0.200:443 BLOCKED, registry.npmjs.org:443 BLOCKED.
#
# THE AIRGAP IS KEPT. This opens exactly one destination — the cluster's INTERNAL
# ingress VIP on 443, which is where buildkitd's own `hostAliases` already point
# registry.int.${BASE_DOMAIN} (going via the PUBLIC IP hairpins and resets OCI blob
# uploads; see kubernetes/core/registry/README.md). buildkitd still has NO route to
# the internet: no npm, no Docker Hub, no ECR. That is deliberate and it is the
# property worth keeping — a privileged, unauthenticated build daemon with outbound
# internet is an exfiltration path with a shell attached.
#
# The consequence is that the daemon cannot pull an upstream base image either, so
# the base is MIRRORED into Zot (registry.int.${BASE_DOMAIN}/base/node:20-alpine)
# by the agent shell, which does have a 443-to-world allowance of its own and is
# behind the Authentik gate. scripts/console-build-incluster.sh refreshes it.
#
# Both forms of the same single flow are listed because the destination is a MetalLB
# LoadBalancer IP: depending on where service translation happens relative to policy
# enforcement, Cilium sees either the traefik endpoint or the bare VIP. Naming both
# is one flow described twice, not two holes.
#
# MEASURED which one actually carries it (2026-08-15, `cilium-dbg bpf policy get`
# on the buildkitd endpoint, straight after a real push):
#   cidr:10.0.0.200/32          443/TCP   52819702 bytes / 14646 packets  ← this one
#   k8s:...name=traefik          443/TCP          0 bytes /     0 packets
# So on THIS cluster the VIP is not translated before policy is evaluated, which
# tracks: cilium-config has kube-proxy-replacement=false, so kube-proxy does the
# DNAT on the host AFTER the packet has left the pod. The toEndpoints form is
# retained deliberately — turning kube-proxy-replacement on would move the
# translation ahead of policy and the CIDR rule would stop matching, which would
# break image builds silently and a long way from the cause.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-buildkitd-to-registry, namespace: build, labels: {app.kubernetes.io/managed-by: gitops}}
spec:
  endpointSelector: {matchLabels: {"app.kubernetes.io/name": buildkitd}}
  egress:
    - toEndpoints: [{matchLabels: {"k8s:io.kubernetes.pod.namespace": traefik}}]
      toPorts: [{ports: [{port: "443", protocol: TCP}]}]
    - toCIDR: ["10.0.0.200/32"]
      toPorts: [{ports: [{port: "443", protocol: TCP}]}]
---
# WHY: the console runtime image installs ONE OS package — `RUN apk add --no-cache
# git` in apps/infraweaver-console/Dockerfile.prebuilt — because the console shells
# out to git at runtime (external-routes-server.ts) and the clone-infra-routes
# initContainer runs the same image. That single RUN step is the only reason
# buildkitd needs anything outside this cluster at all.
#
# SCOPED TO ONE NAME, ON PURPOSE. node:20-alpine ships exactly two repository
# lines, both on the same host (measured 2026-08-15):
#   https://dl-cdn.alpinelinux.org/alpine/v3.23/main
#   https://dl-cdn.alpinelinux.org/alpine/v3.23/community
# So this is the Alpine package CDN and nothing else: no npm, no Docker Hub, no
# ECR, no arbitrary registry. The base image itself is NOT pulled through here —
# it is mirrored into Zot by the agent shell (see allow-buildkitd-to-registry).
#
# THREE THINGS THIS IS NOT, STATED PLAINLY:
#   1. toFQDNs is not a hard boundary. Cilium allows the IPs that name resolves
#      to, and dl-cdn is Fastly — those IPs front many other sites, so a process
#      with RCE inside buildkitd could reach them with a different SNI. It is a
#      large reduction from `toEntities: [world]`, not an airtight one.
#   2. It is not the only outbound channel the build namespace has. airgap-baseline
#      already permits DNS with `matchPattern: "*"`, which is itself an exfil path
#      and predates this rule.
#   3. It relies on that same DNS rule: without the Cilium DNS proxy seeing the
#      lookup, toFQDNs has no IPs to allow and this silently denies.
#
# The alternative considered and rejected: switch the runtime base to full
# `node:20` (Debian, ships git) so buildkitd needs no internet whatsoever. It
# works, but it changes the deployed image from musl/alpine to glibc/Debian and
# adds ~330MB to every node's image cache — a production change made to avoid a
# one-hostname hole. Not worth it. Revisit if a Zot-hosted base with git ever
# exists, at which point this rule should be DELETED.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-buildkitd-os-packages, namespace: build, labels: {app.kubernetes.io/managed-by: gitops}}
spec:
  endpointSelector: {matchLabels: {"app.kubernetes.io/name": buildkitd}}
  egress:
    - toFQDNs: [{matchName: "dl-cdn.alpinelinux.org"}]
      toPorts: [{ports: [{port: "443", protocol: TCP}]}]
