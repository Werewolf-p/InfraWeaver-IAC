    pod-security.kubernetes.io/warn: restricted
---
# ── Cluster DNS ──────────────────────────────────────────────────────────────
# dns-system is DELIBERATELY NOT DECLARED HERE. It is owned by apps-dns, which
# ships its own Namespace manifest (kubernetes/platform/dns/manifests/
# namespace.yaml) and now carries the PSA labels there instead.
#
# Declaring one Namespace in two Applications left apps-dns permanently
# OutOfSync, and is dangerous in general on this cluster: every Application is
# applied through ONE shared server-side-apply field manager, so a second
# declarer prunes whatever labels it omits.
#
# The verification that justified the level is kept with the labels, in that
# file: the running coredns Deployment passes baseline (hostNetwork/hostPID/
# hostIPC false, configMap volumes only, no hostPort, allowPrivilegeEscalation
# false, readOnlyRootFilesystem true, capabilities drop ALL add
# NET_BIND_SERVICE, which is inside both the baseline and restricted sets).
---
# ── Backup object store + backup controller ──────────────────────────────────
# RAISED baseline -> privileged 2026-08-15, together with the Velero deployment
# (kubernetes/platform/velero/). This is a REQUIRED, BLOCKING change, not a
# convenience: without it the Velero node-agent DaemonSet is rejected at
# admission and the entire local-path backup capability silently does not exist.
#
# WHY: Velero's node-agent is the only mechanism in this cluster that can back up
# a local-path PVC (Longhorn physically cannot — those are node-local bind
# mounts, not Longhorn volumes; 19 bound local-path PVCs as of 2026-08-15,
# including the GT New Horizons world on talos-prod-cp1). To read pod volumes it
# mounts the kubelet pod directory:
#     hostPath: /var/lib/kubelet/pods
#     hostPath: /var/lib/kubelet/plugins
# and the chart runs it with podSecurityContext.runAsUser: 0.
# PSA `baseline` FORBIDS hostPath volumes outright, so those pods would never be
# admitted. `privileged` is the level upstream Velero documents for node-agent.
#
# This is the same treatment already applied in this file to the other namespaces
# whose pods legitimately need host-level access — longhorn-system, kube-system,
# metallb-system, local-path-storage. Velero is storage infrastructure and lands
# in the same category.
#
# CONTAINMENT — why raising this is acceptable here:
#   * `velero` is already excluded from every Enforce Kyverno ClusterPolicy
#     (require-non-root, disallow-privileged-containers,
#     require-drop-all-capabilities, disallow-latest-tag) in
#     core/kyverno/manifests/cluster-policies.yaml — the exclusion comment names
#     `restic`, i.e. exactly this node-agent, as the reason.
#   * The namespace deliberately does NOT carry `infraweaver.io/type: catalog-app`,
#     the label that arms those Enforce policies. It must STAY absent.
#   * Only two workloads run here: minio-velero (the S3 target) and Velero
#     itself. No third-party or user-supplied code.
#
# audit/warn stay at `restricted` so any NEW pod added to this namespace that
# does not need host access still shows up in the audit log as an outlier.
# minio-velero itself remains restricted-clean (hostNetwork false, volumes pvc +
# projected, no hostPort, allowPrivilegeEscalation false, capabilities drop ALL)
# — raising enforce does not relax anything it was already satisfying.
apiVersion: v1
kind: Namespace
metadata:
  name: velero
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# ═════════════════════════════════════════════════════════════════════════════
# LEAST-TRUSTED WORKLOADS — added 2026-08-12
# ═════════════════════════════════════════════════════════════════════════════
# `wordpress` runs third-party plugin code that site owners install themselves,
# on ~14 pods, and it had NO PSA labels at all. It was therefore inheriting the
# cluster AdmissionConfiguration default rather than declaring one — the same
# invisible posture the block above was written to end, except here it applied
# to the one namespace on the cluster where arbitrary third-party PHP is
# executed on purpose. A plugin that ships a privileged sidecar or a hostPath
# mount had nothing stopping it at admission.
#
# LEVEL: enforce baseline / audit+warn restricted. Deliberately NOT restricted
# at enforce. WordPress site pods do not currently set runAsNonRoot,
# capabilities.drop or seccompProfile, so `enforce: restricted` would refuse
# admission to every site pod on its next restart — a fleet outage dressed up as
# a hardening commit. baseline blocks what actually matters here (privileged,
# hostPath, host namespaces, host ports) and takes effect with zero restarts;
# audit+warn restricted makes the remaining gap show up in the audit log and in
# `kubectl apply` warnings so it can be closed workload by workload.
apiVersion: v1
kind: Namespace
metadata:
  name: wordpress
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# ═════════════════════════════════════════════════════════════════════════════
# `game-hub` AND `game-servers` ARE MISSING FROM THIS FILE ON PURPOSE
# ═════════════════════════════════════════════════════════════════════════════
# They need PSA labels at least as badly as wordpress does — they execute
# third-party game mods. As of 2026-08-13 they HAVE them (enforce=baseline,
# audit/warn=restricted), set in the two owning manifests named below rather
# than here. They are still NOT added to this file, because doing so would fire
# the exact SSA fieldset collision this file's header documents at length:
#
#   game-hub      declared by kubernetes/catalog/game-hub/namespace.yaml
#                 (labels: app.kubernetes.io/part-of: infraweaver)
#   game-servers  declared by kubernetes/catalog/infraweaver-console/base/
#                 game-servers-namespace.yaml
#                 (labels: app.kubernetes.io/managed-by: infraweaver)
#
# Every Application applies through the ONE shared `argocd-controller` field
# manager, which owns a single fieldset per object. Declaring these Namespaces
# in a second Application makes the two syncs take turns pruning each other's
# labels — so the PSA labels would appear and disappear on a cycle, which is
# strictly worse than absent because it reads as fixed. `app.kubernetes.io/
# part-of: infraweaver` is not cosmetic either: it is the entire match set of
# set-default-memory-limits (see resource-governance-policies.yaml), so pruning
# it would silently move that policy's scope too.
#
# THE FIX WAS THREE LINES IN THE TWO FILES NAMED ABOVE, not a block here, and
# it has been APPLIED (2026-08-13):
#     pod-security.kubernetes.io/enforce: baseline
#     pod-security.kubernetes.io/audit: restricted
#     pod-security.kubernetes.io/warn: restricted
# baseline, not restricted, for the same reason as wordpress above: enforcing
# restricted would refuse admission to running game servers at their next
# restart, and evicting somebody's game world is not a change to make from a
# security sweep. That is measured, not assumed — a server-side dry-run of
# enforce=restricted on game-hub returns:
#   Warning: gt-new-horizons-...: allowPrivilegeEscalation != false,
#            unrestricted capabilities, runAsNonRoot != true, runAsUser=0,
#            seccompProfile
# while the same dry-run at enforce=baseline returns no warnings at all.
#
# DO NOT "consolidate" those labels back into this file later. The reason they
# live in the app manifests is the SSA collision above, and it does not expire.
#
# ── apps-grafana: REMOVED 2026-08-15 ────────────────────────────────────────
# This file used to declare an `apps-grafana` Namespace with
# `enforce/audit/warn: privileged`. It was a hand-labeled leftover adopted here
# to stop the drift, with the level "reproduced UNCHANGED so this commit stays a
# no-op" and tightening left as "a separate, testable change".
#
# This is that change, and the answer turned out to be deletion rather than
# tightening. The namespace had 0 pods for its entire life, its chart is
# `kubernetes/platform/grafana/application.yaml.disabled`, and no Grafana pod
# exists anywhere in the cluster — dashboards are served by
# kube-prometheus-stack. It also held three orphaned NetworkPolicies including
# two default-denies, which read as active segmentation in an audit while
# guarding an empty namespace.
#
# So the cluster carried its most permissive PSA level, indefinitely, for
# nothing. Removing the declaration lets prune delete the namespace and the
# policies with it.
#
# ⚠️ If Grafana is ever re-enabled, do NOT re-add a privileged namespace here.
# Enable the Application, let it own its namespace, and give it the tightest
# level it actually passes — the dry-run method is documented above.
