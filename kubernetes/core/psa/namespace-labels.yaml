---
# Pod Security Admission (PSA) namespace labels — always applied, independent of Kyverno.
#
# Enforcement levels:
#   privileged  — unrestricted (used only for host-level system components)
#   baseline    — blocks most known privilege escalations; allows typical workloads
#   restricted  — requires non-root, no hostPID/IPC, limited capabilities
#
# Platform namespaces are set to "baseline" enforce + "restricted" warn so drift is
# visible in the audit log without breaking running workloads.
# Networking and storage infrastructure namespaces stay "privileged" since their
# pods legitimately need host-level access (eBPF, CNI, storage drivers).
#
# ⚠️  SINGLE SOURCE OF TRUTH: This file is the ONLY place PSA labels are set.
#     Individual apps must NOT include Namespace resources with PSA labels.
#     They rely on CreateNamespace=true to auto-create their namespace; PSA is set here.
#     This prevents SSA ownership ping-pong between apps managing the same Namespace.
#
# ═══════════════════════════════════════════════════════════════════════════
# WHY THIS FILE STILL DOES NOT COVER EVERY NAMESPACE (measured 2026-08-07)
# ═══════════════════════════════════════════════════════════════════════════
# The rule above is aspirational, not true. Eight namespaces are declared as
# `kind: Namespace` by OTHER ArgoCD Applications, several of them carrying
# their own PSA labels. That matters because of how ArgoCD does server-side
# apply:
#
#   kubectl get ns <n> -o json --show-managed-fields | jq '.metadata.managedFields'
#
# returns the SAME field manager -- `argocd-controller` -- for every
# Application. Under SSA a manager owns exactly one fieldset per object, so if
# two Applications apply the same Namespace with different label sets, each
# sync replaces the other's fieldset and prunes the labels it no longer
# declares. The two apps then take turns undoing each other.
#
# Measured owners, and what this file therefore must NOT declare:
#
#   ns              argocd-controller (Apply) owns          declared by
#   ------------    ------------------------------------    ---------------------------
#   gatus           app.kubernetes.io/name, infraweaver.io/type
#                                                           catalog/gatus/manifests
#   jellyfin        infraweaver.io/source, PSA x3           catalog/jellyfin/manifests
#   nextcloud       infraweaver.io/source, PSA x3           catalog/nextcloud/manifests
#   game-hub        app.kubernetes.io/part-of               catalog/game-hub
#   game-servers    app.kubernetes.io/managed-by            catalog/infraweaver-console/base
#   n8n-prod        kubernetes.io/metadata.name             platform/n8n/manifests
#   cilium-secrets  app.kubernetes.io/part-of               core-cilium (chart-rendered)
#   private-test /  app.kubernetes.io/part-of, PSA          private-apps/*/k8s
#     tradesphere
#
# `gatus` is the sharp edge. Adding it here with only PSA labels would prune
# `infraweaver.io/type: catalog-app` off it -- and that label is the
# `namespaceSelector` on EVERY policy in core/kyverno/manifests/. Stripping it
# would silently switch off the whole Kyverno security ratchet for the only
# namespace it still covers besides infraweaver-console. Do not add gatus here.
#
# Closing GAP-M3 properly means REMOVING the PSA labels from those app
# manifests, not duplicating them here. Those files are outside this package's
# ownership; see the WP4 report.
#
# Namespaces added below were each checked to have no competing
# `argocd-controller (Apply)` owner: `default`, `kube-public`, `kube-node-lease`
# are owned by kube-apiserver (Update); `bootstrap` and `crds` come from
# CreateNamespace=true with `managedNamespaceMetadata: none`, which creates the
# namespace once and never re-applies it; `dns-system` is applied by apps-dns
# with ServerSideApply=false, so it lands as an Update and shares no fieldset;
# `infraweaver`, `velero` and `apps-grafana` are owned by kubectl (Update).
#
# ═══════════════════════════════════════════════════════════════════════════
# ON `infraweaver.io/type: catalog-app`
# ═══════════════════════════════════════════════════════════════════════════
# That label is not descriptive metadata -- it is the match set for every
# ClusterPolicy in core/kyverno/manifests/, several of which are Enforce.
# Adding it to a namespace opts that namespace into admission-time blocking.
# None of the namespaces added below carry it, deliberately: they hold
# platform/system components (or nothing at all), have no PolicyReport history
# under those policies, and several would immediately violate them.
# Only `infraweaver-console` carries it in this file, unchanged.

# ── Host-level infra: privileged ────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: kube-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
