---
# ── In-cluster image builder (BuildKit): privileged ──────────────────────────
# Rootful BuildKit needs a privileged container (Talos nodes have user
# namespaces disabled, so rootless BuildKit cannot run). Build namespace only.
apiVersion: v1
kind: Namespace
metadata:
  name: build
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    infraweaver.io/component: buildkit
---
# ═════════════════════════════════════════════════════════════════════════════
# Namespaces below were previously carrying NO PSA labels at all and were
# inheriting the cluster-wide AdmissionConfiguration default. Verified via
# talosctl on 2026-08-07, that default is:
#     enforce: baseline, audit: restricted, warn: restricted   (exempt: kube-system)
# so the levels declared below are EXACTLY what these namespaces already
# resolve to today. This block makes the level explicit and reviewable
# (CIS 5.2.x wants it declared, not inherited); it changes nothing at
# admission. No namespace is tightened in this pass.
# ═════════════════════════════════════════════════════════════════════════════

# ── Empty / structural namespaces (0 pods, verified) ─────────────────────────
# `default` holds no workloads; it is the fallback destination for the
# core-psa, core-limitranges, core-local-path and catalog-nas-shares
# Applications, none of which create pods in it. Labeling it explicitly means a
# pod that lands here by accident is admitted at baseline rather than by
# whatever the cluster default happens to be at the time.
apiVersion: v1
kind: Namespace
metadata:
  name: default
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Holds ArgoCD Application objects only.
apiVersion: v1
kind: Namespace
metadata:
  name: bootstrap
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Holds CustomResourceDefinitions only.
apiVersion: v1
kind: Namespace
metadata:
  name: crds
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Legacy/reserved namespace, currently empty.
apiVersion: v1
kind: Namespace
metadata:
  name: infraweaver
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# ── Kubernetes-owned namespaces (not exempt from PSA; kube-system is) ────────
# The cluster AdmissionConfiguration exempts kube-system ONLY, so these two
# already enforce baseline. Both are empty of pods.
apiVersion: v1
kind: Namespace
metadata:
  name: kube-public
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-node-lease
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# ── Cluster DNS ──────────────────────────────────────────────────────────────
# Verified the running coredns Deployment passes baseline before labeling:
#   hostNetwork/hostPID/hostIPC all false, volumes: configMap only, no hostPort,
#   securityContext { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true,
#   capabilities: { drop: [ALL], add: [NET_BIND_SERVICE] } }.
# NET_BIND_SERVICE is inside both the baseline and restricted capability sets.
# It will WARN at restricted (no runAsNonRoot, no seccompProfile) -- that is the
# intended "drift is visible without breaking anything" posture used above, and
# warn/audit are non-blocking.
apiVersion: v1
kind: Namespace
metadata:
  name: dns-system
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# ── Backup object store ──────────────────────────────────────────────────────
# Velero itself is not deployed (GAP-C2); this namespace currently runs only
# minio-velero. Verified both of its pods pass baseline before labeling:
# hostNetwork false, volumes pvc + projected, no hostPort, containers set
# allowPrivilegeEscalation: false and capabilities.drop: [ALL].
apiVersion: v1
kind: Namespace
metadata:
  name: velero
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# ── Manually-labeled leftover, brought under GitOps ──────────────────────────
# apps-grafana carries privileged PSA applied by hand (field manager
# `kubectl-label`, an Update op with no ArgoCD Application behind it) and has
# had 0 pods since. The level is reproduced here UNCHANGED so this commit stays
# a no-op; tightening it to baseline is a separate, testable change and is
# deliberately not bundled into the ratchet.
apiVersion: v1
kind: Namespace
metadata:
  name: apps-grafana
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
