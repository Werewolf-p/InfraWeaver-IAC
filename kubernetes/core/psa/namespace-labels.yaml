# ═════════════════════════════════════════════════════════════════════════════
# Namespaces below were previously carrying NO PSA labels at all and were
# inheriting the cluster-wide AdmissionConfiguration default. Verified via
# talosctl on 2026-08-07, that default is:
#     enforce: baseline, audit: restricted, warn: restricted   (exempt: kube-system)
# so the levels declared below are EXACTLY what these namespaces already
# resolve to today. This block makes the level explicit and reviewable
# (CIS 5.2.x wants it declared, not inherited); it changes nothing at
# admission. No namespace is tightened in this pass.
# ═════════════════════════════════════════════════════════════════════════════

# ── Empty / structural namespaces (0 pods, verified) ─────────────────────────
# `default` holds no workloads; it is the fallback destination for the
# core-psa, core-limitranges, core-local-path and catalog-nas-shares
# Applications, none of which create pods in it. Labeling it explicitly means a
# pod that lands here by accident is admitted at baseline rather than by
# whatever the cluster default happens to be at the time.
apiVersion: v1
kind: Namespace
metadata:
  name: default
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
