apiVersion: v1
kind: ServiceAccount
metadata:
  name: etcd-metrics-logger
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: etcd-metrics-logger
rules:
  - nonResourceURLs:
      - /metrics
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: etcd-metrics-logger
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: etcd-metrics-logger
subjects:
  - kind: ServiceAccount
    name: etcd-metrics-logger
    namespace: kube-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-metrics-logger
  namespace: kube-system
spec:
  schedule: "0 2 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: etcd-metrics-logger
          restartPolicy: Never
          containers:
            - name: metrics
              # Digest-pinned — `bitnami/kubectl:1.33.4` returns MANIFEST_UNKNOWN
              # today for the same reason 1.31 did: Bitnami deleted the versioned
              # tags from `bitnami/*` when it moved the free catalog to
              # `bitnamilegacy/` in 2025. This Job is run on demand, so the
              # breakage was latent and would only have surfaced during an etcd
              # maintenance window — the worst possible time to discover it.
              image: "bitnami/kubectl:1.35.4@sha256:e2b97dde9666986c61c56d49aae85a714b89b69392baa531438e74ec34096fb4"
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                - |
                  echo "[etcd-metrics] $(date -u +'%Y-%m-%dT%H:%M:%SZ') collecting apiserver-exposed etcd metrics"
                  kubectl get --raw /metrics \
                    | grep -E '^(etcd_|apiserver_storage_)' \
                    | sed 's/^/[etcd-metrics] /'
