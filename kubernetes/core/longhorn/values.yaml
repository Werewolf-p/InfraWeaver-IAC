# Longhorn HA storage for Talos control-plane-only cluster
# Disable pre-upgrade checker job (causes circular SA dependency on fresh installs)
preUpgradeChecker:
  jobEnabled: false
  upgradeVersionCheck: false

defaultSettings:
  # All 3 nodes healthy — store 2 replicas (no workers, only 3 CPs; 3 replicas would exhaust disk)
  defaultReplicaCount: 2
  # Allow scheduling on control-plane nodes (no workers in this cluster)
  taintToleration: "node-role.kubernetes.io/control-plane:NoSchedule"
  # Give Longhorn's SYSTEM-MANAGED pods (instance-manager, engine-image, CSI
  # plugin/sidecars) platform-standard priority so storage stays online without
  # out-prioritising ingress/DNS/control-plane components.
  #
  # The longhorn-manager DaemonSet is deliberately NOT covered by this any more
  # — it is the storage CONTROL plane and is pinned to platform-critical under
  # `longhornManager.priorityClass` below. See the incident note there.
  priorityClass: platform-standard
  # Storage reserved per node — 5% minimal ensures CP1/CP3 remain schedulable
  # with ~134GB available and 299GB scheduled at 200% overprovisioning (299 < 390).
  # At 15% the condition would require 63GB reserved which pushes CP1/CP3 to
  # "not schedulable" even though overprovisioning headroom is fine.
  storageMinimalAvailablePercentage: 5
  storageOverProvisioningPercentage: 300
  # Reserve CPU for Longhorn instance managers so replica rebuilds do not starve.
  #
  # ⚠️ PER-DATA-ENGINE JSON MAP SINCE 1.12, NOT A NUMBER. This was `12`, and on
  # 1.12 the manager refused to start at all:
  #
  #   Error starting manager: failed to unmarshal setting
  #   guaranteed-instance-manager-cpu value 12: json: cannot unmarshal number
  #   into Go value of type map[v1beta2.DataEngineType]string
  #
  # That is fatal, not a warning: every longhorn-manager crashlooped, taking
  # longhorn-csi-plugin and csi-snapshotter with it, and leaving prometheus and
  # alertmanager stuck in Init waiting on volumes. Volumes stayed attached and
  # healthy throughout — the data plane survives a dead control plane — but no
  # new attach could happen.
  guaranteedInstanceManagerCPU: '{"v1":"12","v2":"12"}'
  # 3 concurrent rebuilds per node — increased from 1 to recover faster after
  # rolling node reboots (which leave ~15 stopped replicas per node). Warm restarts
  # (data dir intact, just reconnecting) are low-I/O; the original 1-limit extended
  # post-reboot degraded-volume windows unnecessarily.
  concurrentReplicaRebuildPerNodeLimit: 3
  # Wait before replenishing a failed replica — 2 min gives rebooting nodes time to return
  # and reuse existing replicas (delta-resync only). Reduced from 30 min to prevent long
  # degraded-volume windows that block new workloads from starting.
  replicaReplenishmentWaitInterval: 120
  # Auto-clean Longhorn-generated system snapshots (head snapshot, recurring job snapshots)
  # to prevent FailedStartingSnapshotPurge errors caused by stale engine proxy references.
  autoCleanupSystemGeneratedSnapshot: true
  # Auto-delete orphaned volume CRs and instance data left after PVC deletion.
  # replica-data: orphaned data dirs on disk; instance: orphaned instance-manager entries.
  orphanResourceAutoDeletion: "replica-data;instance"
  # Limit concurrent engine upgrades per node so upgrades don't cause I/O storms.
  concurrentAutomaticEngineUpgradePerNodeLimit: 1
  # Disable periodic snapshot integrity checks — reduces background I/O on small cluster.
  snapshotDataIntegrity: disabled
  # Auto-clean orphaned replicas left behind after PVC deletion (prevents disk fill).
  orphanAutoDeletion: true
  # Reserve 5% of disk for system use (reduced from 15% to keep CP1/CP3 schedulable
  # given current 299GB storageScheduled at 200% overprovisioning on 195GB disks)
  storageReservedPercentageForDefaultDisk: 5
  # Auto-balance replicas when nodes have unequal replica counts
  replicaAutoBalance: least-effort
  # Delete PVCs when PV is deleted
  defaultDataLocality: best-effort
  # Faster failover
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
  # ---------------------------------------------------------------------------
  # TrueNAS NFS backup target.
  #
  # !! THE HOST IS A RESOLVED LITERAL ON PURPOSE. DO NOT RE-PARAMETERISE IT. !!
  #
  # This file is a Helm valueFile consumed by ArgoCD-NATIVE Helm (see
  # kubernetes/bootstrap/appset-core.yaml: sources[].helm.valueFiles =
  # "$values/kubernetes/core/longhorn/values.yaml"). Native Helm rendering does
  # NOT pass through the argocd-cmp-envsubst plugin — that plugin only runs for
  # sources declaring `plugin: { name: envsubst-v1.0 }`, e.g. the sibling
  # core-longhorn-manifests app. The same rule is already recorded in
  # core/openbao/values.yaml, platform/authentik/values.yaml and
  # platform/external-dns/values.yaml.
  #
  # MEASURED CONSEQUENCE of the previous value "nfs://${TRUENAS_HOST}:/mnt/...":
  # the placeholder reached the cluster verbatim in ConfigMap
  # longhorn-system/longhorn-default-setting, and longhorn-manager rejected it:
  #   "Customized settings are invalid, will give up using them: ... failed to
  #    parse nfs://${TRUENAS_HOST}:/mnt/pool/k8s-longhorn-backups as url:
  #    invalid character \"{\" in host name"
  # Longhorn then fell back to an EMPTY backup-target, so BackupTarget/default
  # reported `available: false, message: "backup target URL is empty"` and ZERO
  # backups.longhorn.io resources have ever been created. (GAP-C2.)
  #
  # WHY 10.1.0.135 AND NOT THE ${TRUENAS_HOST} PARAMETER'S VALUE:
  # the live argocd-cmp-substitutions ConfigMap carries TRUENAS_HOST=10.1.0.5,
  # which answers ICMP/443 but has NO NFS and NO SMB listener. The NAS that
  # actually serves this platform is 10.1.0.135 — it is what platform.yaml
  # declares (persistence.truenas.nfs_ip) and what the live SMB PVs in
  # kubernetes/catalog/nas-shares/ mount (//10.1.0.135/infraweaver).
  # Verified 2026-08-07 by MOUNTPROC3_EXPORT against 10.1.0.135:
  #   EXPORT /mnt/pool/k8s-longhorn-backups  clients=[10.0.0.0/24]
  # i.e. the export exists and is ACL'd to exactly the cluster node subnet.
  # The literal stays a literal EVEN AFTER the parameter is corrected: Helm apps
  # never pass through the CMP, so `${TRUENAS_HOST}` here would ship verbatim.
  # Do not "simplify" this back to the placeholder.
  #
  # The parameter itself is being corrected separately (it is genuinely wrong —
  # 10.1.0.5 is a live device answering HTTPS 404, not the NAS). Nothing depends
  # on that correction for THIS file to work. The ordering is subtle enough to
  # need a runbook: the substitutions ConfigMap is the only CMP-rendered consumer
  # of ${TRUENAS_HOST}, i.e. it renders itself from the sidecar env that came from
  # itself, so an imperative patch is reverted by selfHeal until the repo-server
  # sidecar restarts. See docs/SECURITY-REMEDIATION-RUNBOOK.md §P2.4.
  #
  # An earlier revision of this comment said the authentik LDAP outpost consumed
  # the same parameter. That outpost was deleted 2026-08-07 — it never worked.
  #
  # On fresh redeploy, scripts/restore-from-truenas.sh uses this target to
  # restore PVCs before apps deploy. Restore procedure:
  # docs/BACKUP-AND-RESTORE-RUNBOOK.md
  # ---------------------------------------------------------------------------
  backupTarget: "nfs://10.1.0.135:/mnt/pool/k8s-longhorn-backups"
  backupTargetCredentialSecret: ""
  # Back up volumes even while they are detached (Longhorn attaches them briefly,
  # then detaches again). Measured 2026-08-07: 17 of 19 Longhorn volumes are
  # `detached` — with the Longhorn default of `false` a nightly backup job skips
  # them silently and reports success, which is precisely how GAP-C2 stayed
  # invisible. Backup concurrency is capped at 2 in manifests/backup-jobs.yaml so
  # this cannot become an attach storm.
  allowRecurringJobWhileVolumeDetached: true

longhornUI:
  enabled: true
  priorityClass: "platform-standard"

ingress:
  enabled: true
  ingressClassName: traefik
  host: longhorn.prod.local
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik-forward-auth@kubernetescrd

persistence:
  defaultClass: false
  defaultClassReplicaCount: 2

# Allow pods on control-plane nodes
tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

longhornManager:
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
  # ---------------------------------------------------------------------------
  # !! DO NOT ADD `resources:` HERE. THE CHART WOULD SILENTLY IGNORE IT. !!
  #
  # Longhorn chart 1.7.3 (pinned "1.7.*" in ./application.yaml) exposes NO
  # resources key for the longhorn-manager DaemonSet. templates/daemonset-sa.yaml
  # contains no `resources:` block at all, and this `longhornManager` map accepts
  # only log / priorityClass / tolerations / nodeSelector / serviceAnnotations.
  # Verified by rendering the chart with the key set: zero occurrences of
  # "resources" survive into the DaemonSet. A `longhornManager.resources` entry
  # would look like a fix in git and change nothing on the cluster.
  #
  # longhorn-manager's memory request/limit is set instead by the admission
  # mutation in ./manifests/longhorn-manager-resources.yaml, which carries the
  # full incident write-up and the per-node request arithmetic.
  # ---------------------------------------------------------------------------
  #
  # platform-critical (1000000), raised from platform-standard (500000) on
  # 2026-08-07. longhorn-manager is the storage control plane; every stateful
  # workload depends on it, so it belongs in the same tier as traefik/argocd/
  # coredns rather than below them. It TIES with ingress/DNS, it does not
  # out-prioritise them, so the hierarchy note in defaultSettings above still
  # holds. This is the secondary eviction lever: the kubelet ranks memory
  # evictions by (exceeds-request, priority, excess), and during the cp3
  # incident longhorn-manager held the LOWEST priority of every pod that
  # exceeded its request, which made it rank #1 on the node's kill list.
  #
  # ROLLOUT WARNING: priorityClassName is part of the pod template, so changing
  # it rolls the DaemonSet — and the chart sets
  # updateStrategy.rollingUpdate.maxUnavailable: "100%", meaning all three
  # longhorn-manager pods restart AT ONCE. Volume I/O is served by the
  # instance-manager/engine pods and keeps running, but volume management
  # (attach/detach/replica rebuild) pauses for the restart window. Merge this
  # during a quiet window. That roll is also what applies the new memory
  # request on cp1/cp2, which would otherwise keep the old 50Mi request until
  # their pods next restart on their own.
  priorityClass: "platform-critical"

longhornDriver:
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
  priorityClass: "platform-standard"

longhornAdmissionWebhook:
  priorityClass: "platform-standard"

longhornConversionWebhook:
  priorityClass: "platform-standard"

longhornRecoveryBackend:
  priorityClass: "platform-standard"
