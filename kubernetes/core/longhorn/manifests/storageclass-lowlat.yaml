# longhorn-lowlat — replicated storage FENCED OFF the offsite node.
#
# WHY THIS CLASS EXISTS
# ---------------------
# Longhorn acknowledges a write only when EVERY replica has acked it. cp4
# (zone=hypatia) is a Hetzner box across a stretched VLAN: 14.9-16.3 ms away,
# versus 0.19-0.63 ms between cp1 and cp3. Putting a latency-sensitive volume's
# replica there does not merely slow it down, it breaks it. Measured
# 2026-08-14, moving the Authentik database onto plain `longhorn`:
#
#     FATAL:  could not open file "global/pg_filenode.map": I/O error
#
# ...and the migration was reverted the same day. The note left in
# kubernetes/platform/authentik/values.yaml said the precondition for retrying
# was to "fence latency-sensitive volumes off the remote node (Longhorn disk
# tags / a dedicated StorageClass with a diskSelector)". This class is that
# fence, and 2026-08-18 is the retry.
#
# HOW THE FENCE WORKS — and why the pre-existing `offsite` tag was NOT enough
# ---------------------------------------------------------------------------
# cp4's disk was already tagged `offsite`. That tag alone excludes nothing:
# measured 2026-08-18, ALL 27 Longhorn volumes — every one of them with an
# empty diskSelector — had a replica on cp4's `offsite` disk. A tag on a disk
# does not make that disk exclusive; it only gives volumes something to select
# ON. Exclusion has to come from the volume side.
#
# So the low-latency disks (cp1, cp3) are tagged `lowlat` and this class sets
#     diskSelector: "lowlat"
# A disk is eligible only if it carries EVERY tag in the selector. cp4's disk
# has `offsite` and not `lowlat`, so it can never hold a replica of a volume in
# this class. Nothing else changes for any other volume.
#
# ⚠️ The disk tags themselves are NOT in git — they live on the
# `nodes.longhorn.io` CRs, which Longhorn owns and creates. This file is
# useless without them. To re-apply after a node rebuild:
#     kubectl -n longhorn-system patch nodes.longhorn.io <node> --type=merge \
#       -p '{"spec":{"disks":{"<disk>":{"tags":["lowlat"], ...}}}}'
# Verify with: kubectl -n longhorn-system get nodes.longhorn.io \
#       -o custom-columns=N:.metadata.name,TAGS:.spec.disks.*.tags
#
# THE OTHER HALF OF THE FENCE — THE POD
# -------------------------------------
# ⚠️ A diskSelector fences REPLICAS. It does not fence the ENGINE, which runs on
# whichever node the volume is attached to, i.e. wherever the consuming POD was
# scheduled, and which writes to every replica synchronously. A pod on cp4 with
# its replicas correctly on cp1+cp3 is therefore the WORST arrangement this
# class can produce, not a safe one: every write leaves the node, crosses the
# 15 ms link to both replicas, and blocks until both ack.
#
# That is not hypothetical. Measured 2026-08-19, all three WordPress databases
# on this class (lol, yonavaarwater-nl, zonnevaarwater-nl) were running exactly
# like that, having been moved off cp3 the previous night when it hit 99%
# memory requests.
#
# The pod-side half now lives in
#     kubernetes/core/kyverno/manifests/lowlat-pv-node-affinity.yaml
# which stamps `zone NotIn [hypatia]` onto `spec.nodeAffinity` of every
# PersistentVolume in this class at admission. Read that file before changing
# anything here — and note that `dataLocality: best-effort` below is NOT that
# mechanism and cannot be: it wants a replica next to the engine, which this
# diskSelector forbids, so on a wrongly-placed pod it only produces a permanent
# `stopped` replica with hardNodeAffinity to the node it may not use.
#
# REPLICA COUNT
# -------------
# numberOfReplicas 2, and BOTH are satisfiable again as of 2026-08-19: cp1's
# Longhorn disk is back to allowScheduling with ~637 GiB available, and all four
# volumes in this class report robustness `healthy` with one replica on cp1 and
# one on cp3.
#
# (History, kept because it explains the choice of 2: on 2026-08-18 cp1's disk
# was Ready=False — "record diskUUID doesn't match the one on the disk", the
# EPHEMERAL wipe having given /var/lib/longhorn a new filesystem — so a volume
# here was DEGRADED-but-serving until it re-registered. Degraded is the honest
# signal and is deliberate: 1 is not set here, because that would report
# "healthy" while providing no redundancy at all.)
#
# Volumes in this class carry no recurring-job labels, so Longhorn applies the
# `default` group (see backup-jobs.yaml): midnight snapshot + 01:00 backup to
# TrueNAS. That is real off-box protection, which a local-path PV can never
# have.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-lowlat
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "2880"
  diskSelector: "lowlat"
  dataLocality: "best-effort"
  fromBackup: ""
  fsType: ext4
