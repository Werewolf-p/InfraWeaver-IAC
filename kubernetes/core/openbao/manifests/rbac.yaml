---
# Role: grants the openbao ServiceAccount read access to the openbao-unseal Secret.
# This allows the autounseal sidecar container to read the unseal key on pod start.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-unseal-reader
  namespace: openbao
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["openbao-unseal"]
    verbs: ["get", "watch", "list"]
---
# RoleBinding: binds the openbao ServiceAccount (created by Helm) to the unseal-reader Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-unseal-reader
  namespace: openbao
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-unseal-reader
subjects:
  - kind: ServiceAccount
    name: openbao
    namespace: openbao
---
# ClusterRoleBinding: lets OpenBao validate Kubernetes ServiceAccount tokens via the
# TokenReview API. This is the prerequisite for the kubernetes auth method, which
# lets each app authenticate with its own pod ServiceAccount and reach only its own
# bucket (secret/private/<namespace>) — see scripts/deploy/openbao-app-self-secrets.sh.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: openbao
    namespace: openbao
