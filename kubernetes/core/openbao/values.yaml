server:
  # Self-healing: ensure OpenBao (secrets engine) is never evicted.
  priorityClassName: platform-critical

  # Memory limit: OpenBao uses ~56Mi at rest, 256Mi gives 4.5x headroom.
  # limit/request = 256/64 = 4x, inside the limit-memory-burst-ratio policy's 8x.
  #
  # THESE TWO KEYS LIVED AT THE TOP LEVEL OF THIS FILE UNTIL 2026-08-07, WHERE
  # THE CHART NEVER READ THEM. openbao-helm (a vault-helm fork) consumes both
  # under server.*. Measured live before the move:
  #   kubectl get sts openbao -n openbao -o json | jq '{u:.spec.updateStrategy,
  #     pc:.spec.template.spec.priorityClassName,
  #     c:[.spec.template.spec.containers[]|{name,resources}]}'
  #   -> priorityClassName: null, both containers resources: {}
  # So the "never evicted" comment and the resource block were both lies, and
  # Kyverno's require-memory-request-and-limit failed on StatefulSet/openbao and
  # Pod/openbao-0 for exactly that reason.
  resources:
    requests:
      memory: 64Mi
      cpu: 25m
    limits:
      memory: 256Mi
      cpu: 500m

  # Probe tuning: OpenBao takes 2-3 minutes to start and unseal.
  # - readinessProbe: 10s timeout, 60s initial delay, 5 failures tolerated
  # - livenessProbe: disabled — autounseal sidecar handles recovery; HTTP liveness
  #   was killing the pod before it could fully initialize (exit 137 after ~150s)
  readinessProbe:
    enabled: true
    failureThreshold: 5
    initialDelaySeconds: 60
    periodSeconds: 15
    successThreshold: 1
    timeoutSeconds: 10

  livenessProbe:
    enabled: false

  # Node affinity: prefer cp1/cp2 over cp3 which has known Longhorn mmap instability.
  # SIGBUS crashes occur when cp3 briefly loses volume connectivity, causing mmap
  # page faults in OpenBao's Raft/BBolt storage. Preferring stable nodes prevents this.
  affinity: |
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
            - talos-prod-cp2
            - talos-prod-cp3

  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"

        # WITHOUT THIS, `OpenBaoSealed` CAN NEVER FIRE.
        # `vault_core_unsealed` had no series at all, which the alert pipeline's
        # own self-check has been reporting as AlertInputMissingOpenBao — a
        # sealed OpenBao freezes every ExternalSecret on the platform and would
        # have paged nothing. Metrics are only emitted when a `telemetry` stanza
        # exists, and /v1/sys/metrics otherwise demands a token, which a
        # Prometheus scrape has no good way to hold.
        #
        # `unauthenticated_metrics_access` exposes counters and gauges — seal
        # state, request rates, storage latency — and no secret material. The
        # listener it sits on is ClusterIP-only and already tls_disable = 1 for
        # in-cluster traffic, so nothing new is reachable from outside.
        telemetry {
          unauthenticated_metrics_access = true
        }
      }

      # Prometheus scrapes on an interval, so the retention has to outlive it.
      # disable_hostname keeps the pod name out of every metric NAME (it is
      # already a label), which otherwise makes a restarted pod look like a new
      # series and breaks `absent()` — the very function the self-check uses.
      telemetry {
        prometheus_retention_time = "30s"
        disable_hostname = true
      }

      storage "raft" {
        path = "/openbao/data"
        node_id = "openbao-0"
      }

      # Audit log: write all requests/responses to a file inside the data volume.
      # Log is rotated at 100MB. Required for compliance and incident investigation.
      audit {
        type = "file"
        path = "/openbao/data/audit.log"
        options = {
          file_path = "/openbao/data/audit.log"
          log_raw    = "false"
          hmac_accessor = "true"
        }
      }

      api_addr = "http://openbao.openbao.svc.cluster.local:8200"
      cluster_addr = "http://openbao.openbao.svc.cluster.local:8201"

  dataStorage:
    enabled: true
    size: 5Gi
    storageClass: local-path   # local-path avoids Longhorn I/O errors on Raft BoltDB
    accessMode: ReadWriteOnce

  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.middlewares: traefik-forward-auth@kubernetescrd
    hosts:
      - host: openbao.prod.local
        paths:
          - /
      # NOTE: resolved literal, NOT ${BASE_DOMAIN}. This is a Helm valueFile consumed
      # raw by ArgoCD's Helm source (multi-source $values ref in appset-core.yaml), so it
      # bypasses the argocd-cmp-envsubst-plugin — a ${BASE_DOMAIN} here stays literal and
      # selfHeal would overwrite the live Ingress with the broken host. Matches the
      # already-hardcoded openbao.prod.local above. (BASE_DOMAIN=example.com)
      - host: openbao.int.example.com
        paths:
          - /
    pathType: Prefix

  service:
    type: ClusterIP

  serviceAccount:
    create: true
    name: openbao

  extraContainers:
    - name: autounseal
      image: quay.io/openbao/openbao:2.5.3
      command:
        - /bin/sh
        - -c
        - >-
          echo "Autounseal sidecar starting...";
          while true; do
            EXIT_CODE=0;
            bao status -address=http://127.0.0.1:8200 >/dev/null 2>&1 || EXIT_CODE=$?;
            if [ "$EXIT_CODE" = "2" ]; then
              UNSEAL_KEY=$(cat /etc/openbao-unseal/unseal_key 2>/dev/null || true);
              if [ -n "$UNSEAL_KEY" ]; then
                echo "OpenBao sealed - unsealing...";
                bao operator unseal -address=http://127.0.0.1:8200 "$UNSEAL_KEY" >/dev/null 2>&1 && echo "Unseal OK" || echo "Unseal failed";
              else
                echo "Sealed but no unseal key yet";
              fi;
            fi;
            sleep 30;
          done
      env:
        - name: BAO_ADDR
          value: "http://127.0.0.1:8200"
      # require-memory-request-and-limit uses `name: "*"`, so EVERY container
      # needs requests.cpu + requests.memory + limits.memory or the StatefulSet
      # still fails. This is a `sleep 30` shell loop; the budget is generous.
      # 64Mi limit / 16Mi request = 4x, inside limit-memory-burst-ratio's 8x.
      resources:
        requests:
          memory: 16Mi
          cpu: 10m
        limits:
          memory: 64Mi
      volumeMounts:
        - name: userconfig-openbao-unseal
          mountPath: /etc/openbao-unseal
          readOnly: true

  extraVolumes:
    - type: secret
      name: openbao-unseal
      defaultMode: "0444"

injector:
  enabled: false

ui:
  enabled: true
  serviceType: ClusterIP

# NOTE: `priorityClassName` and `resources` used to sit HERE, at the top level,
# where the chart never read them. They now live under `server:` at the top of
# this file. Do not re-add them here — a top-level key that the chart ignores
# renders as a control that is present in git and absent in the cluster.
