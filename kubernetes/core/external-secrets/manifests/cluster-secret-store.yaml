---
# ClusterSecretStore — connects ESO to OpenBao (HashiCorp Vault-compatible API)
#
# Auth: Kubernetes auth backend (SA JWT). ESO authenticates using its own
# in-pod ServiceAccount token (external-secrets/external-secrets), mounted at
# /var/run/secrets/kubernetes.io/serviceaccount/token, against the OpenBao
# `kubernetes` auth mount, role `external-secrets` (policy platform-k8s).
#
# This replaces the previous static tokenSecretRef (secret openbao-token): that
# token had a fixed, non-renewable ~30d TTL that nothing rotated, so it expired
# and broke every ExternalSecret + PushSecret cluster-wide. SA JWTs are
# auto-rotated by the kubelet and never expire as a class.
#
# No serviceAccountRef/secretRef is set on purpose: the ESO controller SA is not
# granted create on serviceaccounts/token (TokenRequest), so ESO falls back to
# reading its own mounted SA token file — which requires no extra RBAC.
#
# OpenBao side (provisioned out-of-band via root token, NOT GitOps-tracked):
#   bao write auth/kubernetes/role/external-secrets \
#     bound_service_account_names=external-secrets \
#     bound_service_account_namespaces=external-secrets \
#     token_policies=platform-k8s token_ttl=1h
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: "http://openbao.openbao.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
