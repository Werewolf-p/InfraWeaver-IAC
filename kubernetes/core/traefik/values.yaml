deployment:
  replicas: 3  # one per control-plane node (DoNotSchedule spread below) so externalTrafficPolicy:Local
               # always has a local Traefik endpoint on whichever node MetalLB announces ${METALLB_TRAEFIK_VIP} from

# Single replica: remove topology spread that required 2 nodes
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: traefik

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
          topologyKey: kubernetes.io/hostname

service:
  type: LoadBalancer
  loadBalancerIP: "${METALLB_TRAEFIK_VIP}"
  spec:
    # Local preserves the real client source IP. REQUIRED for the ipAllowList
    # middlewares (lan-only, internal-cluster-only) to work: under Cluster, kube-proxy
    # SNATs every request to a node IP in ${NODE_SUBNET_CIDR} (an allowed range), so the
    # allowlists would see all traffic as internal and admit it. With one Traefik pod
    # per node (replicas:3 + DoNotSchedule spread) Local keeps HA across node reboots.
    externalTrafficPolicy: Local

ingressClass:
  enabled: true
  isDefaultClass: true

# Traefik API + Dashboard — enabled for internal access via traefik-dashboard ClusterIP service
# The traefik entrypoint (port 9000) serves /api, /dashboard and /ping.
# NOT exposed externally — only accessible via traefik.int.${BASE_DOMAIN} (internal-only middleware).
api:
  dashboard: true
  insecure: false

# Enable /ping endpoint on the traefik entrypoint (port 9000)
ping:
  entryPoint: "traefik"

# ── Prometheus metrics — DECLARED, not inherited ─────────────────────────────
# Every value below is already the chart default. Writing them down is the point:
# manifests/podmonitor.yaml and the console's Cluster Vitals widget both depend
# on this exposition, and alerts/console-availability.yaml now keys the console's
# only error/latency signal on traefik_service_*. Until this block existed, all
# of that rested on a default that a chart bump can flip silently — which is the
# exact failure class alerts/alert-pipeline-selfcheck.yaml was written for. An
# undeclared dependency that disappears without a diff is how a control dies.
#
#   addEntryPointsLabels  → traefik_entrypoint_requests_total (Cluster Vitals)
#   addServicesLabels     → traefik_service_requests_total and
#                           traefik_service_request_duration_seconds_bucket
#                           (ConsoleHighErrorRate / ConsoleHighLatency)
#   addRoutersLabels is left at its `false` default: routers carry the same
#   traffic as their services here, at ~44 IngressRoutes' worth of extra series.
#
# BUCKETS ARE THE LOAD-BEARING CHANGE. The chart default is "0.1,0.3,1.2,5.0",
# and histogram_quantile() returns the highest FINITE bucket bound once the
# quantile falls in +Inf — so under the default buckets a p95 can never evaluate
# above 5.0, and `ConsoleHighLatency ... > 5` would have been a second dead rule
# that merely looked alive. 10.0 and 30.0 make the 5s threshold expressible with
# room above it. Cost is stated rather than assumed: 5 series per
# (service, code, method, protocol) becomes 7, ~40% more duration series.
metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addServicesLabels: true
    buckets: "0.1,0.3,1.2,5.0,10.0,30.0"

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true      # Allow IngressRoutes to reference services in other namespaces
    allowExternalNameServices: true # Allow routing to ExternalName services (cluster app proxying)
  kubernetesIngress:
    enabled: true
    allowExternalNameServices: true

rbac:
  enabled: true

# Allow Traefik to connect to backends with self-signed TLS certs (Proxmox, TrueNAS, Portainer, etc.)
# Redirect HTTP to HTTPS at the entrypoint level (v34+ syntax via args)
additionalArguments:
  - "--serversTransport.insecureSkipVerify=true"
  # Connection pool tuning — reduces overhead for keep-alive connections
  - "--serversTransport.maxIdleConnsPerHost=200"
  # Response buffer — prevents backends from being held while client downloads (important for slow VPN clients)
  - "--api.disableDashboardAd=true"

# Enable access logging so we can see source IPs for debugging IP allowlist issues
logs:
  access:
    enabled: true
    format: json
    fields:
      headers:
        defaultMode: drop
        names:
          X-Forwarded-For: keep
          X-Real-Ip: keep

ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    protocol: TCP
  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    protocol: TCP
    tls:
      enabled: true
    transport:
      respondingTimeouts:
        readTimeout: "0s"    # Disable read timeout for WebSocket / streaming backends
        idleTimeout: "0s"    # Disable idle timeout — keeps gRPC streaming connections alive indefinitely
      lifeCycle:
        graceTimeOut: "30s"
  # GitLab container registry
  registry:
    port: 5005
    expose:
      default: true
    exposedPort: 5005
    protocol: TCP
  # Bitwarden / extra NodePort
  extra-port:
    port: 30032
    expose:
      default: true
    exposedPort: 30032
    protocol: TCP
  # Teleport Auth
  teleport-auth:
    port: 3025
    expose:
      default: true
    exposedPort: 3025
    protocol: TCP
  # Teleport Node
  teleport-node:
    port: 3023
    expose:
      default: true
    exposedPort: 3023
    protocol: TCP
  # Teleport Proxy SSH
  teleport-proxy:
    port: 3024
    expose:
      default: true
    exposedPort: 3024
    protocol: TCP

resources:
  requests:
    cpu: 100m
    # Raised 128Mi -> 256Mi (2026-08-03) based on measurement, not the OOMKill itself:
    # `kubectl top pods -n traefik` showed live replicas at 83Mi/118Mi/216Mi -- one
    # already over the old 128Mi request. A Burstable pod whose usage exceeds its
    # request is a preferred target for kubelet's node-pressure eviction/OOM scoring,
    # which matters because talos-prod-cp3 was measured at 106% of its allocatable
    # memory (6979Mi used / 6563Mi allocatable) at the time of this investigation --
    # the same node that hosts one Traefik replica and that OOMKilled it on 2026-08-02.
    # The container's OWN 512Mi limit was never evidenced as too tight (usage stayed
    # well under it), so the limit is intentionally left unchanged rather than raised
    # further, to stay defensible against the incoming cluster-wide LimitRange
    # max/ratio caps.
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Self-healing: ensure Traefik is never evicted under resource pressure
priorityClassName: platform-critical
