---
# Runner identity, delivered from OpenBao — never hardcoded, never a PAT.
#
# WHY THIS IS THE RUNNER'S OWN CREDENTIALS AND NOT A GITHUB PAT
# -------------------------------------------------------------
# The obvious design (and what actions-runner-controller does) is to put a
# GitHub PAT with `administration: write` in the cluster and let the pod
# self-register on every start. We deliberately do NOT do that:
#
#   * That PAT can add and remove runners on the repo. A workflow job running
#     ON this runner can read the pod's own environment/mounts, steal it, and
#     register an attacker-controlled runner to intercept future jobs — a
#     full CI supply-chain compromise from one malicious PR.
#   * MEASURED CONSTRAINT (2026-08-15): the PAT that exists at
#     secret/platform/infraweaver-console property `github-token` CANNOT do
#     this anyway. It is a fine-grained PAT without `administration: write`:
#       POST /repos/example-owner/InfraWeaver-platform/actions/runners/registration-token
#         -> HTTP 403 "Resource not accessible by personal access token"
#       POST /repos/example-owner/InfraWeaver-base/...                -> HTTP 404
#     So PAT-based self-registration is not merely undesirable, it is not
#     currently possible without minting a new, more powerful credential.
#
# WHAT WE STORE INSTEAD
# ---------------------
# The runner was registered ONCE (out of band, using an operator credential
# that never entered the cluster) and the three files GitHub's runner writes
# are kept in OpenBao:
#
#   .runner                 — non-secret: agent id, name, repo URL, work folder
#   .credentials            — non-secret envelope naming the RSA auth scheme
#   .credentials_rsaparams  — SECRET: the RSA private key the runner uses to
#                             authenticate to the Actions broker
#
# The runner re-authenticates itself indefinitely with that RSA key. No GitHub
# admin credential ever lives in this cluster. The worst an attacker who
# escapes into this Secret can do is impersonate THIS runner — which is
# strictly less than what they already have by executing on it.
#
# ROTATION / RE-REGISTRATION (operator runbook)
# ---------------------------------------------
# These credentials are invalidated if the runner is removed in GitHub or
# re-registered. To re-issue:
#   1. gh api -X POST repos/<owner>/<repo>/actions/runners/registration-token
#   2. In a throwaway pod on ghcr.io/actions/actions-runner:
#        ./config.sh --unattended --url https://github.com/<owner>/<repo> \
#          --token <tok> --name in-cluster-platform --labels in-cluster \
#          --work _work --disableupdate --replace
#   3. base64 -w0 each of the three files and
#        bao kv put secret/platform/github-runner-platform \
#          runner_b64=... credentials_b64=... rsaparams_b64=...
#   4. kubectl -n github-runner rollout restart deploy/github-runner-platform
#
# NOTE ON deletionPolicy: Retain — one missing property fails the WHOLE
# ExternalSecret and every key stops refreshing while ArgoCD shows only
# "Degraded". Seed all three properties in OpenBao BEFORE syncing this.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-runner-platform
  namespace: github-runner
  labels:
    app.kubernetes.io/name: github-runner
    app.kubernetes.io/managed-by: gitops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: github-runner-platform
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # decodingStrategy: Base64 — OpenBao holds these base64-encoded (the RSA
    # params and .runner both contain bytes that do not survive round-tripping
    # as plain KV strings; .runner in particular starts with a UTF-8 BOM that
    # the runner requires). ESO decodes them so the mounted files are the exact
    # bytes ./run.sh expects.
    - secretKey: .runner
      remoteRef:
        key: secret/platform/github-runner-platform
        property: runner_b64
        decodingStrategy: Base64
    - secretKey: .credentials
      remoteRef:
        key: secret/platform/github-runner-platform
        property: credentials_b64
        decodingStrategy: Base64
    - secretKey: .credentials_rsaparams
      remoteRef:
        key: secret/platform/github-runner-platform
        property: rsaparams_b64
        decodingStrategy: Base64
