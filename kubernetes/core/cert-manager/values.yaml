installCRDs: true

replicaCount: 1

global:
  leaderElection:
    enabled: true
  priorityClassName: platform-critical

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

extraArgs:
  - --dns01-recursive-nameservers-only
  - --dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53

webhook:
  replicaCount: 1
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

cainjector:
  replicaCount: 1
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# The monitoring stack is NOT optional any more, and this being false was not a
# free saving: certmanager_certificate_expiration_timestamp_seconds had no
# series, so CertificateExpiringSoon and CertificateExpiringCritical could never
# fire. Nothing was watching certificate expiry — the rules existed and measured
# nothing. AlertInputMissingCertManager guards against that regressing.
prometheus:
  enabled: true
  servicemonitor:
    enabled: true
