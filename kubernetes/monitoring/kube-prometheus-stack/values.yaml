fullnameOverride: kube-prometheus-stack

# ── Prometheus Operator ───────────────────────────────────────────────────────
# Disable admission webhook (its cert-patch Job has hook-delete-policy:
# hook-succeeded which causes ArgoCD to wait forever after the Job self-deletes)
prometheusOperator:
  priorityClassName: platform-standard
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false

# ── Grafana ───────────────────────────────────────────────────────────────────
# Disabled: standalone grafana (apps-grafana namespace, 69Mi) serves the UI instead.
# The bundled Grafana was using 511Mi and is redundant.
grafana:
  enabled: false
  priorityClassName: platform-standard
  # Admin credentials from OpenBao via ExternalSecret in monitoring namespace
  # grafana-admin-secret provides both admin-user and admin-password keys
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  persistence:
    enabled: true
    size: 5Gi

  # Prefer standard nodes (CP1/CP2, 18GB RAM each)
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: infraweaver.io/node-class
                operator: In
                values: [standard]

  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.prod.local
    paths:
      - /
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.middlewares: traefik-forward-auth@kubernetescrd

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  dashboards:
    default:
      kubernetes-cluster:
        gnetId: 7249
        revision: 1
        datasource: Prometheus
      node-exporter:
        gnetId: 1860
        revision: 37
        datasource: Prometheus
      talos-dashboard:
        gnetId: 19764
        revision: 1
        datasource: Prometheus

  sidecar:
    dashboards:
      enabled: true
    datasources:
      enabled: true

# ── Prometheus ────────────────────────────────────────────────────────────────
prometheus:
  enabled: true
  prometheusSpec:
    priorityClassName: platform-standard
    # ── Retention (GAP-H5) ───────────────────────────────────────────────────
    # Measured 2026-08-07 (read-only, from inside the pod and from talosctl):
    #   TSDB on disk            5.6 GiB at the old 3d/8GB settings
    #   ingest rate             ~1.87 GiB/day
    #   backing store           local-path → talos-prod-cp2 /var (EPHEMERAL, xfs)
    #                           295.8 GiB total, 113.5 GiB used, 182.4 GiB free
    # NOTE: the plan recorded this PVC as Longhorn. It is not — all three
    # monitoring PVCs are `local-path`, and all three live on talos-prod-cp2.
    #
    # `local-path` enforces no quota (proof: the sibling "10Gi" Loki volume holds
    # 10.7 GiB), so the declared 20Gi claim below is not a real ceiling; the only
    # real ceiling is cp2's free space. retentionSize is therefore the actual
    # safety device and is kept INSIDE the declared claim on purpose, with ~30%
    # of it left free for compaction scratch (a compaction writes the new block
    # before unlinking the old ones).
    #
    #   14GB (= 14 GiB, Prometheus units are base-2) ÷ 1.87 GiB/day ≈ 7.5 days
    # So the size cap binds first: this raises effective retention from 3d to
    # ~7.5d, not to the full 15d. 15d is the time ceiling for when ingest drops.
    # Reaching a genuine 15d needs ~28 GiB, i.e. a bigger claim — which cannot be
    # done here: the claim is a StatefulSet volumeClaimTemplate (immutable) and
    # the `local-path` StorageClass has no allowVolumeExpansion. That resize
    # requires recreating the Prometheus StatefulSet and is a separate change.
    #
    # Worst case this adds 8.4 GiB to cp2 (5.6 → 14 GiB), leaving ~174 GiB free.
    retention: 15d
    retentionSize: 14GB
    # Reduce scrape load to ease memory pressure on 8GB nodes
    scrapeInterval: 60s
    evaluationInterval: 60s
    # Prevent Kubernetes from re-applying fsGroup between init containers and main container
    # (which would reset our chown). With Never, our initContainer sets the correct ownership.
    podMetadata:
      annotations: {}
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 2000
      fsGroup: 2000
      fsGroupChangePolicy: "OnRootMismatch"
      seccompProfile:
        type: RuntimeDefault
    # subPath mounts in Kubernetes use overlayfs. The overlay's upper layer is a fresh
    # root:root 755 directory created by kubelet, overriding changes to the lower layer.
    # Fix: second init container mounts WITH subPath to chmod the overlayfs upper layer directly.
    initContainers:
      - name: fix-prometheus-permissions
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            mkdir -p /prometheus/prometheus-db
            chmod -R a+rwx /prometheus/prometheus-db
            chown -R 1000:2000 /prometheus/prometheus-db
            echo "Lower layer fixed: $(ls -lan /prometheus/)"
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: true
        volumeMounts:
          - name: prometheus-kube-prometheus-stack-prometheus-db
            mountPath: /prometheus
      - name: fix-prometheus-overlay-permissions
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            chmod 777 /prometheus
            chown 1000:2000 /prometheus
            echo "Overlay upper layer fixed: $(ls -lan /prometheus)"
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: true
        volumeMounts:
          - name: prometheus-kube-prometheus-stack-prometheus-db
            mountPath: /prometheus
            subPath: prometheus-db
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    # Prefer standard nodes (CP1/CP2, 18GB RAM each); CP3 only has 6.6GB allocatable
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: infraweaver.io/node-class
                  operator: In
                  values: [standard]

    resources:
      requests:
        memory: 512Mi
        cpu: 200m
      limits:
        memory: 2Gi  # Hard cap: 4x headroom over current 499Mi usage

    # Scrape all ServiceMonitors across all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

# ── Chart default-rule overrides ─────────────────────────────────────────────
# KubeJobFailed (kube_job_failed > 0, for: 15m) is replaced by
# alerts/cronjob-health.yaml. Two measured defects: (1) it can NEVER fire for a
# CronJob faster than 15m with failedJobsHistoryLimit<=1 — each failed Job is a
# new series that is deleted before the `for:` elapses (the four kyverno cleanup
# jobs failed every 10 minutes for hours, silently); (2) it fires and STAYS
# firing for stale failed Jobs retained by failedJobsHistoryLimit=3 long after
# later successes — 23 simultaneous firings measured on 2026-08-07, which is the
# noise that taught the operator to ignore Discord. CronJobLastRunFailed +
# StandaloneJobFailed + CronJobNeverSucceeded cover strictly more, accurately.
# KubeJobNotCompleted (stuck >12h) is intentionally kept.
defaultRules:
  disabled:
    KubeJobFailed: true

# ── AlertManager ─────────────────────────────────────────────────────────────
alertmanager:
  enabled: true
  alertmanagerSpec:
    priorityClassName: platform-standard
    # Mounted at /etc/alertmanager/secrets/alerts-inbound-token/token and read by
    # the console receiver's `credentials_file`, so the token never appears in
    # this file. VERIFIED PRESENT before this was enabled: the ExternalSecret in
    # `monitoring` reports SecretSynced and the Secret carries the `token` key.
    # Enabling it while the Secret is absent leaves this pod in ContainerCreating
    # forever — no alerting at all — which is why the order was not optional.
    secrets:
      - alerts-inbound-token
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    # ── Escalation transport, step 2 of 2 — DO NOT UNCOMMENT YET ─────────────
    # Enabling this line while the Secret does not exist leaves the Alertmanager
    # pod in ContainerCreating forever, i.e. NO alerting at all. That is a worse
    # outage than the missing escalation leg it fixes, so the order is not
    # negotiable. See the "Escalation transport" block further down for the full
    # two-step procedure and the alerts that page until it is finished.
    #
    # secrets:
    #   - alertmanager-escalation-urls
  # ── Alerting delivery (GAP-M4, SOC 2 CC7.3-7.5) ────────────────────────────
  # BEFORE: every route that delivered anything at all ended at ONE Discord
  # webhook (the `all` receiver was Discord too, despite its name), `email-admin`
  # was defined and never referenced by any route, and four routes went to `null`
  # with no recorded reason — including Watchdog, the dead-man's-switch signal.
  # A broken Discord webhook therefore silenced the entire platform, silently.
  #
  # AFTER: critical alerts fan out over TWO independent transports, Watchdog has
  # a real destination, and every remaining `null` is an explicit, justified
  # decision rather than an accident.
  config:
    global:
      resolve_timeout: 5m
      # Corrected to the mailbox the rest of the platform actually authenticates
      # against (infraweaver-console and authentik both use smtp-mail.outlook.com);
      # the previous smtp.gmail.com smarthost could never have worked with it.
      # Outlook rejects a From that differs from the authenticated user (554
      # SendAsDenied), so both are the same address — see the same note in
      # catalog/infraweaver-console/overlays/prod/kustomization.yaml.
      smtp_from: "${ADMIN_EMAIL}"
      smtp_smarthost: "smtp-mail.outlook.com:587"
      smtp_auth_username: "${ADMIN_EMAIL}"
      # ⚠ SECOND KNOWN GAP, verified not assumed: `${...}` is NOT substituted in
      # this file. The `platform-monitoring` ApplicationSet consumes it as a
      # multi-source Helm `$values` valueFile, which bypasses the argocd CMP that
      # performs substitution — so the LIVE Alertmanager secret today contains the
      # literal string `admin@${BASE_DOMAIN}` as a recipient
      # (kubectl get secret -n monitoring alertmanager-kube-prometheus-stack-alertmanager).
      # Alertmanager accepts it and starts, so this has been failing silently
      # since the receiver was written. The placeholder form is kept rather than
      # hardcoding a real address, because this repo is mirrored to a public
      # remote by scripts/sync-to-public.sh. Fix alongside the SMTP secret below.
      # KNOWN GAP — placeholder, so the email transport does NOT deliver yet.
      # It cannot be fixed from this file: the real fix is an ExternalSecret
      # creating `alertmanager-smtp-secret` in the monitoring namespace from
      # OpenBao (the same path authentik-smtp-secret reads), plus
      # `alertmanagerSpec.secrets: [alertmanager-smtp-secret]` and
      # `smtp_auth_password_file: /etc/alertmanager/secrets/.../smtp-password`.
      # That ExternalSecret lives in kube-prometheus-stack/manifests/, which this
      # work package does not own. It is NOT wired here on purpose: referencing a
      # Secret that does not exist yet leaves the Alertmanager pod stuck in
      # ContainerCreating, which would be a worse outage than a missing email.
      # Until it lands, the email leg fails LOUDLY — the stack's built-in
      # AlertmanagerFailedToSendAlerts fires on
      # alertmanager_notifications_failed_total{integration="email"} — instead of
      # this being an unnoticed single point of failure.
      smtp_auth_password: "changeme"
      smtp_require_tls: true
    route:
      group_by: ["alertname", "namespace", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 6h
      receiver: "discord"
      routes:
        # ── InfraWeaver console inbox ────────────────────────────────────────
        # FIRST so it sees everything, and `continue: true` so it consumes
        # nothing: every alert still falls through to the routes below exactly as
        # before. This leg is additive by construction — if the console is down,
        # Discord delivery is unaffected, so the inbox cannot become a new single
        # point of failure for alerting.
        #
        # group_wait is shorter than the 30s default because the destination is a
        # SCREEN, not a pager: an operator opening /alerts during an incident
        # should not wait out a batching window to see what is firing.
        - receiver: "infraweaver-console"
          continue: true
          group_wait: 10s

        # ── Dead-man's switch ────────────────────────────────────────────────
        # Watchdog always fires; its ABSENCE is the signal. Routing it to `null`
        # (the old behaviour) threw that signal away, so a dead Prometheus, a
        # dead Alertmanager or a dead notification path looked identical to
        # "nothing is wrong". It now goes to the transport that does not share a
        # failure domain with the Discord webhook.
        # LIMITATION, stated deliberately: a complete dead-man's switch must
        # terminate OUTSIDE this cluster (an external heartbeat that alarms when
        # the ping stops — healthchecks.io / Gatus push / uptime monitor). No such
        # endpoint exists in this platform yet, and neither does a working email
        # transport (see the two gaps in `global` above). Until one does, this is
        # a 12-hourly heartbeat an operator must notice the ABSENCE of — weaker
        # than a real switch, stronger than the `null` it replaces. When an
        # external endpoint exists, add it as another entry on this receiver;
        # nothing else in this file changes.
        - matchers: ['alertname = "Watchdog"']
          receiver: "deadmansswitch"
          repeat_interval: 12h
          continue: false

        # ── Deliberately silenced: InfoInhibitor ─────────────────────────────
        # kube-prometheus-stack ships InfoInhibitor purely to drive the
        # inhibit_rules below. It is a routing primitive, never an incident.
        # Silencing it is correct, not an oversight.
        - matchers: ['alertname = "InfoInhibitor"']
          receiver: "null"
          continue: false

        # ── Deliberately silenced: unscrapable Talos control-plane components ─
        # Talos binds kube-controller-manager, kube-proxy and kube-scheduler to
        # 127.0.0.1, so they can never be scraped and these alerts are
        # permanently, structurally false. Their ServiceMonitors are also
        # disabled at the bottom of this file, so these routes are belt-and-
        # braces for rules that ship inside the chart's own rule groups.
        # COMPENSATING CONTROL: control-plane liveness is covered by NodeNotReady,
        # EtcdMemberDown and the Kubernetes API's own availability — losing these
        # three alerts does not leave the control plane unmonitored.
        - matchers: ['alertname =~ "KubeControllerManagerDown|KubeProxyDown|KubeSchedulerDown"']
          receiver: "null"
          continue: false
        # Same root cause: TargetDown fires for the same three unscrapable jobs.
        # Scoped by `job` so a genuine TargetDown for any OTHER job still pages.
        - matchers: ['alertname = "TargetDown"', 'job =~ "kube-proxy|kube-controller-manager|kube-scheduler"']
          receiver: "null"
          continue: false

        # ── Critical: two independent transports ─────────────────────────────
        # `continue: true` makes the alert fall through to the next sibling, so a
        # critical alert is delivered over BOTH Discord and email. Either one can
        # be broken without the alert being lost.
        - matchers: ['severity = "critical"']
          receiver: "discord"
          repeat_interval: 1h
          continue: true
        - matchers: ['severity = "critical"']
          receiver: "email-admin"
          repeat_interval: 1h
          continue: false

        # Warnings stay single-transport on purpose: doubling every warning would
        # train the operator to ignore both channels.
        - matchers: ['severity = "warning"']
          receiver: "discord"
          repeat_interval: 6h
          continue: false
        # Anything unmatched falls through to the top-level `discord` receiver.
    receivers:
      # Used ONLY by the two deliberately-silenced routes above. Every use is
      # commented at the route; a `null` with no comment is a bug.
      - name: "null"

      - name: "discord"
        webhook_configs:
          - url: "http://alertmanager-discord.monitoring.svc.cluster.local:9094"
            send_resolved: true

      # The second, independent transport. Now actually referenced by a route —
      # it previously existed but nothing routed to it.
      - name: "email-admin"
        email_configs:
          - to: "${ADMIN_EMAIL}"
            send_resolved: true

      # Heartbeat sink. Two legs on purpose: the Discord bridge works TODAY (so
      # the heartbeat is real from the moment this merges), and the email leg
      # becomes the independent transport as soon as the two gaps in `global`
      # above are closed. send_resolved is off on both: Watchdog never resolves,
      # so a "resolved" notification could only ever mean the pipeline died.
      #
      # MEASURED 2026-08-07: the email leg has never delivered. 180 of 182 email
      # notifications FAILED and AlertmanagerFailedToSendAlerts{integration="email"}
      # is firing right now — into Discord, the channel it was supposed to back
      # up. Both legs of this receiver are therefore effectively one leg, inside
      # one cluster. The real fix is the healthchecks.io leg in the escalation
      # block below.
      - name: "deadmansswitch"
        webhook_configs:
          - url: "http://alertmanager-discord.monitoring.svc.cluster.local:9094"
            send_resolved: false
        email_configs:
          - to: "${ADMIN_EMAIL}"
            send_resolved: false

      # The console's alert inbox. Authenticated by a shared bearer token read
      # from the mounted Secret BY PATH — `${...}` is not substituted in this
      # file (it is a Helm `$values` file and bypasses the argocd CMP, the trap
      # that shipped the literal `changeme` to the live SMTP config), so a token
      # written here would be both wrong and in git. It is minted by the console
      # into OpenBao and delivered by manifests/alerts-inbound-externalsecret.yaml.
      - name: "infraweaver-console"
        webhook_configs:
          - url: "http://infraweaver-console.infraweaver-console.svc.cluster.local:3000/api/alerts/inbound"
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/alerts-inbound-token/token

      # ── HISTORICAL NOTE — the block below is now LIVE, kept for its reasoning
      #
      # Gives the console's alert inbox (`/alerts`) a COPY of every alert, so
      # cluster alerts and console-native ones land in one place. It is additive:
      # the route below carries `continue: true`, so Discord delivery is
      # unchanged and this cannot become a new single point of failure.
      #
      # THE TOKEN IS NEVER IN THIS FILE. `${...}` is not substituted here (this
      # is a Helm `$values` file and bypasses the argocd CMP — the same trap that
      # shipped the literal `changeme` to the live SMTP config above), so the
      # token is read from a mounted Secret BY PATH. It lives only in OpenBao at
      # `secret/platform/alerts` → `inbound-token`, delivered by
      # manifests/alerts-inbound-externalsecret.yaml.
      #
      # ENABLE ORDER — the order is not optional:
      #   1. bao kv put secret/platform/alerts inbound-token="$(openssl rand -hex 32)"
      #   2. Confirm BOTH ExternalSecrets are SecretSynced:
      #        kubectl get externalsecret alerts-inbound-token -n monitoring
      #        kubectl get externalsecret alerts-inbound-token -n infraweaver-console
      #      and that the console Deployment carries ALERTS_INBOUND_TOKEN from the
      #      infraweaver-console one. Until it does the receiver 503s every POST
      #      (fail-closed by design) and AlertmanagerFailedToSendAlerts will fire.
      #   3. Uncomment all three blocks below.
      # Uncommenting `alertmanagerSpec.secrets` before step 1 leaves the
      # Alertmanager pod in ContainerCreating FOREVER — no alerting at all, a
      # worse outage than the leg it adds. Same hazard, same answer, as the SMTP
      # secret documented above.
      #
      # (a) here in `receivers:` —
      #   - name: "infraweaver-console"
      #     webhook_configs:
      #       - url: "http://infraweaver-console.infraweaver-console.svc.cluster.local:3000/api/alerts/inbound"
      #         send_resolved: true
      #         http_config:
      #           authorization:
      #             type: Bearer
      #             credentials_file: /etc/alertmanager/secrets/alerts-inbound-token/token
      #
      # (b) in `route.routes:` above, as the FIRST entry so it sees everything —
      #   - receiver: "infraweaver-console"
      #     continue: true          # <- keeps Discord delivery untouched
      #     group_wait: 10s         # the inbox is a screen, not a page; be prompt
      #
      # (c) in `alertmanagerSpec:` —
      #   secrets:
      #     - alerts-inbound-token

    # ══ ESCALATION TRANSPORT (GAP-M4 Phase C) — STAGED, NOT YET ACTIVE ═══════
    #
    # THE PROBLEM, measured not assumed (2026-08-07):
    #   - Every route above terminates at ONE Discord webhook, inside this
    #     cluster. The `severity=critical` fan-out to two transports is
    #     Discord-only in practice because email is dead (180/182 sends failed).
    #   - Gatus alerts to the same Discord webhook. It is a second watcher, not
    #     a second failure domain.
    #   - The Watchdog dead-man's switch also terminates in-cluster, so cluster
    #     death, Prometheus death and webhook death are indistinguishable from
    #     "all quiet".
    #
    # WHY url_file AND NOT A PLAIN url: `${...}` is NOT substituted in this file
    # (the platform-monitoring ApplicationSet consumes it as a Helm `$values`
    # file, bypassing the CMP — that is exactly why ${ADMIN_EMAIL} is a literal
    # string in the live Alertmanager secret), and this repo is mirrored to a
    # public remote, so a real ntfy topic or healthchecks UUID must never be
    # written here. `url_file` reads the URL from a mounted Secret at send time,
    # which dodges both problems with no new machinery.
    #
    # ── TWO OPERATOR STEPS, IN THIS ORDER ────────────────────────────────────
    # STEP 1 (already merged, safe): the ExternalSecret
    #   `alertmanager-escalation-urls` in manifests/externalsecret.yaml. Seed
    #   OpenBao — the exact `bao kv put` command and what each URL must be are
    #   documented in that file — then CONFIRM the Kubernetes Secret exists:
    #     kubectl -n monitoring get secret alertmanager-escalation-urls
    #
    # STEP 2 (this block + the `secrets:` line in alertmanagerSpec above): only
    #   after STEP 1's Secret is confirmed present. Uncomment
    #   `alertmanagerSpec.secrets`, uncomment the `critical-push` receiver and
    #   the two route/receiver additions below, and add the healthchecks leg to
    #   `deadmansswitch`. Doing STEP 2 first parks Alertmanager in
    #   ContainerCreating — no alerting at all.
    #
    # ── WHY THIS IS STAGED RATHER THAN SHIPPED LIVE ─────────────────────────
    # Shipping the receivers now, before the Secret is mounted, would make
    # url_file point at a nonexistent path. Alertmanager would load the config
    # fine and fail at send time, which sounds like the desired loud failure —
    # but `alertmanager_notifications_failed_total` is labelled by INTEGRATION,
    # not by receiver. A permanently-failing webhook would poison the one signal
    # that can currently tell us the Discord webhook broke
    # (integration="webhook" is at 0 failures today). Trading a working alarm
    # for a louder TODO is the wrong trade.
    #
    # ── HOW THE GAP PAGES INSTEAD OF ROTTING ────────────────────────────────
    # alerts/alert-pipeline-selfcheck.yaml carries two rules that fire until
    # both steps are complete: AlertEscalationSecretMissing (step 1) and
    # AlertEscalationReceiverNotWired (step 2). Neither can be satisfied by
    # writing a comment.
    #
    # ── THE EXACT BLOCK TO ENABLE IN STEP 2 ─────────────────────────────────
    # In `receivers:` above, add:
    #
    #   - name: "critical-push"
    #     webhook_configs:
    #       - url_file: /etc/alertmanager/secrets/alertmanager-escalation-urls/ntfy-url
    #         send_resolved: true
    #
    # On the existing `deadmansswitch` receiver, add a SECOND webhook entry —
    # this is the external termination the LIMITATION note above reserved a slot
    # for:
    #
    #       - url_file: /etc/alertmanager/secrets/alertmanager-escalation-urls/healthchecks-url
    #         send_resolved: false
    #
    # In `route.routes:` above, change the LAST critical leg
    # (`receiver: "email-admin"`) to `continue: true` and append a third leg
    # after it:
    #
    #   - matchers: ['severity = "critical"']
    #     receiver: "critical-push"
    #     repeat_interval: 1h
    #     continue: false
    #
    # ── BEFORE MERGING STEP 2: VERIFY EGRESS, DO NOT ASSUME IT ───────────────
    # The Alertmanager pod must reach ntfy.sh:443 and hc-ping.com:443. The
    # monitoring NetworkPolicies in manifests/networkpolicy.yaml are
    # ingress-only, but the cluster-wide airgap-baseline policy — the one that
    # silently blocked Longhorn from reaching the NAS for 54 days — lives
    # elsewhere. Check it, then test from the pod:
    #     kubectl get ccnp,cnp -A | grep -i airgap
    #     kubectl -n monitoring exec sts/alertmanager-kube-prometheus-stack-alertmanager \
    #       -c alertmanager -- wget -qO- --timeout=5 https://hc-ping.com/ >/dev/null && echo reachable
    # If it is enforced, add an allowlist entry in
    # kubernetes/core/network-policies/manifests/allowlists.yaml (follow the
    # gatus/console entries there).
    #
    # ── WHAT THIS DOES NOT FIX ──────────────────────────────────────────────
    # Email stays dead. The SMTP *password* could move to
    # `smtp_auth_password_file` via the same secret-mount trick, but the
    # recipient (`to:`) has NO `_file` variant in Alertmanager — it stays a
    # literal `${ADMIN_EMAIL}` until the values pipeline substitutes. Stated
    # plainly rather than pretended away. Once ntfy is live, email is redundant
    # as the second transport anyway.
    #
    # ── ROLLBACK ORDER (the reverse, and it matters) ─────────────────────────
    # Remove the receiver/route legs FIRST, let Alertmanager reload, and only
    # then remove the `secrets:` mount. The other order reloads Alertmanager
    # with a dangling url_file.
    inhibit_rules:
      - source_matchers: ['severity = "critical"']
        target_matchers: ['severity = "warning"']
        equal: ["alertname", "namespace"]

# ── Node Exporter ─────────────────────────────────────────────────────────────
nodeExporter:
  enabled: true
  priorityClassName: platform-standard

# ── kube-state-metrics ───────────────────────────────────────────────────────
kubeStateMetrics:
  enabled: true
  priorityClassName: platform-standard

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ── Talos-incompatible ServiceMonitors ────────────────────────────────────────
# Talos binds these to 127.0.0.1 only — disable monitors to prevent false alerts
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
