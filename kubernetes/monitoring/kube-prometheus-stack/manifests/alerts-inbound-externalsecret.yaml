---
# ExternalSecret — the shared bearer token Alertmanager uses to POST alerts into
# the InfraWeaver console's inbound receiver (`POST /api/alertmanager/inbound`).
#
# THE TOKEN IS NEVER IN GIT. It lives only in OpenBao at
# `secret/platform/alerts`, property `inbound-token`, and reaches both pods
# through these two ExternalSecrets. values.yaml cannot carry it in any form:
# `${...}` is NOT substituted there (that file is consumed as a Helm `$values`
# file, which bypasses the argocd CMP — the same trap that shipped the literal
# string `changeme` to the live SMTP config, see the notes in values.yaml).
#
# TWO ExternalSecrets because the token has two ends:
#   - monitoring          → Alertmanager reads it via `authorization.credentials_file`
#   - infraweaver-console → the console reads it as `ALERTS_INBOUND_TOKEN`
# Both must resolve to the SAME OpenBao key or the receiver rejects every POST.
#
# ORDER OF OPERATIONS — this file is deliberately safe to merge FIRST:
#   1. Put the token in OpenBao:
#        bao kv put secret/platform/alerts inbound-token="$(openssl rand -hex 32)"
#   2. Merge this file; confirm BOTH secrets exist and are SecretSynced.
#   3. Only THEN uncomment the console receiver, its route and
#      `alertmanagerSpec.secrets` in values.yaml.
# Doing 3 before 1 mounts a Secret that does not exist, which leaves the
# Alertmanager pod in ContainerCreating forever — i.e. NO ALERTING AT ALL, a far
# worse outage than the missing inbound leg it adds. This is the same hazard
# already documented twice in values.yaml for the SMTP secret, and the same
# ordering answer.
#
# Nothing mounts either Secret until step 3, so merging this file cannot wedge a
# pod even if the OpenBao key is still absent — the ExternalSecret simply stays
# unsynced and says so.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alerts-inbound-token
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: alerts-inbound-token
    creationPolicy: Owner
    # Retain, matching every other ExternalSecret here. NOTE the known sharp
    # edge: with Retain, ONE missing key fails the WHOLE secret, so if this ever
    # gains a second property, both must exist in OpenBao before it syncs.
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: secret/platform/alerts
        property: inbound-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# The console end of the same token. `ALERTS_INBOUND_TOKEN` is the env var the
# receiver compares against, in constant time; with it unset the endpoint
# fail-closed 503s rather than accepting anonymous writes into the alert store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alerts-inbound-token
  namespace: infraweaver-console
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: alerts-inbound-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ALERTS_INBOUND_TOKEN
      remoteRef:
        key: secret/platform/alerts
        property: inbound-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
