---
# ExternalSecret — pulls Grafana admin credentials from OpenBao for monitoring namespace.
# The kube-prometheus-stack Helm chart requires grafana-admin-secret in its own namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: grafana-admin-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: admin-user
      remoteRef:
        key: secret/platform/grafana
        property: admin-user
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: admin-password
      remoteRef:
        key: secret/platform/grafana
        property: admin-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# ExternalSecret — the two EXTERNAL alert-escalation endpoints (GAP-M4 Phase C).
#
# WHY THIS EXISTS AS A SECRET AND NOT AS VALUES: every alerting path in this
# platform terminates at one Discord webhook inside this cluster. The `email`
# leg that was supposed to be the independent second transport is dead —
# measured 2026-08-07: 180 of 182 email notifications have FAILED, and
# AlertmanagerFailedToSendAlerts{integration="email"} is firing right now (into
# Discord). Root cause is in values.yaml: `${...}` is NOT substituted there
# because the platform-monitoring ApplicationSet consumes that file as a Helm
# `$values` file, which bypasses the argocd CMP — so the literal strings
# `${ADMIN_EMAIL}` and `changeme` shipped to the live Alertmanager secret.
#
# Alertmanager 0.28 supports `webhook_configs.url_file`, which sidesteps BOTH
# problems at once: the URL is read from a mounted file at send time, so it
# never passes through the values pipeline (no CMP substitution needed) and
# never appears in this repo (which is mirrored to a public remote by
# scripts/sync-to-public.sh). The secret IS the URL in both cases:
#
#   ntfy-url          https://ntfy.sh/<a long random topic>   — the topic name is
#                     the only access control ntfy.sh has, so treat it as a
#                     password. Delivers phone push via the ntfy app.
#   healthchecks-url  https://hc-ping.com/<uuid>              — a healthchecks.io
#                     check configured with period 12h / grace 6h to match the
#                     Watchdog route's repeat_interval. This is the EXTERNAL
#                     termination of the dead-man's switch: when the cluster,
#                     Prometheus, Alertmanager or the Discord bridge dies, the
#                     pings stop and healthchecks.io alarms. No in-cluster
#                     construct can do that, which is why the Watchdog leg has
#                     been a heartbeat an operator had to notice the ABSENCE of.
#
# ── OPERATOR STEP — REQUIRED, NOTHING WORKS UNTIL THIS IS DONE ───────────────
# There are no real URLs anywhere in this repo and there must never be. Create
# both endpoints, then seed them (from a shell with OpenBao access):
#
#   bao kv put secret/platform/monitoring/alerting \
#       ntfy-url="https://ntfy.sh/<your-random-topic>" \
#       healthchecks-url="https://hc-ping.com/<your-uuid>"
#
# Then confirm the Kubernetes Secret actually materialised BEFORE enabling the
# receivers in values.yaml — see the "Escalation transport" block there for why
# the order is not optional:
#
#   kubectl -n monitoring get externalsecret alertmanager-escalation-urls
#   kubectl -n monitoring get secret alertmanager-escalation-urls
#
# ── HOW THIS FAILS LOUDLY IF THE OPERATOR STEP IS SKIPPED ────────────────────
# 1. This ExternalSecret cannot sync, so ExternalSecretNotSynced (platform-alerts,
#    15m) fires.
# 2. AlertEscalationSecretMissing (alerts/alert-pipeline-selfcheck.yaml) fires on
#    absent(kube_secret_info{...,secret="alertmanager-escalation-urls"}) and keeps
#    firing until the Secret exists.
# 3. AlertEscalationReceiverNotWired fires until the values.yaml receivers are
#    enabled.
# Nothing here degrades quietly into "the second transport just doesn't run".
#
# deletionPolicy is Delete, NOT Retain, deliberately: a Retain ExternalSecret
# aborts the WHOLE secret if any one property is missing, and this secret is
# mounted into the Alertmanager pod — a half-seeded OpenBao path would then leave
# Alertmanager in ContainerCreating, i.e. no alerting at all, which is a far
# worse outcome than a missing escalation leg.
# SPLIT INTO TWO SINGLE-KEY SECRETS, 2026-08-09. It was one two-key secret, and
# the paragraph above explains why that is dangerous — but it also made the two
# legs share a fate they do not share in reality. The push endpoint (ntfy) needs
# nothing but a random topic, which the platform can mint for itself; the
# dead-man endpoint needs an account on an EXTERNAL service, which it cannot.
# Coupling them meant the half that was ready could not ship until the half that
# needs a human was done, and neither leg existed months later.
#
# Split, each leg goes live the moment its own value is seeded, and each is
# guarded by its own alert so a cleared alert means that specific leg works.
# Both stay single-key, which is the property that keeps a half-seeded path from
# wedging Alertmanager.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-ntfy-url
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: alertmanager-ntfy-url
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    # Mounted and read with `url_file`, so the topic — which IS the credential —
    # never appears in values.yaml or in any rendered config in git.
    - secretKey: url
      remoteRef:
        key: secret/platform/monitoring/alerting
        property: ntfy-url
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# The dead-man leg. STILL UNSEEDED and expected to stay unsynced until an
# operator creates the external check: it must terminate OUTSIDE this cluster,
# so no in-cluster construct and no self-minted value can stand in for it.
#   bao kv patch secret/platform/monitoring/alerting \
#       healthchecks-url="https://hc-ping.com/<your-uuid>"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-healthchecks-url
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: alertmanager-healthchecks-url
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: url
      remoteRef:
        key: secret/platform/monitoring/alerting
        property: healthchecks-url
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
