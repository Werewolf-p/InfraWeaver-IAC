---
# ExternalSecret — pulls Grafana admin credentials from OpenBao for monitoring namespace.
# The kube-prometheus-stack Helm chart requires grafana-admin-secret in its own namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: grafana-admin-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: admin-user
      remoteRef:
        key: secret/platform/grafana
        property: admin-user
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: admin-password
      remoteRef:
        key: secret/platform/grafana
        property: admin-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# ── EXTERNAL ESCALATION ENDPOINTS — WITHDRAWN 2026-08-09 ─────────────────────
#
# This file used to declare two ExternalSecrets carrying an ntfy.sh topic and a
# healthchecks.io ping URL. Both are gone, and the reason is a REQUIREMENT, not
# an oversight: alert content must not leave this network. An alert body names
# namespaces, nodes and workloads, and both of those endpoints are public
# third-party services, so every critical would have described the estate to
# someone else's server.
#
# The need they served has not gone away, and neither has been re-solved yet:
#
#   · CRITICAL PUSH — replaced by an in-network notifier. See the alert manager
#     plan in the console repo (docs/design/ALERT-MANAGER-PLAN.md); delivery is
#     its Phase 2 and the console owns it.
#
#   · THE DEAD-MAN SWITCH — the hard one, and the constraint is physics rather
#     than preference. A heartbeat that stops when the cluster dies cannot be
#     judged BY the cluster. It does not have to leave the NETWORK, though: it
#     only has to leave the CLUSTER'S FAILURE DOMAIN. The Proxmox host or the
#     ops VM both satisfy that and stay on the LAN. Until such a watcher exists,
#     AlertEscalationSecretMissing stays firing, which is the honest state — the
#     absence of a heartbeat is currently something an operator must NOTICE.
#
# Do not re-add a public endpoint here to clear those alerts. Clearing them that
# way trades a visible gap for an invisible data leak.

