---
# ExternalSecret — the Office365 password Alertmanager authenticates with.
#
# WHY THIS EXISTS. values.yaml carried `smtp_auth_password: "changeme"`, a
# literal placeholder, because `${...}` is NOT substituted in that file (it is
# consumed as a Helm $values file and bypasses the argocd CMP). Measured
# 2026-08-07: 180 of 182 email notifications had failed. Measured again
# 2026-08-09: still failing with `535 5.7.3 Authentication unsuccessful`.
#
# THE CREDENTIAL ALREADY EXISTS AND ALREADY WORKS. The console's own mailer
# sends user invitations through the same Office365 mailbox, authenticating with
# `smtp-username`/`smtp-password` from `secret/platform/authentik` — see
# catalog/infraweaver-console/base/externalsecret.yaml, which pulls the same two
# properties. This does not introduce a new secret; it points a second consumer
# at the one already proven in production.
#
# SINGLE KEY ON PURPOSE. With deletionPolicy Retain, ONE missing property fails
# the WHOLE secret — which is why alerts-inbound-token is single-key too, and
# why alertmanager-escalation-urls is currently unsynced (it wants two
# properties and only one is seeded). Only the password can be file-injected:
# Alertmanager 0.28.1 ships `smtp_auth_password_file` but no username
# equivalent, verified against the shipped binary, so the mailbox itself stays a
# literal in values.yaml.
#
# ORDER: merge this and confirm the Secret exists BEFORE adding it to
# alertmanagerSpec.secrets. Mounting a Secret that does not exist leaves the
# Alertmanager pod in ContainerCreating forever — no alerting at all, which is
# worse than the broken email leg it repairs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-smtp-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: alertmanager-smtp-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Mounted at /etc/alertmanager/secrets/alertmanager-smtp-secret/password and
    # named `password` so the path in values.yaml reads plainly.
    - secretKey: password
      remoteRef:
        key: secret/platform/authentik
        property: smtp-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
