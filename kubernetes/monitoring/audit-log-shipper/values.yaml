# ─────────────────────────────────────────────────────────────────────────────
# audit-log-shipper — promtail DaemonSet that ships the kube-apiserver audit log
# into Loki so "who did what" is queryable and retained off the node.
# Closes GAP-H5 (SOC 2 CC7.2, ISO 27001 A.8.15).
#
# WHY THIS EXISTS
#   The apiserver writes `--audit-log-path=/var/log/audit/kube/kube-apiserver.log`
#   on every control-plane node and nothing ever collected it. Worse than the
#   "30 days" the flags suggest: `--audit-log-maxsize=100 --audit-log-maxbackup=10`
#   caps the on-node history at 11 files ≈ 1.1 GB, and at the measured write rate
#   that is only a few HOURS, not 30 days (measured 2026-08-07: cp1 ≈ 0.69 GB/day,
#   cp2 ≈ 3.08 GB/day, cp3 ≈ 1.29 GB/day → cp2 keeps ≈ 7.6 h of audit history).
#
# VERIFIED ON-DISK FACTS (talosctl, 2026-08-07, all three nodes)
#   dir   /var/log/audit/kube          drwx------  uid 65534 gid 65534
#   file  kube-apiserver.log           -rw-------  uid 65534 gid 65534   (active)
#   rot.  kube-apiserver-<ts>.log      -rw-------  uid 65534 gid 65534   (10 kept)
#   The apiserver static pod mounts the same hostPath read-write.
#   SELinux on Talos v1.13.0 is PERMISSIVE (/sys/fs/selinux/enforce == 0), so the
#   kube_log_t label on those files does not block a container read today.
#   Because the directory is 0700 and the files 0600, the reader must be uid 0.
# ─────────────────────────────────────────────────────────────────────────────

fullnameOverride: audit-log-shipper

image:
  registry: docker.io
  repository: grafana/promtail
  # Pinned to the promtail already running for pod logs (loki-promtail), so both
  # shippers behave identically. Bump both together.
  tag: 3.5.1

priorityClassName: platform-standard

# ── Least privilege ──────────────────────────────────────────────────────────
# This promtail uses NO Kubernetes service discovery — targets are static files.
# So it needs no ClusterRole and no projected ServiceAccount token. Dropping the
# token also keeps this DaemonSet out of the GAP-H3 automount population.
rbac:
  create: false
serviceAccount:
  create: true
  automountServiceAccountToken: false
automountServiceAccountToken: false

# Run as 65534, NOT 0. Measured 2026-08-07: with runAsUser 0 the container was
# root in name only and could not read the audit directory at all —
#
#   $ id                            -> uid=0(root) gid=0(root)
#   $ ls -ld /var/log/audit/kube    -> drwx------. 2 nobody nogroup
#   $ ls /var/log/audit/kube/       -> Permission denied
#
# because `capabilities: drop: [ALL]` below removes CAP_DAC_OVERRIDE, which is
# the single capability that lets root ignore file modes. Promtail's /ready
# answered 500 for 13 minutes (no targets discovered) and the pods sat 0/1.
#
# The apiserver writes that trail as uid 65534 and owns the directory 0700, so
# matching its UID grants full access through ordinary ownership and needs no
# capability at all. Adding CAP_DAC_OVERRIDE back would also have worked and is
# strictly more privilege for the same result.
podSecurityContext:
  runAsUser: 65534
  runAsGroup: 65534
containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# All three nodes are converged control planes; the chart defaults already
# tolerate the control-plane taints, restated here so the intent is explicit.
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule

# Sized against the measured audit write rate (peak ≈ 128 MB/h on cp2). The CPU
# limit carries JSON parsing of that stream plus the drop pipeline. Memory is
# small because promtail streams; the limit protects cp3 (6.5 GiB allocatable,
# limits already 209% overcommitted).
resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 500m
    memory: 256Mi

# ── Volumes ──────────────────────────────────────────────────────────────────
# defaultVolumes/defaultVolumeMounts are REPLACED, not extended. The chart
# default mounts /var/log/pods and /var/lib/docker/containers — that is
# loki-promtail's job and mounting it here would double Loki ingest.
#
# The positions file must NOT live at /run/promtail/positions.yaml: the existing
# loki-promtail DaemonSet already owns that hostPath, and two writers would
# corrupt each other's offsets.
defaultVolumes: []
defaultVolumeMounts: []

extraVolumes:
  # emptyDir, not hostPath. A hostPath created by DirectoryOrCreate is owned by
  # root with mode 0755, and this pod now runs as uid 65534 (it has to, to read
  # the apiserver's 0700 audit directory — see podSecurityContext above), so it
  # could not write its positions file there.
  #
  # The cost is explicit: positions do NOT survive a pod restart, so promtail
  # re-reads the current audit file from the start and Loki sees duplicate lines
  # for that window. That is the safe direction for an audit trail — duplicates
  # are recoverable, gaps are not — and the file rotates every few hours on this
  # cluster, so the window is bounded. Restoring durable positions means finding
  # a host path writable by 65534, which Talos does not readily offer.
  - name: positions
    emptyDir: {}
  - name: kube-audit
    hostPath:
      path: /var/log/audit/kube
      # type is deliberately EMPTY — do not "tighten" this to Directory.
      #
      # Measured 2026-08-07: with `type: Directory` the kubelet refused the
      # mount on all three nodes for 27 minutes —
      #   MountVolume.SetUp failed for volume "kube-audit":
      #   hostPath type check failed: /var/log/audit/kube is not a directory
      # — and the DaemonSet never left ContainerCreating.
      #
      # The path IS readable (talosctl lists both the live and rotated logs),
      # but on Talos the kubelet's type check does not agree. The authority
      # here is the kube-apiserver static pod, which mounts this exact path
      # successfully and writes to it; its volume is
      #   hostPath: {path: /var/log/audit/kube, type: ""}
      # Matching it is what makes the mount work. An empty type skips the
      # check rather than asserting something that is not true on this OS.
      type: ""

extraVolumeMounts:
  - name: positions
    mountPath: /run/promtail-audit
  - name: kube-audit
    mountPath: /var/log/audit/kube
    readOnly: true

# `${HOSTNAME}` in the config below is expanded by promtail, not by Helm. The
# chart already injects HOSTNAME from spec.nodeName (templates/_pod.tpl).
extraArgs:
  - -config.expand-env=true

# Prometheus may scrape this: monitoring/allow-intra-namespace permits any pod in
# the namespace to reach any other, and the stack selects ServiceMonitors in all
# namespaces (serviceMonitorSelectorNilUsesHelmValues: false). The scrape backs
# the KubeAuditLogIngestStalled alert.
serviceMonitor:
  enabled: true

config:
  logLevel: info
  logFormat: logfmt
  serverPort: 3101

  clients:
    - url: http://loki:3100/loki/api/v1/push

  positions:
    filename: /run/promtail-audit/positions.yaml

  snippets:
    # NOTE: the chart runs `tpl` over these snippets, so Go-template syntax
    # ({{ ... }}) here would be evaluated by HELM, not promtail. The pipeline
    # below therefore uses only `drop`, `json`, `labels`, `match` and
    # `labelallow` — no promtail `template` stages.
    #
    # This REPLACES the chart's default `kubernetes-pods` job on purpose.
    scrapeConfigs: |
      - job_name: kube-audit
        static_configs:
          - targets:
              - localhost
            labels:
              job: kube-audit
              node: ${HOSTNAME}
              # Only the ACTIVE file. Globbing the 10 rotated files as well would
              # backfill ~1 GB per node into a single stream out of order, which
              # Loki rejects past max_chunk_age/2; and the on-node history is only
              # a few hours anyway (see header), so there is nothing to gain.
              # Rotation is rename+create (klog/lumberjack), which promtail follows.
              __path__: /var/log/audit/kube/kube-apiserver.log
        pipeline_stages:
          # Stamp entries with the event time, not the ingest time.
          - json:
              expressions:
                ts: requestReceivedTimestamp
          - timestamp:
              source: ts
              format: RFC3339Nano
              action_on_failure: fudge

          # ── Filter 1: keep only the final stage ──────────────────────────
          # RequestReceived and ResponseStarted duplicate the request with no
          # outcome. Measured on 40 MB of live cp2 audit log (2026-08-07):
          # 46.9% of all bytes, zero compliance value.
          - drop:
              expression: '"stage":"(RequestReceived|ResponseStarted)"'
              drop_counter_reason: audit_non_final_stage

          # ── Filter 2: drop low-value control-plane reads ─────────────────
          # Everything below is DELIBERATELY retained:
          #   · every mutation (create/update/patch/delete/deletecollection)
          #   · every read of secrets / service accounts / RBAC / CSRs / tokenreviews
          #   · every exec, attach, port-forward and SA token request
          #   · every 401/403 (authn/authz denial)
          #   · everything a non-`system:` (i.e. human or external) identity does
          # What is dropped: get/list/watch issued by a `system:` identity against
          # a non-sensitive resource with a non-denied response — i.e. controller
          # reconcile traffic. Measured share: 43.5% of all bytes, and 52% of the
          # total comes from one client alone (argocd-notifications-controller
          # re-reading appprojects). Combined with filter 1 this ships 8.40% of
          # the raw bytes — ~425 MB/day fleet-wide instead of ~5.06 GB/day —
          # measured by running this exact rendered config through promtail 3.5.1
          # in -dry-run against 8 MB of live cp2 audit log. In that run every
          # surviving read was on a sensitive resource (secrets, RBAC, webhooks,
          # serviceaccounts), a pods/exec upgrade, or a 403 denial.
          # Matchers are anchored (Prometheus semantics), and an absent label is
          # the empty string, so anything unparsed fails the `user` matcher and is
          # KEPT — the filter fails open, never silently loses evidence.
          - json:
              expressions:
                verb: verb
                resource: objectRef.resource
                subresource: objectRef.subresource
                user: user.username
                code: responseStatus.code
          - labels:
              verb:
              resource:
              subresource:
              user:
              code:
          - match:
              selector: '{verb=~"get|list|watch", user=~"system:.*", resource!~"secrets|serviceaccounts|roles|rolebindings|clusterroles|clusterrolebindings|certificatesigningrequests|tokenreviews|validatingwebhookconfigurations|mutatingwebhookconfigurations", subresource!~"exec|attach|portforward|token|proxy", code!~"401|403"}'
              action: drop
              drop_counter_reason: audit_low_value_read

          # ── Stream labels ────────────────────────────────────────────────
          # `user` and `resource` were needed to evaluate the filter but must NOT
          # become stream labels — `user` alone would be unbounded cardinality.
          # The full JSON line is preserved, so every dropped label is still
          # queryable with `| json` in LogQL.
          - labelallow:
              - job
              - node
              - verb
              - filename

    extraScrapeConfigs: ""
