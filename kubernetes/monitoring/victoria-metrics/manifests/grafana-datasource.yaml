# gitops-coverage: dormant - the alternative monitoring stack. Parked on purpose.
#
# This platform runs kube-prometheus-stack. VictoriaMetrics is the documented
# swap for it (~320Mi lighter) and ships complete but switched off:
# ../application.yaml.disabled holds the chart definition and the swap procedure.
# This datasource would point Grafana at a VMSingle that does not exist.
# To turn it on: follow ../application.yaml.disabled - rename it to
# application.yaml, disable kube-prometheus-stack's, and add a bootstrap
# Application for this manifests/ directory in the same change.
#
# Grafana datasource ConfigMap for VictoriaMetrics
# This is picked up by the Grafana sidecar (grafana.sidecar.datasources.enabled=true)
# Replaces the kube-prometheus-stack datasource (prometheus:9090) with
# VictoriaMetrics single-node (vmsingle:8429) which is PromQL-compatible.
#
# All existing Grafana dashboards referencing datasource "Prometheus" will
# continue to work because we use the same datasource name "Prometheus".
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-victoriametrics
  namespace: apps-grafana
  labels:
    grafana_datasource: "1"   # Grafana sidecar watches for this label
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc:8429
        access: proxy
        isDefault: true
        jsonData:
          timeInterval: 60s
          httpMethod: POST
