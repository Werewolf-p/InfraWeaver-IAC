---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: memory-pressure-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    # NOTE: the node-level >85% memory alert that used to live here was removed as
    # a duplicate. It had a byte-identical expression to `NodeHighMemory` in
    # alerts/manifests/prometheus-rules.yaml, and both carried severity: warning
    # in the same Prometheus with the same `release` selector — so one condition
    # produced two Discord notifications, and Alertmanager could not inhibit
    # either because inhibition keys on `equal: [alertname, namespace]` and the
    # alertnames differed.
    #
    # `NodeHighMemory` was kept rather than this one for two reasons:
    #   · it pairs with `NodeCriticalMemory` (>92%, critical) as a deliberate
    #     85/92 warning→critical ladder in the same group, and
    #   · "Pressure" already means something specific in this repo's alert
    #     vocabulary — `NodeDiskPressure` reads the real kubelet condition via
    #     kube_node_status_condition{condition="DiskPressure"}. Naming a
    #     percentage-of-usage alert `NodeMemoryPressure` invited an on-call to
    #     read it as the kubelet MemoryPressure condition, which it was not.
    # This rule's better operator description was carried over to NodeHighMemory.
    - name: memory.pressure
      rules:
        - alert: PodOOMKillRisk
          expr: |
            (
              container_memory_working_set_bytes{container!="",container!="POD",image!=""}
              /
              on(namespace, pod, container)
              max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory", unit="byte"} > 0)
            ) * 100 > 90
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is nearing its memory limit"
            description: >-
              Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }}
              has exceeded 90% of its configured memory limit for more than 3 minutes.
