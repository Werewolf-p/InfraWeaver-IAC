---
# Platform alerting rules for InfraWeaver
# These complement the default kube-prometheus-stack rules with platform-specific alerts.
# Deployed via kubernetes/bootstrap/app-monitoring-alerts.yaml to the monitoring namespace.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack   # must match prometheusRule selector label
spec:
  groups:

    # ── Node health ─────────────────────────────────────────────────────────────
    - name: node.health
      rules:
        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} is NotReady"
            description: "Node {{ $labels.node }} has been NotReady for more than 2 minutes."

        - alert: NodeHighCPU
          expr: (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) by (instance)) * 100 > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High CPU on {{ $labels.instance }}"
            description: "CPU usage > 85% for 10 minutes on {{ $labels.instance }}."

        - alert: NodeHighMemory
          expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.instance }} memory usage > 85%"
            description: >-
              Node {{ $labels.instance }} has sustained memory usage above 85% for 5 minutes.
              Check eviction thresholds, kubelet reservations, and the memory heatmap in InfraWeaver.
              Escalates to NodeCriticalMemory at 92%.

        - alert: NodeDiskPressure
          expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} has DiskPressure"
            description: "Node {{ $labels.node }} is reporting DiskPressure."

        - alert: NodeCriticalMemory
          expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 92
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Critical memory on {{ $labels.instance }}"
            description: "Memory usage > 92% for 3 minutes on {{ $labels.instance }}. Proxmox OOM kill risk is high."

    - name: node.oom
      rules:
        - alert: NodeOOMKillDetected
          expr: increase(node_vmstat_oom_kill[5m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "OOM kill detected on {{ $labels.instance }}"
            description: >-
              The kernel OOM killer fired on node {{ $labels.instance }}.
              Check kubelet reservations, eviction thresholds, and the heaviest pods on that node.

    # ── PVC / Storage ────────────────────────────────────────────────────────────
    - name: storage.alerts
      rules:
        - alert: PVCHighUsage
          expr: |
            (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} > 80% full"
            description: "PVC usage is {{ printf \"%.0f\" $value }}% on {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}."

        - alert: PVCCriticalUsage
          expr: |
            (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 95
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} > 95% full"
            description: "PVC is critically full ({{ printf \"%.0f\" $value }}%). Immediate action needed."

        - alert: LonghornVolumesDegraded
          expr: longhorn_volume_robustness{robustness="degraded"} > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} is degraded"
            description: "Volume {{ $labels.volume }} has been in degraded state for > 15m. A replica rebuild may be in progress or a replica is lost."

    # ── Pod / Workload health ────────────────────────────────────────────────────
    - name: pod.health
      rules:
        - alert: PodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash-looping"
            description: "Container {{ $labels.container }} has restarted {{ printf \"%.0f\" $value }} times in 15 minutes."

        - alert: PodNotRunning
          expr: |
            kube_pod_status_phase{phase=~"Failed|Unknown",namespace!~"kube-system"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is in {{ $labels.phase }}"
            description: "Pod has been in {{ $labels.phase }} state for more than 5 minutes."

        # PENDING is the phase PodNotRunning above does not match, and it is the
        # one a stuck pod actually sits in. A pod that cannot schedule, cannot
        # pull its image, or is waiting on a volume that will not detach never
        # reaches Failed or Unknown — it stays Pending indefinitely, and nothing
        # in this cluster said so. The concrete case: infraweaver-backup is
        # replicas 1 + strategy Recreate on an RWO longhorn-retain PVC, so losing
        # its node parks the replacement pod in Pending on Multi-Attach until the
        # old attachment is cleaned up. That is a total outage of the WordPress
        # backup datastore presenting as complete silence.
        #
        # 15m is derived, not chosen: kube-controller-manager waits
        # default-not-ready-toleration-seconds (300s) before evicting pods off a
        # NotReady node, and the Longhorn detach/reattach that follows takes
        # several minutes more — call it ~10m for a recovery that IS working.
        # 15m is past that and far short of the hourly sweeps. Scheduling a pod
        # normally takes seconds, so this is loose by an order of magnitude for
        # every other cause.
        #
        # No namespace exclusion, unlike PodNotRunning: the volume-attachment and
        # unschedulable cases this exists for are namespace-agnostic, and a pod
        # pending for a quarter of an hour is worth a look wherever it is.
        - alert: PodPendingSustained
          expr: |
            kube_pod_status_phase{phase="Pending"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been Pending for 15 minutes"
            description: >-
              Pod {{ $labels.pod }} has not started for 15 minutes, which is
              longer than any healthy schedule, image pull or volume reattach on
              this cluster. `kubectl -n {{ $labels.namespace }} describe pod
              {{ $labels.pod }}` names the cause in Events: FailedScheduling
              (no node fits, or a DoNotSchedule topology spread cannot be
              satisfied with a node down), Multi-Attach / FailedAttachVolume (an
              RWO volume still attached to a lost node), or ImagePullBackOff.

    # ── etcd health ──────────────────────────────────────────────────────────────
    - name: etcd.health
      rules:
        - alert: EtcdHighCommitDuration
          expr: |
            histogram_quantile(0.99, rate(etcd_disk_backend_commit_duration_seconds_bucket[5m])) > 0.25
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "etcd commit latency high on {{ $labels.instance }}"
            description: "etcd 99th percentile commit duration > 250ms for 5 minutes."

        - alert: EtcdMemberDown
          expr: up{job="kube-etcd"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "etcd member {{ $labels.instance }} is down"
            description: "etcd cluster member has been unreachable for more than 1 minute."

    # ── TLS / Cert expiry ─────────────────────────────────────────────────────────
    - name: tls.alerts
      rules:
        - alert: CertificateExpiringSoon
          expr: |
            certmanager_certificate_expiration_timestamp_seconds - time() < 7 * 24 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in < 7 days"
            description: "Certificate {{ $labels.name }} in namespace {{ $labels.namespace }} will expire soon."

        - alert: CertificateExpiringCritical
          expr: |
            certmanager_certificate_expiration_timestamp_seconds - time() < 2 * 24 * 3600
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in < 2 days"
            description: "URGENT: Certificate {{ $labels.name }} expires soon — check cert-manager."

    # ── Longhorn storage ─────────────────────────────────────────────────────────
    - name: longhorn.health
      rules:
        - alert: LonghornVolumeDegraded
          expr: longhorn_volume_robustness == 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} is degraded"
            description: "Longhorn volume has degraded robustness. Check replica health in Longhorn UI."

        - alert: LonghornVolumeFaulted
          expr: longhorn_volume_robustness == 3
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} is FAULTED"
            description: "Longhorn volume is faulted — data may be at risk. Check Longhorn UI immediately."

        - alert: LonghornNodeStoragePressure
          expr: |
            (longhorn_node_storage_used_bytes / longhorn_node_storage_capacity_bytes) * 100 > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn node storage > 80% on {{ $labels.node }}"
            description: "Longhorn storage usage is {{ printf \"%.0f\" $value }}% on node {{ $labels.node }}."

    # ── OpenBao / Vault ──────────────────────────────────────────────────────────
    - name: openbao.health
      rules:
        - alert: OpenBaoSealed
          expr: vault_core_unsealed == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "OpenBao is SEALED — secrets unavailable"
            description: >-
              OpenBao pod {{ $labels.pod }} is sealed. ExternalSecrets cannot sync
              and apps may fail to start. Run: kubectl exec -n openbao <pod> -- bao operator unseal

        - alert: OpenBaoUnavailable
          expr: up{job=~".*openbao.*"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "OpenBao scrape target is down"
            description: "OpenBao pod may have crashed. Check: kubectl get pods -n openbao"

    # ── ArgoCD application health ─────────────────────────────────────────────────
    - name: argocd.health
      rules:
        - alert: ArgoCDAppDegraded
          expr: argocd_app_info{health_status="Degraded"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{ $labels.name }} is Degraded"
            description: "ArgoCD application {{ $labels.name }} has been Degraded > 10 min. Check the ArgoCD UI."

        - alert: ArgoCDSyncFailed
          expr: argocd_app_info{sync_status="OutOfSync",operation_state_phase="Failed"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{ $labels.name }} sync failed"
            description: "ArgoCD application sync has failed. The self-healer will retry automatically."

    # ── ExternalSecrets ───────────────────────────────────────────────────────────
    - name: externalsecrets.health
      rules:
        - alert: ExternalSecretNotSynced
          expr: |
            externalsecret_status_condition{status="False",condition="Ready"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} not synced"
            description: "ExternalSecret has not synced for > 15 minutes. Check OpenBao connectivity."

    # ── Automation health — SUPERSEDED, removed 2026-08-07 ──────────────────────
    # The `automation.health` group (ClusterAutomationCronJobMissedSuccess,
    # LonghornBackupVerifierMissedSuccess, ClusterAutomationCronJobSuspended)
    # lived here. It was an ALLOWLIST of 6 CronJob names out of the 31 that exist
    # cluster-wide, and its verifier rule was structurally blind: it computed
    # `time() - kube_cronjob_status_last_successful_time`, a series that does not
    # exist for a CronJob with zero successes — which is exactly the state
    # longhorn-backup-verifier was in for 54 days while that alert sat green.
    #
    # Replaced by alerts/cronjob-health.yaml, which derives its threshold from
    # each CronJob's OWN schedule (2x the interval, clamped 1h..8d) and therefore
    # needs no allowlist. Coverage is equal or tighter for every name that was
    # here: the five automation jobs get CronJobMissedSuccess (2x300s..2x3600s →
    # clamped to 1h, vs the old fixed 2h) plus CronJobLastRunFailed,
    # CronJobNeverSucceeded and CronJobSuspended; longhorn-backup-verifier gets
    # the four CRITICAL Backup* rules (missed-success threshold 2x86400 = the old
    # 172800 exactly, and the never-succeeded case now actually fires).
    # argocd/node-label-enforcer, which this group never covered at all, is
    # covered too.
    #
    # Left as a comment rather than deleted silently: `monitoring-alerts` has
    # prune: false, so anyone reverting this needs to know the group is gone on
    # purpose and that the live object must be reconciled by hand.

    # ── Console automation health ────────────────────────────────────────────────
    #
    # 12 of the 13 CronJobs in the infraweaver-console namespace had NO failure
    # alerting. The 13th, `openbao-token-renew`, is already covered in full by
    # alerts/openbao-token.yaml (TTL, stalled, suspended, and unobservable), so
    # NOTHING here may select it — a second alert on the same condition reaches
    # the same Discord receiver twice and the inhibit rule cannot suppress it,
    # because inhibition keys on `equal: [alertname, namespace]` and the
    # alertnames differ.
    #
    # kube-state-metrics has been exporting kube_cronjob_status_last_successful_time
    # for the other 12 the whole time; the automation.health group above simply
    # never selected the namespace.
    #
    # Why this is a separate group rather than a wider selector on
    # ClusterAutomationCronJobMissedSuccess: that rule uses a single 2h threshold.
    # Three console CronJobs run DAILY (openbao-token-renew 02:41, rotation-sweep
    # 03:17, patch-sweep 04:31), so 2h after each successful run they would go
    # firing and stay firing for the remaining ~22 hours of every single day.
    # Widening that one selector would have produced three alerts that are always
    # on, which is worse than no alert — it trains the on-call to ignore the group.
    # Cadence therefore gets its own threshold.
    #
    # The frequent-job rule is a NEGATIVE match on the daily names, not an
    # allowlist. A CronJob added to this namespace tomorrow is covered by default;
    # forgetting to update this file makes a new DAILY job noisy, never silent.
    # That direction is deliberate — the failure being fixed here is a guard that
    # said nothing.
    #
    # Every missed-success rule below excludes SUSPENDED CronJobs. This is not
    # tidiness: `kube_cronjob_status_last_successful_time` freezes while a job is
    # suspended, so `time() - lst` grows without bound and the alert would fire
    # forever. Suspending is the documented operator action in
    # wordpress-patch-sweep-cronjob.yaml and wordpress-sandbox-sweep-cronjob.yaml,
    # so that is a routine state, not an incident.
    - name: console.automation.health
      rules:
        # Everything except the three daily sweeps: schedules run from */5 to
        # hourly, so 3h without a success is at minimum two consecutive misses.
        - alert: ConsoleAutomationCronJobMissedSuccess
          expr: |
            time() - kube_cronjob_status_last_successful_time{namespace="infraweaver-console",cronjob!~"openbao-token-renew|wordpress-connector-rotation-sweep|wordpress-patch-sweep|alerts-dispatch|wordpress-backup-sweep"} > 10800
              unless on(namespace, cronjob)
            kube_cronjob_spec_suspend{namespace="infraweaver-console"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Console CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has not succeeded recently"
            description: "Console automation CronJob {{ $labels.cronjob }} has not reported a successful run in over 3 hours. Its schedule is hourly or faster, so this is at least two consecutive missed runs."

        # alerts-dispatch runs `* * * * *`. Against the 3h threshold above that is
        # 180 CONSECUTIVE FAILED TICKS before a warning — a cadence and a
        # threshold three orders of magnitude apart, which is not a loose alert,
        # it is an absent one. And of every CronJob in this namespace it is the
        # worst one to be slow about: it is the ONLY thing that turns the
        # console's own firing alerts into notifications. While it is down the
        # product is a well-organised list of things nobody has been told about,
        # and nothing about that state looks wrong from the outside.
        #
        # 900s is derived from what the product promises, not from the schedule
        # doubled (2 minutes would flap on a single slow tick). The smallest
        # timer the notification policy exposes is group_interval = 5 minutes, so
        # 15 minutes is three whole delivery intervals and fifteen consecutive
        # missed ticks. `for: 5m` is short on purpose: the threshold already
        # encodes fifteen failures, so the `for` only has to cover a
        # kube-state-metrics scrape gap, not flapping. Total time to page ~20
        # minutes, against the 180 this job used to get.
        #
        # This rule reaching an operator does not depend on the job it watches:
        # it rides Prometheus → Alertmanager → Discord, which is a separate path
        # from the console's own dispatcher. A rule about the notifier that
        # needed the notifier would be worthless.
        - alert: ConsoleAlertDispatchMissedSuccess
          expr: |
            time() - kube_cronjob_status_last_successful_time{namespace="infraweaver-console",cronjob="alerts-dispatch"} > 900
              unless on(namespace, cronjob)
            kube_cronjob_spec_suspend{namespace="infraweaver-console"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Console alert dispatch has not succeeded in 15 minutes"
            description: "alerts-dispatch runs every minute and has not reported a success for over 15 minutes — fifteen consecutive missed ticks, three full group_intervals. Nothing is delivering the console's alerts: routes, silences, quiet hours, timers and escalation are all evaluated by this sweep. Inbound alerts keep accumulating in the console and no one is told. Check: kubectl -n infraweaver-console get jobs --sort-by=.metadata.creationTimestamp | tail, then that pod's logs."

        # The daily pair (openbao-token-renew is deliberately NOT here — see the
        # group comment). 28h = one full missed run plus 4h of margin, rather than
        # the 48h that would have let two consecutive days pass unreported.
        - alert: ConsoleAutomationDailyCronJobMissedSuccess
          expr: |
            time() - kube_cronjob_status_last_successful_time{namespace="infraweaver-console",cronjob=~"wordpress-connector-rotation-sweep|wordpress-patch-sweep"} > 100800
              unless on(namespace, cronjob)
            kube_cronjob_spec_suspend{namespace="infraweaver-console"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Console daily CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has missed a run"
            description: "Daily console CronJob {{ $labels.cronjob }} has not succeeded in over 28 hours, so it has missed at least one scheduled run. Rotation and patch sweeps failing silently means credentials and WordPress cores stop moving."

        # Scoped away from openbao-token-renew, which OpenBaoTokenRenewCronSuspended
        # in alerts/openbao-token.yaml already covers with a better runbook.
        # wordpress-backup-sweep excluded alongside openbao-token-renew: it moved
        # to the CRITICAL cronjob.backup.chain group in alerts/cronjob-health.yaml,
        # which owns its suspended, missed-success, never-succeeded and absent
        # cases. Two rules on one condition reach Discord twice and Alertmanager
        # cannot inhibit across differing alertnames.
        - alert: ConsoleAutomationCronJobSuspended
          expr: |
            kube_cronjob_spec_suspend{namespace="infraweaver-console",cronjob!~"openbao-token-renew|wordpress-backup-sweep"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Console CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} is suspended"
            description: "Console automation CronJob {{ $labels.cronjob }} is suspended and will not run until resumed."

        # The gap the time()-based rules structurally cannot see: a CronJob that
        # has NEVER succeeded exports no kube_cronjob_status_last_successful_time
        # series at all, so `time() - <absent>` yields no result and no alert. A
        # sweep that was misconfigured on the day it was created would therefore
        # stay invisible forever.
        #
        # The grace period is taken from kube_cronjob_created rather than from a
        # long `for:`. Prometheus only restores pending-alert state across a
        # restart when the gap is under --rules.alert.for-outage-tolerance (1h by
        # default, not overridden here), and this is a single-replica Prometheus
        # on a cluster with a documented OOM history — so a `for: 26h` would be
        # reset to zero by exactly the kind of event that precedes someone
        # checking their alerts. A data-driven window survives the restart.
        - alert: ConsoleAutomationCronJobNeverSucceeded
          expr: |
            kube_cronjob_spec_suspend{namespace="infraweaver-console",cronjob!="wordpress-backup-sweep"} == 0
              unless on(namespace, cronjob)
            kube_cronjob_status_last_successful_time{namespace="infraweaver-console"}
              and on(namespace, cronjob)
            (time() - kube_cronjob_created{namespace="infraweaver-console"} > 93600)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Console CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has NEVER succeeded"
            description: "CronJob {{ $labels.cronjob }} was created over 26 hours ago, is not suspended, and has no recorded successful run at all. The missed-success alerts cannot fire for it because the metric they subtract from does not exist yet. Check the job template, image tag, and RBAC."

        # THE GAP EVERY RULE ABOVE SHARES. All four subtract from, or filter on,
        # a kube_cronjob_* series — and a deleted or ArgoCD-pruned CronJob emits
        # NO series at all. `time() - <absent>` returns nothing, `== 0` matches
        # nothing, and the whole group goes green the instant the object it
        # watches stops existing. The doctrine was already written down one file
        # away, in BackupCronJobAbsent ("a prune silently disarms every rule
        # above"), and then applied only to the four Longhorn names — never to
        # the fifteen CronJobs in this namespace, which is where the automation
        # that runs this platform actually lives.
        #
        # kube_cronjob_spec_suspend exists from the moment a CronJob is created,
        # so its absence means the OBJECT is gone, not that a run was missed.
        # One absent() per name because absent() cannot be aggregated — this is
        # the one place in this repo where an explicit list is unavoidable, and
        # the failure direction is the safe one: a CronJob added tomorrow and
        # forgotten here is merely unguarded against deletion, never falsely
        # green. Deleting one of these on purpose means deleting its line here in
        # the SAME commit.
        #
        # wordpress-backup-sweep is deliberately NOT in this list — it is
        # absent-guarded at CRITICAL by BackupCronJobAbsent in
        # alerts/cronjob-health.yaml, with the rest of the backup chain.
        - alert: ConsoleAutomationCronJobAbsent
          expr: |
            absent(kube_cronjob_spec_suspend{namespace="infraweaver-console",cronjob="alerts-dispatch"})
            or absent(kube_cronjob_spec_suspend{namespace="infraweaver-console",cronjob="openbao-token-renew"})
            or absent(kube_cronjob_spec_suspend{namespace="infraweaver-console",cronjob="users-reconcile"})
            or absent(kube_cronjob_spec_suspend{namespace="infraweaver-console",cronjob="roster-drift"})
            or absent(kube_cronjob_spec_suspend{namespace="infraweaver-console",cronjob="replica-floor-sweep"})
            or absent(kube_cronjob_spec_suspend{namespace="infraweaver-console",cronjob="placement-rebalance"})
            or absent(kube_cronjob_spec_suspend{namespace="infraweaver-console",cronjob="game-hub-power-sweep"})
            or absent(kube_cronjob_spec_suspend{namespace="infraweaver-console",cronjob="game-hub-capacity-retry"})
            or absent(kube_cronjob_spec_suspend{namespace="infraweaver-console",cronjob="wiki-atlas-sweep"})
            or absent(kube_cronjob_spec_suspend{namespace="infraweaver-console",cronjob="wordpress-connector-health-sweep"})
            or absent(kube_cronjob_spec_suspend{namespace="infraweaver-console",cronjob="wordpress-connector-rotation-sweep"})
            or absent(kube_cronjob_spec_suspend{namespace="infraweaver-console",cronjob="wordpress-manage-snapshot-sweep"})
            or absent(kube_cronjob_spec_suspend{namespace="infraweaver-console",cronjob="wordpress-patch-sweep"})
            or absent(kube_cronjob_spec_suspend{namespace="infraweaver-console",cronjob="wordpress-sandbox-sweep"})
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "A console automation CronJob no longer exists"
            description: "kube-state-metrics reports no CronJob object for infraweaver-console/{{ $labels.cronjob }}. It was deleted or ArgoCD-pruned, and every other console automation alert is now blind to it — a missing object produces no series, so the missed-success, never-succeeded and suspended rules all read as healthy. Check the infraweaver-console ArgoCD application and git history for the deletion. If it was removed on purpose, delete its absent() line here in the same commit."
