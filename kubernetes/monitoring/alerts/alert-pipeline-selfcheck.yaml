---
# Self-check: alerts whose INPUT SERIES do not exist are dead controls.
#
# Measured 2026-08-07 against the live Prometheus: all five families below were
# EMPTY (`count(<series>)` returned no result) while their alert rules sat green
# in platform-alerts and in the chart's own groups. A rule that can never fire is
# worse than no rule — the compliance claim outlives the mechanism, which is the
# same rationale audit-and-retention.yaml was written for, and the same shape as
# the backup that was "configured" for 54 days without ever running.
#
# THESE FIVE FIRE IMMEDIATELY AND STAY FIRING until the exporter or scrape each
# one names is deployed. That is the point: the gap becomes a page instead of a
# paragraph in a plan. Do not silence them. Either build the scrape or delete the
# dead rules they guard — both close the alert, and both are honest.
#
# Dead rules currently guarded, by family:
#   cert-manager  → CertificateExpiringSoon, CertificateExpiringCritical
#   Longhorn      → LonghornVolumesDegraded, LonghornVolumeDegraded,
#                   LonghornVolumeFaulted, LonghornNodeStoragePressure
#   OpenBao       → OpenBaoSealed, OpenBaoUnavailable
#   ArgoCD        → ArgoCDAppDegraded, ArgoCDSyncFailed
#   etcd          → EtcdHighCommitDuration, EtcdMemberDown, and the whole
#                   kube-prometheus-stack etcd rule group
#   console reqs  → ConsoleHighLatency, ConsoleHighErrorRate  (ADDED 2026-08-12;
#                   see that rule for why this file's own omission was the
#                   costliest one in it)
#
# There is no ServiceMonitor for Longhorn, ArgoCD, OpenBao, cert-manager or
# Kyverno in this cluster. The kube-etcd ServiceMonitor DOES exist but produces
# zero targets, which is the more dangerous variant: it looks configured.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: alert-pipeline-selfcheck
  namespace: monitoring
  labels:
    release: kube-prometheus-stack   # must match the prometheusRule selector label
spec:
  groups:
    - name: alert.pipeline.selfcheck
      rules:
        - alert: AlertInputMissingLonghorn
          expr: absent(longhorn_volume_robustness)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Longhorn metrics absent — 4 Longhorn volume alerts are dead"
            description: >-
              longhorn_volume_robustness has no series, so LonghornVolumesDegraded,
              LonghornVolumeDegraded, LonghornVolumeFaulted and
              LonghornNodeStoragePressure in platform-alerts can never fire.
              Fix: a ServiceMonitor for longhorn-backend (longhorn-manager
              exposes /metrics on :9500) in kubernetes/core/longhorn/manifests/.

        - alert: AlertInputMissingOpenBao
          expr: absent(vault_core_unsealed)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "OpenBao metrics absent — OpenBaoSealed can never fire"
            description: >-
              vault_core_unsealed has no series, so a sealed OpenBao (every
              ExternalSecret frozen) would page NOTHING. Fix: enable OpenBao
              telemetry + ServiceMonitor; do NOT restart OpenBao to do it — it
              seals on restart.

        - alert: AlertInputMissingArgoCD
          expr: absent(argocd_app_info)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD metrics absent — ArgoCDAppDegraded/SyncFailed are dead"
            description: >-
              argocd_app_info has no series. Fix: argocd-metrics ServiceMonitor
              (metrics service exists in the argocd chart; see
              kubernetes/core/argocd/values.yaml).

        - alert: AlertInputMissingCertManager
          expr: absent(certmanager_certificate_expiration_timestamp_seconds)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "cert-manager metrics absent — certificate-expiry alerts are dead"
            description: >-
              certmanager_certificate_expiration_timestamp_seconds has no
              series; CertificateExpiringSoon/Critical can never fire. Fix:
              cert-manager prometheus.servicemonitor.enabled=true.

        - alert: AlertInputMissingConsoleRequests
          # ADDED 2026-08-12. This file guarded five families and missed the one
          # that mattered most: ConsoleHighLatency and ConsoleHighErrorRate were
          # keyed on `nginx_ingress_controller_*` on a cluster that runs TRAEFIK,
          # so both had been permanently green since they were written and
          # NOTHING on this platform could tell that the console was serving
          # errors. Exactly the shape this file exists to catch, sitting one
          # directory away from it.
          #
          # Two families in one alert because they are one condition — "the
          # console's request telemetry does not exist" — and `or` fires if
          # EITHER half is missing, so disabling only the histogram (a bucket or
          # addServicesLabels change in traefik/values.yaml) is caught too.
          #
          # The selector is intentionally the FULL one the alert rules use,
          # prefix hash and all, not a bare metric-name check. A rename of the
          # `infraweaver-console-int` IngressRoute, a move out of the `traefik`
          # namespace, or a provider-suffix change would leave both metric
          # families healthy while both console rules quietly matched nothing —
          # a dead rule that looks alive, which is the more dangerous variant
          # this file already names for kube-etcd.
          expr: |
            absent(traefik_service_requests_total{service=~"traefik-infraweaver-console-int-.+@kubernetescrd"})
            or absent(traefik_service_request_duration_seconds_bucket{service=~"traefik-infraweaver-console-int-.+@kubernetescrd"})
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Console request metrics absent — ConsoleHighErrorRate/HighLatency are dead"
            description: >-
              No traefik_service_requests_total or
              traefik_service_request_duration_seconds_bucket series matches the
              infraweaver-console IngressRoute, so the platform's ONLY signal
              that the console is answering 5xx or answering slowly cannot fire.
              Everything else that watches the console watches liveness: the
              pod-count alert, the Gatus check and all three kubelet probes assert
              only that /api/ping returns its hardcoded literal. Fix, in order of
              likelihood: (1) the metrics block in
              kubernetes/core/traefik/values.yaml was removed or
              addServicesLabels turned off; (2) manifests/podmonitor.yaml no
              longer selects the Traefik pods; (3) the IngressRoute
              traefik/infraweaver-console-int was renamed or moved, which changes
              the service label and needs the selector in
              alerts/console-availability.yaml updated in the SAME commit.

        - alert: AlertInputMissingEtcd
          expr: absent(up{job="kube-etcd"})
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "etcd scrape has zero targets — all etcd alerts are dead"
            description: >-
              The kube-etcd ServiceMonitor exists but produces no targets, so
              EtcdMemberDown (the documented compensating control for the
              silenced Talos control-plane alerts) can never fire. Talos exposes
              etcd metrics on :2381 only if configured; needs machine-config
              etcd extraArgs listen-metrics-urls plus reachable endpoints.

    # ── Escalation transport (GAP-M4 Phase C) ────────────────────────────────
    # Same principle one layer up: the ALERTS themselves are only as real as the
    # transport that carries them, and today every path terminates at one
    # Discord webhook inside this cluster. Measured 2026-08-07: the email leg
    # that was supposed to be the independent second transport has failed 180 of
    # 182 sends, and AlertmanagerFailedToSendAlerts{integration="email"} has been
    # firing — into Discord.
    #
    # The fix is staged across two operator steps (OpenBao seeding, then the
    # values.yaml receivers) because doing them out of order parks Alertmanager
    # in ContainerCreating. These two rules exist so the half-finished state
    # cannot sit unnoticed: a TODO comment is not a control.
    #
    # Both are `warning`, not `critical`, on purpose: a critical here would ride
    # the very route that is being reported as incomplete.
    - name: alert.pipeline.escalation
      rules:
        - alert: AlertEscalationSecretMissing
          # kube_secret_info appears the moment a Secret exists, so its absence
          # means the ExternalSecret has not synced — almost always because
          # secret/platform/monitoring/alerting was never seeded in OpenBao.
          #
          # RE-POINTED 2026-08-09, from the combined `alertmanager-escalation-urls`
          # to the DEAD-MAN half specifically. The two endpoints were split into
          # one ExternalSecret each, because only one of them can be self-served:
          # the ntfy topic is a random string the platform mints itself, while
          # the healthchecks endpoint needs an account on an external service.
          # The push leg is wired and its secret now exists, so a guard still
          # keyed on the old combined name would have gone green while the
          # dead-man leg — the half that cannot be self-served, and the half that
          # detects this whole cluster dying — was still missing. That is the
          # same silent-disarm this file was bitten by once already today.
          expr: absent(kube_secret_info{namespace="monitoring",secret="alertmanager-healthchecks-url"})
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Dead-man watcher is not provisioned (step 1 of 2)"
            description: >-
              No dead-man watcher is provisioned, so the ABSENCE of the
              heartbeat from this platform is not detected by anything. The public
              healthchecks.io endpoint this once pointed at was withdrawn on
              purpose: alert content must not leave this network. The constraint
              that remains is physics, not preference — a heartbeat that stops
              when the cluster dies cannot be judged BY the cluster. It does not
              have to leave the NETWORK, only the CLUSTER: a watcher on the
              Proxmox host or the ops VM satisfies both. Until one exists, a dead
              pipeline is something an operator must NOTICE rather than be told
              about. Do NOT clear this by pointing at a public endpoint; that
              trades a visible gap for an invisible data leak.

        - alert: AlertEscalationReceiverNotWired
          # Step 2 has no direct metric: Alertmanager exports no per-receiver
          # series, and alertmanager_notifications_failed_total is labelled by
          # integration, not by receiver. The receiver COUNT is the only
          # available proxy.
          # LIMITATION, stated rather than hidden: adding any unrelated receiver
          # would also satisfy this. If the receiver set in values.yaml changes
          # for any other reason, this threshold MUST be re-derived in the same
          # commit or it silently stops guarding anything.
          #
          # RE-DERIVED 4 -> 5 on 2026-08-09, and this is exactly the failure the
          # paragraph above predicted. The alert manager added a fifth receiver,
          # `infraweaver-console`, which has nothing to do with escalation — and
          # the old `< 5` went quiet on its own while the escalation leg remained
          # unwired. The guard was disarmed by an unrelated change, silently,
          # which is worse than never having had it.
          # Today: null, discord, email-admin, deadmansswitch, infraweaver-console
          # = 5. It becomes 6 when critical-push is added.
          expr: max(alertmanager_receivers) < 6
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "External alert escalation receiver is not wired (step 2 of 2)"
            description: >-
              Alertmanager has fewer receivers than the escalation design
              requires, so the critical-push (ntfy) receiver and the
              healthchecks.io dead-man leg are not in the running config.
              Critical alerts are still Discord-only. Enable the staged block in
              kubernetes/monitoring/kube-prometheus-stack/values.yaml — but only
              after the matching Secret exists, or the Alertmanager pod will hang
              in ContainerCreating.
