# gitops-coverage: dormant - argocd-image-updater is not deployed.
#
# The chart Application is parked at ../../../bootstrap/app-argocd-image-updater.yaml.disabled.
# Verified 2026-08-16: no argocd-image-updater Deployment in any namespace. This
# ExternalSecret would materialise a GitHub write token in the argocd namespace
# for a controller that does not exist - a live credential with no consumer,
# which is strictly worse than not having it.
# To turn it on: enable the chart Application FIRST, then wire this directory.
#
---
# ExternalSecret — GitHub token for ArgoCD Image Updater git write-back
# Token is stored in OpenBao at secret/platform/github
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-image-updater-github
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: argocd-image-updater-github
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: secret/platform/github
        property: token
    - secretKey: username
      remoteRef:
        key: secret/platform/github
        property: username
