# gitops-coverage: dormant - n8n is optional and disabled (platform.yaml groups.core-platform.apps.n8n.enabled: false).
# Set that flag to true and re-run scripts/sync-groups.sh to re-enable; it flips
# kubernetes/bootstrap/app-n8n-manifests.yaml.disabled back to active. The old
# instance's data was deleted on 2026-08-18, so re-enabling is a FRESH install.
---
# ExternalSecret — PostgreSQL credentials for n8n + its postgres backend.
# Both deployments (n8n, postgresql-n8n) consume keys: database, username, password.
# Source: OpenBao at secret/platform/n8n-postgresql.
#
# This secret was lost during the 2026-06-11 DR rebuild (no GitOps source existed),
# which left both pods in CreateContainerConfigError and stalled the bootstrap sync
# wave. Managing it via ESO makes it durable across future rebuilds.
#
#   - refreshInterval: 1h — credentials are static; low churn.
#   - deletionPolicy: Retain — keep the secret (and DB auth) working through transient
#     OpenBao outages; ESO logs an error but leaves the existing secret intact.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-n8n-credentials
  namespace: n8n-prod
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/component: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: postgresql-n8n-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: database
      remoteRef:
        key: secret/platform/n8n-postgresql
        property: database
    - secretKey: username
      remoteRef:
        key: secret/platform/n8n-postgresql
        property: username
    - secretKey: password
      remoteRef:
        key: secret/platform/n8n-postgresql
        property: password
