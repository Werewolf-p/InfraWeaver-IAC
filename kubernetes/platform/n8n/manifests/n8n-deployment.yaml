apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n-prod
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: n8n
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: n8n
    spec:
      containers:
      - env:
        - name: N8N_HOST
          value: n8n.${BASE_DOMAIN}
        - name: N8N_PROTOCOL
          value: https
        - name: N8N_PORT
          value: '5678'
        - name: WEBHOOK_URL
          value: https://n8n.${BASE_DOMAIN}
        - name: N8N_EDITOR_BASE_URL
          value: https://n8n.${BASE_DOMAIN}
        - name: N8N_AUTH_EXCLUDE_ENDPOINTS
          value: /webhook/,/healthz
        - name: N8N_USER_MANAGEMENT_DISABLED
          value: 'false'
        - name: NODE_ENV
          value: production
        - name: DB_TYPE
          value: postgresdb
        - name: DB_POSTGRESDB_HOST
          value: postgresql-n8n.n8n-prod.svc.cluster.local
        - name: DB_POSTGRESDB_PORT
          value: '5432'
        - name: DB_POSTGRESDB_DATABASE
          valueFrom:
            secretKeyRef:
              key: database
              name: postgresql-n8n-credentials
        - name: DB_POSTGRESDB_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: postgresql-n8n-credentials
        - name: DB_POSTGRESDB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: postgresql-n8n-credentials
        - name: N8N_EXECUTIONS_MODE
          value: regular
        - name: N8N_SKIP_WEBHOOK_DEREGISTRATION
          value: 'true'
        - name: LOG_LEVEL
          value: info
        image: n8nio/n8n:1.123.50
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: http
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 1
        name: n8n
        ports:
        - containerPort: 5678
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /home/node/.n8n
          name: n8n-data
        - mountPath: /tmp
          name: tmp
      automountServiceAccountToken: false
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      # ── Zone class: latency-bound (docs/SCHEDULING-ZONES.md) ─────────────────
      # Was a weight-100 PREFERENCE naming [talos-prod-cp1, talos-prod-cp2].
      # cp2 was deleted 2026-08-15, so half of it addressed a node that no longer
      # exists — and a preference is discarded the moment the scheduler's resource
      # scoring disagrees, which is precisely how latency-critical singletons
      # landed on cp4 that day (authentik Traefik p95 0.270 s -> 3.765 s).
      #
      # n8n and postgresql-n8n talk to each other on every workflow step. Split
      # across the stretched VLAN (zone=hypatia, ~15 ms; cp1<->cp3 is 0.19-0.63 ms)
      # each step pays that twice. REQUIRED, on the zone label, so it survives a
      # node being replaced and cannot be outvoted by node scoring.
      #
      # Not a pin: cp1 and cp3 both satisfy it. Today both n8n PVCs are
      # local-path bound to talos-prod-cp1, which pins the pod harder than any
      # affinity does — this rule is what keeps the intent true after the volumes
      # move to a class that can follow the pod.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: NotIn
                values: [hypatia]
      volumes:
      - name: n8n-data
        persistentVolumeClaim:
          claimName: n8n-data
      - emptyDir: {}
        name: tmp
