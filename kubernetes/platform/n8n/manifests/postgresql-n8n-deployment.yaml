apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql-n8n
  namespace: n8n-prod
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: postgresql-n8n
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: postgresql-n8n
    spec:
      containers:
      - env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              key: database
              name: postgresql-n8n-credentials
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: postgresql-n8n-credentials
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: postgresql-n8n-credentials
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_HOST_AUTH_METHOD
          value: md5
        - name: POSTGRES_INITDB_ARGS
          value: "--auth-host=md5 --auth-local=md5"
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U n8n_user
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: postgresql
        ports:
        - containerPort: 5432
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U n8n_user
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgresql-data
        - mountPath: /tmp
          name: tmp
        - mountPath: /var/run
          name: run
      automountServiceAccountToken: false
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 70
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      # ── Zone class: latency-bound (docs/SCHEDULING-ZONES.md) ─────────────────
      # Same change, same reason as n8n-deployment.yaml: this was a weight-100
      # preference naming talos-prod-cp2, a node deleted on 2026-08-15. A database
      # one WAN hop away from the application it serves is the shape of the
      # 2026-08-15 slowdown; keeping both ends in the local site is REQUIRED, not
      # preferred, and is expressed on the zone label so a replacement node
      # inherits it instead of silently escaping it.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: NotIn
                values: [hypatia]
      volumes:
      - name: postgresql-data
        persistentVolumeClaim:
          claimName: postgresql-n8n-data
      - emptyDir: {}
        name: tmp
      - emptyDir: {}
        name: run
