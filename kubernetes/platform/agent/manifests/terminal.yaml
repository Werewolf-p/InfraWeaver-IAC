# Web terminal for the in-cluster agent — what the console's "Terminal" button
# opens.
#
# Human authentication is Authentik forward-auth at the edge (the same
# forward-auth-admin middleware ArgoCD sits behind).
#
# ⚠️ "THERE IS DELIBERATELY NO SECOND AUTH LAYER INSIDE" is what this comment
# used to say, and on 2026-08-16 an audit turned that sentence into a writable
# shell for a pod in `monitoring`. A single edge gate is only a gate if nothing
# else can reach the backend, and the network control that was supposed to
# guarantee that had been silently unioned away by a generated CiliumNetworkPolicy.
#
# So there IS a second layer now, and it is independent of the first: ttyd
# requires a client certificate (`-S -C -K -A`) signed by a CA whose only key
# holder is Traefik. Authentik decides WHICH HUMAN may open a session; the
# certificate decides WHICH PROCESS may talk to ttyd at all. Neither is load
# bearing for the other's job. See certificate.yaml.
#
# Always-on (replicas: 1) so the console button always resolves, recycled daily
# by the reaper below, and bounded per-session by TMOUT plus a one-hour attach
# cap that forces the browser back through Authentik. The stricter shape —
# replicas 0, scaled up on click — needs a console action to do the scaling; the
# reaper's Role is already scoped to exactly that one deployment's scale.
#
# The session inherits the read-only agent-session ServiceAccount: it can read
# pods, logs, events and platform CRDs, and cannot read Secrets or write
# anything. See rbac.yaml for why.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-terminal
  namespace: infraweaver-agent
spec:
  # ── RESTORED TO 1 ON 2026-08-16 AFTER BOTH FAILURES WERE CLOSED ────────────
  #
  # This was scaled to 0 in git on 2026-08-16 because an audit obtained a
  # writable, unauthenticated admin shell on 7681 from an unrelated pod in the
  # `monitoring` namespace. Two controls failed, and each had been safe only
  # because of the other — which is the same as having one control:
  #
  #  1. NETWORK — FIXED in kubernetes/core/kyverno/manifests/
  #     resource-governance-policies.yaml. The Kyverno-generated
  #     `auto-default-deny` CiliumNetworkPolicy re-allowed the whole
  #     `monitoring` namespace on EVERY port, and Cilium UNIONS allow-rules, so
  #     the restrictive NetworkPolicy below was decorative. The generated rule
  #     now admits the Prometheus pods only, on metrics ports only (2112,
  #     8080-8085, 9090-9999). 7681 is outside every range. This had to be
  #     fixed in the generated rule itself: adding another allow cannot narrow
  #     an existing one.
  #
  #  2. AUTH — FIXED here and in certificate.yaml. This shell had NO `-H` at all
  #     and answered 200 to anything; the admin sibling had a presence-only `-H`
  #     that a forged `X-authentik-username` satisfied. ttyd now runs with
  #     `-S -C -K -A`, so libwebsockets REQUIRES a client certificate signed by
  #     a CA only Traefik holds a key for. A forged header no longer reaches
  #     HTTP at all — the TLS handshake is reset first. See certificate.yaml for
  #     the measured before/after.
  #
  # Neither fix relies on the other: cut the network rule and mTLS still refuses
  # the caller; take the certificate away and the network still refuses the
  # packet.
  #
  # Also closed in the same change: no imagePullSecrets on a registry that
  # requires auth (registry-pull-secret.yaml), no session timeout of any kind
  # (TMOUT + an absolute attach cap below), no editor in the image, and a
  # RollingUpdate strategy that deadlocks on this RWO volume.
  #
  # ⚠️ Scale in GIT, never with `kubectl scale` — this Application runs
  # selfHeal=true and reverts a live scale within seconds.
  # PROVEN BEFORE THIS LINE WAS FLIPPED, on the live cluster, 2026-08-16:
  #   monitoring pod   -> agent ns :7681   BLOCKED (connect times out)
  #   monitoring pod   -> agent ns :9100   BLOCKED (source is not Prometheus)
  #   PROMETHEUS       -> agent ns :9100   target UP — scraping still works
  #   PROMETHEUS       -> agent ns :7681   target DOWN, context deadline
  #                                         exceeded — same source, same pod,
  #                                         same namespace, one port allowed
  #                                         and one refused
  #   53/53 pre-existing scrape targets still UP
  replicas: 1
  # Recreate, not the default RollingUpdate. The home volume below is a
  # ReadWriteOnce Longhorn PVC, so a rolling update asks Kubernetes to run the
  # new pod while the old one still holds the attachment: the replacement sits
  # in ContainerCreating with `Multi-Attach error for volume …` until the
  # rollout times out, and `kubectl rollout status` hangs. The admin sibling has
  # always used Recreate for exactly this reason; this one did not, which is why
  # the daily reaper's `rollout restart` could stall. One replica means Recreate
  # costs nothing that RollingUpdate was buying.
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-session
      app.kubernetes.io/component: terminal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-session
        app.kubernetes.io/component: terminal
    spec:
      serviceAccountName: agent-session
      # Zot requires auth on every pull. Without this the pod starts only on a
      # node that already has the layers cached and 403s everywhere else — see
      # registry-pull-secret.yaml.
      imagePullSecrets:
        - name: registry-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: terminal
          # Tag AND digest. The tag is what a human reads; the digest is what
          # survives Zot's `mostRecentlyPushedCount: 3` retention deciding this
          # tag is collectable — with it, a collected tag fails the pull loudly
          # instead of silently resolving to a different image.
          #
          # agentshell-20260816-152940 is the first build whose OWN ttyd can
          # actually start: the runtime stage was missing libwebsockets-evlib-uv,
          # so /usr/local/bin/ttyd aborted with "unable to load evlib plugin
          # evlib_uv" on every invocation and the pods were silently running the
          # stale curl-installed ttyd 1.7.7 binary left on the home PVC. See
          # images/agent-shell/Dockerfile.
          image: registry.int.example.com/agent-shell:agentshell-20260816-152940@sha256:9987b27385fcba37b6f5a8a73f3733215783bac9a68e781aceebc11cc1538d31
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: "2", memory: 2Gi }
          ports:
            - name: ttyd
              containerPort: 7681
          env:
            - { name: HOME, value: /home/session }
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-api-key
                  key: api-key
                  optional: true
            - name: AGENT_MEMORY_REPO
              valueFrom:
                secretKeyRef:
                  name: agent-memory
                  key: repo
                  optional: true
            - name: AGENT_MEMORY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-memory
                  key: token
                  optional: true
          command: ["bash","-lc"]
          args:
            - |
              set -e
              export PATH="$HOME/bin:$HOME/.npm-global/bin:$PATH"
              mkdir -p "$HOME/bin" "$HOME/.npm-global/bin"
              npm config set prefix "$HOME/.npm-global" >/dev/null 2>&1 || true
              curl -sSLo "$HOME/bin/kubectl" \
                "https://dl.k8s.io/release/$(curl -sSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" \
                && chmod +x "$HOME/bin/kubectl"
              # ttyd, tmux and asciinema are BAKED INTO THE IMAGE now
              # (images/agent-shell). This used to curl the 1.7.7 release binary
              # on every pod start, which made each restart depend on GitHub
              # being reachable and pinned us to a release from 2024-03-30 whose
              # successors carry unreleased shell-injection and sprintf
              # hardening. The image builds ttyd from a pinned main commit.
              command -v ttyd >/dev/null || { echo "ttyd missing from image"; exit 1; }
              ttyd --version
              # Install Claude Code only if the persistent volume does not already
              # carry it, and FAIL LOUDLY when that install does not work.
              #
              # This used to end in `|| true` with all output to /dev/null, so a
              # broken install produced a pod that passed its readiness probe —
              # ttyd was listening — and dropped every visitor into a bare shell
              # with no agent and no explanation. Same shape as the `optional: true`
              # on the API key above: Healthy, and useless. If the install breaks,
              # this pod should crashloop and say so.
              if ! command -v claude >/dev/null 2>&1; then
                echo "installing @anthropic-ai/claude-code ..."
                npm i -g @anthropic-ai/claude-code
              fi
              claude --version
              # ── MEMORY REPO CLONE, WITHOUT LEAVING THE TOKEN ON THE VOLUME ──
              # ⚠️ THE OLD FORM WROTE A CREDENTIAL TO A PERSISTENT VOLUME AND
              # LEFT IT THERE FOREVER. `git clone https://x-access-token:$TOK@…`
              # records the tokenised URL verbatim in .git/config, and $HOME is
              # a Longhorn PVC that outlives every pod. So a token that was only
              # ever meant to be an env var became a file on disk, readable by
              # anyone who later got a shell — which is exactly how the Talos,
              # Proxmox and GitHub credentials ended up on this volume and had
              # to be deleted by hand on 2026-08-16. They have NOT been rotated;
              # assume they are compromised.
              #
              # The token now lives only in the argv of one clone, and the
              # remote is immediately rewritten to the clean URL. The `rm -f`
              # runs UNCONDITIONALLY, before anything else, so that a key
              # removed from the Secret is removed from the disk too — the old
              # code only ever wrote credentials and never cleaned them up, so
              # "the secret is gone" and "the credential is gone" were different
              # facts.
              rm -f "$HOME/.git-credentials" "$HOME/.netrc"
              if [ -n "${AGENT_MEMORY_REPO:-}" ]; then
                URL="${AGENT_MEMORY_REPO}"
                [ -n "${AGENT_MEMORY_TOKEN:-}" ] && URL="$(echo "$URL" | sed "s#https://#https://x-access-token:${AGENT_MEMORY_TOKEN}@#")"
                git clone --depth 1 "$URL" "$HOME/.claude" >/dev/null 2>&1 || true
                if [ -d "$HOME/.claude/.git" ]; then
                  git -C "$HOME/.claude" remote set-url origin "${AGENT_MEMORY_REPO}" 2>/dev/null || true
                fi
              fi
              # Belt and braces: strip a tokenised remote left by any EARLIER
              # pod start, since the volume predates this fix.
              if [ -d "$HOME/.claude/.git" ] && [ -n "${AGENT_MEMORY_REPO:-}" ]; then
                git -C "$HOME/.claude" remote set-url origin "${AGENT_MEMORY_REPO}" 2>/dev/null || true
              fi
              # -W makes the terminal writable (you need to type). Auth is the
              # business of the forward-auth middleware in front, not ttyd.
              #
              # -O and -m added 2026-08-15, same reasoning as the admin shell:
              #   -O   without it ttyd never calls check_host_origin() and
              #        accepts a WebSocket handshake from ANY origin. Any page a
              #        signed-in operator visits could open wss://terminal.int/ws,
              #        have the browser attach the Authentik cookie, and get a
              #        writable shell with full read-back — cross-site WebSocket
              #        hijacking. SameSite=Lax on the authentik cookie probably
              #        blocks it today, but that is a cookie we do not control
              #        guarding a path with no test. Traefik preserves the
              #        original Host header, which is what -O compares against.
              #        ⚠️ Upstream #1566: over HTTP/2 the check fails closed and
              #        the browser retries on HTTP/1.1 — a ~5s first-connect
              #        delay, not a breakage.
              #   -m 8 the default is 0 = UNLIMITED and every WebSocket forks a
              #        process, so a client can loop connections and fork-bomb
              #        the pod.
              # -a/--url-arg stays OFF: it lets a client append argv to the
              # spawned command, which is the historically dangerous surface.
              # tmux gives session persistence: ttyd SIGHUPs the child on
              # disconnect, so before this a browser refresh started a NEW shell
              # and killed whatever was running. `new -A -s ops` attaches to the
              # existing session or creates it. This is why the custom image
              # exists — tmux is not in node:22-bookworm and this container is
              # uid 1000 with no apt.
              #
              # ── SESSION BOUNDING: three layers, none of which existed ───────
              # There was no idle timeout and no absolute timeout here at all.
              # The Authentik cookie lasts 1h, but an ESTABLISHED WebSocket is
              # never re-checked against it, so a tab left open was an
              # indefinitely-live shell authorised by a credential that had
              # expired hours earlier.
              #
              #   TMOUT=900        bash's own idle-input timer. It fires only on
              #                    input inactivity at a prompt and does NOT
              #                    reset on resize or reconnect — the defect AWS
              #                    documents in SSM and the design doc records as
              #                    S5. It does not fire while a command runs.
              #   timeout 3600     absolute cap on ONE ATTACH, not on the work.
              #                    ttyd's browser client reconnects on socket
              #                    close by default, and a reconnect is a fresh
              #                    HTTP request that goes back through
              #                    forward-auth-admin — so this is precisely
              #                    "re-check the authorising credential every
              #                    hour", matched to the 1h cookie. tmux keeps
              #                    the session, so a running build survives the
              #                    re-auth. THIS is why `disableReconnect` must
              #                    stay unset.
              #   reaper CronJob   restarts the Deployment daily, bounding the
              #                    tmux SERVER itself. See the bottom of file.
              #
              # ⚠️ TMOUT is advisory — the operator can unset it from inside
              # their own shell. It is hygiene, not a boundary; the boundary is
              # the attach cap and the reaper, both outside the shell.
              cat > "$HOME/bin/session-wrapper.sh" <<'WRAPPER'
              #!/bin/bash
              export PATH="$HOME/bin:$HOME/.npm-global/bin:$PATH"
              export EDITOR="${EDITOR:-vim}"
              export TMOUT=900
              exec timeout --foreground --signal=HUP 3600 tmux new -A -s ops
              WRAPPER
              sed -i 's/^              //' "$HOME/bin/session-wrapper.sh"
              chmod +x "$HOME/bin/session-wrapper.sh"
              # ── TLS + CLIENT-CERT GATE ─────────────────────────────────────
              # -S/-C/-K/-A: libwebsockets sets
              # LWS_SERVER_OPTION_REQUIRE_VALID_OPENSSL_CLIENT_CERT when -A is
              # given, so the handshake itself demands a certificate signed by
              # the CA in certificate.yaml. Traefik holds the only key.
              #
              # This shell previously had NO auth flag whatsoever and returned
              # 200 to any caller with no header at all. `-H` is added for the
              # same reason the admin shell has it — TTYD_USER attribution and a
              # fail-closed assertion that the request came through
              # forward-auth-admin — but it is NOT what keeps strangers out.
              # The certificate is.
              #
              # ⚠️ ABSOLUTE PATH, not `ttyd`. $HOME/bin comes first on PATH and
              # the persistent volume still carries a curl-installed ttyd 1.7.7
              # from before the custom image existed; a bare `ttyd` runs THAT
              # one, silently undoing the pinned-commit build. Measured
              # 2026-08-16.
              exec /usr/local/bin/ttyd -p 7681 -W -O -m 8 \
                -S -C /etc/ttyd/tls/tls.crt \
                   -K /etc/ttyd/tls/tls.key \
                   -A /etc/ttyd/tls/ca.crt \
                -H X-authentik-username \
                -t titleFixed="InfraWeaver agent" \
                -t scrollback=100000 \
                -t screenReaderMode=true \
                "$HOME/bin/session-wrapper.sh"
          readinessProbe:
            tcpSocket: { port: 7681 }
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - { name: home, mountPath: /home/session }
            - { name: tmp,  mountPath: /tmp }
            - { name: ttyd-tls, mountPath: /etc/ttyd/tls, readOnly: true }
      volumes:
        # Server cert + the CA that client certificates are verified against.
        # Issued by the dedicated in-namespace CA in certificate.yaml, NOT by
        # the cluster-wide infraweaver-ca.
        - name: ttyd-tls
          secret:
            secretName: agent-ttyd-server-tls
            defaultMode: 0440
        # $HOME PERSISTS. It used to be an emptyDir, and that single line was why
        # this terminal looked half-built: every restart threw away the Claude
        # Code install, the signed-in session, and any config the operator had
        # set up. You logged in, the pod moved or restarted, and you were back to
        # an unauthenticated shell with no trace of why.
        #
        # Persistence is also what makes the credential question go away. With a
        # durable HOME an operator signs in through the web terminal ONCE and it
        # sticks, so no Anthropic API key has to be minted, stored in OpenBao, or
        # mounted into a browser-reachable pod. `agent-api-key` stays optional and
        # unset by design.
        #
        # Longhorn rather than local-path: this pod must be free to reschedule
        # onto any node without stranding the operator's session on a machine
        # that happens to be down. RWO is right — the Deployment is single-replica
        # and a second writer would corrupt the config anyway.
        #
        # NOTE: the reaper CronJob deletes session PODS, not this volume. That is
        # the intended split now — sessions stay disposable, identity does not.
        - name: home
          persistentVolumeClaim:
            claimName: agent-session-home
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-session-home
  namespace: infraweaver-agent
  labels:
    app.kubernetes.io/name: agent-session
    app.kubernetes.io/component: terminal
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agent-terminal
  namespace: infraweaver-agent
spec:
  selector:
    app.kubernetes.io/name: agent-session
    app.kubernetes.io/component: terminal
  ports:
    - name: ttyd
      port: 80
      targetPort: 7681
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: agent-terminal
  namespace: infraweaver-agent
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`terminal.int.example.com`)
      kind: Rule
      middlewares:
        - { name: secure-headers, namespace: traefik }
        # Same gate ArgoCD sits behind. Without this the terminal is an
        # unauthenticated shell on the ingress.
        - { name: forward-auth-admin, namespace: traefik }
      services:
        - name: agent-terminal
          port: 80
          # ttyd now speaks TLS and demands a client certificate, so Traefik
          # must connect as https and present one. `agent-ttyd-mtls` carries the
          # client key, the CA to trust, and disableHTTP2 — all three are
          # required; see certificate.yaml for why h2 breaks the `-H` lookup.
          scheme: https
          serversTransport: agent-ttyd-mtls
  tls:
    secretName: platform-int-wildcard-tls
---
# Reaper: recycles the terminal daily, bounding the tmux SERVER so a forgotten
# session cannot live indefinitely. This is the outermost of three layers now —
# TMOUT=900 (idle) and a 3600s attach cap (which forces the browser back through
# forward-auth-admin, re-checking the 1h Authentik cookie) sit inside it and are
# defined with the ttyd invocation above.
#
# Daily rather than hourly ON PURPOSE: the hourly re-auth is done by the attach
# cap at no cost to the operator, whereas restarting the pod destroys running
# work. Doing both hourly would buy nothing and cost a session an hour's build.
# The sibling agent-admin-reaper in terminal-admin.yaml is the same shape.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agent-terminal-reaper
  namespace: infraweaver-agent
spec:
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            # Selected by the SCOPED allow-egress-apiserver CiliumNetworkPolicy in
            # kubernetes/core/network-policies/manifests/apiserver-egress.yaml.
            # Without this label the reaper is covered only by the namespace's
            # Kyverno-generated auto-default-deny CNP, which permits intra-namespace
            # traffic and DNS and nothing else — so every run died on
            #   dial tcp 10.96.0.1:443: i/o timeout
            # The label is deliberately NOT `agent-session`: that name selects the
            # ephemeral operator shells, whose egress must stay narrower than this.
            app.kubernetes.io/name: agent-terminal-reaper
        spec:
          restartPolicy: Never
          serviceAccountName: agent-terminal-reaper
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: reaper
              # Digest-pinned, NOT tag-pinned. Bitnami moved its free Docker Hub
              # catalog to the `bitnamilegacy/` namespace in 2025 and deleted the
              # versioned tags from `bitnami/*`, so `bitnami/kubectl:1.31` began
              # returning MANIFEST_UNKNOWN and this CronJob sat in
              # ImagePullBackOff (680 backoffs over 157m on 2026-08-15). Digests
              # survive tag removal; tags do not.
              #
              # This is the same digest the five ArgoCD CronJobs in
              # kubernetes/core/argocd/manifests/ already run successfully, so it
              # is known-good in this cluster. Do NOT swap to
              # registry.k8s.io/kubectl: it is distroless with no shell, which
              # broke every Kyverno cleanup job (see kubernetes/core/kyverno/values.yaml).
              image: "bitnami/kubectl:1.35.4@sha256:e2b97dde9666986c61c56d49aae85a714b89b69392baa531438e74ec34096fb4"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits:   { cpu: 200m, memory: 128Mi }
              command: ["sh","-c","kubectl -n infraweaver-agent rollout restart deploy/agent-terminal"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-terminal-reaper
  namespace: infraweaver-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-terminal-reaper
  namespace: infraweaver-agent
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    resourceNames: ["agent-terminal"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-terminal-reaper
  namespace: infraweaver-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-terminal-reaper
subjects:
  - kind: ServiceAccount
    name: agent-terminal-reaper
    namespace: infraweaver-agent
