# Web terminal for the in-cluster agent — what the console's "Terminal" button
# opens.
#
# Authentication is Authentik forward-auth at the edge (the same
# forward-auth-admin middleware ArgoCD sits behind). There is deliberately no
# second auth layer inside: a terminal reachable without SSO is a cluster
# breach, so the gate belongs where every other admin surface has it.
#
# Currently always-on (replicas: 1) so the console button always resolves, and
# recycled daily by the reaper below. The stricter shape — replicas 0, scaled
# up on click, reaped hourly — needs a console action to do the scaling; the
# reaper's Role is already scoped to exactly that one deployment's scale.
#
# The session inherits the read-only agent-session ServiceAccount: it can read
# pods, logs, events and platform CRDs, and cannot read Secrets or write
# anything. See rbac.yaml for why.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-terminal
  namespace: infraweaver-agent
spec:
  # 1, not 0: a button that 502s on first click is not a button. The reaper
  # below recycles it daily so a session cannot quietly live forever. Move this
  # to 0 once the console can scale it on demand — the reaper Role already
  # allows exactly that scale and nothing else.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-session
      app.kubernetes.io/component: terminal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-session
        app.kubernetes.io/component: terminal
    spec:
      serviceAccountName: agent-session
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: terminal
          image: docker.io/library/node:22-bookworm
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: "2", memory: 2Gi }
          ports:
            - name: ttyd
              containerPort: 7681
          env:
            - { name: HOME, value: /home/session }
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-api-key
                  key: api-key
                  optional: true
            - name: AGENT_MEMORY_REPO
              valueFrom:
                secretKeyRef:
                  name: agent-memory
                  key: repo
                  optional: true
            - name: AGENT_MEMORY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-memory
                  key: token
                  optional: true
          command: ["bash","-lc"]
          args:
            - |
              set -e
              export PATH="$HOME/bin:$HOME/.npm-global/bin:$PATH"
              mkdir -p "$HOME/bin" "$HOME/.npm-global/bin"
              npm config set prefix "$HOME/.npm-global" >/dev/null 2>&1 || true
              curl -sSLo "$HOME/bin/kubectl" \
                "https://dl.k8s.io/release/$(curl -sSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" \
                && chmod +x "$HOME/bin/kubectl"
              curl -sSLo "$HOME/bin/ttyd" \
                "https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64" \
                && chmod +x "$HOME/bin/ttyd"
              # Install Claude Code only if the persistent volume does not already
              # carry it, and FAIL LOUDLY when that install does not work.
              #
              # This used to end in `|| true` with all output to /dev/null, so a
              # broken install produced a pod that passed its readiness probe —
              # ttyd was listening — and dropped every visitor into a bare shell
              # with no agent and no explanation. Same shape as the `optional: true`
              # on the API key above: Healthy, and useless. If the install breaks,
              # this pod should crashloop and say so.
              if ! command -v claude >/dev/null 2>&1; then
                echo "installing @anthropic-ai/claude-code ..."
                npm i -g @anthropic-ai/claude-code
              fi
              claude --version
              if [ -n "${AGENT_MEMORY_REPO:-}" ]; then
                URL="${AGENT_MEMORY_REPO}"
                [ -n "${AGENT_MEMORY_TOKEN:-}" ] && URL="$(echo "$URL" | sed "s#https://#https://x-access-token:${AGENT_MEMORY_TOKEN}@#")"
                git clone --depth 1 "$URL" "$HOME/.claude" >/dev/null 2>&1 || true
              fi
              # -W makes the terminal writable (you need to type). Auth is the
              # business of the forward-auth middleware in front, not ttyd.
              #
              # -O and -m added 2026-08-15, same reasoning as the admin shell:
              #   -O   without it ttyd never calls check_host_origin() and
              #        accepts a WebSocket handshake from ANY origin. Any page a
              #        signed-in operator visits could open wss://terminal.int/ws,
              #        have the browser attach the Authentik cookie, and get a
              #        writable shell with full read-back — cross-site WebSocket
              #        hijacking. SameSite=Lax on the authentik cookie probably
              #        blocks it today, but that is a cookie we do not control
              #        guarding a path with no test. Traefik preserves the
              #        original Host header, which is what -O compares against.
              #        ⚠️ Upstream #1566: over HTTP/2 the check fails closed and
              #        the browser retries on HTTP/1.1 — a ~5s first-connect
              #        delay, not a breakage.
              #   -m 8 the default is 0 = UNLIMITED and every WebSocket forks a
              #        process, so a client can loop connections and fork-bomb
              #        the pod.
              # -a/--url-arg stays OFF: it lets a client append argv to the
              # spawned command, which is the historically dangerous surface.
              exec "$HOME/bin/ttyd" -p 7681 -W -O -m 8 \
                -t titleFixed="InfraWeaver agent" \
                -t scrollback=100000 \
                -t screenReaderMode=true \
                bash -lc 'export PATH=$HOME/bin:$HOME/.npm-global/bin:$PATH; claude || bash -l'
          readinessProbe:
            tcpSocket: { port: 7681 }
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - { name: home, mountPath: /home/session }
            - { name: tmp,  mountPath: /tmp }
      volumes:
        # $HOME PERSISTS. It used to be an emptyDir, and that single line was why
        # this terminal looked half-built: every restart threw away the Claude
        # Code install, the signed-in session, and any config the operator had
        # set up. You logged in, the pod moved or restarted, and you were back to
        # an unauthenticated shell with no trace of why.
        #
        # Persistence is also what makes the credential question go away. With a
        # durable HOME an operator signs in through the web terminal ONCE and it
        # sticks, so no Anthropic API key has to be minted, stored in OpenBao, or
        # mounted into a browser-reachable pod. `agent-api-key` stays optional and
        # unset by design.
        #
        # Longhorn rather than local-path: this pod must be free to reschedule
        # onto any node without stranding the operator's session on a machine
        # that happens to be down. RWO is right — the Deployment is single-replica
        # and a second writer would corrupt the config anyway.
        #
        # NOTE: the reaper CronJob deletes session PODS, not this volume. That is
        # the intended split now — sessions stay disposable, identity does not.
        - name: home
          persistentVolumeClaim:
            claimName: agent-session-home
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-session-home
  namespace: infraweaver-agent
  labels:
    app.kubernetes.io/name: agent-session
    app.kubernetes.io/component: terminal
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agent-terminal
  namespace: infraweaver-agent
spec:
  selector:
    app.kubernetes.io/name: agent-session
    app.kubernetes.io/component: terminal
  ports:
    - name: ttyd
      port: 80
      targetPort: 7681
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: agent-terminal
  namespace: infraweaver-agent
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`terminal.int.example.com`)
      kind: Rule
      middlewares:
        - { name: secure-headers, namespace: traefik }
        # Same gate ArgoCD sits behind. Without this the terminal is an
        # unauthenticated shell on the ingress.
        - { name: forward-auth-admin, namespace: traefik }
      services:
        - name: agent-terminal
          port: 80
  tls:
    secretName: platform-int-wildcard-tls
---
# Reaper: recycles the terminal daily so a forgotten session does not live
# indefinitely. Runs at 04:00 rather than hourly because the deployment is
# currently always-on; when the console gains an on-demand scale-up action,
# tighten this to hourly and set replicas back to 0.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agent-terminal-reaper
  namespace: infraweaver-agent
spec:
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            # Selected by the SCOPED allow-egress-apiserver CiliumNetworkPolicy in
            # kubernetes/core/network-policies/manifests/apiserver-egress.yaml.
            # Without this label the reaper is covered only by the namespace's
            # Kyverno-generated auto-default-deny CNP, which permits intra-namespace
            # traffic and DNS and nothing else — so every run died on
            #   dial tcp 10.96.0.1:443: i/o timeout
            # The label is deliberately NOT `agent-session`: that name selects the
            # ephemeral operator shells, whose egress must stay narrower than this.
            app.kubernetes.io/name: agent-terminal-reaper
        spec:
          restartPolicy: Never
          serviceAccountName: agent-terminal-reaper
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: reaper
              # Digest-pinned, NOT tag-pinned. Bitnami moved its free Docker Hub
              # catalog to the `bitnamilegacy/` namespace in 2025 and deleted the
              # versioned tags from `bitnami/*`, so `bitnami/kubectl:1.31` began
              # returning MANIFEST_UNKNOWN and this CronJob sat in
              # ImagePullBackOff (680 backoffs over 157m on 2026-08-15). Digests
              # survive tag removal; tags do not.
              #
              # This is the same digest the five ArgoCD CronJobs in
              # kubernetes/core/argocd/manifests/ already run successfully, so it
              # is known-good in this cluster. Do NOT swap to
              # registry.k8s.io/kubectl: it is distroless with no shell, which
              # broke every Kyverno cleanup job (see kubernetes/core/kyverno/values.yaml).
              image: "bitnami/kubectl:1.35.4@sha256:e2b97dde9666986c61c56d49aae85a714b89b69392baa531438e74ec34096fb4"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits:   { cpu: 200m, memory: 128Mi }
              command: ["sh","-c","kubectl -n infraweaver-agent rollout restart deploy/agent-terminal"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-terminal-reaper
  namespace: infraweaver-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-terminal-reaper
  namespace: infraweaver-agent
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    resourceNames: ["agent-terminal"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-terminal-reaper
  namespace: infraweaver-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-terminal-reaper
subjects:
  - kind: ServiceAccount
    name: agent-terminal-reaper
    namespace: infraweaver-agent
