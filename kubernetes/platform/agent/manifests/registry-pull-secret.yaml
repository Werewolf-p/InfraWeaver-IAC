# Pull credential for the self-hosted Zot registry (registry.int.example.com).
#
# WHY THIS WAS MISSING AND WHY IT MATTERED. Both agent Deployments run
# `registry.int.example.com/agent-shell:…`, and Zot requires authentication for
# every pull — but neither Deployment carried `imagePullSecrets`, and the
# `infraweaver-agent` namespace held no pull secret at all. They started anyway
# for one reason: the layers were already in cp1's containerd content store from
# the `docker build` that produced them. That is a cache, not a configuration.
#
# The failure this hides is a COLD one, and it lands at the worst possible time:
# the node holding the cache reboots or the pod is rescheduled onto cp3/cp4, the
# kubelet pulls for real, and gets
#
#     failed to pull and unpack image … 401 Unauthorized / 403 Forbidden
#
# i.e. the shell you would use to fix a node problem is the thing that will not
# start because of it. Every other namespace running a Zot image
# (infraweaver-console, private-test, tradesphere) already syncs this exact
# secret from the same OpenBao path; this namespace was simply skipped.
#
# ⚠️ SEPARATE, STILL-OPEN RISK — NOT FIXED HERE, AND NOT THIS FILE'S TO FIX.
# Zot runs `retention: { deleteUntagged: true, mostRecentlyPushedCount: 3 }`
# (kubernetes/core/registry/registry.yaml), which counts PUSHES and knows
# nothing about DEPLOYS. Three more pushes to the `agent-shell` repo and the tag
# this cluster runs becomes garbage-collectable. The Deployments therefore pin
# `tag@sha256:…`: a digest pin turns "the tag was collected" from a silent pull
# of something else into a loud, unambiguous manifest-unknown. Making the
# running tag genuinely un-collectable needs a retention exclusion in
# kubernetes/core/registry/registry.yaml, which is a different owner's tree.
#
# Seed the source with scripts/deploy/seed-registry-pull-secret.sh (same
# `secret/platform/registry-pull-secret` path the console uses) — the value is
# never written into git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-pull-secret
  namespace: infraweaver-agent
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: registry-pull-secret
    creationPolicy: Owner
    # Retain: losing the pull secret because an ExternalSecret was momentarily
    # unhealthy would mean the shells cannot start on a cold node, which is the
    # exact situation this file exists to prevent.
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: secret/platform/registry-pull-secret
        property: dockerconfigjson
        conversionStrategy: Default
        decodingStrategy: Base64
        metadataPolicy: None
