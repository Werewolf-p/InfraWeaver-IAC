---
# ── ArgoCD + OpenBao OAuth2 Blueprints ───────────────────────────────────────
# Creates confidential OAuth2 providers and applications for ArgoCD and OpenBao.
# Client secrets are NOT set here (auto-generated by Authentik); the
# full-redeploy workflow reads them from the Authentik API and stores them in
# OpenBao + K8s secrets so the apps can reference them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-apps
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
data:
  apps.yaml: |
    version: 1
    metadata:
      name: ArgoCD and OpenBao OAuth2 Setup
    entries:
      # ── ArgoCD OAuth2 Provider ──────────────────────────────────────────────
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: ArgoCD Provider
        attrs:
          name: ArgoCD Provider
          client_id: argocd
          client_type: confidential
          sub_mode: user_username
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: strict
              url: "https://argocd.int.${BASE_DOMAIN}/auth/callback"
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: argocd
        attrs:
          name: ArgoCD
          slug: argocd
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, ArgoCD Provider]]
          policy_engine_mode: any

      # ── OpenBao OAuth2 Provider ─────────────────────────────────────────────
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: OpenBao Provider
        attrs:
          name: OpenBao Provider
          client_id: openbao
          client_type: confidential
          sub_mode: user_username
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: strict
              url: "https://openbao.int.${BASE_DOMAIN}/ui/vault/auth/oidc/oidc/callback"
            # CLI callback for bao login -method=oidc
            - matching_mode: strict
              url: "http://localhost:8250/oidc/callback"
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: openbao
        attrs:
          name: OpenBao
          slug: openbao
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, OpenBao Provider]]
          policy_engine_mode: any

      # ── Wiki.js OAuth2 Provider ─────────────────────────────────────────────
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: WikiJS Provider
        attrs:
          name: WikiJS Provider
          client_id: wikijs
          client_type: confidential
          sub_mode: user_username
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: strict
              url: "https://wiki.int.${BASE_DOMAIN}/login/oidc/callback"
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-entitlements]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: wikijs
        attrs:
          name: Wiki.js
          slug: wikijs
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, WikiJS Provider]]
          policy_engine_mode: any

      # ── Grafana OAuth2 Provider ─────────────────────────────────────────────
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: Grafana Provider
        attrs:
          name: Grafana Provider
          client_id: grafana
          client_type: confidential
          sub_mode: user_username
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: strict
              url: "https://grafana.int.${BASE_DOMAIN}/login/generic_oauth"
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          slug: grafana
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Grafana Provider]]
          policy_engine_mode: any

      # ── Proxmox OAuth2 Provider ─────────────────────────────────────────────
      # PVE 7.4+ supports OIDC realms via pveum. The redirect URI is the PVE UI base URL.
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: Proxmox Provider
        attrs:
          name: Proxmox Provider
          client_id: proxmox
          client_type: confidential
          sub_mode: user_username
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            # PVE sends a redirect to its own UI URL after successful OIDC auth
            - matching_mode: regex
              url: "https://proxmox\\.int\\.${BASE_DOMAIN}.*"
            - matching_mode: regex
              url: "https://proxmox\\.${BASE_DOMAIN}.*"
            - matching_mode: regex
              url: "https://${PROXMOX_HOST}:8006.*"
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: proxmox
        attrs:
          name: Proxmox VE
          slug: proxmox
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Proxmox Provider]]
          policy_engine_mode: any

      # ── Gitea OAuth2 Provider (catalog app) ────────────────────────────────
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: Gitea Provider
        attrs:
          name: Gitea Provider
          client_id: gitea
          client_type: confidential
          sub_mode: user_username
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: strict
              url: "https://gitea.int.${BASE_DOMAIN}/user/oauth2/authentik/callback"
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: gitea
        attrs:
          name: Gitea
          slug: gitea
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Gitea Provider]]
          policy_engine_mode: any

      # ── Vaultwarden (catalog app — proxy auth via Traefik forward-auth) ────
      # Vaultwarden free edition has no native OIDC; Traefik forward-auth protects the UI.
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: Vaultwarden Provider
        attrs:
          name: Vaultwarden Provider
          mode: forward_single
          external_host: "https://vaultwarden.int.${BASE_DOMAIN}"
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: vaultwarden
        attrs:
          name: Vaultwarden
          slug: vaultwarden
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, Vaultwarden Provider]]
          policy_engine_mode: any

      # ── Longhorn (internal storage UI — proxy auth via Traefik forward-auth) ──
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: Longhorn Provider
        attrs:
          name: Longhorn Provider
          mode: forward_single
          external_host: "https://longhorn.int.${BASE_DOMAIN}"
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: longhorn
        attrs:
          name: Longhorn
          slug: longhorn
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, Longhorn Provider]]
          policy_engine_mode: any

      # ── Forgejo (catalog app — native OAuth2 OIDC) ───────────────────────────
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: Forgejo Provider
        attrs:
          name: Forgejo Provider
          client_id: forgejo
          client_type: confidential
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - url: https://forgejo.int.${BASE_DOMAIN}/user/oauth2/Authentik/callback
              matching_mode: strict
          scopes:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          access_token_validity: hours=1
          refresh_token_validity: days=30
          include_claims_in_id_token: true

      - model: authentik_core.application
        state: present
        identifiers:
          slug: forgejo
        attrs:
          name: Forgejo
          slug: forgejo
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Forgejo Provider]]
          policy_engine_mode: any

      # ── Portainer OAuth2 Provider ──────────────────────────────────────────
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: Portainer Provider
        attrs:
          name: Portainer Provider
          client_id: portainer
          client_type: confidential
          sub_mode: user_username
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: strict
              url: "https://portainer.int.${BASE_DOMAIN}/"
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: portainer
        attrs:
          name: Portainer
          slug: portainer
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Portainer Provider]]
          policy_engine_mode: any

      # ── InfraWeaver Console OAuth2 Provider ─────────────────────────────────
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: InfraWeaver Console Provider
        attrs:
          name: InfraWeaver Console Provider
          client_id: infraweaver-console
          client_type: confidential
          sub_mode: user_username
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: strict
              url: "https://infraweaver.int.${BASE_DOMAIN}/api/auth/callback/authentik"
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-entitlements]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: infraweaver-console
        attrs:
          name: InfraWeaver Console
          slug: infraweaver-console
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, InfraWeaver Console Provider]]
          policy_engine_mode: any
      # ── AdGuard (forward-auth proxy) ──────────────────────────────────────
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: AdGuard Provider
        attrs:
          name: AdGuard Provider
          mode: forward_single
          external_host: "https://adguard.int.${BASE_DOMAIN}"
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: adguard
        attrs:
          name: AdGuard
          slug: adguard
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, AdGuard Provider]]
          policy_engine_mode: any

      # ── Ansible / Semaphore (forward-auth proxy) ──────────────────────────────────────
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: Ansible Provider
        attrs:
          name: Ansible Provider
          mode: forward_single
          external_host: "https://ansible.int.${BASE_DOMAIN}"
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: ansible
        attrs:
          name: Ansible / Semaphore
          slug: ansible
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, Ansible Provider]]
          policy_engine_mode: any

      # ── Traefik Dashboard (forward-auth proxy) ──────────────────────────────────────
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: Traefik Dashboard Provider
        attrs:
          name: Traefik Dashboard Provider
          mode: forward_single
          external_host: "https://traefik.int.${BASE_DOMAIN}"
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: traefik-dashboard
        attrs:
          name: Traefik Dashboard
          slug: traefik-dashboard
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, Traefik Dashboard Provider]]
          policy_engine_mode: any

      # ── Proxmox VE (forward-auth) (forward-auth proxy) ──────────────────────────────────────
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: Proxmox Forward-Auth Provider
        attrs:
          name: Proxmox Forward-Auth Provider
          mode: forward_single
          external_host: "https://proxmox.int.${BASE_DOMAIN}"
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: proxmox-fwd
        attrs:
          name: Proxmox VE (forward-auth)
          slug: proxmox-fwd
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, Proxmox Forward-Auth Provider]]
          policy_engine_mode: any

      # ── Portainer (forward-auth) (forward-auth proxy) ──────────────────────────────────────
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: Portainer Forward-Auth Provider
        attrs:
          name: Portainer Forward-Auth Provider
          mode: forward_single
          external_host: "https://portainer.int.${BASE_DOMAIN}"
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: portainer-fwd
        attrs:
          name: Portainer (forward-auth)
          slug: portainer-fwd
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, Portainer Forward-Auth Provider]]
          policy_engine_mode: any

      # ── Portainer 2 (forward-auth proxy) ──────────────────────────────────────
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: Portainer2 Provider
        attrs:
          name: Portainer2 Provider
          mode: forward_single
          external_host: "https://portainer2.int.${BASE_DOMAIN}"
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: portainer2
        attrs:
          name: Portainer 2
          slug: portainer2
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, Portainer2 Provider]]
          policy_engine_mode: any

      # ── TrueNAS (forward-auth proxy) ──────────────────────────────────────
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: TrueNAS Provider
        attrs:
          name: TrueNAS Provider
          mode: forward_single
          external_host: "https://truenas.${BASE_DOMAIN}"
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: truenas
        attrs:
          name: TrueNAS
          slug: truenas
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, TrueNAS Provider]]
          policy_engine_mode: any

      # ── Vault (bare-metal) (forward-auth proxy) ──────────────────────────────────────
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: Vault1 Provider
        attrs:
          name: Vault1 Provider
          mode: forward_single
          external_host: "https://vault1.int.${BASE_DOMAIN}"
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: vault1
        attrs:
          name: Vault (bare-metal)
          slug: vault1
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, Vault1 Provider]]
          policy_engine_mode: any

      # ── ArgoCD (forward-auth) (forward-auth proxy) ──────────────────────────────────────
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: ArgoCD Forward-Auth Provider
        attrs:
          name: ArgoCD Forward-Auth Provider
          mode: forward_single
          external_host: "https://argocd.int.${BASE_DOMAIN}"
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: argocd-fwd
        attrs:
          name: ArgoCD (forward-auth)
          slug: argocd-fwd
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, ArgoCD Forward-Auth Provider]]
          policy_engine_mode: any

