          slug: grafana-fwd
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, Grafana Forward-Auth Provider]]
          policy_engine_mode: any

      # ── OpenBao (forward-auth) (forward-auth proxy) ──────────────────────────────────────
      - model: authentik_providers_proxy.proxyprovider
