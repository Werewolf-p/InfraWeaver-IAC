---
# ── Scoped role + group for svc-infraweaver-console (P1.4, stage 1 of 2) ──────
#
# WHAT THIS DOES — AND, IMPORTANTLY, WHAT IT DOES NOT
# This blueprint CREATES a role and a non-superuser group and puts the console's
# service account in that group. It is purely ADDITIVE: it does not remove the
# account from `authentik Admins`, so after this applies the account is still a
# superuser and its effective rights are UNCHANGED. That is deliberate. Dropping
# superuser is a separate, ATTENDED step — see docs/SECURITY-REMEDIATION-RUNBOOK.md
# §P1.4 — because under-granting breaks user provisioning SILENTLY, which is the
# exact reason the 2026-08-07 credential rotation stopped short of doing it
# (docs/BREAK-GLASS.md §10).
#
# `authentik Admins` membership is deliberately NOT asserted anywhere in this
# file. A blueprint that declares that group's user list would silently evict
# whoever is not in the list on every apply — including the break-glass account.
#
# ── HOW THE PERMISSION SET WAS DERIVED ───────────────────────────────────────
# Every Authentik endpoint the console calls was enumerated from the platform
# repo (call sites of `authentikFetch(` plus `src/lib/sso/authentik-client.ts`).
# Two results are worth writing down because they are counter-intuitive:
#   * There is NO `POST /core/users/` anywhere in the console. Users are created
#     through the Authentik invitation ENROLLMENT FLOW, not the API. Hence
#     `add_user` is NOT granted below.
#   * `src/app/api/test-suite/route.ts` matched an AUTHENTIK grep but only checks
#     that env var NAMES are set (AUTHENTIK_CLIENT_ID/SECRET). It makes no API
#     call, so it adds nothing to this set. (The plan flagged this as unmeasured.)
#
# Deliberately NOT granted: impersonate, preview_user, set_token_key, add_user,
# enable_group_superuser / disable_group_superuser (a scoped account must never be
# able to mint a superuser group), delete_invitation, delete_policybinding
# (bindings cascade with application deletion), and every flow/stage/crypto write.
#
# ── VALIDATED WITH A THROWAWAY CANARY, NOT BY READING THE DOCS ───────────────
# 2026-08-07: a disposable service account holding ONLY this permission set ran
# the full round-trip against the live API. 20/20 as expected:
#   whoami 200 · list users 200 · list groups 200 · create group 201 ·
#   add user 200 · remove_user 204 · delete group 204 · events 200 ·
#   flows?slug= 200 · tokens?identifier= 200 (the P1.1 exporter dependency) ·
#   certificatekeypairs 200 · propertymappings/provider/scope 200 ·
#   outposts/instances 200 · create invitation 201 ·
#   proxy provider create 201 → patch 200 → delete 204
# and the mandatory DENIALS, which are what prove privilege was actually lowered:
#   POST /flows/instances/  → 403
#   POST /rbac/roles/       → 403   (cannot escalate itself)
#   DELETE an invitation    → 403   (granted add+view only)
# The canary, its token, group and role were deleted afterwards and verified gone.
#
# ── TWO MEASURED TRAPS IN AUTHENTIK'S OWN BLUEPRINT HANDLING ─────────────────
# Both were read out of RoleSerializer's source on this exact version (2026.5.6):
#
# 1. `permissions:` only exists in BLUEPRINT context. RoleSerializer.__init__ adds
#    the field only when SERIALIZER_CONTEXT_BLUEPRINT is present. So it works
#    here — but the same key sent to POST /rbac/roles/ over the API is ignored.
#
# 2. THE APP LABEL IS DISCARDED. The serializer resolves the list with
#      Permission.objects.filter(codename__in=[x.split(".")[1] for x in perms])
#    — matching on codename ONLY. The 40 entries below therefore actually grant
#    44 permissions: the extras are auth.{add,change,delete,view}_group, i.e.
#    Django's built-in auth.Group, whose codenames collide with authentik_core's.
#    That model has no authentik API surface, so the over-grant is inert — but it
#    is real, and it is why the count in the cluster reads 44 and not 40. Do not
#    "fix" the discrepancy by deleting entries; the collision is upstream.
#
# 3. ASSIGNMENT IS ADDITIVE — SHRINKING THIS LIST DOES NOTHING. Both create() and
#    update() end in `instance.assign_perms(...)`, which only adds. Removing a
#    codename from this file will NOT revoke it from the live role; the role will
#    keep drifting wider than the file claims. To actually revoke, an operator
#    must run `Role.objects.get(name="role-infraweaver-console").remove_perms([...])`
#    (or delete and recreate the role) and confirm the count dropped. Adding a
#    permission here works normally.
#
# ── ORDERING AFTER A DISASTER RESTORE ────────────────────────────────────────
# `!Find` on user `svc-infraweaver-console` requires that account to already
# exist. It was created imperatively during the 2026-08-07 rotation
# (docs/BREAK-GLASS.md §10 step 1) and that step is NOT in git. On a restore onto
# an empty database this blueprint will fail to bind the user until the account
# is recreated — same class of issue as the break-glass account's dormant-after-
# restore note. Recreate the service account first, then re-apply.
#
# ── REMINDER: THIS FILE DOES NOTHING UNLESS IT IS LISTED ─────────────────────
# A blueprint ConfigMap that is not named in `blueprints.configMaps` in
# kubernetes/platform/authentik/values.yaml is mounted nowhere and never applied.
# The companion edit to that list ships in the same commit as this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-console-scope
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
data:
  console-scope.yaml: |
    version: 1
    metadata:
      name: InfraWeaver Console Service Account Scope
      labels:
        blueprints.goauthentik.io/description: >-
          Least-privilege role + non-superuser group for svc-infraweaver-console.
          Additive only: creating these does not change the account's effective
          rights while it remains in `authentik Admins`. Dropping superuser is an
          attended operator step (SECURITY-REMEDIATION-RUNBOOK.md §P1.4).
    entries:
      # state: present — unlike the break-glass account, drift here SHOULD be
      # re-asserted. A future console feature that calls a new Authentik endpoint
      # must extend THIS list, not hand-edit the role (see trap 3 above: adding
      # works, removing does not).
      - model: authentik_rbac.role
        state: present
        id: role-infraweaver-console
        identifiers:
          name: role-infraweaver-console
        attrs:
          permissions:
            # ── users ────────────────────────────────────────────────────────
            # GET/PATCH/DELETE /core/users/. No add_user: user creation goes
            # through the invitation enrollment flow, not the API.
            - authentik_core.view_user
            - authentik_core.change_user
            - authentik_core.delete_user
            # POST /core/users/{pk}/recovery/ — self-service + admin reset.
            - authentik_core.reset_user_password
            # ── groups ───────────────────────────────────────────────────────
            # SSO client creates/deletes gate groups; RBAC assigns membership.
            - authentik_core.view_group
            - authentik_core.add_group
            - authentik_core.change_group
            - authentik_core.delete_group
            - authentik_core.add_user_to_group
            - authentik_core.remove_user_from_group
            # ── tokens ───────────────────────────────────────────────────────
            # Profile→Sessions and offboard revoke tokens. view_token is ALSO the
            # P1.1 dependency: the expiry exporter reads
            # GET /core/tokens/?identifier=iw-console-api-token every scrape.
            # Removing it silently blinds that alert.
            - authentik_core.view_token
            - authentik_core.delete_token
            # ── applications ─────────────────────────────────────────────────
            - authentik_core.view_application
            - authentik_core.add_application
            - authentik_core.change_application
            - authentik_core.delete_application
            # ── read-only surfaces ───────────────────────────────────────────
            # Security→Auth events, Profile→Activity, user history.
            - authentik_events.view_event
            # Resolve the invitation enrollment flow by slug.
            - authentik_flows.view_flow
            # ── invitations ──────────────────────────────────────────────────
            # No delete_invitation: unused today, and drill invitations are
            # created with an expiry and age out on their own.
            - authentik_stages_invitation.add_invitation
            - authentik_stages_invitation.view_invitation
            # ── MFA device reset (exactly the three types the console lists) ──
            - authentik_stages_authenticator_totp.view_totpdevice
            - authentik_stages_authenticator_totp.delete_totpdevice
            - authentik_stages_authenticator_static.view_staticdevice
            - authentik_stages_authenticator_static.delete_staticdevice
            - authentik_stages_authenticator_webauthn.view_webauthndevice
            - authentik_stages_authenticator_webauthn.delete_webauthndevice
            # ── providers (SSO client full lifecycle) ────────────────────────
            - authentik_providers_proxy.view_proxyprovider
            - authentik_providers_proxy.add_proxyprovider
            - authentik_providers_proxy.change_proxyprovider
            - authentik_providers_proxy.delete_proxyprovider
            - authentik_providers_oauth2.view_oauth2provider
            - authentik_providers_oauth2.add_oauth2provider
            - authentik_providers_oauth2.change_oauth2provider
            - authentik_providers_oauth2.delete_oauth2provider
            - authentik_providers_oauth2.view_scopemapping
            # ── policy bindings ──────────────────────────────────────────────
            # No delete: bindings cascade when their application is deleted.
            - authentik_policies.view_policybinding
            - authentik_policies.add_policybinding
            # ── outposts ─────────────────────────────────────────────────────
            # PATCH attaches newly created proxy providers to the embedded
            # outpost. No add/delete — the console never creates an outpost.
            - authentik_outposts.view_outpost
            - authentik_outposts.change_outpost
            # ── crypto (read-only; certificate PICKER, never a write) ────────
            - authentik_crypto.view_certificatekeypair

      # Dedicated to the one service account, so asserting the full `users` list
      # is safe here — unlike `authentik Admins`, which this file never touches.
      # is_superuser is pinned false EXPLICITLY: authentik derives a user's
      # superuser flag from group membership, so an accidental true here would
      # hand back everything this change exists to take away.
      - model: authentik_core.group
        state: present
        id: group-infraweaver-console-scope
        identifiers:
          name: svc-infraweaver-console-scope
        attrs:
          is_superuser: false
          roles:
            - !Find [authentik_rbac.role, [name, role-infraweaver-console]]
          users:
            - !Find [authentik_core.user, [username, svc-infraweaver-console]]
          attributes:
            managed_by: "kubernetes/platform/authentik/manifests/blueprints/60-console-service-account-scope.yaml"
            runbook: "docs/SECURITY-REMEDIATION-RUNBOOK.md#p14"
