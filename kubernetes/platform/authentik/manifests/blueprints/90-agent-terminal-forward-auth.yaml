---
# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  The Authentik gate for the in-cluster agent terminal.                    ║
# ║                                                                          ║
# ║  WITHOUT THIS FILE THE TERMINAL IS NOT PROTECTED — IT IS UNREACHABLE.     ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
# WHAT WAS WRONG (measured 2026-08-15)
# kubernetes/platform/agent/terminal.yaml puts the ttyd shell behind Traefik's
# `forward-auth-admin` middleware, the same one ArgoCD uses. That looked done. It
# was not: the middleware only forwards the request to the embedded outpost, and
# the outpost decides what to do by matching the request's Host against a proxy
# provider's `external_host`. NO PROVIDER EXISTED for terminal.int.<domain>, so
# the outpost had nothing to match and answered 404.
#
#   https://argocd.int.<domain>    -> 302, redirect to Authentik  (correctly gated)
#   https://terminal.int.<domain>  -> 404 from the outpost        (no provider)
#
# It failed CLOSED, which is the only reason this is a gap and not an incident.
# But it also meant nobody could use the terminal at all, authenticated or not —
# which is why the agent sat "deployed" and unusable from 2026-08-14.
#
# WHY THE GENERATOR MISSED IT
# scripts/generate-forward-auth-blueprint.py discovers hosts by scanning Traefik
# IngressRoute manifests for the middleware named exactly `forward-auth`. The
# terminal deliberately uses `forward-auth-admin`, the stricter gate, so the
# generator skipped it and nothing else filled the gap. Do NOT "fix" that by
# renaming the terminal's middleware to the weaker one — the admin gate is the
# point. This file supplies the provider the generator will never produce.
#
# WHY A SEPARATE FILE AND NOT THE GENERATED BLUEPRINT
# That blueprint is rewritten wholesale by the script, and running it by hand has
# already destroyed 57 of 58 providers once. An additive, hand-maintained file
# cannot be clobbered by a regeneration.
#
# THE BINDING IS THE SECURITY CONTROL
# `policy-admins-only` is the same expression policy that gates every other admin
# surface. `policy_engine_mode: any` with exactly one enabled binding means a
# request is admitted only if that policy passes. This is a SHELL: a session here
# reaches whatever the pod's ServiceAccount can reach, so "any authenticated
# user" would be far too wide. If the binding is ever removed, the application
# falls open to every authenticated account. Keep it.
#
# ⚠️ THIS GATE IS THE PREREQUISITE FOR ANY WRITE ACCESS. The session pod's RBAC
# is read-only today. Do not grant the agent write verbs until this file is
# applied and a live probe shows terminal.int answering 302 rather than 404.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-agent-terminal
  namespace: authentik
data:
  agent-terminal-forward-auth.yaml: |
    version: 1
    metadata:
      name: InfraWeaver Agent Terminal Forward-Auth
      labels:
        blueprints.goauthentik.io/description: >-
          Forward-auth provider, application and admins-only policy binding for
          the in-cluster agent terminal. Without it the embedded outpost has no
          provider matching terminal.int.<domain> and answers 404 to everyone.
    entries:
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers: { name: Agent Terminal Forward-Auth Provider }
        attrs:
          name: Agent Terminal Forward-Auth Provider
          mode: forward_single
          external_host: "https://terminal.int.${BASE_DOMAIN}"
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers: { slug: agent-terminal-fwd }
        attrs:
          name: InfraWeaver Agent Terminal
          slug: agent-terminal-fwd
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, Agent Terminal Forward-Auth Provider]]
          policy_engine_mode: any

      # The one control standing between an authenticated account and a shell.
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, agent-terminal-fwd]]
          order: 10
        attrs:
          target: !Find [authentik_core.application, [slug, agent-terminal-fwd]]
          policy: !Find [authentik_policies_expression.expressionpolicy, [name, policy-admins-only]]
          enabled: true
          order: 10
          negate: false
          timeout: 30

      # ── The ELEVATED shell (kubernetes/platform/agent/terminal-admin.yaml) ──
      # Separate hostname, separate ServiceAccount, separate volume. This one can
      # change production, so the binding below is doing more work than the one
      # above: it is the only thing between an authenticated account and a shell
      # that can delete a StatefulSet.
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers: { name: Agent Admin Forward-Auth Provider }
        attrs:
          name: Agent Admin Forward-Auth Provider
          mode: forward_single
          external_host: "https://agent.int.${BASE_DOMAIN}"
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers: { slug: agent-admin-fwd }
        attrs:
          name: InfraWeaver Agent (admin shell)
          slug: agent-admin-fwd
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, Agent Admin Forward-Auth Provider]]
          policy_engine_mode: any

      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, agent-admin-fwd]]
          order: 10
        attrs:
          target: !Find [authentik_core.application, [slug, agent-admin-fwd]]
          policy: !Find [authentik_policies_expression.expressionpolicy, [name, policy-admins-only]]
          enabled: true
          order: 10
          negate: false
          timeout: 30
