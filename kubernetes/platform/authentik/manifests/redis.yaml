# Standalone Redis for Authentik
# Required since authentik chart 2026.x dropped the Redis subchart dependency.
# Authentik workers connect to AUTHENTIK_REDIS__HOST=authentik-redis-master (from values.yaml).
apiVersion: v1
kind: Service
metadata:
  name: authentik-redis-master
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-redis
    app.kubernetes.io/component: master
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    app.kubernetes.io/name: authentik-redis
    app.kubernetes.io/component: master
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: authentik-redis-master
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-redis
    app.kubernetes.io/component: master
spec:
  serviceName: authentik-redis-master
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-redis
      app.kubernetes.io/component: master
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-redis
        app.kubernetes.io/component: master
    spec:
      priorityClassName: platform-high
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: redis
          image: docker.io/redis:7-alpine
          command: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            exec:
              command: [redis-cli, ping]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
        annotations:
          # ⚠️ INERT — BACKS NOTHING UP, AND NOTHING IS MEANT TO BACK IT UP.
          # Measured 2026-08-07: this PVC is `local-path`, pinned by PV
          # nodeAffinity to talos-prod-cp3's disk, so no Longhorn RecurringJob
          # can see it; and PVC annotations never propagate to a Longhorn Volume
          # CR in any case (see kubernetes/core/longhorn/manifests/backup-jobs.yaml).
          #
          # DECIDED 2026-08-07: Authentik Redis is ACCEPTED LOSS. It holds
          # sessions, cache and the task queue — no system of record. Losing cp3
          # means every user re-authenticates and in-flight tasks retry. There is
          # deliberately no backup and none is planned; the SSO *database* is
          # covered by manifests/pg-backup.yaml instead.
          #
          # Left in place rather than deleted because it renders into
          # `volumeClaimTemplates`, which Kubernetes forbids updating — removing
          # it would fail every apps-authentik-manifests sync on an
          # immutable-field rejection. It goes when this StatefulSet is next
          # recreated.
          recurring-job-group.longhorn.io/truenas-backup: "enabled"
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 256Mi
