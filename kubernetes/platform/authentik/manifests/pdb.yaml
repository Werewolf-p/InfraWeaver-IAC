---
# PodDisruptionBudget for Authentik server
# Ensures at least 1 Authentik pod is available during node drains (login remains functional).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: authentik-server-pdb
  namespace: authentik
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: server
      app.kubernetes.io/name: authentik
---
# PodDisruptionBudget for Authentik worker
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: authentik-worker-pdb
  namespace: authentik
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
      app.kubernetes.io/name: authentik
# NOTE: `authentik-ldap-outpost-pdb` lived here until 2026-08-07. It selected
# ZERO pods (the outpost Deployment had been 0/0 for 54 days) while advertising
# minAvailable: 1 — a PDB that protected nothing and, worse, read as evidence
# that LDAP auth was a live control. Removed with the rest of the dead outpost.
# `apps-authentik-manifests` has prune: true, so the live PDB is pruned on sync.
