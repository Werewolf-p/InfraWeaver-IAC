global:
  # Mount custom branding images as static files so they are served
  # permanently at /static/dist/assets/icons/<filename> (no JWT expiry).
  # subPath mounts add individual files without replacing the whole directory.
  volumes:
    - name: authentik-media
      configMap:
        name: authentik-media
  volumeMounts:
    - name: authentik-media
      mountPath: /web/dist/assets/icons/logo.png
      subPath: logo.png
      readOnly: true
    - name: authentik-media
      mountPath: /web/dist/assets/icons/favicon.png
      subPath: favicon.png
      readOnly: true
    - name: authentik-media
      mountPath: /web/dist/assets/icons/banner.png
      subPath: banner.png
      readOnly: true

  # Inject secrets from ExternalSecret-managed K8s secret (authentik-secrets)
  env:
    - name: AUTHENTIK_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: secret-key
    - name: AUTHENTIK_BOOTSTRAP_PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: bootstrap-password
    - name: AUTHENTIK_BOOTSTRAP_TOKEN
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: bootstrap-token
    - name: AUTHENTIK_BOOTSTRAP_EMAIL
      # Sourced from the envsubst-rendered ConfigMap (manifests/email-configmap.yaml).
      # A literal "akadmin@${BASE_DOMAIN}" here is NOT substituted — this app's
      # Helm source bypasses the envsubst CMP plugin.
      valueFrom:
        configMapKeyRef:
          name: authentik-email-addresses
          key: bootstrap-email
    - name: AUTHENTIK_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: admin-password
          # No optional: true — pod must fail if password key is missing.
          # Silently empty password → blueprint runs without setting it → user locked out.

    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: postgresql-password
    - name: AUTHENTIK_EMAIL__USERNAME
      valueFrom:
        secretKeyRef:
          name: authentik-smtp-secret
          key: smtp-username
    - name: AUTHENTIK_EMAIL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-smtp-secret
          key: smtp-password
    # FROM must equal the authenticated SMTP mailbox. Office365/Outlook submission
    # rejects a From that differs from the login mailbox (550 5.7.60 "not allowed to
    # send as this sender") unless SendAs is granted. Sourcing FROM from the SAME
    # secret key as the username guarantees they always match — no drift on rotation.
    # (Overrides the chart's authentik.email.from.)
    - name: AUTHENTIK_EMAIL__FROM
      valueFrom:
        secretKeyRef:
          name: authentik-smtp-secret
          key: smtp-username
    # 4 Gunicorn workers — reduces the chance of a request hitting a worker that
    # is being recycled (max_requests reached). With 4 workers, 3 remain available
    # while one restarts, eliminating the intermittent "flow infinite load" on first click.
    - name: AUTHENTIK_WEB__WORKERS
      value: "4"

authentik:
  # secret_key must be non-empty for chart templating; actual value from env var above
  secret_key: "placeholder-overridden-by-env"
  log_level: info
  error_reporting:
    enabled: false
  email:
    host: "smtp-mail.outlook.com"
    port: 587
    use_tls: true
    use_ssl: false
    timeout: 30
    # NOTE: `from` is intentionally NOT set here. It is injected via the
    # AUTHENTIK_EMAIL__FROM env var (see global.env above), sourced from the
    # envsubst-rendered authentik-email-addresses ConfigMap. Setting it here with
    # "${BASE_DOMAIN}" would reach the pod literally (this Helm source skips envsubst).
  postgresql:
    host: "authentik-postgresql"
    name: "authentik"
    user: "authentik"
    password: ""  # supplied via AUTHENTIK_POSTGRESQL__PASSWORD env var
    port: 5432
  # NO `redis:` KEY — REMOVED 2026-08-13, and it must not come back.
  #
  # Authentik dropped Redis upstream in 2025.10; this instance runs 2026.5.6.
  # The key was not merely unused, it was UNREADABLE: measured on the live
  # worker, `[k for k in dir(settings) if 'REDIS' in k.upper()]` returns `[]`.
  # There is no Redis setting left in the application to populate, so
  # `authentik.redis.host` rendered an AUTHENTIK_REDIS__HOST env var that
  # nothing ever read. What replaced it, all read from the same live settings:
  #     SESSION_ENGINE  authentik.core.sessions          (PostgreSQL)
  #     CACHES.default  django_postgres_cache…DatabaseCache
  #     CHANNEL_LAYERS  django_channels_postgres…PostgresChannelLayer
  #
  # Re-adding this key does NOT re-enable anything. It only re-adds a dead env
  # var — and, because the chart stamps `checksum/secret` on both pod
  # templates, it restarts the server and worker to do it.

# Blueprint ConfigMaps mounted into the WORKER pod at
# /blueprints/mounted/cm-<name>/. This list is the only thing that mounts them:
# a ConfigMap that exists in the namespace but is missing here is never mounted
# and never applied — config-as-code in appearance only. Adding a blueprint
# therefore always means two edits: the manifest, and this list.
blueprints:
  configMaps:
    - authentik-blueprint-branding
    - authentik-blueprint-users
    - authentik-blueprint-apps
    - authentik-blueprint-access-control
    - authentik-blueprint-forward-auth
    - authentik-blueprint-invitation-flow
    - authentik-blueprint-recovery-email
    # ── Session lifetime cap (manifests/blueprints/80-…) ─────────────────────
    # Absolute 12h cap on every authenticated session, replacing the
    # `session_duration: seconds=0` default under which expiry slid forward on
    # every session write and nothing bounded total session age. Listed rather
    # than deferred because it CANNOT lock anyone out: the worst case is an
    # earlier login prompt, and 12h clears the console's 1h staleness floor by
    # 12x. See the header of the blueprint for the measurements.
    - authentik-blueprint-session-lifetimes
    # ── Agent terminal gate (manifests/blueprints/90-…) ──────────────────────
    # The in-cluster shell's forward-auth provider + admins-only binding. The
    # auto-generated forward-auth blueprint cannot produce it: that generator
    # only matches IngressRoutes using the middleware named `forward-auth`, and
    # the terminal uses the stricter `forward-auth-admin`. Until this applied,
    # the embedded outpost had no provider for terminal.int.<domain> and returned
    # 404 to everyone — the shell was gated shut rather than gated.
    - authentik-blueprint-agent-terminal
    # ── WP11 / GAP-C5 (manifests/blueprints/) ────────────────────────────────
    - authentik-blueprint-break-glass      # dormant recovery admin (stage 2)
    - authentik-blueprint-current-state    # no-op export of the auth path (stage 1)
    - authentik-blueprint-mfa-enrollment   # validation stage, bound to nothing (stage 3)
    # ARMED 2026-08-07 — this closes a live hole; it is not an MFA flip.
    # 13 of 74 Applications had NO policy binding, and an unbound application
    # admits EVERY authenticated user. Six had a reachable surface; the worst
    # was `route-truenas`.
    #
    # Verified live before arming, because the obvious reading is wrong:
    #   app `truenas`       -> external_host truenas.example.com      1 binding
    #   app `route-truenas` -> external_host truenas.int.example.com  0 bindings
    # Only the .int host has an IngressRoute (traefik, secure-headers +
    # forward-auth). So the forward-auth challenge on the LIVE TrueNAS admin UI
    # was answered by the unbound application, and all 7 active users — every
    # WordPress-site and Nextcloud account — passed it. The infra-truenas group
    # that appears to gate storage administration was gating a hostname that
    # has no route.
    #
    # Lockout risk was CHECKED, not assumed: infra-truenas, infra-proxmox and
    # infra-containers all have ZERO members, so binding on group membership
    # alone would have locked everyone out. Each of these policies is
    # `platform-admins OR infra-<x>`, and policy-admins-only is
    # `is_superuser OR platform-admins`; platform-admins has 1 member. Admin
    # access is preserved; the other six users lose access they should never
    # have had.
    - authentik-blueprint-app-access-backfill
    # ── P1.4 stage 1 (manifests/blueprints/60-…) ─────────────────────────────
    # Creates role-infraweaver-console + the non-superuser group
    # svc-infraweaver-console-scope and puts the console's service account in it.
    # Listed because it is ADDITIVE and safe: while the account is still in
    # `authentik Admins` its effective rights do not change at all. The step that
    # actually lowers privilege is removing it from `authentik Admins`, which is
    # an attended operator action, NOT a line in this list — see
    # docs/SECURITY-REMEDIATION-RUNBOOK.md §P1.4.
    - authentik-blueprint-console-scope
    # ── WP11 / brute-force lockout (manifests/blueprints/70-…) ───────────────
    # ARMED 2026-08-13, together with the Cloudflare trustedIPs fix in
    # core/traefik/values.yaml that this depended on. Before that fix Authentik
    # recorded a Cloudflare edge address as every caller's IP (measured: the top
    # 20 external login client_ips over 30 days were all Cloudflare), so an
    # IP-reputation lockout would have punished everyone behind an edge and
    # missed the attacker.
    #
    # The binding is `negate: true` and that is LOAD-BEARING — ReputationPolicy
    # returns TRUE for BAD reputation, so an un-negated binding denies EVERY
    # user on first sync. Verified against the running pod's own source, not
    # from memory; see §2 / §2b of the blueprint.
    #
    # It was DISARMED once, 2026-08-13, before it ever merged: the branch
    # carrying it (fix/traefik-cloudflare-xff-arm-brute-force) put the mount and
    # the warning in the same commit, so merging would have armed the policy
    # while the hole it warns about was wide open. Kept below, because the reason
    # it was disarmed is the reason it may be armed now.
    #
    # Cloudflare APPENDS to a caller-supplied X-Forwarded-For and Authentik reads
    # the FIRST entry, so with this mounted:
    #   * a credential-stuffer rotates the spoofed first entry per attempt and no
    #     address ever reaches the threshold — the control does nothing;
    #   * 21 failed logins carrying `X-Forwarded-For: <victim>` deny login to that
    #     address for 24h, and any unauthenticated caller picks the victim. That
    #     is a NEW remote DoS on login, created by adding a security control.
    #
    # WHY IT COULD NOT SIMPLY BE FIXED TODAY, measured rather than assumed:
    #   * The Cloudflare token this platform holds is DNS-scoped: reading
    #     zones/<id>/rulesets/phases/http_request_late_transform/entrypoint
    #     returns "Authentication error". Re-checked 2026-08-13 — the console's
    #     `cloudflare-api-token` and external-dns's are the SAME token (identical
    #     digest), so there is no second, broader one to reach for. The Transform
    #     Rule needs a token with Zone → Transform Rules → Edit, or a hand edit in
    #     the dashboard.
    #   * ⚠️ AND THE PLANNED RULE WAS THE WRONG ONE. "Set dynamic X-Forwarded-For
    #     = ip.src" is refused by Cloudflare — Transform Rules may not WRITE the
    #     visitor-identifying headers. Only REMOVE works, after which Cloudflare
    #     writes its own single authoritative value. Corrected in the blueprint's
    #     §3c; `scripts/cloudflare-xff-transform.sh` applies the remove and probes
    #     the result end-to-end through the edge.
    #   * Reading CF-Connecting-IP instead is not available: grepped on the
    #     running pod, /authentik/root/middleware.py:198 consults exactly one
    #     header, HTTP_X_FORWARDED_FOR. `listen.trusted_proxy_cidrs` in
    #     /authentik/lib/default.yml governs whether XFF is trusted from the
    #     pod's peer, not which header or which index is read.
    #
    # The Traefik trustedIPs half of that branch DOES stay. On its own it only
    # changes what Authentik RECORDS — real client IPs for honest traffic instead
    # of a Cloudflare edge for everyone — and with no policy consuming the score,
    # nothing acts on a forged value. Note the trade honestly: a hostile caller
    # can now poison the client_ip in the event log. That is worth it for
    # attribution, and it is exactly why the lockout may not be armed on top of
    # it. Re-arm by restoring this line ONLY after §3c is confirmed live, per
    # step 0b of the blueprint's arming procedure — the check is that a request
    # sent with a bogus X-Forwarded-For is recorded under the real caller, and it
    # is one command: `bash scripts/cloudflare-xff-transform.sh --verify`, which
    # must print AUTHORITATIVE. It printed SPOOFABLE on 2026-08-13.
    # `scripts/validate-iac.sh` gate 6 fails the build if this line comes back
    # while the blueprint still marks §3c outstanding.
    #
    # ✅ RE-ARMED 2026-08-13, on evidence rather than on a plan. The Cloudflare
    # Transform Rule now REMOVES the visitor-supplied X-Forwarded-For at the edge
    # (see the blueprint's §3c for why "set" was impossible), and the probe that
    # used to prove the hole now proves it closed: a request carrying
    # `X-Forwarded-For: 203.0.113.77` through the edge is recorded by Authentik
    # under the real caller. Re-check with
    #     bash scripts/cloudflare-xff-transform.sh --verify
    # which must print AUTHORITATIVE. Comment this line out again if it does not.
    - authentik-blueprint-brute-force
    # NOT listed, deliberately — these are the MFA enforcement flips, and they
    # can lock the sole administrator out of every admin surface at once.
    # Adding a name here is the second of two gates a human must open, and
    # stage 4 additionally requires break-glass to have been ARMED AND
    # EXERCISED first. See manifests/blueprints/README.md.
    #   - authentik-blueprint-mfa-required-admins    (stage 4)
    #   - authentik-blueprint-mfa-required-all       (stage 5)

postgresql:
  enabled: true
  auth:
    username: authentik
    database: authentik
    existingSecret: authentik-secrets
    secretKeys:
      userPasswordKey: postgresql-password
  primary:
    priorityClassName: platform-high
    # ── jit = off IS LOAD-BEARING. DO NOT DROP EITHER LINE BELOW. ────────────
    # On 2026-08-09 every login failed: the PostgreSQL JIT compiler segfaulted
    # the backend mid-query, so Authentik could not authenticate anyone and the
    # whole platform — console, ArgoCD, Nextcloud, Jellyfin, the WordPress
    # fleet — was locked out. The fix applied at the time was
    #     ALTER DATABASE authentik SET jit = off;
    # typed into psql. It worked, and it existed in NO manifest: measured
    # 2026-08-13, `pg_settings.source` for jit read `database` with an empty
    # `sourcefile`, i.e. the only copy of the fix lived in a system catalogue.
    #
    # Two independent ways that fix could evaporate, which is why it is here:
    #   1. Restore. The nightly dump is a plain `pg_dump -Fc` of ONE database;
    #      a database-level `ALTER DATABASE … SET` is not inside it. Restoring
    #      it onto a fresh cluster silently reintroduced the outage. That half
    #      is now fixed separately by `--create` in manifests/pg-backup.yaml.
    #   2. Any rebuild of this StatefulSet onto an empty PGDATA.
    # Setting it in postgresql.conf makes it a property of the SERVER, so it
    # holds for every database and survives both paths regardless of the dump.
    #
    # ⚠️ max_connections MUST STAY. This key REPLACES the authentik chart's own
    # default for extendedConfiguration, which is exactly `max_connections = 500`
    # (verified against the live ConfigMap authentik-postgresql-extended-
    # configuration). Setting only `jit = off` here would silently drop the
    # connection ceiling back to Postgres' default of 100 and starve Authentik.
    #
    # ⚠️ APPLYING THIS ROLLS POSTGRES. The chart stamps
    # `checksum/extended-configuration` onto the pod template, so the first sync
    # after this change restarts authentik-postgresql-0 — a short, expected
    # Authentik outage. Sync it deliberately, not incidentally. (`jit` itself is
    # a USERSET GUC and would only need a reload; it is the chart's checksum,
    # not Postgres, that forces the restart.)
    extendedConfiguration: |
      max_connections = 500
      jit = off
    persistence:
      annotations:
        # ⚠️ THIS ANNOTATION IS INERT. IT BACKS NOTHING UP. Do not read it as
        # protection. It is doubly ineffective, both parts measured 2026-08-07:
        #   1. This PVC is `local-path`, not a Longhorn volume, so no Longhorn
        #      RecurringJob can ever see it. The PV is pinned by nodeAffinity to
        #      talos-prod-cp2's disk.
        #   2. Even on a Longhorn volume it would do nothing: PVC annotations do
        #      not propagate to the Longhorn Volume CR — only a StorageClass
        #      `recurringJobSelector` or a label on the Volume itself enrols a
        #      volume. See the long note in
        #      kubernetes/core/longhorn/manifests/backup-jobs.yaml.
        #
        # WHY IT IS STILL HERE rather than deleted: this key renders into the
        # StatefulSet's `volumeClaimTemplates`, and Kubernetes forbids updating
        # any StatefulSet spec field other than replicas/ordinals/template/
        # updateStrategy/persistentVolumeClaimRetentionPolicy/minReadySeconds.
        # Removing it would make every ArgoCD sync of platform-authentik fail on
        # an immutable-field rejection — trading a misleading comment for a
        # broken deploy. It comes out in the same maintenance window that
        # recreates the StatefulSet (see the Longhorn-migration option in
        # docs/BACKUP-AND-RESTORE-RUNBOOK.md §1).
        #
        # THE ACTUAL BACKUP for this database is the nightly logical dump in
        # manifests/pg-backup.yaml → Longhorn PVC → 01:00 NAS backup.
        recurring-job-group.longhorn.io/truenas-backup: "enabled"
      # ── 2026-08-18: MOVED OFF local-path. This is the retry that the note
      # below spent four days asking for, with its precondition finally met.
      #
      # HISTORY. Longhorn was attempted 2026-08-14 and reverted the same day:
      # with cp4 (hypatia, ~16 ms over WireGuard) in the replica set, Postgres
      # died with
      #     FATAL: could not open file "global/pg_filenode.map": I/O error
      # because Longhorn acknowledges writes from EVERY replica, so one
      # internet-latency replica stalls the whole volume. The stated
      # precondition for retrying was to "fence latency-sensitive volumes off
      # the remote node (Longhorn disk tags / a dedicated StorageClass with a
      # diskSelector)".
      #
      # THAT FENCE NOW EXISTS: kubernetes/core/longhorn/manifests/
      # storageclass-lowlat.yaml. cp1 and cp3 disks are tagged `lowlat`, cp4's
      # is not, and this class sets diskSelector "lowlat" — so a replica of
      # this volume can never be placed across the stretched VLAN. Note the
      # `offsite` tag already on cp4 did NOT do this on its own: measured
      # 2026-08-18, all 27 volumes (every one with an empty diskSelector) had a
      # replica on that "offsite" disk. Exclusion has to come from the volume.
      #
      # WHY IT COULD NOT WAIT. local-path pinned this database to cp1 by PV
      # nodeAffinity. On 2026-08-18 cp1 started corrupting container images —
      # `postgres:17.10-bookworm` failed `exec format error` on EVERY binary in
      # the image including /usr/bin/sh, while the identical image ran on cp3
      # and cp4 with matching entrypoint sha256 9c440299ae04… That took SSO,
      # and therefore 41 of 45 Traefik routes, down hard, and the local-path
      # pin meant the pod could not be moved anywhere. One bad node must not be
      # able to do that to SSO again.
      storageClass: longhorn-lowlat
      size: 2Gi
    resources:
      requests:
        cpu: 400m
        memory: 768Mi
      limits:
        # ⚠️ cpu was 500m and that was a real bottleneck, not headroom. Measured
        # 2026-08-16 straight from the container cgroup while the database sat at
        # 490m: nr_throttled 528 of 2598 periods (20.3%), 20.24 s of throttled
        # time. Every one of those stalls lands inside an Authentik request, and
        # Authentik forward-auth gates 41 of 45 Traefik routes.
        #
        # This is a SECOND, independent cause of the 2026-08-15 slowdown. Moving
        # authentik-server back next to this database cut the round trip from
        # 16.27 ms to 1.12 ms and the requests were still ~400 ms, which is what
        # exposed the throttling underneath.
        cpu: 2000m
        memory: 1280Mi   # was 768Mi → OOMKilled (exit 137) under normal load; give real headroom
    # ⚠️ MUST stay in a low-latency zone with authentik-server. Measured
    # 2026-08-16: cp1<->cp3 is 0.19-0.63 ms, but either to cp4 (zone=hypatia, a
    # Hetzner box across the stretched VLAN) is 14.9-16.3 ms. An Authentik
    # request makes ~7.7 DB round trips, so a server/database split across that
    # link costs >=125 ms per request -- and Authentik forward-auth backs 41 of
    # 45 Traefik routes, so it is paid by nearly every surface on the platform.
    #
    # This is REQUIRED, not preferred. The previous rule was a weight-60
    # preference naming talos-prod-cp2, a node that no longer exists, which left
    # nothing but a soft hint -- and on 2026-08-15 the scheduler duly placed the
    # server on cp4 and Traefik p95 for authentik went 0.274 s -> 3.881 s.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: topology.kubernetes.io/zone
              operator: NotIn
              values:
              - hypatia
            # The cp1 exclusion that lived here (added 2026-08-18, "until it is
            # understood and proven fixed") was REMOVED later the same day,
            # because both halves of that condition were met.
            #
            # Understood: cp1 was not corrupting images, it was losing writes.
            # Its containerd content store was byte-perfect — every blob read
            # back and hashed — while the UNPACKED overlayfs snapshots held
            # files with correct name, mode, owner and mtime and ZERO length. A
            # 0-byte file with the exec bit set makes execve() return ENOEXEC,
            # which is exactly `exec format error`. XFS journals metadata but
            # not file data, and the guest was rebooted uncleanly nine minutes
            # after those layers were unpacked. busybox survived because it was
            # pulled first and its writeback completed.
            #
            # Proven fixed: the damaged images were removed via the CRI and
            # re-pulled, and each repaired file now hashes IDENTICALLY to the
            # same file on cp4 (postgres, coredns, promtail, cilium), verified
            # by exec'ing the binaries rather than by "the pod started".
            #
            # Keeping the exclusion had a cost that had become the larger risk:
            # with hypatia excluded for latency and cp1 excluded for this, cp3
            # was the ONLY eligible node, and cp3 (12 GiB) hit 99% memory
            # requests — which left three WordPress sites unschedulable.

# No Redis. The authentik chart dropped the bundled Redis subchart in 2026.x and
# the application dropped Redis entirely in 2025.10; the standalone StatefulSet
# that used to stand in for it (manifests/redis.yaml) was deleted 2026-08-13
# after measuring that it served nothing but its own liveness probes. See the
# note on the absent `authentik.redis` key above.

server:
  replicas: 1  # Memory-optimised: single replica saves ~800Mi; requiredAntiAffinity is trivially satisfied
  priorityClassName: platform-high
  nodeSelector: {}
  podAnnotations:
    infraweaver.io/rebalance-memory: "true"
  ingress:
    enabled: false
  # Explicit rolling-update strategy: never take a pod down before a new one is ready.
  # With 2 replicas and maxUnavailable=0, Kubernetes always keeps both pods serving
  # traffic until the replacement is healthy — zero downtime during ArgoCD-triggered
  # rollouts or resource-limit changes from the cluster editor.
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  # Give enough time for Django migrations on a fresh DB (292+ migrations)
  # NOTE: Authentik chart does NOT support livenessProbe.enabled field — use raw k8s probe fields only
  startupProbe:
    timeoutSeconds: 10
  livenessProbe:
    initialDelaySeconds: 120
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 30
  readinessProbe:
    # 30s is enough: Authentik static responses are available well before all migrations complete.
    # Reduced from 60s so rolling updates complete faster (old pod released sooner).
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 6
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: authentik
          app.kubernetes.io/component: server
  affinity:
    # REQUIRED anti-affinity: force 2 server replicas onto 2 different nodes for true HA.
    # With 3 nodes, this guarantees a node reboot can only take down 1 of 2 replicas.
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: authentik
              app.kubernetes.io/component: server
          topologyKey: kubernetes.io/hostname
    # REQUIRED: never across the stretched VLAN from PostgreSQL. See the note on
    # postgresql.affinity above -- ~15 ms x ~7.7 DB round trips per request.
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: NotIn
                values:
                  - hypatia
              # The cp1 exclusion here was removed 2026-08-18 once the image
              # damage was understood (lost writes after an unclean shutdown,
              # not corruption) and the repair proven by hash against cp4 — see
              # the long note on postgresql.affinity. cp1 and cp3 are both
              # eligible again, which is what stops server and worker from
              # collapsing onto one node. Historical note follows:
              # requiredDuringScheduling podAntiAffinity above is currently
              # satisfiable at replicas=1 ONLY. Raising either replica count
              # before cp1 is trusted again will leave the extra pods Pending.
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1500Mi

worker:
  replicas: 1  # Memory-optimised: single worker saves ~500Mi
  priorityClassName: platform-high
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: authentik
          app.kubernetes.io/component: worker
  affinity:
    # REQUIRED anti-affinity: force worker replicas onto different nodes too.
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: authentik
              app.kubernetes.io/component: worker
          topologyKey: kubernetes.io/hostname
    # REQUIRED: never across the stretched VLAN from PostgreSQL. See the note on
    # postgresql.affinity above -- ~15 ms x ~7.7 DB round trips per request.
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: NotIn
                values:
                  - hypatia
              # ⚠️ cp1 CORRUPTS CONTAINER IMAGES (2026-08-18) — see the long
              # note on postgresql.affinity. This is why the line above no
              # longer says "leaves cp1 and cp3 eligible": only cp3 is. That
              # genuinely does collapse server and worker onto one node, so the
              # requiredDuringScheduling podAntiAffinity above is currently
              # satisfiable at replicas=1 ONLY. Raising either replica count
              # before cp1 is trusted again will leave the extra pods Pending.
  # Give enough time for Django migrations on a fresh DB (292+ migrations)
  # NOTE: Authentik chart does NOT support livenessProbe.enabled field — use raw k8s probe fields only
  startupProbe:
    timeoutSeconds: 10
  livenessProbe:
    initialDelaySeconds: 120
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 30
  readinessProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 6
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
