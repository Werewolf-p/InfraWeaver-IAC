---
# ExternalSecret — Velero's S3 credentials for the in-cluster MinIO backup store.
#
# Reuses the ALREADY-PROVISIONED OpenBao path secret/platform/minio-velero, the
# same one minio-velero itself reads. No new credential has to be created: the
# sibling ExternalSecret velero/minio-velero-credentials is live and
# SecretSynced=True against this exact path, which proves both properties exist.
#
#   bao kv get secret/platform/minio-velero     # -> access_key, secret_key
#
# The Velero chart mounts the resulting Secret at /credentials and sets
# AWS_SHARED_CREDENTIALS_FILE=/credentials/cloud, so the target template has to
# render an AWS INI file under the key `cloud`. That is what values.yaml's
# `credentials.existingSecret: velero-s3-credentials` binds to.
#
# An identical object is DECLARED in platform/minio-velero/manifests/minio.yaml,
# but no ArgoCD Application owns that directory (app-minio-velero.yaml is still
# .disabled), so it has never been applied — confirmed live 2026-08-15:
#   $ kubectl -n velero get externalsecret
#   NAME                       STORE     STATUS         READY
#   minio-velero-credentials   openbao   SecretSynced   True     <-- only this one
# Owning it here is what makes it real.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-s3-credentials
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: velero-s3-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .access_key }}
          aws_secret_access_key={{ .secret_key }}
  data:
    - secretKey: access_key
      remoteRef:
        key: secret/platform/minio-velero
        property: access_key
    - secretKey: secret_key
      remoteRef:
        key: secret/platform/minio-velero
        property: secret_key
