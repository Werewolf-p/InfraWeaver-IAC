# Velero — Kubernetes OBJECT backup + file-system backup for local-path volumes.
#
# ─────────────────────────────────────────────────────────────────────────────
# !! NO ${PLACEHOLDERS} IN THIS FILE. THEY WOULD SHIP VERBATIM. !!
# ─────────────────────────────────────────────────────────────────────────────
# This is a Helm valueFile consumed by ArgoCD-NATIVE Helm (see
# kubernetes/bootstrap/appset-core-platform.yaml: sources[].helm.valueFiles =
# "$values/kubernetes/platform/velero/values.yaml"). Native Helm rendering does
# NOT pass through the argocd-cmp-envsubst plugin — that plugin only runs for
# sources declaring `plugin: { name: envsubst-v1.0 }`. The same rule is recorded
# in core/longhorn/values.yaml, core/openbao/values.yaml and
# platform/authentik/values.yaml.
#
# The PREVIOUS revision of this file carried
#   publicUrl: https://minio-velero.int.${BASE_DOMAIN}
# which would have reached the cluster as that literal string. It is removed —
# publicUrl only rewrites download links in `velero backup logs`, and s3Url is
# what the client actually connects to.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS DOES AND DOES NOT BACK UP — read before changing a schedule
# ─────────────────────────────────────────────────────────────────────────────
# Velero here is deliberately NOT a second copy of Longhorn. Measured 2026-08-15:
#
#   Longhorn volumes  → ALREADY backed up. RecurringJobs truenas-backup-daily
#                       (01:00, retain 7) and truenas-backup-weekly (Sun 02:00,
#                       retain 4) cover the `default` group, which Longhorn
#                       auto-applies to every volume. 185 Completed backups on
#                       the NFS target. Velero MUST NOT duplicate this.
#   etcd / API objects → ALREADY snapshotted daily by scripts/etcd-snapshot.sh
#                       on the ops host (see core/etcd-maintenance/).
#                       BUT an etcd snapshot is all-or-nothing: it cannot restore
#                       one namespace without reverting the entire cluster.
#   local-path PVCs   → **NOT COVERED BY ANYTHING.** 19 bound local-path PVCs.
#                       Longhorn physically cannot snapshot them — they are
#                       node-local bind mounts, not Longhorn volumes.
#
# So Velero's job is exactly two things:
#   1. file-system backup (kopia) of local-path PVC data  → the real gap
#   2. granular per-namespace object restore              → what etcd can't do
#
backupsEnabled: true

# NO CSI SNAPSHOTS. Measured 2026-08-15: this cluster has NO external-snapshotter.
#   $ kubectl get volumesnapshotclass
#   error: the server doesn't have a resource type "volumesnapshotclass"
#   $ kubectl get crd | grep snapshot   →   snapshots.longhorn.io   (Longhorn's own, not CSI)
# There is no snapshot-controller, no VolumeSnapshotClass, no
# snapshot.storage.k8s.io CRDs. The previous revision of this file set
# `features: "EnableCSI"` and declared a volumeSnapshotLocation — both were
# inert at best. Volume-level snapshots are Longhorn's job and Longhorn already
# does them natively to TrueNAS.
snapshotsEnabled: false

# The node-agent DaemonSet is the ENTIRE reason Velero is here: kopia
# file-system backup is the only mechanism that can read a local-path PVC.
# It reads pod volumes from the kubelet pod dir on each node.
deployNodeAgent: true

image:
  repository: docker.io/velero/velero
  tag: v1.18.1
  pullPolicy: IfNotPresent

# velero-plugin-for-aws v1.14.x is the version matched to Velero v1.18.x by the
# upstream compatibility table (https://github.com/vmware-tanzu/velero-plugin-for-aws).
# The previous revision pinned v1.10.0, which pairs with Velero v1.14 — a
# mismatch that predates the chart bump from 8.1.0 to 12.1.0.
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.14.2
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

configuration:
  # kopia is the default and only supported uploader from Velero 1.15 onward.
  uploaderType: kopia

  # OPT-IN, not opt-out. With `true`, every schedule would file-system-copy every
  # volume it sees — including the Longhorn volumes TrueNAS already holds — and
  # would fill the 20Gi MinIO PVC with a redundant second copy. Each schedule
  # below that needs volume data sets defaultVolumesToFsBackup on its own template.
  defaultVolumesToFsBackup: false

  logLevel: info

  backupStorageLocation:
    - name: default
      provider: aws
      bucket: velero-backups
      # Prefix keeps a future second cluster from colliding in the same bucket.
      prefix: infraweaver-prod
      default: true
      validationFrequency: 1h
      config:
        region: minio
        s3ForcePathStyle: "true"
        # In-cluster MinIO. Service verified live: velero/minio-velero ClusterIP
        # 10.96.59.43, ports 9000 (api) / 9001 (console).
        s3Url: http://minio-velero.velero.svc.cluster.local:9000

  # volumeSnapshotLocation intentionally ABSENT — snapshotsEnabled: false.

# Credentials come from OpenBao via ExternalSecret, never from this file.
# manifests/externalsecret.yaml renders secret/platform/minio-velero into an AWS
# INI-format key named `cloud`; the chart mounts that secret at /credentials and
# sets AWS_SHARED_CREDENTIALS_FILE=/credentials/cloud.
credentials:
  useSecret: true
  existingSecret: velero-s3-credentials

priorityClassName: platform-standard

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

nodeAgent:
  priorityClassName: platform-standard
  # Talos default kubelet root. Confirmed: Talos v1.13.0 uses the standard
  # /var/lib/kubelet path, so the chart default is correct here.
  podVolumePath: /var/lib/kubelet/pods
  pluginVolumePath: /var/lib/kubelet/plugins
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      # kopia buffers while hashing. 512Mi (the previous value) is a plausible
      # OOM on the 2.4G GTNH world; this box has a documented OOM history.
      cpu: 1000m
      memory: 1Gi
  tolerations:
    # Every node in this cluster is a control-plane node. The DaemonSet
    # controller adds the unschedulable toleration itself, but control-plane
    # taints must be tolerated explicitly if they are ever re-applied.
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

# The chart's CRD upgrade hook now uses registry.k8s.io/kubectl (it used to use
# bitnami/kubectl, whose dynamically-linked sh was incompatible with the velero
# scratch image — that is the "disable upgradeCRDs" note in the previous
# revision, and it no longer applies on chart 12.x).
upgradeCRDs: true

metrics:
  enabled: true
  serviceMonitor:
    # kube-prometheus-stack is deployed in this cluster; let it scrape Velero so
    # a silently-failing backup is visible. A backup system nobody watches is
    # the exact failure mode recorded as GAP-C2.
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack

# ─────────────────────────────────────────────────────────────────────────────
# SCHEDULES
# ─────────────────────────────────────────────────────────────────────────────
#
# ╔═════════════════════════════════════════════════════════════════════════╗
# ║ ⚠️ READ FIRST — VELERO FILE-SYSTEM BACKUP CANNOT SEE A local-path PVC.   ║
# ║                                                                          ║
# ║ Every claim below about `defaultVolumesToFsBackup: true` protecting      ║
# ║ local-path volumes was WRONG, and it was wrong from the first run. The   ║
# ║ local-path provisioner emits PVs whose source is `hostPath`:             ║
# ║   kubectl get pv <pv> -o jsonpath='{.spec.hostPath.path}'                ║
# ║   → /opt/local-path-provisioner/pvc-…_game-hub_gt-new-horizons-…-local   ║
# ║ and Velero's FSB skips hostPath volumes by design. There is no setting   ║
# ║ that turns this on.                                                      ║
# ║                                                                          ║
# ║ MEASURED 2026-08-16 on runs that all reported Completed:                 ║
# ║   velero-daily-gamehub-20260816083024      →  0 PodVolumeBackups         ║
# ║   velero-weekly-localpath-20260816050024   →  0 PodVolumeBackups         ║
# ║   velero-daily-wordpress-20260816034524    → 13 PVBs, and every `data`   ║
# ║       one belongs to a LONGHORN PVC (hi2, lolll, lol-slot-b + 2 dbs).    ║
# ║       hihi / lol / yonavaarwater-nl / zonnevaarwater-nl produced a       ║
# ║       `wp-cli` PVB (an emptyDir) and NO `data` PVB at all.               ║
# ║   Reproduce:                                                             ║
# ║     kubectl -n velero get podvolumebackups.velero.io \                   ║
# ║       -l velero.io/backup-name=<backup> -o wide                          ║
# ║                                                                          ║
# ║ So these three schedules were GAP-C2 again — green jobs that back up     ║
# ║ nothing — for exactly the volumes they were written to protect. TWO OF   ║
# ║ THEM ARE NOW DELETED (2026-08-19): `daily-gamehub` and `weekly-localpath`║
# ║ produced 0 PVBs on every run, AND their object capture turned out to be  ║
# ║ a strict subset of `daily-objects` measured same-day over durable kinds  ║
# ║ (0 items captured by either that daily-objects did not also capture).    ║
# ║ The full measurement is recorded where they used to be defined, below.   ║
# ║ `daily-wordpress` stays: it moves real bytes, and since the 08-18/19     ║
# ║ migrations it now reaches 11 `data` volumes including zonnevaarwater-nl  ║
# ║ at 1.63 GiB — the site files, not just the emptyDirs it used to catch.   ║
# ║                                                                          ║
# ║ The actual volume coverage for local-path now comes from three archive   ║
# ║ CronJobs that write onto `longhorn-retain` PVCs and ride the existing    ║
# ║ Longhorn → TrueNAS chain, the same trick the pg-backup jobs use:         ║
# ║   kubernetes/catalog/game-hub/manifests/world-archive.yaml       00:30   ║
# ║   kubernetes/catalog/wordpress-cache/manifests/wp-data-archive.yaml  00:35/00:40 ║
# ║   kubernetes/catalog/nextcloud/manifests/data-archive.yaml       00:45   ║
# ║                                                                          ║
# ║ ADDED 2026-08-18 — the per-app archives above are per-app by definition,  ║
# ║ so a local-path volume belonging to no app with an archive job was still  ║
# ║ covered by nothing. cp1's reset that day erased eight of them and only a  ║
# ║ hand-made tar saved the data. There is now a catch-all that copies EVERY  ║
# ║ local-path directory on a node straight to the NAS over NFS:              ║
# ║   kubernetes/core/local-path/localpath-offnode-backup.yaml       00:40   ║
# ║ It exits NON-ZERO when it finds nothing, so "the mount broke" is a        ║
# ║ failure rather than another green job protecting nothing.                 ║
# ║                                                                          ║
# ║ ⚠️ The rule this banner now enforces: a schedule whose name promises      ║
# ║ volume coverage it cannot deliver gets DELETED, not annotated. An        ║
# ║ annotation is read once; the name is read every time someone asks        ║
# ║ "is it backed up?".                                                       ║
# ╚═════════════════════════════════════════════════════════════════════════╝
#
# Times are cluster-local UTC. Deliberately placed AROUND the existing backup
# windows so nothing collides:
#   00:00  longhorn local-snapshot-daily
#   00:15  authentik-pg-dump
#   00:20  nextcloud-pg-dump
#   00:25  n8n-pg-dump
#   00:30  game-hub world archive        (local-path → longhorn-retain)
#   00:35  wordpress wp-data archive A   (local-path → longhorn-retain)
#   00:40  wordpress wp-data archive B   (local-path → longhorn-retain)
#   00:45  nextcloud data archive        (local-path → longhorn-retain)
#   01:00  longhorn truenas-backup-daily
#   02:00  longhorn truenas-backup-weekly (Sun)
#   03:30  velero daily-objects        ← here
#   03:45  velero daily-wordpress      ← here
#   05:00  velero weekly-localpath     ← here (Sun)
#   08:30  velero daily-gamehub        ← here. See below.
#
# ⚠️ `game-hub-scale-down` (00:00) and `game-hub-scale-up` (08:00) are NOT in
# that list any more, because they do nothing. MEASURED 2026-08-16 in the live
# ConfigMap game-hub/game-hub-scale-schedule-config:
#   scaleDownEnabled: "false"   scaleUpEnabled: "false"   targetDeployments: ""
# and in the job logs: "scale-down is disabled; exiting". The machinery ships
# dormant on purpose (see kubernetes/catalog/game-hub/scale-schedule.yaml). The
# GT New Horizons server runs 24/7 and there is no quiet window to schedule a
# backup into — which is why the world archive takes the server's OWN
# 30-minutely save-flushed zip instead of tarring a live directory.
schedules:

  # ── Tier 2: objects only, everything, cheap ────────────────────────────────
  # No volume data at all — this is a few MB of YAML. Its whole purpose is the
  # thing an etcd snapshot cannot do: restore ONE namespace, or one Deployment,
  # without reverting the entire cluster to a point in time.
  daily-objects:
    disabled: false
    schedule: "30 3 * * *"
    template:
      ttl: "720h"                      # 30 days — it costs almost nothing
      snapshotVolumes: false
      defaultVolumesToFsBackup: false
      includeClusterResources: true
      excludedNamespaces:
        - kube-system
        - kube-public
        - kube-node-lease
        - velero                       # never let Velero back up its own store
      excludedResources:
        - events
        - events.events.k8s.io
      storageLocation: default

  # ── WordPress: covers the LONGHORN site volumes only ───────────────────────
  # 7 live sites. The local-path-retain ones (hihi, lol, yonavaarwater-nl,
  # zonnevaarwater-nl) are the reason this schedule was written — and are
  # precisely the ones it does not reach.
  #
  # ⚠️ MEASURED 2026-08-16, velero-daily-wordpress-20260816034524, Completed:
  #   13 PodVolumeBackups. Every `data` PVB belongs to a LONGHORN PVC —
  #     hi2 90.0Mi, lolll 90.0Mi, lol-slot-b 90.0Mi, hi2-db 171.1Mi,
  #     lolll-db 162.5Mi
  #   The four local-path sites produced a `wp-cli` PVB (that is an emptyDir)
  #   and NO `data` PVB at all. hihi-db / lol-db / yonavaarwater-nl-db /
  #   zonnevaarwater-nl-db produced nothing.
  # The PVs are hostPath-backed; Velero's FSB skips hostPath by design — see the
  # banner above the schedules block. Those four sites are covered instead by
  # kubernetes/catalog/wordpress-cache/manifests/wp-data-archive.yaml at
  # 00:35 / 00:40.
  #
  # NOTE on the console chain, which is also weaker than it reads. CronJob
  # wordpress-backup-sweep runs hourly at :20 into
  # infraweaver-console/infraweaver-backup-datastore (a longhorn-retain volume
  # that does reach the NAS — 3.9G on disk). But it is DB-only, and measured
  # 2026-08-16 the newest artefact per site was:
  #   hihi 08-16, yonavaarwater-nl 08-16 | test 08-14 | lolll 08-12,
  #   zonnevaarwater-nl 08-12 | hi2 08-11 | lol 08-10
  # Five of seven sites are days stale. "Hourly sweep" is not "RPO 1h" — that is
  # a console-side defect and is tracked there, not here.
  daily-wordpress:
    disabled: false
    schedule: "45 3 * * *"
    template:
      ttl: "168h"                      # 7 days
      includedNamespaces:
        - wordpress
      snapshotVolumes: false
      defaultVolumesToFsBackup: true   # kopia FSB — the only local-path mechanism
      storageLocation: default

  # ── DELETED 2026-08-19: `daily-gamehub` and `weekly-localpath` ─────────────
  # Both schedules reported Completed for months while protecting nothing, and
  # the "keep them for their OBJECT capture" defence written above them did not
  # survive being measured. Re-measured 2026-08-19 before the deletion:
  #
  #   VOLUME BYTES — PodVolumeBackups produced by real runs, counted, not inferred:
  #     velero-daily-gamehub-20260816083024   → 0 PVBs
  #     velero-daily-gamehub-20260817083025   → 0 PVBs
  #     velero-daily-gamehub-20260818083026   → 0 PVBs   (Completed, 7 warnings)
  #     velero-weekly-localpath-20260816050024→ 0 PVBs   (PartiallyFailed, 1 error)
  #   Reproduce:
  #     kubectl -n velero get podvolumebackups.velero.io \
  #       -l velero.io/backup-name=<backup> -o json | jq '.items | length'
  #
  #   OBJECT CAPTURE — the actual reason they were kept, now refuted. Both
  #   backups' resource lists were downloaded (velero DownloadRequest, kind
  #   BackupResourceList) and set-differenced against the SAME-DAY daily-objects
  #   run, over durable kinds only (Event/Pod/ReplicaSet/ControllerRevision/
  #   EndpointSlice/Endpoints/CiliumEndpoint/EphemeralReport/Job excluded — all
  #   controller-regenerated, and Events are excludedResources on daily-objects):
  #     daily-gamehub 08-18   vs daily-objects 08-18, ns=game-hub
  #        36 durable items vs 36 — captured ONLY by daily-gamehub: 0
  #     weekly-localpath 08-16 vs daily-objects 08-16, ns=nextcloud+jellyfin+authentik
  #       103 durable items vs 103 — captured ONLY by weekly-localpath: 0
  #   daily-objects reaches those namespaces because it has no includedNamespaces
  #   and excludes only kube-system/kube-public/kube-node-lease/velero — measured
  #   2026-08-19: game-hub 91 items, nextcloud 76, jellyfin 38, authentik 108.
  #   Its ttl is 720h against their 168h/336h, so retention IMPROVES on deletion.
  #
  #   So: zero volume bytes, and an object capture that is a strict subset of a
  #   schedule that runs more often and keeps it longer. Two green jobs proving
  #   nothing, deleted. Volume coverage for these namespaces is unchanged and is
  #   where it always actually was — the archive CronJobs and pg-dumps listed in
  #   the banner above, riding the Longhorn → TrueNAS chain.
  #
  #   Existing backups were NOT touched. Schedule-created Backup objects carry
  #   no ownerReferences (verified 2026-08-19), so deleting a Schedule cannot
  #   cascade-delete a Backup; the remaining copies age out on their own TTL.
  #
  #   If a future migration puts these PVCs on a CSI-backed class, the correct
  #   move is a NEW schedule written against that class — not a resurrection of
  #   one of these, whose names were the lie in the first place.
