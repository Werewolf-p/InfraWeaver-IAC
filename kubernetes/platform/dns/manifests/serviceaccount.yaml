---
# =============================================================================
# coredns (dns-system) — dedicated ServiceAccount, token NOT mounted.
# =============================================================================
# This CoreDNS was running on the dns-system `default` ServiceAccount with a
# token automounted into all three pods (CIS 5.1.5 / 5.1.6, GAP-H3).
#
# WHY IT NEEDS NO TOKEN AT ALL: this is not the cluster-DNS CoreDNS. The
# kube-system CoreDNS uses the `kubernetes` plugin and genuinely needs API
# access to watch Services and EndpointSlices. This instance's Corefile
# (configmap.yaml) is only `hosts` + `forward` + `cache` + `health` + `ready`
# over two static zone files — it never contacts the Kubernetes API. So the
# right answer is not "give it a scoped Role", it is "give it an identity with
# no bindings and stop mounting a credential it cannot use".
#
# Consequently this SA has NO RoleBinding or ClusterRoleBinding anywhere, by
# design. Do not add one without changing the Corefile first.
#
# This also unblocks WP4's cluster-wide `automountServiceAccountToken: false`
# mutation on `default` ServiceAccounts: dns-system was the namespace flagged in
# the plan as needing its own SA before that mutation could safely land.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coredns
  namespace: dns-system
  labels:
    app: coredns
automountServiceAccountToken: false
