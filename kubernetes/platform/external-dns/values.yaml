# ─────────────────────────────────────────────────────────────────────────────
# ExternalDNS — Unified DNS management for ${BASE_DOMAIN} (all subdomains)
#
# Architecture:
#   - IngressRoutes ARE the single source of truth for DNS records
#   - Only routes annotated with external-dns.alpha.kubernetes.io/managed: "true"
#     get published to Cloudflare (opt-in, NOT opt-out)
#   - Public services: annotate with managed + cloudflare-proxied: "true"
#     → Cloudflare CDN proxied record pointing to public IP (${PUBLIC_INGRESS_IP})
#   - Private .int services: rely on Cloudflare wildcard *.int.${BASE_DOMAIN} → ${METALLB_TRAEFIK_VIP}
#     No annotation needed — wildcard handles all .int resolution
#   - Truly private (no DNS at all): just don't annotate the route
#
# Source: traefik-proxy — reads IngressRoute objects, extracts Host() rules.
# Policy: upsert-only — never deletes existing records (safe default).
# TXT owner: infraweaver-prod — marks managed records so other ExternalDNS
#            instances don't interfere.
# ─────────────────────────────────────────────────────────────────────────────

sources:
  - traefik-proxy
  - service

provider:
  name: cloudflare

# Cloudflare API token — injected from ExternalSecret (pulled from OpenBao)
env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: CF_API_TOKEN

# Manage ALL example.com subdomains (both public and int).
# HARDCODED (not ${BASE_DOMAIN}) on purpose: external-dns is a Helm chart app, and
# Helm valueFiles bypass the ArgoCD envsubst CMP, so a ${PLACEHOLDER} here reaches the
# container LITERALLY (DomainFilter:[${BASE_DOMAIN}]). A literal filter matches nothing,
# so external-dns silently dropped every NEW record (games showed NXDOMAIN; old records
# survived only because policy=upsert-only never deletes). Same class/fix as the openbao
# ${BASE_DOMAIN} Helm-values gotcha. Revisit if the Helm value pipeline learns envsubst.
domainFilters:
  - "example.com"
  # The three infraweaver domains, added 2026-08-17 for the project site.
  # The same Cloudflare token already has Zone:DNS:Edit on all three (verified
  # against /zones: all active), so no new credential is involved — the filter
  # was the only thing stopping external-dns from managing them.
  #
  # policy=upsert-only still applies: external-dns creates and updates records
  # it owns and never deletes, so adding a zone here cannot remove anything that
  # is already in it.
  - "infraweaver.net"
  - "infraweaver.nl"
  - "infraweaver.cloud"

# Default target for services without explicit target annotation.
# HARDCODED for the same Helm-bypasses-CMP reason as domainFilters above — a literal
# ${PUBLIC_INGRESS_IP} made external-dns log "ignoring default targets [${PUBLIC_INGRESS_IP}]".
# 203.0.113.10 is the public ingress IP (matches the live auth/console IngressRoute targets).
extraArgs:
  - --default-targets=203.0.113.10
  - --annotation-filter=external-dns.alpha.kubernetes.io/managed in (true)

# upsert-only: create/update records but NEVER delete them.
#
# ─── DO NOT flip this to "sync" yet. Read this first. ───────────────────────
#
# Why it should eventually become "sync": upsert-only is why orphaned records
# accumulate. A game server or route that goes away leaves its A record and its
# `edns-` ownership TXT behind forever, because nothing ever collects them. The
# 2026-08-06 inventory found 24 such orphans in example.com.
#
# What "sync" actually deletes — the blast radius, measured, not assumed:
#   Only records this instance OWNS, i.e. records with an `edns-` registry TXT
#   carrying `external-dns/owner=infraweaver-prod`, inside
#   `domainFilters: example.com`, whose source object no longer exists.
#   Everything without an ownership TXT is invisible to it. Verified against the
#   live zone on 2026-08-06: the apex A/MX/SPF/verification TXTs, `_dmarc`,
#   `*._domainkey`, `default._bimi`, `autodiscover`, the `*.int` wildcard, the
#   WordPress CNAMEs (hi2/hihi/lol/lolll/test), `www`, `bitwarden` and the five
#   pre-platform manual CNAMEs (cloud, degoudentijd, feestinhetdonker, pane,
#   teleport) have NO ownership TXT and are therefore structurally untouchable.
#
# BLOCKER — one owned record has no source and is NOT approved for deletion:
#   `n8n.example.com` (A) + `edns-a-n8n.example.com` (TXT) are owned by this
#   instance, but the only surviving route is `n8n-int` — no IngressRoute
#   produces the public host any more (confirmed: no `Host(\`n8n.example.com\`)`
#   exists in the cluster). The first sync pass WOULD delete both, and that
#   record is in the operator-decision bucket, not the approved cleanup list.
#
# Preconditions for flipping, all of them:
#   1. The reviewed 24-record purge has been committed
#      (`apps/infraweaver-console/scripts/dns-purge.mjs --commit`), so the first
#      sync pass has nothing of its own to collect.
#   2. `n8n.example.com` is resolved by a human — EITHER delete the pair
#      deliberately through the purge script, OR keep the A record and first
#      delete ONLY its `edns-a-n8n.example.com` ownership TXT so external-dns
#      stops claiming it. Keeping the record while leaving the TXT in place is
#      the one combination that loses it.
#   3. After flipping: watch a full interval and confirm zero deletions —
#      `kubectl -n external-dns logs deploy/external-dns --since=10m | grep -iE "delete|error"`
#      then re-check that auth / private-test / gt-new-horizons still resolve.
#
# Do NOT add `--exclude-record-types=...TXT` as an extra belt: the TXT registry
# IS the ownership model, and excluding it would break the very guarantee above.
policy: upsert-only

# TXT records claim ownership — prevents other ExternalDNS instances interfering
txtOwnerId: "infraweaver-prod"
txtPrefix: "edns-"

# How often to reconcile DNS records against IngressRoutes
interval: "2m"

logLevel: "info"
logFormat: "text"

# RBAC — create ClusterRole for ExternalDNS to read K8s + Traefik resources
rbac:
  create: true

serviceAccount:
  create: true
  name: external-dns

# Extra RBAC rules to read Traefik IngressRoute CRDs
# (not included in default ExternalDNS ClusterRole)
extraRules:
  - apiGroups:
      - traefik.io
    resources:
      - ingressroutes
      - ingressroutetcps
      - ingressrouteudps
    verbs:
      - get
      - list
      - watch

resources:
  requests:
    cpu: 25m
    memory: 50Mi
  limits:
    memory: 128Mi

# Single replica is fine — DNS reconciliation is stateless and idempotent
replicaCount: 1
