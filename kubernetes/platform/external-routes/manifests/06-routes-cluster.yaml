# IngressRoutes for public K8s cluster apps on *.${BASE_DOMAIN}
# Internal apps (argocd, grafana, longhorn, openbao) use *.int.${BASE_DOMAIN}
# via 10-routes-int.yaml. Only public apps remain here.

# ── Test website (public) ─────────────────────────────────────────────────────
# REMOVED. This route matched Host(`test.${BASE_DOMAIN}`) and forwarded to the
# `test-website` ExternalName service, which resolved into the `test-website`
# namespace — a namespace that no longer exists. Every request therefore got a
# 502, and because the WordPress site of the same name (`wordpress/test`) matches
# the identical host with no greater specificity, this dead route was shadowing a
# site that was up and healthy the whole time.
#
# The host is served by `wordpress/test`, which the WordPress addon owns and
# which carries its own Authentik gate. Nothing replaces this block.
