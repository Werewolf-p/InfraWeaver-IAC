---
# IngressRoutes for *.int.${BASE_DOMAIN} — internal platform services.
#
# Security model:
#   DNS:  *.int.${BASE_DOMAIN} wildcard → public ingress (${PUBLIC_INGRESS_IP}), Cloudflare-proxied.
#         Reachable from anywhere; the perimeter is identity, not network.
#   Auth: forward-auth middleware on ALL browser-facing .int routes. Every request is
#         validated by the Authentik embedded outpost (login + per-app group policy).
#         No Authentik session = no access; wrong group = 403.
#   Exception: api.int is internal-cluster-only (server-side callers, no browser/session).
#
# TLS: platform-int-wildcard-tls (wildcard cert via letsencrypt-dns DNS-01)

# ── ArgoCD ────────────────────────────────────────────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-int
  namespace: traefik
  annotations:
    external-dns.alpha.kubernetes.io/managed: "true"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
  labels:
    infraweaver.io/access-tier: internal
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`argocd.int.${BASE_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: secure-headers
          namespace: traefik
        - name: forward-auth
          namespace: traefik
      services:
        - name: argocd-server
          port: 80
  tls:
    secretName: platform-int-wildcard-tls
---
