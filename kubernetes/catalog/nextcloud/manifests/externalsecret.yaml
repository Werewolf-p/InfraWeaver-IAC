---
# ExternalSecret — Nextcloud admin + Postgres credentials.
#
# OpenBao path (must exist before this ExternalSecret can materialise):
#   secret/platform/nextcloud
#     admin_user          → e.g. "admin"
#     admin_password      → strong random
#     db_user             → e.g. "nextcloud"
#     db_password         → strong random
#     db_name             → e.g. "nextcloud"
#     db_host             → "postgresql-nextcloud"  (in-cluster service)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-app-credentials
  namespace: nextcloud
  labels:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/component: app
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: nextcloud-app-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: admin-user
      remoteRef: { key: secret/platform/nextcloud, property: admin_user }
    - secretKey: admin-password
      remoteRef: { key: secret/platform/nextcloud, property: admin_password }
    - secretKey: db-user
      remoteRef: { key: secret/platform/nextcloud, property: db_user }
    - secretKey: db-password
      remoteRef: { key: secret/platform/nextcloud, property: db_password }
    - secretKey: db-name
      remoteRef: { key: secret/platform/nextcloud, property: db_name }
    - secretKey: db-host
      remoteRef: { key: secret/platform/nextcloud, property: db_host }
---
# ExternalSecret — Authentik OIDC client credential + endpoints for the
# Nextcloud user_oidc app. Written into the deployment as env vars and
# consumed by the post-install Job (see configmap-postinstall.yaml).
#
# OpenBao path:
#   secret/platform/nextcloud-oidc
#     client_id           → "nextcloud"
#     client_secret       → the auto-generated Authentik client secret
#     discovery_url       → "https://auth.<BASE_DOMAIN>/application/o/nextcloud/.well-known/openid-configuration"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-oidc-credentials
  namespace: nextcloud
  labels:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/component: sso
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: nextcloud-oidc-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client-id
      remoteRef: { key: secret/platform/nextcloud-oidc, property: client_id }
    - secretKey: client-secret
      remoteRef: { key: secret/platform/nextcloud-oidc, property: client_secret }
    - secretKey: discovery-url
      remoteRef: { key: secret/platform/nextcloud-oidc, property: discovery_url }
---
# ExternalSecret — Jellyfin API key for the `media-notify` sidecar.
#
# The sidecar POSTs to Jellyfin's /Library/Media/Updated whenever Nextcloud
# writes to the NAS. The key is a Jellyfin API key (admin-scoped; Jellyfin has
# no narrower scope for this endpoint).
#
# It is sourced from the CONSOLE's own Jellyfin service-account secret — the
# console mints and rotates this key when it adopts Jellyfin, so tracking it
# here means the sidecar always follows the live key instead of a hand-copied
# value that goes stale the moment Jellyfin is reinstalled (the exact failure
# that broke auto-scan: a 401 from a revoked key).
#
# OpenBao path (written by the console via writeAppSecret, app "jellyfin"):
#   secret/platform/app-accounts/jellyfin/service-account
#     apiKey              → the console's live Jellyfin API key
#     adminUsername       → current Jellyfin admin username
#     adminPassword       → current Jellyfin admin password
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyfin-notify-credentials
  namespace: nextcloud
  labels:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/component: media-notify
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: jellyfin-notify-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api-key
      remoteRef: { key: secret/platform/app-accounts/jellyfin/service-account, property: apiKey }
---
# NAS mount credentials are NOT declared here.
#
# The console's NAS flow mints scoped `iw-<provider>-{ro,rw}` service accounts on
# the appliance and generates the matching `nas-<provider>-<ro|rw>` ExternalSecret
# into this namespace (see kubernetes/catalog/nas-shares/). Hardcoding a share and
# an account here pinned Nextcloud to one appliance and to credentials nothing
# ever wrote to OpenBao.
