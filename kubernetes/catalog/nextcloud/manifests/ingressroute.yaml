---
# Nextcloud IngressRoute — Traefik on `websecure`, Cloudflare-proxied.
#
# AUTH DECISION (plan §5.4): forward-auth (Authentik) is NOT applied here for
# the same reason as Jellyfin — Nextcloud desktop/iOS/Android sync clients
# authenticate via WebDAV and OAuth, both of which are broken by the
# forward-auth browser redirect.
#
# Recommended follow-up: install the "OpenID Connect user backend" Nextcloud
# app and point it at Authentik. That gives SSO for the browser without
# breaking sync clients.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nextcloud
  namespace: nextcloud
  labels:
    app.kubernetes.io/name: nextcloud
    infraweaver.io/source: catalog
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`nextcloud.int.${BASE_DOMAIN}`)
      kind: Rule
      services:
        - name: nextcloud
          port: 80
  tls:
    store:
      name: default
      namespace: traefik
