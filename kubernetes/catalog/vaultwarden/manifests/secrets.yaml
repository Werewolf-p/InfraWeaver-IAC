---
# ADMIN_TOKEN for Vaultwarden's /admin panel — brokered from OpenBao, never git.
#
# WHY THIS IS AN ExternalSecret AND NOT A `kind: Secret`. This file used to ship
# a raw Secret carrying `value: "change-me"`, and catalog.yaml records
# `installed_at: 2026-05-17` — so that string was not a placeholder waiting for
# an operator, it was the LIVE credential on the /admin panel of a password
# vault. /admin enumerates and deletes every user and can flip SIGNUPS_ALLOWED
# back on. The IngressRoute is SSO-gated, but forward-auth admits ANY valid
# Authentik session, and this namespace carries no NetworkPolicy, so any pod in
# the cluster reaches the ClusterIP directly and never meets Traefik at all.
#
# Rotating in-cluster does not hold: the catalog Application syncs with selfHeal,
# so a `kubectl edit` is reverted to `change-me` on the next pass. The value has
# to stop living in git before any rotation can survive.
#
# The old token is BURNED as of the commit that introduced it, not as of the
# commit that removes it — it is in git history and in every clone. Deleting the
# literal is the second half of the fix; the first half is that the seeder mints
# a fresh random token into OpenBao that has never been in this repo.
#
# The Secret NAME and KEY are deliberately unchanged (`admin-token-secret[value]`)
# so deployment.yaml's secretKeyRef keeps resolving — only the SOURCE moved.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: admin-token-secret
  namespace: vaultwarden
  labels:
    app.kubernetes.io/name: vaultwarden
    infraweaver.io/source: community-apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: admin-token-secret
    creationPolicy: Owner
  data:
    # `key` is the path INSIDE the store's `secret` mount, matching
    # catalog.yaml's `secrets.path` — the same form registry/manifests/all.yaml
    # uses, and the form scripts/seed-catalog-secrets.sh writes to.
    - secretKey: value
      remoteRef:
        key: platform/vaultwarden
        property: admin-token
