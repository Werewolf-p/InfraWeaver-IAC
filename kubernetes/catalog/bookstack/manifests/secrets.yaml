---
# APP_KEY — BookStack's (Laravel's) encryption key, brokered from OpenBao.
#
# WHY THIS IS AN ExternalSecret AND NOT A `kind: Secret`. Both keys in this file
# used to ship as raw Secrets carrying `value: "change-me"`, and catalog.yaml
# records `installed_at: 2026-05-17` — so they were not placeholders waiting for
# an operator, they were the live application key and the live database password
# of an installed app, readable by anyone with the repo. APP_KEY is what every
# session cookie and every encrypted column is sealed with: knowing it is
# forge-a-session, decrypt-at-rest.
#
# Rotating in-cluster does not hold: the catalog Application syncs with selfHeal
# and reverts a `kubectl edit` back to `change-me` on the next pass. Both values
# are burned as of the commit that introduced them — they live in git history
# and in every clone — so the fix is that the seeder mints fresh random values
# into OpenBao, not that the literal disappears from HEAD.
#
# The Secret NAMES and KEYS are deliberately unchanged (`app-key-secret[value]`,
# `db-password-secret[value]`) so deployment.yaml's secretKeyRefs keep resolving.
#
# The template is not decoration. Laravel decrypts with AES-256-CBC and accepts
# a raw APP_KEY only when it is EXACTLY 32 bytes; seed-catalog-secrets.sh builds
# a password by stripping `=+/` out of base64 and then `head -c`, so a raw
# 32-char request comes up one or two characters short often enough to be a
# coin-flip rather than a bug you can reproduce. Declaring 40 characters and
# emitting `base64:<b64 of the first 32>` makes the key exactly 32 bytes every
# time, which is the form Laravel documents anyway.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-key-secret
  namespace: bookstack
  labels:
    app.kubernetes.io/name: bookstack
    infraweaver.io/source: community-apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: app-key-secret
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        value: "base64:{{ .appKey | trunc 32 | b64enc }}"
  data:
    # `key` is the path INSIDE the store's `secret` mount, matching catalog.yaml's
    # `secrets.path` — the form registry/manifests/all.yaml uses and the form
    # scripts/seed-catalog-secrets.sh writes to.
    - secretKey: appKey
      remoteRef:
        key: platform/bookstack
        property: app-key
---
# DB_PASSWORD — BookStack's database password, brokered from OpenBao.
# Same history as APP_KEY above: it shipped as `change-me` on an installed app.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-password-secret
  namespace: bookstack
  labels:
    app.kubernetes.io/name: bookstack
    infraweaver.io/source: community-apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: db-password-secret
    creationPolicy: Owner
  data:
    - secretKey: value
      remoteRef:
        key: platform/bookstack
        property: db-password
