---
# Generated by InfraWeaver Community Apps from Unraid AppFeed
# Source: https://raw.githubusercontent.com/linuxserver/templates/main/unraid/plex.xml
# Category: MediaServer-Video, MediaServer-Music, MediaServer-Photos
# Stars: 2142 | Downloads: 891945189
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  namespace: plex
  labels:
    app.kubernetes.io/name: plex
    app.kubernetes.io/managed-by: infraweaver
    infraweaver.io/source: community-apps
    infraweaver.io/tier: simple
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: plex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plex
    spec:
      # ⚠️ hostNetwork IS RETAINED, AND IT IS THE LARGEST REMAINING RISK HERE.
      #
      # What it costs: a hostNetwork pod carries Cilium's `reserved:host`
      # identity, which places it outside EVERY CiliumNetworkPolicy on this
      # cluster — the airgap baselines, the allowlists, all of it. This is a
      # media transcoder that parses container formats supplied by whoever
      # produced the file, so "outside all network policy" is exactly the wrong
      # property for it to have.
      #
      # Why it stays anyway: hostNetwork is here for Plex's LAN client
      # discovery (GDM on UDP 32410-32414 and DLNA/SSDP on UDP 1900), which is
      # multicast/broadcast. `hostPort: 32400` does NOT carry those ports and
      # would not restore discovery — it would only re-expose the web port. So
      # removing hostNetwork is not a like-for-like swap: it ends auto-discovery
      # for every Plex client on the LAN and leaves manual server-URL entry as
      # the only path. That is a change to how the owner's media server behaves,
      # not a security cleanup, and it is not this commit's to make.
      #
      # ── THE MetalLB REPLACEMENT WAS INVESTIGATED 2026-08-13. IT DOES NOT WORK.
      #
      # An earlier revision of this comment told the next engineer that "a
      # MetalLB LoadBalancer Service with a dedicated LAN IP" was the drop-in
      # replacement. That instruction was wrong, and following it would have
      # broken LAN discovery while appearing to be a pure security win. The
      # measured reasons, against THIS cluster:
      #
      #   1. GDM (UDP 32410-32414) and DLNA/SSDP (239.255.255.250:1900) are
      #      multicast/broadcast. A MetalLB L2-mode Service is announced by
      #      gratuitous ARP for a single UNICAST VIP; the speaker joins no IGMP
      #      group, and a Kubernetes Service has no concept of multicast group
      #      membership at all. Multicast never reaches the VIP.
      #
      #   2. `kubectl -n kube-system get cm cilium-config` reports
      #      routing-mode=tunnel, tunnel-protocol=vxlan, and NO multicast key of
      #      any kind (Cilium v1.17.4 BPF multicast is off). Pods sit in a VXLAN
      #      overlay, not on the LAN L2 segment, so LAN broadcast frames are
      #      never encapsulated toward them. There is no path for the discovery
      #      packet to arrive even in principle.
      #
      #   3. enable-ipv4-masquerade=true, so a pod's own outbound SSDP NOTIFY
      #      would be SNAT'd to the node IP — the wrong source address for a
      #      protocol whose entire mechanism is "reply from where you were seen".
      #
      # This is specifically a MULTICAST failure, not a UDP one: dns-system/
      # coredns is a working UDP LoadBalancer on 10.0.0.201, so unicast UDP
      # through MetalLB is fine here. Discovery is what cannot survive, exactly
      # as the hostPort analysis above already found.
      #
      # Per the operator's standing instruction — a broken Plex is not an
      # acceptable trade — hostNetwork STAYS, and this stays the largest known
      # residual risk in the cluster. It is a deliberate, priced decision, not
      # an oversight.
      #
      # IF SOMEONE REVISITS THIS, the honest options are, cheapest first:
      #   a. Accept the loss of GDM/DLNA and move to a LoadBalancer anyway.
      #      Signed-in Plex clients would still find the server via plex.tv's
      #      published connection list if the VIP is added under Settings >
      #      Network > "Custom server access URLs". Only unauthenticated LAN
      #      clients and DLNA-only devices (some TVs) would break. FREE AND
      #      UNRESERVED VIPs as of 2026-08-13: 10.0.0.203, .204, .205 —
      #      vlan3-pool is ["10.0.0.200/32","10.0.0.202-10.0.0.210"], with
      #      .200 traefik, .202 n8n, and .206-.210 reserved for game servers by
      #      game-servers-pool.yaml. Do NOT template the VIP through envsubst:
      #      authentik-ldap-outpost has sat <pending> for 60 days because its
      #      loadBalancerIP is the literal string ${METALLB_LDAP_VIP}.
      #   b. Enable Cilium BPF multicast (v1.17 feature, currently off) and
      #      re-test GDM end to end. Datapath-wide change; needs its own commit.
      #   c. Leave hostNetwork and buy back the network containment a different
      #      way — a CiliumClusterwideNetworkPolicy with a nodeSelector, since a
      #      hostNetwork pod carries `reserved:host` and only host-level policy
      #      can see it. NOT done here: enable-host-firewall is unset, and
      #      turning it on cluster-wide can lock every node out of the API
      #      server if the baseline is wrong. That is a change that needs a
      #      console and a rollback window, not a security sweep.
      hostNetwork: true
      # A hostNetwork pod has node-local reach to the kubelet and the API server
      # with no CiliumNetworkPolicy in front of it, so a mounted ServiceAccount
      # token is the single cheapest path from "transcoder RCE" to "cluster
      # credential". Plex makes no Kubernetes API calls whatsoever; this is a
      # pure subtraction with no functional cost, and unlike readOnlyRootFilesystem
      # it needs no runtime testing to be safe. It does not depend on the Kyverno
      # default-SA automount mutation, which cannot apply to a namespace that
      # does not exist yet.
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        # The single highest-value control for this workload, and it was absent.
        # RuntimeDefault blocks ~44% of kernel syscalls, including those used by
        # the container-escape CVEs (CVE-2022-0492, CVE-2023-0386). It matters
        # here more than almost anywhere else on the cluster: this container
        # runs ffmpeg-family demuxers over untrusted media, which is the classic
        # memory-corruption surface, and a hostNetwork pod that escapes lands on
        # the node with no network policy between it and anything.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: plex
          image: lscr.io/linuxserver/plex
          # Was: no container securityContext at all — root, full default
          # capability set, privilege escalation permitted.
          securityContext:
            # Sets no_new_privs. s6-overlay drops to PUID/PGID with setuid()
            # while still root, which no_new_privs does not affect; it only
            # blocks REGAINING privilege via a setuid binary later, which is
            # what an exploited transcoder would try.
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # linuxserver.io images run an s6 init that chowns /config and
              # the media mounts to PUID:PGID before dropping privilege, so a
              # bare drop:[ALL] makes the container fail at startup. This is the
              # standard linuxserver set and nothing wider.
              # IF THE POD FAILS AT INIT with chown/permission errors, this list
              # is what to widen — one capability at a time, with the error that
              # justified it. Do not "fix" it by deleting the whole block.
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
            # readOnlyRootFilesystem is deliberately NOT set: s6-overlay writes
            # to /run and /var/run during init, so enabling it needs an emptyDir
            # per write path. That is a separate, testable change.
          env:
            - name: VERSION
              value: "docker"
            - name: PLEX_CLAIM
              value: ""
            - name: PUID
              value: "99"
            - name: PGID
              value: "100"
            - name: UMASK
              value: "022"
            - name: TZ
              value: "UTC"
          # No ports defined

          volumeMounts:
            - name: plex-data-0
              mountPath: "/config"
            - name: tmp-tv
              mountPath: "/tv"
            - name: tmp-movies
              mountPath: "/movies"
          resources:
            requests:
              memory: "512Mi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "4000m"
      volumes:
      - name: plex-data-0
        persistentVolumeClaim:
          claimName: plex-data-0
      - name: tmp-tv
        emptyDir:
      - name: tmp-movies
        emptyDir:
---
apiVersion: v1
kind: Service
metadata:
  name: plex
  namespace: plex
  labels:
    app.kubernetes.io/name: plex
    infraweaver.io/source: community-apps
spec:
  selector:
    app.kubernetes.io/name: plex
  ports:
  - port: 32400
    targetPort: 32400
    protocol: TCP
    name: http
  type: ClusterIP