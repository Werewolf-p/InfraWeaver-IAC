name: infraweaver-console
description: "InfraWeaver Console — platform management UI with RBAC"
namespace: infraweaver-console

ingressroute:
  host: infraweaver.int.${BASE_DOMAIN}
  entrypoint: websecure

secrets:
  path: platform/infraweaver-console
  keys:
    oidc-client-id:
      type: static
      value: "infraweaver-console"
    oidc-client-secret:
      type: password
    nextauth-secret:
      type: password
    argocd-token:
      type: password
    # Shared token the console verifies on POST/GET from the in-cluster hygiene
    # CronJobs (wordpress-connector-health-sweep, users-reconcile, roster-drift).
    # All three read it from infraweaver-console-secret[wordpress-health-cron-token]
    # (ESO-synced from this same path), so declaring it here means seed-catalog-
    # secrets.sh auto-generates it on a fresh install — without it ESO can't sync
    # the key and both the console pod and every hygiene CronJob fail to start.
    wordpress-health-cron-token:
      type: password
      length: 64
    # The other three console tokens the ExternalSecret already maps. They were
    # never declared here, which is a live fresh-install bug rather than a cosmetic
    # one: the ExternalSecret uses deletionPolicy Retain, and Retain aborts the
    # ENTIRE secret when any single key is missing from OpenBao — so one unseeded
    # key takes down every other key with it, including the core-update token
    # below. Declaring them lets seed-catalog-secrets.sh generate all four.
    wordpress-rotation-cron-token:
      type: password
      length: 64
    wordpress-metrics-cron-token:
      type: password
      length: 64
    wordpress-metrics-token:
      type: password
      length: 64
    # Dedicated token for the WordPress core-update sweep CronJob. Declared here so
    # seed-catalog-secrets.sh generates it on a fresh install: without it ESO cannot
    # sync the key, the console env is absent, and the sweep fails closed forever —
    # i.e. auto-updates would silently never run while the UI says they are on.
    wordpress-update-cron-token:
      type: password
      length: 64
    # Shared token for the Game Hub power sweep, the capacity-retry job and the
    # placement rebalancer — the one deliberate sharing, since all three are the
    # same operator concern. It was reachable by three CronJobs and the Retain
    # ExternalSecret without ever being declared here, so a fresh install would
    # have aborted the ENTIRE console secret on first sync.
    game-hub-power-cron-token:
      type: password
      length: 64
    # Dedicated token for the hourly replica-floor ("Redundancy") sweep CronJob.
    # Same reasoning as above: without it ESO cannot sync the key and the sweep
    # fails closed forever while the setting page reports a floor is in force.
    replica-floor-cron-token:
      type: password
      length: 64
    # Shared service token binding the console (proxy half) to the
    # infraweaver-backup datastore pod (execute half). Both read the SAME value
    # from infraweaver-console-secret, so declaring it here is what makes a fresh
    # install able to materialise it at all.
    backup-service-token:
      type: password
      length: 64
    # Dedicated token for the hourly WordPress backup sweep CronJob. Without it
    # ESO cannot sync the key, the console env is absent, and scheduled backups
    # fail closed forever while the UI reports the schedule as on.
    wordpress-backup-cron-token:
      type: password
      length: 64
    # ── Remaining properties the console ExternalSecret pulls from THIS path ───
    # The ExternalSecret uses deletionPolicy: Retain, under which ESO fails the
    # ENTIRE secret sync if ANY referenced property is absent in OpenBao (a
    # missing key is only skipped when deletionPolicy != Retain). So every
    # property the ExternalSecret reads from secret/platform/infraweaver-console
    # MUST exist here on a fresh install, or the console pod + all three hygiene
    # CronJobs never receive their Secret. validate-iac.sh step 4/4 enforces this.
    #
    # Shared HMAC the console signs dispatch mutation POSTs with; the dispatch
    # systemd unit on the runner reads the SAME value from this OpenBao path, so
    # generating it here is the single source of truth.
    dispatch-secret:
      type: password
      length: 64
    # Fork↔canonical feedback-ingest HMAC. Generated for the canonical; a fork
    # that federates upstream overwrites it with the shared value.
    feedback-upstream-secret:
      type: password
      length: 64
    # Externally/bootstrap-provided values — declared as empty placeholders so the
    # property always EXISTS (Retain sync succeeds). bootstrap-openbao.sh and/or an
    # operator overwrite them with real values, which the idempotent seeder then
    # preserves (it only (re)writes keys whose current value is empty).
    github-token:
      type: static
      value: ""
    authentik-token:
      type: static
      value: ""
    openbao-token:
      type: static
      value: ""
    cloudflare-api-token:
      type: static
      value: ""
    cf-zone-id:
      type: static
      value: ""
    dns-provider:
      type: static
      value: ""
replicas: "2"
