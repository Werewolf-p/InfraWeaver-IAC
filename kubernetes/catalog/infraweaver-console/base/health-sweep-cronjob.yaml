# WordPress Connector health sweep — hourly, server-driven (§12.5).
#
# Every hour this CronJob POSTs to the console's own /api/wordpress/health-sweep
# endpoint, which runs a signed `health.check` against every commandable managed
# link and persists the outcome (`lastHealth`) on each link record. Keeps the
# ✓/✗ + "last checked" indicator on the connector pages fresh even when no
# operator has the console open; the page button becomes a manual override.
#
# Auth: the shared token is sourced from the SAME ESO-managed secret the console
# reads (`infraweaver-console-secret` key `wordpress-health-cron-token`, synced
# from OpenBao `secret/platform/infraweaver-console`), so the CronJob and the
# server can never drift out of sync. The console middleware (proxy.ts) lets this
# request past the session gate only when the token matches; the route handler
# re-validates it (defence in depth).
#
# Networking: the sweep pod is default-denied. Egress to CoreDNS + the console
# Service is granted by ciliumnetworkpolicy-wp-health-egress.yaml, and ingress to
# the console pod on :3000 from the sweep pod by networkpolicy-wp-health.yaml.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wordpress-connector-health-sweep
  namespace: infraweaver-console
  labels:
    app.kubernetes.io/managed-by: infraweaver-console
    infraweaver.io/component: iwsl
spec:
  schedule: "0 * * * *" # top of every hour
  concurrencyPolicy: Replace # kill a wedged sweep, never let a hung pod block the schedule
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/managed-by: infraweaver-console
            infraweaver.io/component: iwsl
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: health-sweep
              image: curlimages/curl:8.11.1
              imagePullPolicy: IfNotPresent
              env:
                - name: CRON_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: infraweaver-console-secret
                      key: wordpress-health-cron-token
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              command: ["/bin/sh", "-c"]
              # The Origin header matches the request host so the console's CSRF
              # same-origin guard passes even independently of the token bypass.
              args:
                - >-
                  curl --fail --silent --show-error --max-time 300
                  -X POST
                  -H "x-internal-cron-token: ${CRON_TOKEN}"
                  -H "Origin: http://infraweaver-console.infraweaver-console.svc.cluster.local:3000"
                  http://infraweaver-console.infraweaver-console.svc.cluster.local:3000/api/wordpress/health-sweep
