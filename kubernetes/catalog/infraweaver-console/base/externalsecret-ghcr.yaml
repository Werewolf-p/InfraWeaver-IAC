apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: infraweaver-console
spec:
  # Pull credential for ghcr.io (GitHub Container Registry). The console and
  # infraweaver-api Deployments reference `ghcr-pull-secret` as an imagePullSecret.
  # Previously this was a hand-applied plaintext dockerconfigjson (leaked PAT);
  # it now lives in OpenBao and is projected here by ESO — rotate by re-running
  # scripts/deploy/seed-ghcr-pull-secret.sh with a fresh read-only PAT.
  refreshInterval: 24h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: secret/platform/ghcr-pull-secret
        property: dockerconfigjson
        conversionStrategy: Default
        decodingStrategy: Base64
        metadataPolicy: None
