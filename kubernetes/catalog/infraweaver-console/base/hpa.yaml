apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: infraweaver-console
  namespace: infraweaver-console
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: infraweaver-console
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
    scaleUp:
      # 300s, matching scaleDown. At 30s a single one-minute cron burst
      # (alerts-dispatch runs `* * * * *`, plus the wordpress/game-hub sweeps)
      # was enough to trip the 70% CPU target and add a pod. Each new pod is a
      # Next.js cold start that fails readiness ~5x before serving, which then
      # perturbs the average again -- 623 rescale events in 3d18h, oscillating
      # 2<->3<->4 forever, while steady-state CPU is 1-22m against a 250m
      # request. Requiring the load to persist 5 minutes ends the oscillation
      # without changing capacity; min/max are untouched.
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
