# Placement rebalance — makes preferred nodes come true.
#
# A preferred node is expressed as a SOFT node affinity, which the scheduler
# honours when there is room and silently ignores when there is not. That is the
# right behaviour — a required affinity turns a node filling up into an outage —
# but nothing ever revisits the decision afterwards, so a workload sits on the
# wrong machine indefinitely with no indication why. This sweep revisits it.
#
# It frees room on the preferred node by evicting workloads that can genuinely
# move: no PersistentVolumeClaim at all, or Longhorn volumes whose replicas
# already live on other nodes. A volume with node affinity stamped on its PV —
# local-path, or a Longhorn class with dataLocality strict-local — is never
# touched, because the scheduler would refuse the move forever.
#
# Eviction rather than deletion, so a PodDisruptionBudget can say no. Capped at a
# few moves per pass: rebalancing is maintenance, not an emergency.
#
# Every 15 minutes. Auth and networking are identical to the other console
# sweeps: same ESO-managed cron token, same component label the existing egress
# policies select on.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: placement-rebalance
  namespace: infraweaver-console
  labels:
    app.kubernetes.io/managed-by: infraweaver-console
    infraweaver.io/component: iwsl
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid # a pass still running has the namespace covered
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/managed-by: infraweaver-console
            infraweaver.io/component: iwsl
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: placement-rebalance
              image: curlimages/curl:8.11.1
              imagePullPolicy: IfNotPresent
              env:
                - name: CRON_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: infraweaver-console-secret
                      key: game-hub-power-cron-token
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              command: ["/bin/sh", "-c"]
              # The Origin header matches the request host so the console's CSRF
              # same-origin guard passes independently of the token bypass.
              args:
                - >-
                  curl --fail --silent --show-error --max-time 120
                  -X POST
                  -H "x-internal-cron-token: ${CRON_TOKEN}"
                  -H "Origin: http://infraweaver-console.infraweaver-console.svc.cluster.local:3000"
                  http://infraweaver-console.infraweaver-console.svc.cluster.local:3000/api/placement/rebalance
