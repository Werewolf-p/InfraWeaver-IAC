---
# ClusterRole: read + write access for InfraWeaver Console operations.
# Includes game-hub management (scale, delete pods, create PVCs), Longhorn backups,
# and ExternalSecrets viewing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: infraweaver-console-reader
  labels:
    app: infraweaver-console
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "namespaces", "nodes", "events", "services", "endpoints", "configmaps", "persistentvolumes", "persistentvolumeclaims", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
  # Read-only, and specifically for the replica-floor sweep: it refuses to touch
  # a workload an HPA already owns, so it has to be able to see which those are.
  # Without this the whole hourly pass 403s and raises nothing at all — the floor
  # silently stops being enforced while the CronJob reports a plain 500.
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes", "ingressroutetcps", "ingressrouteudps", "middlewares", "traefikservices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["longhorn.io"]
    resources: ["volumes", "nodes", "backupvolumes", "backups", "recurringjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "appprojects"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets", "secretstores", "clustersecretstores"]
    verbs: ["get", "list", "watch"]
  # Pod firewall UI: list CNPs to show a pod's active exceptions, and
  # create/patch/delete the per-app `<app>-<direction>-allowlist` policies that
  # one-click Allow / remove-exception manage (cluster:admin gated in the API).
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infraweaver-console-reader
  labels:
    app: infraweaver-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: infraweaver-console-reader
subjects:
  - kind: ServiceAccount
    name: infraweaver-console
    namespace: infraweaver-console
# NOTE: the game-hub-scoped Role/RoleBinding `infraweaver-console-game-hub`
# is owned by the game-hub namespace bundle
# (kubernetes/catalog/game-hub/manifests/rbac.yaml), which carries the
# authoritative superset (events, statefulsets, batch, volumesnapshots).
# Do NOT re-declare it here — a duplicate triggers an ArgoCD
# SharedResourceWarning / OutOfSync on this Application.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infraweaver-console-configmaps
  namespace: infraweaver-console
  labels:
    app: infraweaver-console
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infraweaver-console-configmaps
  namespace: infraweaver-console
  labels:
    app: infraweaver-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: infraweaver-console-configmaps
subjects:
  - kind: ServiceAccount
    name: infraweaver-console
    namespace: infraweaver-console
---
# Role: full WordPress Manager addon resource management in the `wordpress`
# namespace. The cluster-wide infraweaver-console-reader only grants read on
# networkpolicies/ingressroutes and lacks `update` on PVCs, so site provisioning
# (createSite/deleteSite + plugin wp-cli exec) needs create/update/delete here.
# `events` (create/patch) lets the reconcile publish the deduped SsoGateUnavailable
# Warning Event to the notification bell when a stuck SSO gate defers on Authentik
# being unavailable (reconcile-alerts.ts); the cluster-wide reader is events:read-only.
# Scoped to one namespace for least privilege, mirroring the game-hub Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infraweaver-console-wordpress
  namespace: wordpress
  labels:
    app: infraweaver-console
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/log", "services", "configmaps", "secrets", "persistentvolumeclaims", "endpoints", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes", "middlewares"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infraweaver-console-wordpress
  namespace: wordpress
  labels:
    app: infraweaver-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: infraweaver-console-wordpress
subjects:
  - kind: ServiceAccount
    name: infraweaver-console
    namespace: infraweaver-console
