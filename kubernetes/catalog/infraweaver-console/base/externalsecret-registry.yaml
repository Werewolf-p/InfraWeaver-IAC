apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-pull-secret
  namespace: infraweaver-console
spec:
  # Pull credential for the self-hosted Zot registry (registry.int.${BASE_DOMAIN}).
  # Ephemeral feedback PREVIEW pods run images pushed to Zot by the dispatch
  # pipeline, so the console namespace needs a Zot pull secret in addition to the
  # existing ghcr/onedev ones. Seed the source with scripts/deploy/seed-registry-pull-secret.sh.
  refreshInterval: 24h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: registry-pull-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: secret/platform/registry-pull-secret
        property: dockerconfigjson
        conversionStrategy: Default
        decodingStrategy: Base64
        metadataPolicy: None
