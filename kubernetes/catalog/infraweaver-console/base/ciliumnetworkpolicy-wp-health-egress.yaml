---
# Zero-trust egress allow for the hourly WordPress health-sweep CronJob pods.
# Without this the job pod is default-denied and cannot resolve DNS or reach the
# console (curl: Could not resolve host / Could not connect). Scopes egress to
# CoreDNS + the console Service only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-wp-health-sweep-egress
  namespace: infraweaver-console
  labels:
    app.kubernetes.io/managed-by: infraweaver-console
    infraweaver.io/component: iwsl
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/managed-by: infraweaver-console
      infraweaver.io/component: iwsl
  egress:
    # The cluster resolver is backed by CoreDNS. Allow both kube-system and
    # dns-system so DNS works regardless of which CoreDNS instance answers.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: dns-system
            app: coredns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # The console pod (post-Service-translation: Cilium enforces egress at the
    # POD port, so :3000 here is the container port the Service targets).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: infraweaver-console
            app: infraweaver-console
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
