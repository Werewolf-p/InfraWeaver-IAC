---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infraweaver-console-secret
  namespace: infraweaver-console
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: infraweaver-console-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: oidc-client-id
      remoteRef:
        key: secret/platform/infraweaver-console
        property: oidc-client-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: oidc-client-secret
      remoteRef:
        key: secret/platform/infraweaver-console
        property: oidc-client-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: nextauth-secret
      remoteRef:
        key: secret/platform/infraweaver-console
        property: nextauth-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: argocd-token
      remoteRef:
        key: secret/platform/infraweaver-console
        property: argocd-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Shared HMAC secret for signing dispatch mutation POSTs (C-3). Must match the
    # DISPATCH_SECRET in the dispatch systemd unit on the runner.
    # Seed in OpenBao: bao kv patch secret/platform/infraweaver-console dispatch-secret=<64-hex>
    - secretKey: dispatch-secret
      remoteRef:
        key: secret/platform/infraweaver-console
        property: dispatch-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Optional: GitHub PAT for pipeline listing, pelican eggs, and node rolling-update triggers.
    # Set manually: openbao kv patch secret/platform/infraweaver-console github-token=<your-pat>
    # Console degrades gracefully without it (pipelines page shows empty, pelican eggs unavailable).
    - secretKey: github-token
      remoteRef:
        key: secret/platform/infraweaver-console
        property: github-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: authentik-token
      remoteRef:
        key: secret/platform/infraweaver-console
        property: authentik-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: cloudflare-api-token
      remoteRef:
        key: secret/platform/infraweaver-console
        property: cloudflare-api-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: cf-zone-id
      remoteRef:
        key: secret/platform/infraweaver-console
        property: cf-zone-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: dns-provider
      remoteRef:
        key: secret/platform/infraweaver-console
        property: dns-provider
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # NAS provider credentials — optional; console works without them (ops on NAS shares disabled)
    # Seed these in OpenBao: openbao kv put secret/platform/nas/synology user=<u> password=<p>
    - secretKey: synology-user
      remoteRef:
        key: secret/platform/nas/synology
        property: user
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: synology-password
      remoteRef:
        key: secret/platform/nas/synology
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Seed in OpenBao: openbao kv put secret/platform/nas/truenas api-key=<key>
    - secretKey: truenas-api-key
      remoteRef:
        key: secret/platform/nas/truenas
        property: api-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # OpenBao token (policy=wordpress) for the WordPress Manager addon's self-contained
    # KV client (src/addons/wordpress-manager/lib/openbao.ts reads OPENBAO_TOKEN).
    # Seed in OpenBao: bao token create -policy=wordpress -period=720h -orphan, then
    #   bao kv patch secret/platform/infraweaver-console openbao-token=<token>
    - secretKey: openbao-token
      remoteRef:
        key: secret/platform/infraweaver-console
        property: openbao-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Shared token authenticating the hourly WordPress health-sweep CronJob to
    # POST /api/wordpress/health-sweep (constant-time compared server-side).
    # Seed in OpenBao: bao kv patch secret/platform/infraweaver-console wordpress-health-cron-token=<64-hex>
    - secretKey: wordpress-health-cron-token
      remoteRef:
        key: secret/platform/infraweaver-console
        property: wordpress-health-cron-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Dedicated token for the daily WordPress key-reroll sweep CronJob's POST to
    # /api/wordpress/rotation-sweep. DISTINCT VALUE from the health-sweep token
    # (SECURITY-SCAN-2026-07-18 M2): fleet key-rotation is far higher impact than
    # read-only health probing, so it does not inherit the health token's blast
    # radius. Seed in OpenBao: bao kv patch secret/platform/infraweaver-console wordpress-rotation-cron-token=<64-hex>
    - secretKey: wordpress-rotation-cron-token
      remoteRef:
        key: secret/platform/infraweaver-console
        property: wordpress-rotation-cron-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Dedicated token for the hourly WordPress Manage-snapshot sweep CronJob's POST
    # to /api/wordpress/manage/sweep. DISTINCT VALUE from the health/rotation
    # tokens so the three internal crons stay independently gateable.
    # Seed in OpenBao: bao kv patch secret/platform/infraweaver-console wordpress-metrics-cron-token=<64-hex>
    - secretKey: wordpress-metrics-cron-token
      remoteRef:
        key: secret/platform/infraweaver-console
        property: wordpress-metrics-cron-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Dedicated token for the hourly WordPress CORE-UPDATE sweep CronJob's POST to
    # /api/wordpress/core-update-sweep. DISTINCT VALUE from every other cron token,
    # and deliberately the highest-impact of them: this is the one that can start a
    # blue/green WordPress upgrade unattended, so it must be independently
    # revocable without disturbing health probing or snapshot warming.
    # Seed in OpenBao: bao kv patch secret/platform/infraweaver-console wordpress-update-cron-token=<64-hex>
    - secretKey: wordpress-update-cron-token
      remoteRef:
        key: secret/platform/infraweaver-console
        property: wordpress-update-cron-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Dedicated token for the Game Hub power sweep CronJob's POST to
    # /api/game-hub/power-sweep, which re-applies every recorded stop. Without it
    # a stopped server whose Deployment was destroyed and recreated stays running
    # until an operator opens the Game Hub page, because that is the only place
    # the intent was enforced. DISTINCT VALUE from the WordPress cron tokens so
    # it stays independently revocable — this one can scale game servers down.
    # THIS KEY MUST EXIST IN OPENBAO BEFORE THIS ENTRY IS APPLIED. deletionPolicy
    # is Retain and creationPolicy is Owner: one unresolvable property does not
    # skip that key, it fails the whole ExternalSecret, and every other value in
    # infraweaver-console-secret stops refreshing with it.
    # Seed in OpenBao: bao kv patch secret/platform/infraweaver-console game-hub-power-cron-token=<64-hex>
    - secretKey: game-hub-power-cron-token
      remoteRef:
        key: secret/platform/infraweaver-console
        property: game-hub-power-cron-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Dedicated token for the hourly replica-floor sweep CronJob's POST to
    # /api/replicas/sweep, which re-asserts the "Redundancy" floor (how many
    # copies of each workload should be running) across every app namespace.
    # DISTINCT VALUE from the Game Hub token: that one is shared between passes
    # over a single namespace, whereas this sweep reaches every namespace ArgoCD
    # delivers and must therefore be revocable on its own.
    # THIS KEY MUST EXIST IN OPENBAO BEFORE THIS ENTRY IS APPLIED. deletionPolicy
    # is Retain and creationPolicy is Owner: one unresolvable property does not
    # skip that key, it fails the whole ExternalSecret, and every other value in
    # infraweaver-console-secret stops refreshing with it.
    # Seed in OpenBao: bao kv patch secret/platform/infraweaver-console replica-floor-cron-token=<64-hex>
    - secretKey: replica-floor-cron-token
      remoteRef:
        key: secret/platform/infraweaver-console
        property: replica-floor-cron-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Shared service token authenticating the console's proxied backup calls to
    # the infraweaver-backup datastore pod. The console presents it; the datastore
    # compares it in constant time. ONE value, both halves of the split — a
    # mismatch means every backup route fails closed.
    # THIS KEY MUST EXIST IN OPENBAO BEFORE THIS ENTRY IS APPLIED. deletionPolicy
    # is Retain: one unresolvable property does not skip that key, it fails the
    # WHOLE ExternalSecret, and every other value in infraweaver-console-secret
    # stops refreshing with it.
    # Seed in OpenBao: bao kv patch secret/platform/infraweaver-console backup-service-token=<64-hex>
    - secretKey: backup-service-token
      remoteRef:
        key: secret/platform/infraweaver-console
        property: backup-service-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # HMAC key the datastore signs every snapshot manifest with, and verifies
    # with before a restore or a download hands anything back. The threat it
    # answers is specific: NAS credentials on this platform are per-PROVIDER, so
    # the storage credential the datastore writes with is the SAME one other
    # workloads hold — content addressing stops forged BYTES but not a forged
    # manifest+index+chunk set, all internally consistent. This key is the root
    # of trust that makes that set unforgeable, and it is the one secret an
    # attacker with only storage access does not have. Never copy it to a pod
    # that does not need to sign or verify.
    # THIS KEY MUST EXIST IN OPENBAO BEFORE THIS ENTRY IS APPLIED — Retain means
    # one unresolvable property fails the WHOLE ExternalSecret.
    # Seed in OpenBao: bao kv patch secret/platform/infraweaver-console backup-manifest-key=<64-hex>
    - secretKey: backup-manifest-key
      remoteRef:
        key: secret/platform/infraweaver-console
        property: backup-manifest-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Dedicated token for the hourly WordPress BACKUP sweep CronJob's POST to
    # /api/wordpress/backups/sweep. DISTINCT VALUE from every other cron token:
    # this tick starts fleet-wide backups and expires snapshots under the
    # retention policy, so it must be revocable without disturbing health
    # probing, key rotation, snapshot warming or core updates.
    # THIS KEY MUST EXIST IN OPENBAO BEFORE THIS ENTRY IS APPLIED (Retain, as above).
    # Seed in OpenBao: bao kv patch secret/platform/infraweaver-console wordpress-backup-cron-token=<64-hex>
    - secretKey: wordpress-backup-cron-token
      remoteRef:
        key: secret/platform/infraweaver-console
        property: wordpress-backup-cron-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Bearer token gating the WordPress Connector metrics exporter
    # (/api/wordpress/metrics). Prometheus scrapes with this token via the
    # wordpress-connector-metrics ServiceMonitor, and the console re-validates the
    # SAME value (WORDPRESS_METRICS_TOKEN env) — one shared secret so they never
    # drift. Seed: bao kv patch secret/platform/infraweaver-console wordpress-metrics-token=<64-hex>
    - secretKey: wordpress-metrics-token
      remoteRef:
        key: secret/platform/infraweaver-console
        property: wordpress-metrics-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # C2 (SECURITY-SCAN-2026-07-08): shared fork↔canonical HMAC secret gating
    # cross-deployment feedback ingest. The fork SIGNS each forwarded feedback copy
    # with this; the canonical VERIFIES it before bypassing auth (src/app/api/
    # feedback/route.ts, lib/hmac.ts). MUST be the SAME value on BOTH sides.
    # Seed the SAME 64-hex on the fork AND the canonical:
    #   openssl rand -hex 32   # generate once, use identical value both sides
    #   bao kv patch secret/platform/infraweaver-console feedback-upstream-secret=<64-hex>
    # Fail-closed: when unset, upstream ingest/forward are disabled (a fork that
    # never seeds it simply keeps feedback local). Marked optional so boot is
    # unaffected on forks that opt out.
    - secretKey: feedback-upstream-secret
      remoteRef:
        key: secret/platform/infraweaver-console
        property: feedback-upstream-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # SMTP credentials for the console's own mailer (user invitations). Reuses the SAME
    # authenticated Office365 mailbox Authentik sends from — the FROM must equal this
    # mailbox unless SendAs is granted (O365 550 5.7.60). Sourced from the shared
    # secret/platform/authentik path (smtp-username/smtp-password).
    - secretKey: smtp-username
      remoteRef:
        key: secret/platform/authentik
        property: smtp-username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: smtp-password
      remoteRef:
        key: secret/platform/authentik
        property: smtp-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Nextcloud admin credential for offboard user deletion via the OCS API. Reuses the
    # existing admin the deployment already runs with (secret/platform/nextcloud).
    - secretKey: nextcloud-admin-user
      remoteRef:
        key: secret/platform/nextcloud
        property: admin_user
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: nextcloud-admin-password
      remoteRef:
        key: secret/platform/nextcloud
        property: admin_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
