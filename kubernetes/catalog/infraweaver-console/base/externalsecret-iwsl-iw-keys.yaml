---
# IWSL connector signing-key custody — phase 3 (design §9/§13).
#
# Projects the interim IW keypair from OpenBao (`secret/iwsl/iw-keys`) into the
# k8s Secret `infraweaver-iwsl-iw-keys` that the console reads in
# apps/infraweaver-console/src/addons/wordpress-manager/lib/iwsl-keys.ts.
# Fields (b64url values): kid, ed25519Sk/Pk, slhdsaSk/Pk (SLH-DSA-192s), and the
# optional slhdsa192fSk/Pk (SLH-DSA-192f fast-sign set). Fingerprint of the live
# 192s key is 2f49:85df:cd55:401b (kid=1) — it MUST NOT change or every enrolled
# WordPress site has to re-enroll.
#
# 192f migration (fast-sign): the 192f keypair is added ALONGSIDE the 192s one
# (same ed25519 identity). The console signs each link with whichever set it
# pinned at enrollment, and a link moves to 192f only by re-enrolling — so adding
# these two fields is safe for existing 192s links (they keep verifying 192s).
# If slhdsa192fSk/Pk are absent from OpenBao, ESO simply omits them and the
# console stays on 192s.
#
# ── DEPLOY ORDERING (do not skip — wrong order breaks enrollment signing) ──
#   1. Seed OpenBao with the EXISTING live key (one-time migration; command in
#      ansible/playbooks/openbao.yml, "IWSL connector signing-key custody").
#   2. Apply THIS ExternalSecret. creationPolicy=Owner makes ESO adopt/overwrite
#      the Secret the console previously self-minted — with identical values, so
#      the fingerprint is unchanged.
#   3. Only then ship the iwsl-keys.ts read-only change (drops self-mint). Until
#      OpenBao is authoritative, that code throws on a missing Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infraweaver-iwsl-iw-keys
  namespace: infraweaver-console
  labels:
    app.kubernetes.io/managed-by: external-secrets
    infraweaver.io/component: iwsl
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: infraweaver-iwsl-iw-keys
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
          infraweaver.io/component: iwsl
  data:
    - secretKey: kid
      remoteRef:
        key: secret/iwsl/iw-keys
        property: kid
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: ed25519Sk
      remoteRef:
        key: secret/iwsl/iw-keys
        property: ed25519Sk
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: ed25519Pk
      remoteRef:
        key: secret/iwsl/iw-keys
        property: ed25519Pk
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: slhdsaSk
      remoteRef:
        key: secret/iwsl/iw-keys
        property: slhdsaSk
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: slhdsaPk
      remoteRef:
        key: secret/iwsl/iw-keys
        property: slhdsaPk
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # SLH-DSA-192f fast-sign keypair (optional; present once seeded in OpenBao).
    # ESO omits a field whose OpenBao property is absent, so this is safe to ship
    # before/independently of the seed. The console treats both as optional.
    - secretKey: slhdsa192fSk
      remoteRef:
        key: secret/iwsl/iw-keys
        property: slhdsa192fSk
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: slhdsa192fPk
      remoteRef:
        key: secret/iwsl/iw-keys
        property: slhdsa192fPk
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
