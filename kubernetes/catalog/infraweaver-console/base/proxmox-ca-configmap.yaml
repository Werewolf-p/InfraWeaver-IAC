---
# Proxmox VE cluster CA — the trust anchor for the /infrastructure surface.
#
# The Proxmox API serves a certificate signed by the cluster's own CA, not a
# public one, so Node rejected every request with:
#
#   UNABLE_TO_VERIFY_LEAF_SIGNATURE
#
# Trusting this CA is the correct fix. The alternative — NODE_TLS_REJECT_
# UNAUTHORIZED=0 — would disable verification for EVERY outbound TLS
# connection the console makes, including Authentik, GitHub and the mailer,
# to solve a problem with one host. That is not a trade worth making on the
# surface that can destroy VMs.
#
# This is a PUBLIC certificate, not a secret: it verifies the hypervisor's
# identity and grants nothing. The API tokens live in OpenBao.
#
#   subject: CN = Proxmox Virtual Environment,
#            O = PVE Cluster Manager CA
#   expires: 2034-09-15
#
# Both registered hypervisors are members of one PVE cluster and therefore
# share this CA. Rotating it (pvecm updatecerts) means updating this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: proxmox-cluster-ca
  namespace: infraweaver-console
  labels:
    app: infraweaver-console
    infraweaver.io/component: proxmox
data:
  pve-root-ca.pem: |
