apiVersion: apps/v1
kind: Deployment
metadata:
  name: infraweaver-console
  namespace: infraweaver-console
  labels:
    app: infraweaver-console
spec:
  # NOTE: spec.replicas is intentionally omitted — the HorizontalPodAutoscaler
  # (hpa.yaml) is the sole owner of the replica count. Declaring it here would
  # cause an ArgoCD/HPA drift war (selfHeal resets it, HPA scales it back).
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  # minReadySeconds ensures a new pod must be stable for 30s before old pod terminates.
  # This prevents silent startup failures from causing a brief outage.
  minReadySeconds: 30
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: infraweaver-console
  template:
    metadata:
      labels:
        app: infraweaver-console
    spec:
      priorityClassName: platform-high
      terminationGracePeriodSeconds: 60
      serviceAccountName: infraweaver-console
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # MUST remain true — console uses in-cluster k8s API (game-hub, apps, cluster
      # info, etc.) via /var/run/secrets/kubernetes.io/serviceaccount/. Setting false
      # breaks ALL k8s features and makes everything show "unknown" in the UI.
      automountServiceAccountToken: true
      imagePullSecrets:
      - name: ghcr-pull-secret
      # Zot pull secret so ephemeral feedback PREVIEW pods (and Zot-released prod
      # images after Publish) can pull from registry.int.${BASE_DOMAIN}.
      - name: registry-pull-secret
      # Spread replicas across nodes so a single Flannel disruption
      # doesn't take down both console pods simultaneously
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: infraweaver-console
      affinity:
        # Keep every replica out of zone `hypatia` (cp4, the Hetzner box across
        # the stretched VLAN). Measured 2026-08-16 against /api/health, straight
        # at the pod with no Traefik and no auth in the path:
        #   cp1 10.6 ms | cp3 14.5 ms | cp4 57.0 ms
        # The console fans out to the API, ArgoCD and the Kubernetes API, all of
        # which live in the other two zones, so a cp4 replica pays that crossing
        # several times per page. With 4 replicas behind one Service, two of them
        # on cp4 meant roughly half of all console traffic was 5.4x slower --
        # which is a large part of "the console feels slower than earlier".
        #
        # HA is unaffected: cp1 and cp3 both remain eligible and the
        # podAntiAffinity below still spreads replicas across them.
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: NotIn
                values:
                - hypatia
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: infraweaver-console
              topologyKey: kubernetes.io/hostname
      containers:
      - name: console
        # Tag intentionally omitted — overlays/prod/kustomization.yaml is the
        # single source of truth for the image tag (images[].newTag).
        image: registry.int.${BASE_DOMAIN}/infraweaver-console
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "HOSTNAME=0.0.0.0 node server.js"]
        # NOTE: the container securityContext is defined once, below (near
        # volumeMounts). A duplicate minimal block used to sit here and was
        # silently shadowed by the fuller one — removed to fix the dup key.
        ports:
        - containerPort: 3000
          name: http
        env:
        # Platform base domain for server-side domain resolution (lib/domain.ts).
        # Without this the genericized console defaults to example.com at runtime.
        # NEXT_PUBLIC_BASE_DOMAIN is also injected at BUILD time (see Dockerfile);
        # this runtime copy covers server components. ${BASE_DOMAIN} is rendered.
        - name: BASE_DOMAIN
          value: ${BASE_DOMAIN}
        - name: NEXT_PUBLIC_BASE_DOMAIN
          value: ${BASE_DOMAIN}
        # Public ingress IP for game-server DNS. Game servers are exposed via NodePort
        # straight to the internet (bypassing Traefik), so their external-dns records
        # need an explicit target (external-dns runs as a Helm app whose --default-targets
        # placeholder is not env-substituted). The create-server route stamps this onto
        # each game Service's external-dns target annotation.
        - name: PUBLIC_INGRESS_IP
          value: ${PUBLIC_INGRESS_IP}
        # ── The master default (2026-08-02) ──────────────────────────────────
        # Every shipped feature in this console hides behind its own env switch,
        # off by default, each for a good per-feature reason. The aggregate was a
        # console where roughly twenty real, tested, shipped surfaces answered
        # "not enabled here", and the only way to light them was to remember all
        # twenty names. Shipping the image is half of live; this block is the
        # other half, and a list nobody can hold in their head stays half-set.
        #
        # PLATFORM_ENABLE_ALL supplies the DEFAULT for any gate whose own
        # variable is unset or empty. It is a default, never an override — see
        # apps/infraweaver-console/src/lib/feature-defaults.ts:
        #
        #   · an EXPLICIT value still wins in BOTH directions. Setting
        #     GAME_HUB_SLEEP_ENABLED=0 below would leave Sleep off even with the
        #     master on. That is what keeps a per-feature kill switch usable
        #     during an incident: an operator killing one feature must not also
        #     have to find and unset the master.
        #   · the six names in NEVER_DEFAULTED are structurally unreachable from
        #     it, so "turn everything on" can never mean "arm the chaos engine".
        #     Each still works when set explicitly — Client Rooms is set that way
        #     further down.
        #
        # The per-feature switches that follow are now REDUNDANT with the master.
        # They are kept deliberately: each carries the operator note explaining
        # what that feature actually does to this cluster, and the note is worth
        # more than the two lines it costs.
        - name: PLATFORM_ENABLE_ALL
          value: "1"
        # ── Infrastructure node operations (Proxmox-backed) ──────────────────
        # Arms /infrastructure: the node inventory, per-node Proxmox + Kubernetes
        # detail, drift, resize, power, add-node and decommission.
        #
        # This flag is READ DIRECTLY from process.env and is deliberately NOT
        # defaulted by PLATFORM_ENABLE_ALL above, unlike every other switch here.
        # That is a design decision, not an oversight: the master switch is "1"
        # in production, and this gate can create and destroy cluster nodes. A
        # feature that destroys VMs must not be armed as a side effect of a
        # blanket default. tests/unit/infra-api/node-ops-flag.test.ts pins that
        # the master switch cannot arm it.
        #
        # Arming it does NOT bypass authorization. Every mutating route still
        # requires the full triple gate — cluster:admin at /clusters scope, an
        # ACTIVE PIM elevation, and same-origin — plus arm-then-confirm receipts;
        # destroy additionally needs a SECOND receipt, minted only after the VM
        # is stopped, with a matching vmId AND name.
        #
        # Until a Proxmox host registry and its credentials are seeded, the read
        # surface reports each host `provenance: unavailable` with a diagnosis
        # rather than an empty table, and every write refuses.
        - name: INFRA_NODE_OPS_ENABLED
          value: "1"
        # Trust the Proxmox cluster CA mounted above, IN ADDITION to the system
        # store — NODE_EXTRA_CA_CERTS appends, it does not replace. Without it
        # every hypervisor call fails UNABLE_TO_VERIFY_LEAF_SIGNATURE.
        #
        # Deliberately NOT NODE_TLS_REJECT_UNAUTHORIZED=0: that would disable
        # certificate verification for EVERY outbound TLS connection the console
        # makes — Authentik, GitHub, the mailer, the WordPress fleet — to solve a
        # problem with one host. Trusting one extra CA is the narrow fix.
        - name: NODE_EXTRA_CA_CERTS
          value: /etc/ssl/proxmox/pve-root-ca.pem
        # ── Game Hub platform switches (2026-08-01 wave) ─────────────────────
        # Each feature reads its own switch and, when it is absent, answers with
        # an operator sentence rather than an error — so these are what make the
        # surfaces real rather than self-describing as off.
        #
        # Sleep Fleet REQUIRES the Service /spec/selector ignoreDifferences entry
        # on catalog-game-hub-servers (shipped in this repo): hibernation parks
        # the selector on the doorman pod, and without that entry selfHeal
        # reverts the cutover on the next sync. Enabling the platform switch does
        # NOT hibernate anything — every server still opts in per server, and a
        # server an operator STOPPED is never woken by a packet from the internet.
        - name: GAME_HUB_SLEEP_ENABLED
          value: "1"
        - name: GAME_HUB_DOCTOR_ENABLED
          value: "1"
        - name: GAME_HUB_LOCKFILE_ENABLED
          value: "1"
        # Network Fabric writes per-network manifests into
        # kubernetes/catalog/game-hub/networks (catalog-game-hub-networks) and
        # reads the Velocity forwarding secret from OpenBao at
        # secret/platform/game-hub/networks/<name> — both shipped here.
        - name: GAME_HUB_NETWORKS_ENABLED
          value: "1"
        # Import + review. PUBLISH is a separate switch, which the master now
        # defaults ON — but it needs a registry host plus push credentials this
        # namespace does not hold (it has a Zot PULL secret only), so the feature
        # report answers `available: false` with that exact sentence rather than
        # pretending. Set GAME_HUB_EXCHANGE_HOST (or ZOT_REGISTRY_HOST) and seed
        # push credentials to finish it.
        - name: GAME_HUB_EXCHANGE_ENABLED
          value: "1"
        # Player Passport COLLECTS: handles, presence samples, and a moderation
        # ledger. Retention is stated on the roster page; turning this off stops
        # collection and stops new moderation records but does not delete what is
        # already stored.
        - name: GAME_HUB_PASSPORT_ENABLED
          value: "1"
        # Community Hosting opens tenant self-service. A workspace can only
        # create within a budget an operator set at the ROOT scope — with no
        # budgets defined, this grants nobody anything.
        - name: GAME_HUB_COMMUNITY_ENABLED
          value: "1"
        # ── WordPress Client Rooms (2026-08-02) ──────────────────────────────
        # One of the six PLATFORM_ENABLE_ALL can never reach, so it is set here
        # explicitly and on purpose. It does two things that deserve a decision
        # rather than a default:
        #
        #   · it writes REAL RBAC role assignments, so a room grants actual
        #     platform authority to the delegate rather than a view;
        #   · it publishes a capability-URL read surface that is UNAUTHENTICATED
        #     — anyone holding the link reads the report, with no session.
        #
        # Both are the point of the feature: agency delegation, and a client
        # report a client can open without an account on this platform. Turning
        # it off stops new rooms and new links; it does not retroactively revoke
        # assignments already written, so revoke those in /rbac if you reverse
        # this decision.
        - name: WORDPRESS_CLIENT_ROOMS_ENABLED
          value: "1"
        # Headers middleware newly provisioned WordPress site IngressRoutes
        # reference (<namespace>/<name>). wp-secure-headers (external-routes,
        # 2026-08-16) is the PUBLIC-SITE variant of secure-headers: identical
        # except X-Frame-Options SAMEORIGIN (DENY broke Elementor's same-origin
        # editor preview) and no noindex X-Robots-Tag (which was de-indexing
        # public sites). The 7 existing site routes were repointed live the same
        # day; this keeps every FUTURE site consistent with them. Unset, the
        # console falls back to traefik/secure-headers — the admin-portal
        # variant — which reintroduces both regressions for new sites.
        - name: WORDPRESS_SECURE_HEADERS_MIDDLEWARE
          value: "traefik/wp-secure-headers"
        # ── The remaining five NEVER_DEFAULTED gates (2026-08-03) ────────────
        # Set explicitly, on the operator's repeated and specific instruction to
        # enable every feature. PLATFORM_ENABLE_ALL still structurally cannot
        # reach these — that mechanism is intact and unchanged; this block is the
        # deliberate per-flag decision it exists to force.
        #
        # WORD CHOICE IS LOAD-BEARING. Three of the five accept ONLY the literal
        # string `true`, compared untrimmed and case-sensitive. `"1"` on those is
        # a silent no-op — the exact footgun this repo has already shipped once.
        #
        # What each one now permits. Read this before reversing anything:
        #
        #   · FLEET_PROVISION_ENABLED — drives OpenTofu against real
        #     infrastructure. Accepts on/true/1.
        #   · WORDPRESS_PATCH_AUTO_REMEDIATION_ENABLED — changes production site
        #     code with NO human in the loop. It is an AND with the patch gate,
        #     which PLATFORM_ENABLE_ALL already defaults on, so this line is what
        #     makes it live.
        #   · WORDPRESS_AGENT_GATE_ACT_TIER — promotes the agent gate from
        #     OBSERVING sites to ACTING on them. Literal `true` only.
        #   · DR_CHAOS_INJECTION_ENABLED — arms fault injection against this live
        #     cluster. Operator-triggered per game day rather than a background
        #     sweep, but the blast radius is the cluster. Literal `true` only.
        #   · SECRET_REMEDIATION_WRITE_ENABLED — lets the console re-mint and
        #     re-seed credentials in OpenBao rather than only report on them.
        #     Literal `true` only.
        #
        # To reverse ANY of them, set the value to something the gate does not
        # accept — do NOT delete the line. A deleted line falls through to
        # PLATFORM_ENABLE_ALL, and for these five that resolves to off: the same
        # outcome, by a route nobody reading this file would predict.
        - name: FLEET_PROVISION_ENABLED
          value: "true"
        - name: WORDPRESS_PATCH_AUTO_REMEDIATION_ENABLED
          value: "true"
        - name: WORDPRESS_AGENT_GATE_ACT_TIER
          value: "true"
        - name: DR_CHAOS_INJECTION_ENABLED
          value: "true"
        - name: SECRET_REMEDIATION_WRITE_ENABLED
          value: "true"
        # AUTH_URL must include /api/auth so Auth.js v5 derives basePath="/api/auth"
        # and correctly parses actions from /api/auth/signin/authentik etc.
        # Without the path, basePath="/" and the regex extracts "api" as the action → UnknownAction.
        - name: AUTH_URL
          value: https://infraweaver.int.${BASE_DOMAIN}/api/auth
        - name: NEXTAUTH_URL
          value: https://infraweaver.int.${BASE_DOMAIN}
        - name: CONSOLE_API_SECRET
          valueFrom:
            secretKeyRef:
              name: infraweaver-api-console-secret
              key: CONSOLE_API_SECRET
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: nextauth-secret
        - name: AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: nextauth-secret
        - name: AUTHENTIK_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: oidc-client-id
        - name: AUTHENTIK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: oidc-client-secret
        - name: AUTHENTIK_ISSUER
          value: https://auth.${BASE_DOMAIN}/application/o/infraweaver-console/
        - name: ARGOCD_SERVER
          value: http://argocd-server.argocd.svc.cluster.local:80
        - name: ARGOCD_TOKEN
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: argocd-token
        # Optional: GitHub PAT for pipeline listing, pelican eggs, and workflow dispatch.
        # Seed in OpenBao: openbao kv patch secret/platform/infraweaver-console github-token=<pat>
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: github-token
              optional: true
        - name: GITHUB_REPO
          value: ${GITHUB_REPO}
        # OneDev is decommissioned (removed 2026-07-03) — GitHub drives all
        # git/config ops via GITHUB_REPO/GITHUB_TOKEN above.
        - name: GIT_PROVIDER
          value: github
        - name: GIT_WORKTREE_ROOT
          value: /git-cache
        - name: GATUS_URL
          value: http://gatus.gatus.svc.cluster.local:8080
        # Cluster id MUST be "default" (or "local") — that is the id the
        # infraweaver-api cluster registry maps to the in-cluster client. A custom
        # id like "homelab-prod" makes /k8s/* 502 "Failed to fetch nodes".
        - name: CLUSTER_CONTEXTS
          value: '[{"id":"default","displayName":"Production","isLocal":true,"tags":["production"]}]'
        - name: LONGHORN_API
          value: http://longhorn-frontend.longhorn-system.svc.cluster.local:80
        - name: PROMETHEUS_URL
          value: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        - name: NODE_ENV
          value: production
        - name: INFRAWEAVER_API_URL
          value: http://infraweaver-api.infraweaver-console.svc.cluster.local:3001
        - name: AUTHENTIK_URL
          value: http://authentik-server.authentik.svc.cluster.local
        - name: AUTHENTIK_TOKEN
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: authentik-token
        - name: CLOUDFLARE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: cloudflare-api-token
        - name: CF_ZONE_ID
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: cf-zone-id
        - name: DNS_PROVIDER
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: dns-provider
        - name: ADMIN_EMAILS
          value: admin@${BASE_DOMAIN}
        - name: AUTH_TRUST_HOST
          value: "true"
        # Feedback pipeline (Phase 3): the console calls the dispatch service
        # directly (no n8n). Dispatch runs on the runner (${RUNNER_IP}:9876) and
        # only accepts 10.x/loopback callers, which in-cluster pod IPs satisfy.
        - name: DISPATCH_URL
          value: http://${RUNNER_IP}:9876
        # Shared HMAC secret (C-3): the console signs every mutating dispatch POST
        # (/approve, /validate, /publish, /pipeline, /specialists/refresh) with this.
        # Must match the DISPATCH_SECRET in the dispatch systemd unit on the runner.
        # Sourced from OpenBao (secret/platform/infraweaver-console#dispatch-secret).
        - name: DISPATCH_SECRET
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: dispatch-secret
        # Token authenticating the hourly WordPress health-sweep CronJob to
        # POST /api/wordpress/health-sweep (constant-time compared server-side).
        # Optional: absent = token auth disabled, sweep still callable via session.
        - name: WORDPRESS_HEALTH_CRON_TOKEN
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: wordpress-health-cron-token
              optional: true
        # DEDICATED token for the daily key-reroll sweep CronJob's POST to
        # /api/wordpress/rotation-sweep. Distinct VALUE from the health token
        # (SECURITY-SCAN-2026-07-18 M2) — fleet key-rotation must not inherit the
        # read-only health token's blast radius. Optional: absent = rotation cron
        # token auth disabled, sweep still callable via a wordpress:admin session.
        - name: WORDPRESS_ROTATION_CRON_TOKEN
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: wordpress-rotation-cron-token
              optional: true
        # DEDICATED token for the hourly Manage-snapshot sweep CronJob's POST to
        # /api/wordpress/manage/sweep (force-pulls every site's overview into the
        # durable snapshot store + warms the iwsl_site_* KPI gauges). Distinct from
        # the health/rotation/metrics-scrape tokens so the crons stay independently
        # gateable. Optional: absent = cron token auth disabled, sweep still
        # callable via a wordpress:read session.
        - name: WORDPRESS_METRICS_CRON_TOKEN
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: wordpress-metrics-cron-token
              optional: true
        # DEDICATED token for the five-minutely WordPress WP-Cron sweep CronJob's
        # POST to /api/wordpress/cron-sweep — the sweep that runs `wp cron event
        # run --due-now` in every site. The sites set DISABLE_WP_CRON, so this is
        # the fleet's ONLY remaining trigger for scheduled jobs, and that is
        # exactly why it does not share a value with the health/rotation/metrics
        # tokens: revoking a read-only sweep's credential must not be able to stop
        # every site's clock as a side effect. Optional: absent = cron token auth
        # disabled and the sweep is reachable only with a wordpress:write session
        # — which fails closed, and is the direction that surfaces as "scheduled
        # jobs stopped" rather than as an open endpoint.
        - name: WORDPRESS_CRON_CRON_TOKEN
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: wordpress-cron-cron-token
              optional: true
        # Shared with the Game Hub power sweep CronJob, which POSTs to
        # /api/game-hub/power-sweep to re-apply every recorded stop. Its own
        # value so it is revocable without touching the WordPress sweeps.
        # Optional: absent = cron token auth disabled and the sweep is reachable
        # only with a game-hub:admin session, which fails closed rather than open.
        - name: GAME_HUB_POWER_CRON_TOKEN
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: game-hub-power-cron-token
              optional: true
        # The placement rebalancer's OWN token. It used to ride
        # GAME_HUB_POWER_CRON_TOKEN, and it is the exception that broke that
        # sharing rule: `sweepRebalance` evicts pods by their own namespace from
        # a CLUSTER-WIDE inventory, so the "same namespace maintenance"
        # justification does not hold for it. Sharing meant the most widely
        # thought-of cron secret on the platform also authorized pod eviction in
        # every namespace ArgoCD delivers. Split, for the same reason the
        # replica-floor sweep already has its own.
        - name: PLACEMENT_REBALANCE_CRON_TOKEN
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: placement-rebalance-cron-token
              optional: true
        # The wake credential Sleep Fleet hands a doorman so it can wake the
        # server it is parked in front of. This is the PRECONDITION of
        # GAME_HUB_SLEEP_ENABLED above, not a nicety: feature-defaults.ts refuses
        # hibernation unless it is >= 32 characters, on the grounds that parking
        # a server nothing can wake is worse than not parking it. Without this
        # var the switch is on and every hibernation silently declines.
        # Seeded in OpenBao 2026-08-03 (kv version 24) as a 64-hex value.
        # To reseed: bao kv patch secret/platform/infraweaver-console game-hub-wake-secret=<64-hex>
        # Store it with NO trailing newline — the gate .trim()s and would report
        # the feature available, but the doorman compares the raw value, so a
        # stray newline presents as a wrong secret rather than a whitespace bug.
        # optional: true deliberately, like every entry here: if the key ever
        # goes missing the feature must fall back to reporting itself blocked
        # with that exact sentence, not crashloop the whole console.
        - name: GAME_HUB_WAKE_SECRET
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: game-hub-wake-secret
              optional: true
        # DEDICATED token for the hourly replica-floor sweep CronJob's POST to
        # /api/replicas/sweep, which re-asserts the "Redundancy" floor across app
        # namespaces. Its own value rather than the Game Hub one because this
        # sweep reaches every namespace ArgoCD delivers. Optional: absent = cron
        # token auth disabled and the sweep is reachable only with a cluster:admin
        # session, which fails closed rather than open.
        - name: REPLICA_FLOOR_CRON_TOKEN
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: replica-floor-cron-token
              optional: true
        # DEDICATED token for the per-minute alert-dispatch CronJob's POST to
        # /api/alerts/dispatch — the sweep that turns firing alerts into actual
        # notifications. Its own value rather than a shared one because this
        # route makes the console send real messages to real people. Optional:
        # absent = cron token auth disabled and the sweep is reachable only with
        # an alerts:admin session, which fails closed rather than open.
        - name: ALERTS_DISPATCH_CRON_TOKEN
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: alerts-dispatch-cron-token
              optional: true
        # DEDICATED token for the hourly WordPress core-update sweep CronJob's POST
        # to /api/wordpress/core-update-sweep — the tick that finalizes elapsed
        # soaks, reaps parked candidates and, when the operator's policy says so,
        # starts one blue/green core update. The console re-validates it in
        # constant time. Optional: absent = cron token auth disabled and the tick is
        # inert (still callable by a wordpress:admin session), which is the safe
        # direction for the one cron that can upgrade production unattended.
        - name: WORDPRESS_UPDATE_CRON_TOKEN
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: wordpress-update-cron-token
              optional: true
        # Shared token for the in-cluster users-reconcile CronJob's POST to
        # /api/users/reconcile. Reuses the same ESO-synced secret VALUE as the
        # health-sweep token (same in-cluster cron trust boundary) under a distinct
        # env name so the two internal crons stay independently gateable. Optional:
        # absent = token auth disabled, reconcile still callable via admin session.
        - name: USERS_RECONCILE_CRON_TOKEN
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: wordpress-health-cron-token
              optional: true
        # Shared token for the in-cluster roster-drift CronJob's GET to
        # /api/security/roster-drift. Reuses the same ESO-synced secret VALUE as the
        # reconcile/health-sweep tokens (same in-cluster cron trust boundary) under a
        # distinct env name so the internal crons stay independently gateable.
        # Optional: absent = token auth disabled, probe still callable via admin session.
        - name: ROSTER_DRIFT_CRON_TOKEN
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: wordpress-health-cron-token
              optional: true
        # C2 (SECURITY-SCAN-2026-07-08): shared fork↔canonical HMAC secret. The
        # fork signs each forwarded feedback copy; the canonical verifies it before
        # bypassing auth (replaces the old client-settable x-infraweaver-upstream
        # header). MUST be the SAME value on the fork and the canonical. Optional:
        # absent = cross-deployment ingest/forward disabled (fail-closed).
        # Sourced from OpenBao (secret/platform/infraweaver-console#feedback-upstream-secret).
        - name: FEEDBACK_UPSTREAM_SECRET
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: feedback-upstream-secret
              optional: true
        # Domain gate: the feedback review dashboard + its mutating/run-log APIs
        # only act on this canonical host, never inside a reused preview image.
        - name: FEEDBACK_DASHBOARD_HOST
          value: infraweaver.int.${BASE_DOMAIN}
        # NAS provider configuration — for Synology/TrueNAS share management
        - name: SYNOLOGY_HOST
          value: "${SYNOLOGY_HOST}"
        - name: SYNOLOGY_PORT
          value: "5001"
        - name: SYNOLOGY_USER
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: synology-user
              optional: true
        - name: SYNOLOGY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: synology-password
              optional: true
        # NOT a CMP placeholder — this path is rendered by KUSTOMIZE ONLY.
        # App `catalog-infraweaver-console-manifests` renders overlays/prod with
        # no `plugin:` stanza, so the envsubst CMP never touches this file and a
        # `${TRUENAS_HOST}` here would reach the pod as the literal 8 characters.
        # It read `${TRUENAS_HOST}` until 2026-08-07 and only worked because
        # overlays/prod/kustomization.yaml patches it; any overlay that forgot the
        # patch shipped the placeholder string into the container. Resolved
        # literal + the overlay patch, so a missed patch degrades to the correct
        # host instead of to nonsense.
        # 10.1.0.135 is the NAS (TrueNAS API answers there). 10.1.0.5 — the
        # value the live CMP substitutions ConfigMap still carries — is a
        # different device with no NAS services. See SECURITY-REMEDIATION-RUNBOOK
        # §P2.4.
        - name: TRUENAS_HOST
          value: "10.1.0.135"
        - name: TRUENAS_API_KEY
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: truenas-api-key
              optional: true
        # UDM Pro connector — reconciles WAN port-forwards + reads WAN/CGNAT.
        # Host + pinned cert fingerprint are non-secret literals (stable
        # appliance). Refresh the pin after a UDM cert rotation with:
        #   echo | openssl s_client -connect 10.0.0.1:443 2>/dev/null \
        #     | openssl x509 -noout -fingerprint -sha256
        # Connector credentials (username/password) + host + cert pin live in
        # OpenBao at secret/platform/udm, written via the console Settings card
        # (Settings → UDM Connector) and read at request time. These env values
        # are an inert fallback; the stored config takes precedence.
        - name: UDM_HOST
          value: https://10.0.0.1
        - name: UDM_CERT_SHA256
          value: "13:8F:E3:EE:C6:34:B3:EB:DB:97:37:88:C1:88:E2:3F:5A:A4:99:E4:2C:66:32:30:9C:79:D6:A1:D7:F9:7B:F6"
        # SMTP for the console's own mailer (user invitation emails). Host/port are
        # non-secret constants (Office365 submission, STARTTLS on 587). Username +
        # password are the SAME authenticated mailbox Authentik sends from. SMTP_FROM
        # MUST resolve to that mailbox unless SendAs is granted to another address
        # (O365 550 5.7.60); the overlay concretes the ${BASE_DOMAIN} placeholder.
        - name: SMTP_HOST
          value: smtp-mail.outlook.com
        - name: SMTP_PORT
          value: "587"
        - name: SMTP_USERNAME
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: smtp-username
              optional: true
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: smtp-password
              optional: true
        - name: SMTP_FROM
          value: noreply@${BASE_DOMAIN}
        # Nextcloud OCS API for offboard user deletion. In-cluster Service URL (the svc
        # DNS name is a Nextcloud trusted domain). Admin credential reuses the existing
        # secret/platform/nextcloud admin the deployment already runs with.
        - name: NEXTCLOUD_URL
          value: http://nextcloud.nextcloud.svc.cluster.local
        - name: NEXTCLOUD_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: nextcloud-admin-user
              optional: true
        - name: NEXTCLOUD_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: nextcloud-admin-password
              optional: true
        # ── WordPress backups: the console is the PROXY half of the split ──────
        # IW_BACKUP_ROLE is deliberately UNSET here. Unset = "console role": the
        # /api/wordpress/backups/** routes do the RBAC/rate-limit work and then
        # forward to the datastore pod, which runs the SAME image with
        # IW_BACKUP_ROLE=datastore and owns the RWO /datastore volume. One image,
        # one build, two behaviours — see backup-deployment.yaml.
        - name: BACKUP_SERVICE_URL
          value: http://infraweaver-backup.infraweaver-console.svc.cluster.local:3000
        # Shared service token presented on every proxied call and compared in
        # constant time by the datastore pod. Same ESO-managed key on both sides
        # so the two halves can never drift. NOT optional: without it the console
        # cannot reach the datastore and every backup route fails closed, which
        # is the correct direction but should be loud at rollout, not silent.
        - name: BACKUP_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: backup-service-token
        # DEDICATED token for the hourly backup-sweep CronJob's POST to
        # /api/wordpress/backups/sweep — the tick that starts due backups, reaps
        # expired leases and applies retention. DISTINCT VALUE from every other
        # cron token: this one can start fleet-wide backups and expire snapshots,
        # so it must be revocable without disturbing health/rotation/metrics.
        # Optional: absent = cron token auth disabled and the tick is reachable
        # only with a wordpress:admin session, which fails closed.
        - name: WORDPRESS_BACKUP_CRON_TOKEN
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: wordpress-backup-cron-token
              optional: true
        # DEDICATED token for the hourly sandbox-sweep CronJob's POST to
        # /api/wordpress/sandboxes/sweep — the TTL reaper that DELETES expired
        # sandbox sites. Distinct value from every other cron token precisely
        # because it destroys sites.
        #
        # This entry was MISSING while the CronJob and the OpenBao key both
        # existed, so the sweep never once ran: the job presented a perfectly
        # good `wordpress-sandbox-cron-token`, the handler compared it against an
        # undefined env var, failed closed, and logged
        # `auth:unauthorized user=anonymous POST /api/wordpress/sandboxes/sweep`
        # every hour since deployment. `curl --fail` turned that 401 into a job
        # Error, so the failures accumulated as Error pods rather than an alert.
        # Fail-closed behaved exactly as designed — the gap was that nothing on
        # the server side had ever been given the secret to check.
        - name: WORDPRESS_SANDBOX_CRON_TOKEN
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: wordpress-sandbox-cron-token
              optional: true
        # DEDICATED token for the two-minute WordPress Staging pickup sweep's
        # POST to /api/wordpress/staging-sweep. Separate from the sandbox token
        # above on the same rule that split that one out, applied in the other
        # direction: the sandbox sweep only DELETES expired clones, this one
        # PROVISIONS — a pass can copy an entire production database into a new
        # environment and enroll it. Neither credential may drive the other.
        # `optional: true` for the same reason as every sibling: a console that
        # has not been given the secret must start and fail closed on this one
        # path, not CrashLoop on every path.
        - name: WORDPRESS_STAGING_CRON_TOKEN
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: wordpress-staging-cron-token
              optional: true
        # The WordPress Staging feature switch is DELIBERATELY NOT SET HERE.
        #
        # A staging clone is a SECOND FULL COPY of a production site's database
        # and uploads, provisioned on this cluster's disks and served on its own
        # hostname behind Authentik — so being able to stop it mid-incident
        # matters more than declaring it on. Writing the variable here would PIN
        # it (`envPinReason`, src/lib/feature-defaults.ts): env vars in a running
        # Deployment are immutable, so a pinned flag moves only by editing this
        # file and rolling new pods, and the console's runtime kill switch would
        # stop working for precisely the feature whose failure mode is copying
        # production databases.
        #
        # Unset is not the same as off. This cluster runs PLATFORM_ENABLE_ALL=1
        # and WORDPRESS_STAGING_ENABLED is not in NEVER_DEFAULTED, so the master
        # default already arms the machinery — and leaves the toggle live.
        # Which SITES may use it is a separate, per-site operator switch in the
        # ConfigMap `infraweaver-wordpress-staging-enabled`, default off for
        # every site; BOTH must be true before a button press is served.
        # Staging also requires the sandbox switch, because it is that pipeline
        # with a different seal — same createSite, same PVCs, same wildcard DNS,
        # same fleet storage budget.
        # DEDICATED token for the daily patch-sweep CronJob's POST to
        # /api/wordpress/patch/sweep — the unattended remediation pass. Distinct
        # value because this one can change production code on every site.
        #
        # Missing for the same reason as the sandbox token above, with the same
        # symptom at 04:31 daily. Auto-remediation still ships OFF by default, so
        # restoring auth makes the sweep report "refused at the first gate" —
        # a real answer — instead of a 401.
        - name: WORDPRESS_PATCH_CRON_TOKEN
          valueFrom:
            secretKeyRef:
              name: infraweaver-console-secret
              key: wordpress-patch-cron-token
              optional: true
        resources:
          requests:
            memory: 384Mi
            cpu: 250m
          limits:
            # Raised from 512Mi/500m: at 500m CPU the Next.js event loop gets
            # throttled during k8s-API aggregation (posture/apps/cluster routes
            # list all pods+ns), so /api/ping stalled past the liveness budget
            # and the pod was SIGTERM-killed (exit 143) ~1×/hr. 1 CPU + 1Gi gives
            # headroom to answer probes while a heavy request is in flight.
            memory: 1Gi
            # 1 -> 2, the SECOND raise for the same cause. Measured 2026-08-16
            # straight from the container cgroup, not `kubectl top`:
            #   nr_periods 349, nr_throttled 129 (36.9%), throttled 5.29s
            #   against 20.36s of CPU actually consumed — a 26% wall-clock tax.
            # Sustained 7%-43% every 5 minutes over 3 hours.
            #
            # ⚠️ This is invisible to the HPA, which averages CPU against
            # REQUESTS over 15s+: `kubectl get hpa` reads 1%/70% while a third of
            # periods are capped. Adding replicas does not fix throttling; only
            # raising the ceiling does.
            #
            # 2 is exactly the `workload-defaults` LimitRange max.cpu for this
            # namespace, so this is the last raise available here.
            cpu: "2"
        startupProbe:
          httpGet:
            path: /api/ping
            port: 3000
          failureThreshold: 30
          periodSeconds: 10
          # /api/ping can momentarily exceed the 1s default under CPU/memory
          # pressure (Next.js server, 500m CPU limit) → "context deadline
          # exceeded" flaps. Give each probe attempt a realistic budget.
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/ping
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/ping
            port: 3000
          initialDelaySeconds: 0
          periodSeconds: 30
          # Raised 3→6: a single slow /api/ping under transient CPU pressure must
          # not restart a pod that is otherwise serving. 6×30s = 3min of sustained
          # unresponsiveness before a kill (readiness still pulls it from the LB
          # meanwhile), which distinguishes a real hang from a throttle blip.
          failureThreshold: 6
          timeoutSeconds: 5
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 10"]
        volumeMounts:
        # Proxmox cluster CA, read-only. Node must trust it or every call to the
        # hypervisor API fails UNABLE_TO_VERIFY_LEAF_SIGNATURE — the API serves a
        # cert signed by the PVE cluster's own CA, not a public one.
        - name: proxmox-ca
          mountPath: /etc/ssl/proxmox
          readOnly: true
        # Next.js needs a writable cache dir at runtime (readOnlyRootFilesystem prevents direct writes)
        - name: nextjs-cache
          mountPath: /app/.next/cache
        - name: git-cache
          mountPath: /git-cache
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: proxmox-ca
        configMap:
          name: proxmox-cluster-ca
      - name: nextjs-cache
        emptyDir: {}
      - name: git-cache
        emptyDir: {}
      - name: tmp
        emptyDir: {}
