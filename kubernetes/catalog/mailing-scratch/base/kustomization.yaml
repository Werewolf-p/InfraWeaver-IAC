apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Base manifests for the step-4 Stalwart scratch instance.
#
# EXPLICIT RESOURCE LIST, NOT A DIRECTORY GLOB — on purpose. ArgoCD renders a flat
# `manifests/` directory by globbing, and this repo has eight Applications that
# managed ZERO resources because their source path rendered nothing while the app
# reported Synced/Healthy. A kustomization that names its files fails loudly when
# one is missing or renamed, and `kubectl kustomize` reproduces byte-for-byte what
# ArgoCD will apply.
#
# No `namespace:` transformer here. Every resource carries its own
# `metadata.namespace: mailing-scratch`, matching vaultwarden — the transformer
# treats `kind: Namespace` specially and the surprise is not worth the saved line.
#
# Ordering note: ArgoCD applies Namespace ahead of namespaced resources in its own
# resource ordering, and the generated Application also carries
# `CreateNamespace=true`, so the namespace exists either way. Kyverno's
# `generate-default-deny-cnp` and `auto-baseline-requests` LimitRange both fire on
# that Namespace admission.
resources:
  - namespace.yaml
  - configmap.yaml
  - externalsecret.yaml
  - service.yaml
  - statefulset.yaml
  - ciliumnetworkpolicy.yaml
