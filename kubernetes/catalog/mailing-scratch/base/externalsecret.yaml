---
# Stalwart's break-glass administrator, brokered from OpenBao. Never in git.
#
# ── WHY ITS OWN ExternalSecret AND ITS OWN OpenBao PATH ──────────────────────
# Not tidiness — blast radius. Under `deletionPolicy: Retain`, ESO does not skip
# a missing property, it ABORTS THE ENTIRE SECRET: every key in the target, not
# just the absent one. The console's ExternalSecret is Retain. So a mail
# credential added to a shared path and then mistyped, renamed, or simply not
# declared in a catalog.yaml would take the console's whole Secret down with it,
# and the symptom would be "the console won't start", days after the mail change.
#
# Two independent controls stop that here:
#   1. A SEPARATE PATH (`platform/mailing-scratch`) and a separate target Secret,
#      so nothing else's key set can be affected by anything mail does.
#   2. NO `deletionPolicy: Retain` on this object, so even its OWN failure mode
#      degrades to "this key is missing" rather than "this Secret is missing".
#      vaultwarden's ExternalSecret makes the same choice for the same reason.
#
# ── WHY A TEMPLATE ──────────────────────────────────────────────────────────
# Stalwart takes ONE environment variable in the form `username:password`
# (STALWART_RECOVERY_ADMIN). The two halves are stored separately in OpenBao so
# the username is legible in catalog.yaml and the password is a generated value
# that has never been in this repo; the template joins them at sync time.
# bookstack's ExternalSecret is the precedent for a template in this repo, and
# scripts/validate-iac.sh's seed gate documents the consequence explicitly: a
# target with `spec.target.template.data` is "opaque" — the gate cannot enumerate
# its final key set, so it does not judge the workload's secretKeyRef against it.
# The keys are therefore declared in ../../catalog.yaml `secrets.keys` (which is
# what makes the seeder create them at all) and NOT relied on being caught here.
#
# ⚠️ A colon in the password would silently truncate the credential rather than
# fail. The seeder's generator strips `=+/` out of base64, so the value is
# alphanumeric — but if that generator is ever changed, this is the consumer that
# breaks quietly. See the note on `recovery-admin-password` in catalog.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-recovery-admin
  namespace: mailing-scratch
  labels:
    app.kubernetes.io/name: stalwart
    app.kubernetes.io/part-of: mailing
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: stalwart-recovery-admin
    creationPolicy: Owner
    # deletionPolicy is deliberately unset (defaults to Retain-free behaviour):
    # see the header. Do not add `deletionPolicy: Retain` to this object.
    template:
      type: Opaque
      engineVersion: v2
      data:
        STALWART_RECOVERY_ADMIN: "{{ .username }}:{{ .password }}"
  data:
    # `key` is the path INSIDE the store's `secret` mount, matching catalog.yaml's
    # `secrets.path` — the same form vaultwarden and bookstack use, and the form
    # scripts/seed-catalog-secrets.sh writes to.
    - secretKey: username
      remoteRef:
        key: platform/mailing-scratch
        property: recovery-admin-user
    - secretKey: password
      remoteRef:
        key: platform/mailing-scratch
        property: recovery-admin-password
