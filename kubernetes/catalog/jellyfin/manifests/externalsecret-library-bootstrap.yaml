---
# ExternalSecret — Jellyfin API key for the library-bootstrap CronJob.
#
# Sourced from the console's own Jellyfin service-account secret (the same live,
# console-rotated key the media-notify sidecar tracks), so the bootstrap never
# depends on a hand-copied key. Admin-scoped because creating a library
# (/Library/VirtualFolders) requires an administrator token.
#
# OpenBao path (written by the console via writeAppSecret, app "jellyfin"):
#   secret/platform/app-accounts/jellyfin/service-account
#     apiKey → the console's live Jellyfin API key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyfin-bootstrap-credentials
  namespace: jellyfin
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/component: library-bootstrap
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: jellyfin-bootstrap-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api-key
      remoteRef: { key: secret/platform/app-accounts/jellyfin/service-account, property: apiKey }
