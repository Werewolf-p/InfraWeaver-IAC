apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/managed-by: infraweaver
    infraweaver.io/source: community-apps
    infraweaver.io/tier: simple
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  template:
    metadata:
      annotations:
        infraweaver.io/rebalance-memory: 'true'
        # ⚠️ Velero MUST NOT file-system-back-up the NAS share.
        # `velero-weekly-localpath` sets defaultVolumesToFsBackup: true, which
        # opts in EVERY volume in this namespace — including this SMB mount to
        # the TrueNAS media library. On 2026-08-16 that swept 48.79 GiB of media
        # into the 50 GiB MinIO store, filled it to 100%, and every Velero backup
        # cluster-wide has failed since. The transfer itself was Canceled, so it
        # protected nothing and cost everything.
        # The media lives on the NAS and is backed up there; only the local-path
        # config volume needs Velero.
        backup.velero.io/backup-volumes-excludes: nas-media-ro
      labels:
        app.kubernetes.io/name: jellyfin
    spec:
      enableServiceLinks: false
      # Pinned to cp1: /config lives on node-local local-path-retain storage on
      # cp1, and this keeps Jellyfin off the memory-starved cp3 node (6.7Gi vs 21Gi).
      nodeSelector:
        kubernetes.io/hostname: talos-prod-cp1
      securityContext:
        fsGroup: 1000
      containers:
        - name: jellyfin
          # Pinned by digest, 2026-08-07. This reference was previously bare
          # (`lscr.io/linuxserver/jellyfin`, no tag), which Docker resolves as
          # `:latest` — so every pod restart could silently land a different
          # Jellyfin build, including a schema-migrating major upgrade, with no
          # record in git of what was actually running.
          #
          # This digest is the image running now (Jellyfin Server 10.11.11,
          # confirmed via the container's /System/Info/Public endpoint) and was
          # verified resolvable on lscr.io before committing, so the pin is a
          # no-op for the running pod.
          #
          # To upgrade: pick the new tag from
          # https://github.com/linuxserver/docker-jellyfin/pkgs/container/jellyfin,
          # resolve it to a digest, and bump this line — deliberately, in a PR.
          image: lscr.io/linuxserver/jellyfin@sha256:b8dcc7b71d0ea872b74314da4b995c0cf282b1778438c295996e7be88c70fdda
          env:
            - name: JELLYFIN_PublishedServerUrl
              value: http://192.168.0.5
            - name: PUID
              value: '99'
            - name: PGID
              value: '100'
            - name: UMASK
              value: '022'
            - name: TZ
              value: UTC
          ports:
            - containerPort: 8096
              protocol: TCP
              name: webui
            - containerPort: 8920
              protocol: TCP
              name: port-8920
            - containerPort: 7359
              protocol: UDP
              name: port-7359-u
            - containerPort: 1900
              protocol: UDP
              name: port-1900-u
          startupProbe:
            tcpSocket:
              port: 8096
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: 8096
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8096
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: jellyfin-data-0
              mountPath: /config
            - name: nas-media-ro
              mountPath: /data
              readOnly: true
          resources:
            requests:
              memory: 256Mi
              cpu: 500m
            limits:
              memory: 4Gi
              cpu: 5000m
      volumes:
        - name: jellyfin-data-0
          persistentVolumeClaim:
            claimName: jellyfin-data-0-lp
        - name: nas-media-ro
          persistentVolumeClaim:
            claimName: nas-infraweaver-media-ro
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app.kubernetes.io/name: jellyfin
    infraweaver.io/source: community-apps
spec:
  selector:
    app.kubernetes.io/name: jellyfin
  ports:
    - port: 8096
      targetPort: 8096
      protocol: TCP
      name: webui
    - port: 8920
      targetPort: 8920
      protocol: TCP
      name: port-8920
    - port: 7359
      targetPort: 7359
      protocol: UDP
      name: port-7359-u
    - port: 1900
      targetPort: 1900
      protocol: UDP
      name: port-1900-u
  type: ClusterIP
