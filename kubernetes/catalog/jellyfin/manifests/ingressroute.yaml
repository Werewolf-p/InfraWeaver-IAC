---
# Jellyfin IngressRoute — Traefik on `websecure`, wildcard TLS via the shared
# `default` store, Cloudflare-proxied.
#
# AUTH DECISION (plan §5.4): forward-auth (Authentik) is intentionally NOT
# applied to Jellyfin. The Authentik middleware performs a browser redirect
# that breaks native Jellyfin apps (iOS, Android, tvOS, Roku, LG WebOS) and
# Jellyfin's DLNA endpoints — every one of which is the primary way people
# actually consume the service worldwide.
#
# Defence-in-depth without forward-auth:
#   * Cloudflare proxy hides the origin IP; enable Cloudflare Access on the
#     `/web/*` path only if you want an extra SSO factor for browser use.
#   * Jellyfin's built-in auth is required for every user; disable anonymous
#     access in the Jellyfin admin UI.
#   * NAS credentials are RO (this catalog's `nas-media-ro`) so a Jellyfin
#     compromise cannot delete or corrupt media (plan §3).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app.kubernetes.io/name: jellyfin
    infraweaver.io/source: community-apps
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`jellyfin.int.${BASE_DOMAIN}`)
      kind: Rule
      # No forward-auth middleware — native clients depend on Jellyfin's own
      # authentication, not a redirect-based SSO gate. See the AUTH DECISION
      # above; do not "harden" this by adding forward-auth.
      #
      # secure-headers (traefik ns; cross-namespace refs are enabled via
      # providers.kubernetesCRD.allowCrossNamespace=true) is header-only and
      # therefore safe for native clients: iOS/Android/tvOS/Roku/WebOS apps and
      # DLNA never parse X-Frame-Options / Permissions-Policy / HSTS. It closes
      # GAP-H6 (this route previously sent no security headers at all).
      # Permissions-Policy only names geolocation/microphone/camera/payment/usb/
      # bluetooth — fullscreen and encrypted-media are left at their defaults, so
      # fullscreen playback and Widevine DRM are unaffected.
      #
      # rate-limit-public (NOT the -cf variant): jellyfin.int.${BASE_DOMAIN}
      # resolves to the origin 203.0.113.10 — the *.int wildcard is DNS-only, so
      # there is no Cf-Connecting-IP header to bucket on and Traefik's default
      # remote-address criterion is the true client IP (externalTrafficPolicy:
      # Local). 100/s with burst 200 per IP is sized for Range-request direct
      # play, poster-grid loads, and a whole household behind one NAT address;
      # see the header of core/traefik/manifests/middleware-rate-limit.yaml.
      middlewares:
        - name: secure-headers
          namespace: traefik
        - name: rate-limit-public
          namespace: traefik
      services:
        - name: jellyfin
          port: 8096
  tls:
    store:
      name: default
      namespace: traefik
