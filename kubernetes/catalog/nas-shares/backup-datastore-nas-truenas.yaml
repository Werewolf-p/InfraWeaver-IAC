---
# The backup datastore's OWN NAS account — deliberately not `nas-truenas-rw`.
#
# Every other NAS mount on this platform authenticates as `iw-truenas-rw`, a
# PER-PROVIDER account that Nextcloud and Jellyfin also hold. Pointing the backup
# datastore at that credential would mean every workload with a NAS mount can read
# every snapshot's database dump — and each of those dumps contains that site's
# IWSL private signing key. Read access is key disclosure; write access is the
# ability to author a self-consistent forged snapshot for a future restore.
#
# So this is a share account with exactly one share: `iw-backup-dst` on
# `//10.1.0.135/iw-backup-datastore`, whose dataset is chmod 700 to uid/gid 3008.
# Measured on 2026-07-30 against the real NAS: `iw-backup-dst` lists and writes;
# `iw-truenas-rw` gets NT_STATUS_ACCESS_DENIED at the share root. That measurement
# is what the console's dedicated-export attestation is actually attesting to.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nas-backup-datastore
  namespace: infraweaver-console
  labels:
    infraweaver.io/nas-share: 'true'
    infraweaver.io/component: nas-credentials
    infraweaver.io/provider: truenas
    infraweaver.io/access: rw
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: nas-backup-datastore
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: secret/platform/nas/creds/backup-datastore
        property: username
    - secretKey: password
      remoteRef:
        key: secret/platform/nas/creds/backup-datastore
        property: password
