---
apiVersion: v1
kind: Namespace
metadata:
  name: gatus
  labels:
    app.kubernetes.io/name: gatus
    infraweaver.io/type: catalog-app
---
# Gatus config — AUTO-GENERATED from platform.yaml
# DO NOT edit this ConfigMap manually. Run:
#   python3 scripts/generate-gatus-config.py
# to regenerate after changing platform.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: gatus
data:
  config.yaml: |
    web:
      port: 8080

    storage:
      type: memory

    alerting:
      discord:
        webhook-url: "${DISCORD_WEBHOOK_URL}"
        default-alert:
          description: "InfraWeaver platform health alert"
          send-on-resolved: true
          failure-threshold: 5
          success-threshold: 2

    endpoints:
      - name: ArgoCD
        url: http://argocd-server.argocd.svc.cluster.local/healthz
        interval: 60s
        group: core
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2000"
        alerts:
          - type: discord
            description: "ArgoCD is unreachable via VPN"

      - name: Traefik
        url: http://traefik-dashboard.traefik.svc.cluster.local:8080/ping
        interval: 60s
        group: core
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord
            description: "Traefik ingress is unreachable — all internal services affected"

      - name: OpenBao
        url: http://openbao.openbao.svc.cluster.local:8200/v1/sys/health
        interval: 60s
        group: core
        conditions:
          - "[STATUS] == 200"
          - "[BODY].initialized == true"
          - "[BODY].sealed == false"
        alerts:
          - type: discord
            description: "OpenBao is sealed or unreachable — secrets unavailable"

      - name: Authentik SSO
        url: https://auth.${BASE_DOMAIN}/-/health/ready/
        interval: 60s
        group: platform
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord
            description: "Authentik SSO is down — all platform logins affected"

      - name: Prometheus
        url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/-/healthy
        interval: 60s
        group: monitoring
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord
            description: "Prometheus is unreachable — metrics collection stopped"

      - name: Loki
        url: http://loki.monitoring.svc.cluster.local:3100/ready
        interval: 120s
        group: monitoring
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord
            description: "Loki is unreachable — log aggregation stopped"

      - name: InfraWeaver Console
        url: http://infraweaver-console.infraweaver-console.svc.cluster.local:3000/api/ping
        interval: 60s
        group: catalog
        conditions:
          - "[STATUS] == 200"
          - "[BODY].status == ok"
        alerts:
          - type: discord
            description: "InfraWeaver Console is unreachable"

      - name: Container Registry
        url: http://registry.registry.svc.cluster.local:5000/v2/
        interval: 120s
        group: catalog
        conditions:
          - "[STATUS] < 500"
        alerts:
          - type: discord
            description: "Container registry is unreachable"

      - name: Cloudflare DNS
        url: https://cloudflare.com
        interval: 300s
        group: external
        conditions:
          - "[STATUS] < 500"
        alerts:
          - type: discord
            description: "Cloudflare unreachable — external DNS may be failing"

      - name: Let's Encrypt ACME
        url: https://acme-v02.api.letsencrypt.org/directory
        interval: 300s
        group: external
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord
            description: "Let's Encrypt ACME unreachable — cert renewal may fail"
---
# ExternalSecret — pulls Discord webhook URL from OpenBao
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus-discord-secret
  namespace: gatus
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: gatus-discord-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DISCORD_WEBHOOK_URL
      remoteRef:
        key: secret/platform/discord
        property: webhook_url
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# ServiceAccount — dedicated, token NOT mounted.
#
# Gatus never calls the Kubernetes API: every endpoint in the ConfigMap above is
# a plain HTTP(S) URL and the Kubernetes auto-discovery provider is not enabled.
# It was therefore running on the `default` SA with a mounted, automounted token
# it had no use for (CIS 5.1.5/5.1.6). A dedicated SA with no RBAC bindings and
# automount disabled removes that credential from the pod entirely.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gatus
  namespace: gatus
  labels:
    app.kubernetes.io/name: gatus
automountServiceAccountToken: false
---
# Deployment — Gatus status page
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  namespace: gatus
  labels:
    app.kubernetes.io/name: gatus
    app.kubernetes.io/instance: gatus
spec:
  replicas: 1
  # Old ReplicaSets are kept only for `kubectl rollout undo`, which this cluster
  # cannot actually use: catalog-gatus-manifests syncs with selfHeal=true, so
  # ArgoCD reverts any manual rollback within one reconcile. Rollback here is
  # `git revert`. Retaining 0 old ReplicaSets keeps stale, non-conformant pod
  # templates from lingering as permanent PolicyReport failures.
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gatus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gatus
      annotations:
        config-version: "1"
    spec:
      priorityClassName: platform-standard
      serviceAccountName: gatus
      # Gatus makes no Kubernetes API calls — see the ServiceAccount above.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gatus
          image: twinproduction/gatus:v5.12.1
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: gatus-discord-secret
                  key: DISCORD_WEBHOOK_URL
          volumeMounts:
            - name: config
              mountPath: /config
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            # Limits added, requests deliberately unchanged.
            #
            # Measured 2026-08-07: this pod uses 19Mi against a 64Mi request and
            # had NO memory limit at all, so the kernel would let it grow into
            # whatever the node had left. It runs on talos-prod-cp3, the small
            # node (6.5Gi allocatable, 78% of memory already requested), which is
            # exactly where an uncapped process does the most damage.
            #
            # 192Mi is 10x measured usage and a 3x burst over the request, well
            # inside the 8x ceiling that limit-memory-burst-ratio enforces.
            # Because only LIMITS are added here and the request is untouched,
            # this costs zero scheduling budget on cp3.
            limits:
              cpu: 500m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: gatus-config
---
apiVersion: v1
kind: Service
metadata:
  name: gatus
  namespace: gatus
  labels:
    app.kubernetes.io/name: gatus
spec:
  selector:
    app.kubernetes.io/name: gatus
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
# IngressRoute — status.int.${BASE_DOMAIN} (VPN-only, Authentik forward-auth)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gatus
  namespace: gatus
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`status.int.${BASE_DOMAIN}`)
      kind: Rule
      # BOTH NAMES WERE WRONG, AND A WRONG NAME HERE IS NOT A DEGRADED ROUTE —
      # it is no route at all. Traefik refuses to build a router whose middleware
      # cannot be resolved, so `status.int.${BASE_DOMAIN}` answered a plain
      # `404 page not found` on every path for 25 days while the Gatus pod, its
      # Service and its endpoint were all healthy. The status page was the one
      # surface that could not report its own outage.
      #
      # The middlewares that exist are `traefik/forward-auth` (the Authentik
      # forward-auth used by every other internal route here) and
      # `traefik/secure-headers`. `authentik/authentik-forward-auth` and
      # `traefik/security-headers` never existed under those names.
      middlewares:
        - name: forward-auth
          namespace: traefik
        - name: secure-headers
          namespace: traefik
      services:
        - name: gatus
          port: 8080
  # THE SECOND HALF OF THE SAME OUTAGE. `secretName` is resolved in the
  # IngressRoute's OWN namespace, and `platform-wildcard-int-tls` lives in
  # `traefik` — Traefik logged `secret gatus/platform-wildcard-int-tls does not
  # exist` on every reload. Jellyfin, Nextcloud and Tradesphere are all routes
  # that live outside `traefik` and all reference the shared default store
  # instead, which is why they serve and this did not.
  tls:
    store:
      name: default
      namespace: traefik
---
# NetworkPolicy for Gatus
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gatus-ingress
  namespace: gatus
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gatus
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
