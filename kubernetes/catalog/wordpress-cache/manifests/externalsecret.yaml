---
# ─────────────────────────────────────────────────────────────────────────────
# Valkey ACL file, rendered from OpenBao.
#
# The ACL is a rendered artefact rather than a stored blob: OpenBao holds one
# password per site, and the template below assembles them into the users.acl
# Valkey reads. Adding a site is one new property in OpenBao plus one new `user`
# line here — the password itself never appears in git.
#
# ⚠️ SEEDING IS A PREREQUISITE, NOT A FOLLOW-UP. deletionPolicy: Retain makes ESO
#    fail the ENTIRE secret sync when ANY referenced property is missing (a
#    missing key is only skipped when the policy is not Retain — this repo has
#    been bitten by that twice, see
#    kubernetes/catalog/infraweaver-foyer/base/externalsecret.yaml). So
#    `secret/platform/wordpress-cache` must contain `yonavaarwater-nl-password`
#    BEFORE this is applied, or the Deployment gets no ACL file at all and
#    Valkey refuses to start.
#
#    Seed with:
#      bao kv put secret/platform/wordpress-cache \
#        yonavaarwater-nl-password="$(openssl rand -base64 32)"
#
#    and add a matching entry to catalog.yaml `secrets.keys`, which
#    scripts/validate-iac.sh step 4/4 checks.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wordpress-cache-auth
  namespace: wordpress
  labels:
    app.kubernetes.io/name: wordpress-cache
    app.kubernetes.io/component: cache
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: wordpress-cache-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # `user default off` is the load-bearing line: without it Valkey ships a
        # passwordless superuser that every pod in this namespace can reach.
        #
        # Per site: pinned to its own key prefix, no @admin (CONFIG, SHUTDOWN,
        # ACL) and no @dangerous (FLUSHALL, KEYS, DEBUG). INFO is added back
        # because the plugin's diagnostics screen reads it and it leaks nothing
        # another site could not already infer.
        #
        # FLUSHDB is added back deliberately. redis-cache's Predis::flushOrFail()
        # calls FLUSHDB unconditionally — WP_REDIS_SELECTIVE_FLUSH only governs
        # the drop-in's runtime wp_cache_flush(), not the plugin's enable/flush
        # path — so without it `wp redis enable` and the admin "Flush Cache"
        # button both fail outright (verified 2026-08-15).
        #
        # Residual risk, accepted knowingly: ACLs cannot scope a command to one
        # logical database, so a compromised site could SELECT another site's db
        # and FLUSHDB it. That is a cache wipe the victim transparently
        # repopulates from its own database — availability noise, not disclosure.
        # The property that actually matters, no cross-site READ, is enforced by
        # the `~<prefix>*` key pattern and holds regardless of which db is
        # selected (verified: a cross-prefix SET returns NOPERM).
        users.acl: |
          user default off
          user yonavaarwater-nl on >{{ .yonavaarwaterNlPassword }} ~yona:* +@all -@admin -@dangerous +info +flushdb
        # The same password, on its own, for the site pod to consume as an env
        # var. wp-config.php reads it via getenv_docker() exactly as it already
        # does for DB_PASSWORD, so the credential stays out of the wp-config.php
        # file that lives on the site's PVC.
        yonavaarwater-nl-password: "{{ .yonavaarwaterNlPassword }}"
  data:
    - secretKey: yonavaarwaterNlPassword
      remoteRef:
        key: secret/platform/wordpress-cache
        property: yonavaarwater-nl-password
