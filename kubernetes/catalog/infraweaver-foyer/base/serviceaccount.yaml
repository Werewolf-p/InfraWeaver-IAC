---
# The identity Foyer runs as. Distinct from `infraweaver-console` on purpose:
# the two apps share a namespace (see README §"Why no dedicated namespace") but
# they must NEVER share a ServiceAccount. The console SA carries a cluster-wide
# ClusterRole with get/list/watch on secrets and pods/exec across every
# namespace; Foyer is a public, internet-facing surface and gets four verbs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infraweaver-foyer
  namespace: infraweaver-console
  labels:
    app: infraweaver-foyer
# MUST remain true. Foyer's only cluster handle (`src/lib/kube.ts`) calls
# `KubeConfig.loadFromCluster()`, which reads the projected token from
# /var/run/secrets/kubernetes.io/serviceaccount/. Without it every ConfigMap
# read fails, `readPortalConfig()` degrades to `disabledConfig()` — and a
# disabled portal answers 503 to every user, for ever. This is the one place
# where "least privilege" and "works at all" genuinely conflict, and the
# resolution is not to drop the token but to make the token worth almost
# nothing: see rbac.yaml.
automountServiceAccountToken: true
