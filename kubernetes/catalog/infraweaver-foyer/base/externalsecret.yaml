---
# Foyer's Authentik OIDC client credentials + Auth.js signing secret.
#
# Pattern copied verbatim from infraweaver-console/base/externalsecret.yaml:
# ESO ClusterSecretStore `openbao`, creationPolicy Owner, deletionPolicy Retain,
# and the explicit conversionStrategy/decodingStrategy/metadataPolicy triple
# (present so the Application's ignoreDifferences jqPathExpressions match and
# the app does not sit permanently OutOfSync on ESO's own defaulting).
#
# ⚠ deletionPolicy: Retain has a sharp edge this repo has been bitten by twice.
#   Under Retain, ESO fails the ENTIRE secret sync if ANY referenced property is
#   absent in OpenBao — a missing key is only skipped when deletionPolicy is not
#   Retain. So one unseeded property means the pod gets NO secret at all, and
#   the ArgoCD app reports Degraded while every individual resource reads
#   healthy. Every property below is therefore also declared in catalog.yaml so
#   scripts/seed-catalog-secrets.sh materialises it on a fresh install.
#
# Seeding by hand (values never live in git):
#   bao kv patch secret/platform/infraweaver-foyer oidc-client-id=infraweaver-foyer
#   bao kv patch secret/platform/infraweaver-foyer oidc-client-secret=<from Authentik>
#   bao kv patch secret/platform/infraweaver-foyer nextauth-secret=$(openssl rand -hex 32)
#
# `oidc-client-secret` is the ONE value that cannot be generated locally: it is
# minted by Authentik when the `infraweaver-foyer` OAuth2/OpenID provider is
# created, and must be copied from there. See README §Go-live.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infraweaver-foyer-secret
  namespace: infraweaver-console
  labels:
    app: infraweaver-foyer
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: infraweaver-foyer-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Authentik OAuth2 provider client id. Static, but held here rather than in
    # the Deployment so the whole OIDC triple has exactly one source.
    - secretKey: oidc-client-id
      remoteRef:
        key: secret/platform/infraweaver-foyer
        property: oidc-client-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: oidc-client-secret
      remoteRef:
        key: secret/platform/infraweaver-foyer
        property: oidc-client-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # Auth.js v5 session/JWT signing key. Read by the library from the process
    # environment (AUTH_SECRET, falling back to NEXTAUTH_SECRET) rather than by
    # application code, which is why it does not appear in a `process.env` grep
    # of src/ and is easy to forget. Without it every sign-in fails.
    #
    # MUST NOT be the console's nextauth-secret. A shared signing key would let
    # a token minted for one app be presented to the other, and the console's
    # own history includes a script that forged `platform-admins` from exactly
    # that secret. Separate path, separate key.
    - secretKey: nextauth-secret
      remoteRef:
        key: secret/platform/infraweaver-foyer
        property: nextauth-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
