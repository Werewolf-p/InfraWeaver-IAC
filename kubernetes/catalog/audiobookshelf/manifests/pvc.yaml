# gitops-coverage: dormant - catalog template with no catalog.yaml, so it is not
# installable and no Application can be generated for it.
#
# Every other catalog app carries a catalog.yaml; scripts/sync-catalog.sh writes
# the bootstrap Application for the ones platform.yaml lists under `catalog.enabled`.
# audiobookshelf has manifests but no catalog.yaml, so it is invisible to that
# machinery and to the console catalog — half-finished, not parked on purpose.
# To turn it on: add catalog.yaml (copy kubernetes/catalog/_template/catalog.yaml),
# then add `audiobookshelf` to catalog.enabled in platform.yaml.
#
---
# PVC for "Config" → /config
# Default path on Unraid: /mnt/user/appdata/audiobookshelf/config/
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-data-0
  namespace: audiobookshelf
  labels:
    app.kubernetes.io/name: audiobookshelf
    app.kubernetes.io/component: storage
    infraweaver.io/source: community-apps
  annotations:
    infraweaver.io/unraid-path: "/mnt/user/appdata/audiobookshelf/config/"
    infraweaver.io/required: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
# PVC for "Metadata" → /metadata
# Default path on Unraid: /mnt/user/appdata/audiobookshelf/metadata/
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-data-1
  namespace: audiobookshelf
  labels:
    app.kubernetes.io/name: audiobookshelf
    app.kubernetes.io/component: storage
    infraweaver.io/source: community-apps
  annotations:
    infraweaver.io/unraid-path: "/mnt/user/appdata/audiobookshelf/metadata/"
    infraweaver.io/required: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi