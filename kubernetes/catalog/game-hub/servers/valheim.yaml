---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: valheim-server-config
  namespace: game-hub
  labels:
    app: valheim-server
    infraweaver/game: "true"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valheim-server
  namespace: game-hub
  labels:
    app: valheim-server
    infraweaver/game: "true"
    infraweaver/game-type: valheim
spec:
  # NOTE: replicas is intentionally omitted. The console owns start/stop (scaling
  # the live Deployment). If replicas is pinned here, ArgoCD selfHeal re-applies it
  # on every sync and a stopped server (replicas 0) is restarted within ~1s
  # (stopped -> starting -> running). RespectIgnoreDifferences does NOT reliably
  # exclude /spec/replicas under ServerSideApply selfHeal, so the robust fix is to
  # leave replicas out of git entirely (ArgoCD ignoreDifferences also covers it).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: valheim-server
  template:
    metadata:
      labels:
        app: valheim-server
        infraweaver/game: "true"
      annotations:
        infraweaver.io/rebalance-memory: "true"
    spec:
      priorityClassName: game-server
      # Prefer the node platform services bias away from so game workloads stop contending with ArgoCD/Auth.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - talos-prod-cp2
      # Hard-spread game servers: no two on same node (prevents memory overload)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          minDomains: 3
          labelSelector:
            matchLabels:
              infraweaver/game: "true"
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: valheim
          image: lloesche/valheim-server:sha-732221f4d5b5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 2456
              protocol: UDP
              name: game
            - containerPort: 2457
              protocol: UDP
              name: query
            - containerPort: 2458
              protocol: TCP
              name: rcon
          env:
            - name: SERVER_NAME
              value: "InfraWeaver Valheim"
            - name: WORLD_NAME
              value: "MyWorld"
            - name: SERVER_PASS
              value: "changeme123"
            - name: SERVER_PUBLIC
              value: "false"
            - name: BACKUPS
              value: "false"
            - name: UPDATE_CRON
              value: ""
          resources:
            requests:
              memory: 1400Mi  # actual usage ~1200Mi; lower request lets scheduler place this on less-loaded nodes
              cpu: "500m"
            limits:
              memory: 2500Mi
              cpu: "2"
          livenessProbe:
            exec:
              command: ["sh", "-c", "pgrep -f valheim > /dev/null 2>&1"]
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["sh", "-c", "pgrep -f valheim > /dev/null 2>&1"]
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /config
            - name: config
              mountPath: /opt/valheim
              subPath: valheim-data
      terminationGracePeriodSeconds: 60
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: valheim-server-config
---
apiVersion: v1
kind: Service
metadata:
  name: valheim-server
  namespace: game-hub
  labels:
    app: valheim-server
    infraweaver/game: "true"
spec:
  type: NodePort
  selector:
    app: valheim-server
  ports:
    - port: 2456
      targetPort: 2456
      protocol: UDP
      name: game
    - port: 2457
      targetPort: 2457
      protocol: UDP
      name: query
    - port: 2458
      targetPort: 2458
      protocol: TCP
      name: rcon
