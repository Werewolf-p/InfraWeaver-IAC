---
# server-credentials-es.yaml — ExternalSecret projecting game-server credentials
# out of OpenBao into the game-hub namespace, so no plaintext password lives in git.
#
# Consumed by:
#   - palworld   Deployment  → env ADMIN_PASSWORD  (key: palworld-admin-password)
#   - cobalt-grove-45 Deployment → env RCON_PASSWORD (key: cobalt-grove-45-rcon-password)
#
# Sources (OpenBao KV v2, mount "secret"):
#   secret/catalog/game-hub/palworld         property admin-password
#   secret/catalog/game-hub/cobalt-grove-45  property rcon-password
#
#   - sync-wave "-1": the target Secret must exist before the Deployments that
#     reference it are applied, otherwise pods hit CreateContainerConfigError.
#   - refreshInterval 1h: credentials are static / low churn.
#   - deletionPolicy Retain: keep the Secret intact through transient OpenBao
#     outages (ESO logs an error but leaves the existing Secret in place).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: game-hub-server-credentials
  namespace: game-hub
  labels:
    app.kubernetes.io/part-of: infraweaver
    infraweaver/game: 'true'
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: game-hub-server-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: palworld-admin-password
      remoteRef:
        key: secret/catalog/game-hub/palworld
        property: admin-password
    - secretKey: cobalt-grove-45-rcon-password
      remoteRef:
        key: secret/catalog/game-hub/cobalt-grove-45
        property: rcon-password
