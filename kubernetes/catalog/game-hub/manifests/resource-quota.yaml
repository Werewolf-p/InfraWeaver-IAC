---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: game-hub-quota
  namespace: game-hub
spec:
  hard:
    # CPU/memory caps: prevent game servers from starving infra services.
    #
    # TEMPORARILY RAISED 16Gi -> 28Gi on 2026-08-19 for the first real GT New
    # Horizons server update. An update builds the NEW server BESIDE the old one
    # and carries the world across; GTNH requests 12Gi, so both at once need
    # 24Gi, plus ~1.5Gi for the namespace's helper Jobs (archive, health, the
    # two scale Jobs) and the timeline's read/write companion pods, which must
    # still be admitted while both game servers are up.
    #
    # 28Gi is ~17% of this cluster's 166Gi allocatable memory (cp1 45.7Gi,
    # cp3 8.4Gi, cp4 112.6Gi measured 2026-08-19) — the "~40% of cluster memory"
    # note below dates from three ~11Gi nodes and no longer describes this
    # cluster. limits.memory is NOT raised: 12+12 plus helpers is ~26.5Gi and
    # already fits under the existing 32Gi.
    #
    # RESTORE TO 16Gi once only ONE GTNH-class server remains in the namespace.
    # Two 12Gi servers can never both fit under 16Gi, so this cannot be reverted
    # while the old and the new server are both present.
    requests.memory: "28Gi"
    requests.cpu: "12"
    limits.memory: "32Gi"
    limits.cpu: "24"
    count/pods: "20"
    persistentvolumeclaims: "20"
    # Storage cap prevents unbounded PVC creation from filling disks
    requests.storage: "500Gi"
    longhorn-game.storageclass.storage.k8s.io/requests.storage: "400Gi"
    longhorn.storageclass.storage.k8s.io/requests.storage: "100Gi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: game-hub-limits
  namespace: game-hub
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: "1Gi"
        cpu: "500m"
      default:
        memory: "4Gi"
        cpu: "2"
      max:
        memory: "12Gi"
        cpu: "6"
      # Floor for console-provisioned game servers (palworld, cobalt-grove and any
      # future API-created server) that never appear in git and so are never
      # reviewed — it stops an undersized or BestEffort game pod being created
      # through the API.
      #
      # A LimitRange has NO selector and NO scopeSelector: this floor applies to
      # EVERY container in the namespace, including short-lived helper Jobs, and it
      # is checked against requests AND limits. Anything scheduled into game-hub
      # must declare at least these values or the pod is rejected at admission.
      # See scale-schedule.yaml — its scaler Jobs are sized to this floor.
      min:
        memory: "256Mi"
        cpu: "100m"
