# Role: full CRUD on game-hub namespace resources for game server management
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infraweaver-console-game-hub
  namespace: game-hub
  labels:
    app: infraweaver-console
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "persistentvolumeclaims", "configmaps", "events", "pods/log", "pods/exec"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Secrets: token storage for game servers (gameserver-<name>-tokens)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Scale sub-resource: required for scaleServerWorkload (stop/start/scale actions)
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "update"]
  # HPA: auto-scaling game servers (set-hpa / remove-hpa actions)
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # CronJobs: restart / backup / scheduled-start / scheduled-stop schedules
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # VolumeSnapshots: backup/restore for game server data
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots", "volumesnapshotcontents", "volumesnapshotclasses"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # ResourceQuota: capacity page reads `game-hub-quota` (read-only, best-effort;
  # call is .catch(()=>null) so a missing grant silently drops quota display).
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list", "watch"]
  # RBAC self-inspection: setup/status reads this Role/RoleBinding to report
  # readiness. GET-only by design — provisioning is GitOps-owned, so the SA gets
  # no create/update on roles (avoids an in-namespace privilege-escalation path).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch"]
  # ── Addon stop / remove ────────────────────────────────────────────────────
  # The trashcan on a STOPPED addon sweeps what it owns
  # (src/lib/addon-registry/workloads.ts + /api/addons/[id]/resources). Measured
  # against the live cluster, everything above already covered STOPPING this
  # addon — Deployments, StatefulSets and CronJobs are all writable here — but
  # the sweep could not delete DaemonSets or ServiceAccounts, so a "remove" would
  # have reported partial failure while leaving exactly those two behind.
  #
  # DaemonSets get delete but are still never STOPPED: they have no replica count
  # to zero, so the lifecycle code reports them as unstoppable rather than
  # rewriting a pod template. Delete is for the sweep alone.
  #
  # ServiceAccounts get delete and nothing more — the console removes a stopped
  # addon's identities, it does not mint them.
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infraweaver-console-game-hub
  namespace: game-hub
  labels:
    app: infraweaver-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: infraweaver-console-game-hub
subjects:
  - kind: ServiceAccount
    name: infraweaver-console
    namespace: infraweaver-console
