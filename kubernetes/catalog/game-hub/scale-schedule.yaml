---
apiVersion: v1
kind: ConfigMap
metadata:
  name: game-hub-scale-schedule-config
  namespace: game-hub
data:
  # Shipped dormant: the scale machinery is GitOps-tracked and ready, but does not
  # fire until an operator flips these to "true". Avoids surprise auto-stop/start of
  # game servers when this namespace first comes under GitOps management.
  scaleDownEnabled: "false"
  scaleUpEnabled: "false"
  scaleDownSchedule: "0 0 * * *"
  scaleUpSchedule: "0 8 * * *"
  scaleDownReplicas: "0"
  scaleUpReplicas: "1"
  # Empty: none of the servers this list once named still exist. valheim-server
  # was the last of them and has been deleted along with its manifest. The
  # machinery stays (dormant) so a future server can be added by name.
  targetDeployments: ""
  targetStatefulSets: ""
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: game-hub-scale-scheduler
  namespace: game-hub
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: game-hub-scale-scheduler
  namespace: game-hub
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: game-hub-scale-scheduler
  namespace: game-hub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: game-hub-scale-scheduler
subjects:
  - kind: ServiceAccount
    name: game-hub-scale-scheduler
    namespace: game-hub
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: game-hub-scale-down
  namespace: game-hub
  labels:
    app.kubernetes.io/name: game-hub-scale-down
    infraweaver.io/automation: game-hub
spec:
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # Without a TTL a Failed Job is retained indefinitely: failedJobsHistoryLimit
      # prunes only when the count EXCEEDS the limit, so the last failure never ages
      # out and keeps KubeJobFailed firing forever. 24h leaves the artifact visible
      # for a full alert cycle, then it self-cleans.
      ttlSecondsAfterFinished: 86400
      # 300s, not 1800s: this script early-exits in seconds while disabled, and runs
      # a handful of `kubectl scale` calls when enabled. A tight deadline caps how
      # long a future wedged Job can hold the argocd-cm batch_CronJob health Lua
      # (core/argocd/values.yaml) in Progressing — it keys off status.active.
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: game-hub-scale-down
        spec:
          serviceAccountName: game-hub-scale-scheduler
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scaler
              image: "bitnami/kubectl:1.35.4@sha256:e2b97dde9666986c61c56d49aae85a714b89b69392baa531438e74ec34096fb4"
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              envFrom:
                - configMapRef:
                    name: game-hub-scale-schedule-config
              env:
                - name: ACTION
                  value: scale-down
                - name: ACTION_ENABLED
                  valueFrom:
                    configMapKeyRef:
                      name: game-hub-scale-schedule-config
                      key: scaleDownEnabled
                - name: TARGET_REPLICAS
                  valueFrom:
                    configMapKeyRef:
                      name: game-hub-scale-schedule-config
                      key: scaleDownReplicas
              # Must satisfy LimitRange game-hub-limits (manifests/resource-quota.yaml),
              # shipped by THIS SAME Application, which enforces min cpu 100m /
              # memory 256Mi on every container in the namespace — against requests
              # AND limits. A LimitRange has no selector or scopeSelector, so a
              # short-lived helper Job cannot be exempted from the floor; the Job
              # matches the floor instead. Anything lower is rejected at admission
              # (FailedCreate) and the Job never runs a single pod.
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail

                  if [ "${ACTION_ENABLED:-false}" != "true" ]; then
                    echo "${ACTION} is disabled; exiting"
                    exit 0
                  fi

                  scale_targets() {
                    local kind="$1"
                    local replicas="$2"
                    local targets="$3"

                    for target in $targets; do
                      [ -n "$target" ] || continue
                      echo "Scaling ${kind}/${target} to ${replicas}"
                      kubectl scale "${kind}/${target}" -n game-hub --replicas="${replicas}"
                    done
                  }

                  scale_targets deployment "${TARGET_REPLICAS}" "${TARGET_DEPLOYMENTS:-}"
                  scale_targets statefulset "${TARGET_REPLICAS}" "${TARGET_STATEFULSETS:-}"

                  echo "${ACTION} complete"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: game-hub-scale-up
  namespace: game-hub
  labels:
    app.kubernetes.io/name: game-hub-scale-up
    infraweaver.io/automation: game-hub
spec:
